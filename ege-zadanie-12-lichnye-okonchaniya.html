:root{--bg:#0F0F14;--c1:#1B1B24;--c2:#272732;--tx:#F6F5F0;--mu:#A3A2AD;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--orange:#FFA347;--acc:#D6FF3F;--ok:#57E39A;--bad:#FF6B7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Onest',system-ui,sans-serif;font-size:17px;line-height:1.45;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
h1,h2,h3,.uf{font-family:'Unbounded','Onest',sans-serif;font-weight:700;letter-spacing:-.01em}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
@media(min-width:600px){body{padding:24px 0}#app{min-height:calc(100vh - 48px);border-radius:28px;background:#121219;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}}
.screen{flex:1;display:flex;flex-direction:column;padding:20px 18px 24px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;min-height:56px;border-radius:18px;font-size:18px;font-weight:600;padding:14px 18px;background:var(--acc);color:#111;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--c2);color:var(--tx)}
.btn+.btn{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--c2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
/* start */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 22px}
.tile{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded';font-weight:900;font-size:26px;color:#111;animation:bob 3s ease-in-out infinite}
.tile:nth-child(2){animation-delay:.3s}.tile:nth-child(3){animation-delay:.6s}.tile:nth-child(4){animation-delay:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-4deg)}}
.big{font-size:34px;line-height:1.08;margin:6px 0 4px}
.lead{color:var(--mu);margin:6px 0 0}
.spacer{flex:1}
/* theory */
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dot{width:8px;height:8px;border-radius:9px;background:var(--c2)}.dot.on{background:var(--acc);width:22px}
.card{background:var(--c1);border-radius:22px;padding:20px}
.card p{margin:0 0 12px}.card p:last-child{margin:0}
.i1{color:var(--orange);font-weight:700}.i2{color:var(--blue);font-weight:700}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;color:var(--mu);font-size:15px;padding:8px}
/* game */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lvl{flex:1;min-width:0}
.lvl b{display:block;font-family:'Unbounded';font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl span{font-size:13px;color:var(--mu)}
.score{background:var(--c2);border-radius:999px;padding:8px 12px;font-weight:700;white-space:nowrap}
.score i{font-style:normal;color:var(--acc)}
.help{width:42px;height:42px;border-radius:50%;background:var(--c2);font-weight:800;font-size:18px;flex:none}
.prog{display:flex;gap:4px;margin:4px 0 14px}
.seg{flex:1;height:7px;border-radius:9px;background:var(--c2)}
.seg.ok{background:var(--acc)}.seg.bad{background:var(--bad)}.seg.cur{background:#4a4a58}
.streak{font-size:13px;color:var(--mu);min-height:18px;margin-bottom:6px}
.streak b{color:var(--acc)}
.retry{display:inline-block;background:var(--c2);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
.q{font-size:20px;font-weight:600;margin:4px 0 14px}
.ctx{background:var(--c1);border-radius:18px;padding:18px;font-size:22px;font-weight:600;margin-bottom:14px}
.gap{color:var(--acc);letter-spacing:2px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border-radius:18px;background:var(--c2);font-size:19px;font-weight:600;padding:12px 14px;text-align:left;border:2px solid transparent}
.opts.two .opt{text-align:center;font-size:24px}
.opt.sel{border-color:var(--acc)}
.opt.right{background:rgba(87,227,154,.18);border-color:var(--ok)}
.opt.wrong{background:rgba(255,107,122,.18);border-color:var(--bad)}
.chat{background:var(--c1);border-radius:22px;padding:14px}
.who{font-size:13px;color:var(--mu);margin:0 0 6px 4px}
.bubble{background:var(--c2);border-radius:18px 18px 18px 6px;padding:12px;display:flex;flex-wrap:wrap;gap:6px}
.w{background:transparent;border-radius:10px;padding:6px 7px;font-size:18px;border:1.5px dashed #4a4a58}
.w.right{background:rgba(87,227,154,.2);border:1.5px solid var(--ok)}
.w.wrong{background:rgba(255,107,122,.2);border:1.5px solid var(--bad)}
.rows{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--c2);border-radius:16px;padding:12px;text-align:left;font-size:16px;border:2px solid transparent;width:100%}
.row .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--c1);display:flex;align-items:center;justify-content:center;font-weight:800}
.row.sel{border-color:var(--acc)}.row.sel .n{background:var(--acc);color:#111}
.row.right{border-color:var(--ok)}.row.miss{border-color:var(--bad)}
.ans{display:flex;gap:8px;margin-top:12px;align-items:center}
.ans label{font-size:14px;color:var(--mu)}
.ans input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--c2);background:var(--c1);color:var(--tx);font-size:22px;font-weight:700;padding:0 14px;letter-spacing:4px;font-family:'Unbounded'}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stmt{background:var(--c1);border-radius:18px;padding:18px;font-size:19px;margin-bottom:14px}
.foot{margin-top:auto;padding-top:14px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--c1);border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1),visibility .32s;max-height:85vh;overflow-y:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet h3{margin:0 0 6px;font-size:24px}
.sheet .ok{color:var(--ok)}.sheet .no{color:var(--orange)}
.sheet p{margin:8px 0}
.joke{color:var(--mu);font-size:15px;font-style:italic}
.rx{font-size:15px;margin:6px 0;padding-left:4px}
.rx b{color:var(--acc)}
/* level end / final */
.stars{font-size:46px;letter-spacing:6px;text-align:center;margin:10px 0}
.stars .off{opacity:.2}
.next{background:var(--c1);border-radius:22px;padding:18px;margin:14px 0}
.mist{background:var(--c1);border-radius:16px;padding:12px 14px;margin:8px 0;font-size:15px}
.mist b{color:var(--bad)}
textarea{width:100%;min-height:160px;background:var(--c1);color:var(--tx);border:2px solid var(--c2);border-radius:14px;padding:10px;font-family:inherit;font-size:14px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);opacity:0;visibility:hidden;background:var(--acc);color:#111;font-weight:700;border-radius:16px;padding:10px 18px;z-index:40;transition:transform .3s,opacity .3s,visibility .3s;width:max-content;max-width:calc(100vw - 32px);text-align:center;font-size:15px}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
.cheat li{margin:8px 0}
.nojs{max-width:480px;margin:40px auto;padding:24px;background:#1B1B24;border-radius:20px;color:#F6F5F0;font-family:sans-serif}
</style>

<script>
const DATA = {"theory": [{"h": "Задание 12 ЕГЭ 2027", "b": ["Проверяет правописание <b>личных окончаний глаголов</b> и суффиксов причастий, деепричастий. Сегодня тренируем окончания.", "В демоверсии 2027 — <b>5 рядов по 2 слова</b>. Нужно найти ряды, где <b>в обоих словах</b> пропущена одна и та же буква.", "Ответ — номера рядов цифрами, без пробелов и запятых, порядок не важен. <b>1 балл</b> — только за полностью верный ответ."]}, {"h": "Два спряжения", "b": ["<span class=\"i1\">I спряжение</span>: -у/-ю, -ешь, -ет, -ем, -ете, -ут/-ют", "<span class=\"i2\">II спряжение</span>: -у/-ю, -ишь, -ит, -им, -ите, -ат/-ят", "Отличаются гласные: в I — <b>е, у, ю</b>, во II — <b>и, а, я</b>."]}, {"h": "Алгоритм", "b": ["<b>1.</b> Окончание ударное? Пиши, что слышишь: несЁшь, кричИт.", "<b>2.</b> Безударное? Ставь глагол в инфинитив (того же вида!).", "<b>3.</b> Инфинитив на <b>-ить</b> → II спряжение: крАсит ← красить.", "<b>4.</b> Все остальные (-ать, -еть, -ять, -уть, -оть, -ыть…) → I спряжение: дУет ← дуть."]}, {"h": "Исключения", "b": ["<span class=\"i2\">II спряжение</span>, хотя не на -ить: гнать, держать, дышать, слышать, смотреть, видеть, ненавидеть, обидеть, терпеть, вертеть, зависеть.", "<span class=\"i1\">I спряжение</span>, хотя на -ить: брить, стелить (и редкие зиждиться, зыбиться).", "Приставка исключение не отменяет: перегнать, увидеть, постелить — тоже исключения."]}, {"h": "Ловушка: приставка ВЫ-", "b": ["В глаголах совершенного вида ВЫ- забирает ударение: вЫшьешь, вЫкрасит.", "Убери ВЫ- и снова поставь ударение. Стало ударным — пиши, что слышишь: вышьешь → шьЁшь.", "Осталось безударным — работай по алгоритму: выкрасит → крАсит → красить → II спр."]}], "levels": [{"name": "Разминка", "sub": "Определяем спряжение", "color": "#D6FF3F", "tasks": [{"t": "choice", "q": "Какого спряжения глагол <b>косить</b>?", "opts": ["I спряжение", "II спряжение"], "a": 1, "ex": "Инфинитив на -ить → II спряжение: (он) кОсит, (они) кОсят."}, {"t": "choice", "q": "Какого спряжения глагол <b>таять</b>?", "opts": ["I спряжение", "II спряжение"], "a": 0, "ex": "Таять оканчивается на -ять, а не на -ить → I спряжение: (снег) тАет."}, {"t": "tf", "q": "Глагол <b>мыть</b> относится ко II спряжению: он же почти на -ить.", "a": false, "ex": "-ыть — это не -ить. Мыть — I спряжение: (ты) мОешь, (они) мОют."}, {"t": "choice", "q": "Какие окончания у глаголов II спряжения?", "opts": ["-ешь, -ет, -ут/-ют", "-ишь, -ит, -ат/-ят"], "a": 1, "ex": "II спряжение: -ишь, -ит, -им, -ите, -ат/-ят. I спряжение: -ешь, -ет, -ем, -ете, -ут/-ют."}, {"t": "choice", "q": "Какой инфинитив у формы <b>(бельё) сохнет</b>?", "opts": ["сохнуть", "сохнить", "сохнеть"], "a": 0, "ex": "Сохнет ← сохнуть: инфинитив на -уть → I спряжение, поэтому -ет."}, {"t": "tf", "q": "Если окончание ударное, инфинитив не нужен — пишем то, что слышим.", "a": true, "ex": "Верно: под ударением гласная слышна ясно (несЁшь, кричИт). Алгоритм нужен только для безударных окончаний."}, {"t": "choice", "q": "Какой из глаголов — II спряжения?", "opts": ["дремать", "пахнуть", "платить", "резать"], "a": 2, "ex": "Платить — на -ить → II спряжение (плАтит). Дремать, пахнуть, резать — I спряжение."}, {"t": "choice", "q": "Какой из глаголов — I спряжения?", "opts": ["грузить", "гладить", "чесать", "мостить"], "a": 2, "ex": "Чесать — на -ать и не исключение → I спряжение (чЕшет). Остальные — на -ить, II спряжение."}, {"t": "tf", "q": "Спряжение определяют по личной форме: раз в слове окончание -ат, значит, I спряжение.", "a": false, "ex": "Смотрим на инфинитив, а не на личную форму. -ат/-ят — как раз окончание II спряжения: (они) крАсят ← красить."}, {"t": "choice", "q": "Какое окончание у I спряжения в 3-м лице множественного числа?", "opts": ["-ут/-ют", "-ат/-ят"], "a": 0, "ex": "I спряжение: (они) дрЕмлют, рЕжут. II спряжение: (они) плАтят, грУзят."}]}, {"name": "Алгоритм в деле", "sub": "Вставляем букву", "color": "#4CC9FF", "tasks": [{"t": "choice", "q": "Какая буква пропущена?", "ctx": "Мама глад..т рубашку.", "opts": ["е", "и"], "a": 1, "ex": "глАдит ← гладить, на -ить → II спряжение → -ит."}, {"t": "choice", "q": "Какая буква пропущена?", "ctx": "Снег понемногу та..т весной.", "opts": ["е", "и"], "a": 0, "ex": "тАет ← таять, не на -ить → I спряжение → -ет."}, {"t": "choice", "q": "Какая буква пропущена?", "ctx": "Бабушка тщательно чист..т картошку.", "opts": ["е", "и"], "a": 1, "ex": "чИстит ← чистить, на -ить → II спряжение."}, {"t": "choice", "q": "Какая буква пропущена?", "ctx": "Ты так красиво рису..шь!", "opts": ["е", "и"], "a": 0, "ex": "рисУешь ← рисовать, на -ать → I спряжение."}, {"t": "chat", "q": "Найди ошибку в сообщении друга", "from": "Миша", "words": ["Кот", "опять", "дразнет", "собаку,", "а", "она", "так", "смешно", "машет", "хвостом!"], "a": 2, "fix": "дразнит", "ex": "дрАзнит ← дразнить, на -ить → II спряжение. А «машет» ← махать — I спряжение, тут всё верно."}, {"t": "choice", "q": "В сообщении: «Близнецы ссорятся, а потом мирются». Как исправить?", "opts": ["мирятся", "мирются", "мирутся"], "a": 0, "ex": "мИрятся ← мириться, на -ить → II спряжение → -ятся."}, {"t": "choice", "q": "Какая буква пропущена?", "ctx": "Парус колыш..тся на ветру.", "opts": ["е", "и"], "a": 0, "ex": "колЫшется ← колыхаться, на -ать → I спряжение."}, {"t": "chat", "q": "Найди ошибку в сообщении подруги", "from": "Соня", "words": ["Не", "переживай,", "Дима", "наверняка", "ответет", "на", "твоё", "письмо."], "a": 4, "fix": "ответит", "ex": "отвЕтит ← ответить, на -ить → II спряжение → -ит."}, {"t": "choice", "q": "Как правильно?", "ctx": "Рабочие ... мешки в машину.", "opts": ["грузят", "грузют"], "a": 0, "ex": "грУзят ← грузить, на -ить → II спряжение → -ят."}, {"t": "tf", "q": "В «Он наде..тся на удачу» пишем Е, потому что инфинитив «надеяться» не на -ить.", "a": true, "ex": "Верно: надЕется ← надеяться, -ять → I спряжение."}]}, {"name": "Исключения и ВЫ-", "sub": "Глаголы-хитрецы", "color": "#FF6DB0", "tasks": [{"t": "choice", "q": "Какая буква пропущена?", "ctx": "На фи function lock(){app.querySelectorAll('.opt,.w,.row').forEach(b=>b.disabled=true)}

function answer(ok, ex, html){
  const ti=S.queue[S.pos], lv=S.level, L=DATA.levels[lv];
  const prev=S.res[lv][ti];
  if(prev===null){S.res[lv][ti]={first:ok,final:ok};if(!ok)S.retry.push(ti)}
  else S.res[lv][ti].final=ok;
  if(ok){S.streak++;S.best=Math.max(S.best,S.streak);const pts=(S.inRetry?5:10)+(S.streak>=3?2:0);S.score+=pts;confetti();vibrate(40)}
  else{S.streak=0;vibrate([30,60,30]);
    const t=L.tasks[ti];const q=(t.ctx||t.q||'').replace(/<[^>]+>/g,'');
    if(!S.mistakes.some(m=>m.l===lv&&m.i===ti)) S.mistakes.push({l:lv,i:ti,q:t.t==='ege'?'Задание в формате ЕГЭ (уровень «'+L.name+'»)':(t.t==='chat'?'Сообщение: «'+t.words.join(' ')+'»':q),rule:ex.replace(/<div class="rx">/g,' ').replace(/<[^>]+>/g,'')});}
  S.pos++;
  save();
  const sh=$('#sheet');
  sh.innerHTML=`<h3 class="${ok?'ok':'no'}">${ok?'Верно!':'Почти!'}</h3><p>${html?ex:esc(ex).replace(/&lt;(\/?)b&gt;/g,'<$1b>')}</p><p class="joke">${pick(ok?JOKES_OK:JOKES_NO)}</p><button class="btn" id="nextq">Дальше</button>`;
  openSheet();
  $('#nextq').onclick=advance;
}

    S.screen='levelEnd';save();render();return;
  }
  render();
}

    <div class="stars">${[1,2,3].map(k=>`<span class="${k<=st?'':'off'}">★</span>`).join('')}</div>
    <p style="text-align:center;margin:0">С первого раза: <b>${right} из ${L.tasks.length}</b> · очки: <b>${S.score}</b></p>
    ${last?`<div class="next"><b>Все уровни позади!</b><p class="lead">Сейчас покажу итог и ошибки с правилами.</p></div>`:`<div class="next" style="border-left:6px solid ${N.color}"><p class="lead" style="margin:0 0 4px">Дальше:</p><b class="uf" style="font-size:20px">${S.level+2}. ${N.name}</b><p class="lead" style="margin:6px 0 0">${N.sub}${S.level+1===DATA.levels.length-1?' · ловушки из реальных ошибок выпускников':''}</p></div>`}
    <div class="spacer"></div><button class="btn" id="go">${last?'К итогам':'Следующий уровень'}</button></div>`;
  if(st===3)confetti();
  $('#go').onclick=()=>{
    if(last){S.screen='final'}else{S.level++;S.queue=shuffle(DATA.levels[S.level].tasks.map((_,i)=>i));S.pos=0;S.retry=[];S.inRetry=false;S.screen='game'}
    save();render();
  };
}
function resultText(){
  const lines=['Тренажёр «Личные окончания глагола» (задание 12 ЕГЭ)','Очки: '+S.score+' ★','Лучшая серия: '+S.best];
  DATA.levels.forEach((L,k)=>{const r=S.res[k];const f=r.filter(x=>x&&x.first).length;lines.push(`${k+1}. ${L.name}: с первого раза ${f}/${r.length}, звёзды ${levelStars(k)}/3`)});
  if(S.mistakes.length){lines.push('Ошибки:');S.mistakes.forEach(m=>lines.push('— '+m.q))}else lines.push('Ошибок нет!');
  lines.push('Дата: '+new Date().toLocaleString('ru-RU'));
  return lines.join('\n');
}
function finalScreen(){
  setAcc('#D6FF3F');
  const tot=DATA.levels.reduce((a,_,k)=>a+levelStars(k),0);
  app.innerHTML=`<div class="screen"><span class="chip" style="align-self:flex-start;color:var(--lime)">Финиш</span>
   <h1 class="big" style="margin-top:12px">Глаголы побеждены!</h1>
   <div class="stars">★ ${tot}/12</div>
   <p style="text-align:center;margin:0 0 8px">Очки: <b>${S.score}</b> · лучшая серия: <b>${S.best}</b></p>
   <h2 style="font-size:18px;margin:16px 0 4px">${S.mistakes.length?'Над чем поработать':'Ни одной ошибки — это мощно!'}</h2>
   ${S.mistakes.map(m=>`<div class="mist"><b>✘</b> ${esc(m.q)}<br><span class="lead" style="font-size:14px">${esc(m.rule)}</span></div>`).join('')}
   <div class="spacer" style="min-height:16px"></div>
   <button class="btn" id="send">Отправить результат учителю</button>
   <div id="manual"></div>
   <button class="btn ghost" id="again">Пройти ещё раз</button></div>`;
  confetti();
  $('#send').onclick=copyResult;
  $('#again').onclick=()=>{clearSave();S=newState();S.screen='game';save();render()};
}
async function copyResult(){
  const txt=resultText();let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){ok=false}}
  if(ok){toast('Скопировано! Вставь в чат с учителем');$('#manual').innerHTML='<p class="lead" style="font-size:14px;text-align:center">Текст результата скопирован — вставь его в сообщение учителю.</p>'}
  else{$('#manual').innerHTML='<p class="lead" style="font-size:14px">Скопировать автоматически не вышло. Выдели текст и скопируй вручную:</p><textarea id="rt" readonly></textarea>';$('#rt').value=txt;$('#rt').focus();$('#rt').select()}
}
function showCheat(){
  const sh=$('#sheet');
  sh.innerHTML=`<h3>Шпаргалка</h3><ul class="cheat">${DATA.cheat.map(c=>`<li>${c}</li>`).join('')}</ul><button class="btn" id="cl">Понятно</button>`;
  openSheet(true);$('#cl').onclick=()=>closeSheet();
}
let sheetClosable=false;
function openSheet(closable){sheetClosable=!!closable;$('#veil').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#veil').classList.remove('on');$('#sheet').classList.remove('on')}
$('#veil').onclick=()=>{if(sheetClosable)closeSheet()};

/* confetti */
function confetti(){
  const c=$('#cf');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347','#F6F5F0'];
  const P=Array.from({length:70},()=>({x:c.width/2,y:c.height*0.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:4+Math.random()*5,c:pick(cols),r:Math.random()*6}));
  let f=0;
  (function tick(){ctx.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore()});if(++f<70)requestAnimationFrame(tick);else ctx.clearRect(0,0,c.width,c.height)})();
}
render();
</script>
