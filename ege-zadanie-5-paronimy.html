:root{--bg:#0F0F14;--c1:#1B1B24;--c2:#272732;--t:#F6F5F0;--m:#AAAAB8;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--or:#FFA347;--a:#D6FF3F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:400 17px/1.42 Onest,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
h1,h2{font-family:Unbounded,sans-serif;line-height:1.14;margin:0;overflow-wrap:break-word}
p{margin:0}
#app{width:100%;max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));position:relative}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;animation:in .3s ease-out}
.mid{justify-content:center}
.grow{flex:1}
h1{font-size:clamp(34px,11vw,50px);font-weight:800}
h1 em{color:var(--a);font-style:normal}
h2{font-size:24px;font-weight:700}
.kicker{color:var(--a);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.07em}
.lead{color:var(--m)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 2px}
.tile{font:700 14px Unbounded,sans-serif;padding:20px 8px;border-radius:20px;text-align:center;color:var(--bg);animation:float 2.8s ease-in-out infinite alternate}
.tile:nth-child(1){background:var(--lime);rotate:-3deg}
.tile:nth-child(2){background:var(--blue);rotate:2deg;animation-delay:.4s}
.tile:nth-child(3){background:var(--pink);rotate:2deg;animation-delay:.8s}
.tile:nth-child(4){background:var(--or);rotate:-2deg;animation-delay:1.2s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:30px;background:var(--c2);font-size:14px}
.btn{display:block;width:100%;min-height:58px;border:0;border-radius:19px;background:var(--a);color:var(--bg);font-weight:750;padding:14px 18px}
.btn.sec{background:var(--c2);color:var(--t)}
.btn:disabled{opacity:.35;cursor:default}
.card{background:var(--c1);border-radius:24px;padding:20px;overflow-wrap:break-word}
.card p+p{margin-top:11px}
.row{padding:12px 14px;border-radius:15px;background:var(--c2);margin-top:9px}
.row b,.hl{color:var(--a)}
.th{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.link{background:none;border:0;min-height:44px;padding:8px;color:var(--m)}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--c2)}
.dots i.on{background:var(--a);width:26px}
.slide{touch-action:pan-y}
.top{display:flex;align-items:center;gap:10px}
.top .name{flex:1;min-width:0;font:700 14px/1.2 Unbounded,sans-serif;color:var(--a)}
.score{background:var(--c2);border-radius:30px;padding:9px 13px;font-weight:700;white-space:nowrap}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--c2);font-weight:800}
.bar{display:flex;gap:4px}
.bar i{height:7px;flex:1;min-width:0;border-radius:6px;background:var(--c2)}
.bar i.ok{background:var(--a)}.bar i.bad{background:#686877}.bar i.now{background:var(--t)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--m);min-height:20px}
.label{font-weight:750;font-size:19px;line-height:1.3}
.sent{background:var(--c1);border-radius:24px;padding:20px;font-size:19px;line-height:1.48;overflow-wrap:break-word}
.sent.chat{white-space:pre-line;font-size:17px;background:var(--c2);border-bottom-left-radius:5px}
.sent.small{font-size:14px;color:var(--m);padding:14px 16px;border-radius:18px}
.sent b,.ex b{color:var(--a)}
.gap{color:var(--a);letter-spacing:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:58px;padding:13px 17px;text-align:left;border-radius:18px;border:2px solid var(--c2);background:var(--c2);font-weight:600;overflow-wrap:anywhere}
.opt.ok{border-color:var(--lime);background:#313b1b}
.opt.no{border-color:var(--pink);background:#3c2231}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:10px;background:var(--c1);border-radius:16px;padding:12px;font-size:16px}
.ex>span{flex:none;color:var(--m);width:16px}
.ex>div{min-width:0;overflow-wrap:break-word}
.field{width:100%;min-height:58px;border:2px solid var(--c2);background:var(--c1);border-radius:18px;padding:12px 16px;font-size:20px}
.sheet{position:fixed;z-index:20;bottom:0;left:50%;translate:-50% 0;width:100%;max-width:540px;max-height:78vh;overflow-y:auto;background:#272732;border-radius:28px 28px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));animation:up .3s ease-out;display:flex;flex-direction:column;gap:11px;box-shadow:0 -10px 40px #000a}
.sheet h2.ok{color:var(--lime)}.sheet h2.no{color:var(--pink)}
.answer{font-weight:750}
.joke{color:var(--m);font-size:15px}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:500px;max-height:88vh;overflow-y:auto;background:var(--c1);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:13px}
#close{position:sticky;bottom:0;flex:none}
textarea{width:100%;min-height:200px;background:var(--c2);border:0;border-radius:16px;padding:12px;font-size:16px}
.stars{display:flex;gap:10px;justify-content:center;font-size:62px;line-height:1;color:var(--c2)}
.stars .on{color:var(--a);animation:pop .5s ease-out both}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--c1);border-radius:20px;padding:16px;min-width:0}
.stat b{display:block;font:800 27px Unbounded,sans-serif;color:var(--a)}
.stat span{color:var(--m);font-size:14px}
.err{font-size:15px}
.err small{display:block;color:var(--m);font-size:14px;margin-top:4px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.nojs{max-width:420px;margin:30vh auto 0;padding:24px;background:var(--c1);border-radius:24px;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(70%)}to{transform:none}}
@keyframes float{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@media(min-width:700px){body{padding:24px}#app{min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px);border:1px solid var(--c2);border-radius:32px;padding:28px}.sheet{bottom:24px;border-radius:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

"конный — конский","q":"В городе созданы отряды ___ полиции.","opts":["конной","конской"],"a":"конной","why":"Конный связан с ездой на лошадях: конная полиция. Конский принадлежит коню: конская грива.","joke":"В конской полиции служили бы сами кони, в звании сержанта.","id":"1-6"},{"type":"choice","label":"Какое слово пропущено?","pair":"невежа — невежда","q":"Капитан казался полным ___ в вопросах истории Отечества.","opts":["невеждой","невежей"],"a":"невеждой","why":"Невежда мало знает. Невежа плохо воспитан.","joke":"Невежда не знает дату битвы, невежа ещё и перебивает рассказчика.","id":"1-7"},{"type":"choice","label":"Какое слово пропущено?","pair":"двоичный — двойной","q":"В ___ системе счисления используются только две цифры: 0 и 1.","opts":["двоичной","двойной"],"a":"двоичной","why":"Двоичный основан на счёте двойками: двоичный код. Двойной — вдвое больший или из двух частей.","joke":"Компьютеру хватает двух цифр, а ему всё равно завидуют.","id":"1-8"},{"type":"choice","label":"Какое слово пропущено?","pair":"ванна — ванная","q":"Я несколько лет мечтаю о возможности каждый день принимать ___.","opts":["ванну","ванную"],"a":"ванну","why":"Принимают ванну: это процедура или ёмкость с водой. Ванная — это комната.","joke":"Принимать ванную можно только у строителей, по акту.","id":"1-9"},{"type":"choice","label":"Какое слово пропущено?","pair":"обвинённый — обвинительный","q":"Защита обратилась в областной суд с просьбой отменить ___ приговор.","opts":["обвинительный","обвинённый"],"a":"обвинительный","why":"Обвинительный содержит обвинение. Обвинённый — тот, кого обвинили.","joke":"Обвинённый приговор сам попросил бы адвоката.","id":"1-10"}]},{"name":"Редактор чата","color":"#4CC9FF","teaser":"Лови ошибки в сообщениях и предложениях.","tasks":[{"type":"find","label":"Друг прислал предложения на проверку. Какое слово ошибочно?","pair":"надеть — одеть","q":"Со временем Ширяев стал ПРИЗНАННЫМ специалистом в когда-то новой для него области научных исследований.\nРодители предложили ОДЕТЬ на рюкзаки школьников светоотражатели.\nЭто люди БЕЗОТВЕТСТВЕННЫЕ: они не привыкли отвечать за свои поступки.","opts":["признанным","одеть","безответственные"],"a":"одеть","fix":"надеть","why":"Надевают что-то на кого-то или на что-то, одевают кого-то. Светоотражатели нужно надеть на рюкзаки.","joke":"Рюкзаку наряд не нужен, ему нужно светиться.","id":"2-1"},{"type":"find","label":"Друг прислал предложения на проверку. Какое слово ошибочно?","pair":"словарный — словесный","q":"ЖЕСТОКИЙ норд-ост гнал волны на гранитные мостовые.\nВ СЛОВЕСНОМ составе языка не все элементы одинаково подвижны и чувствительны к изменениям.\nКакую долю земной поверхности может ОХВАТИТЬ взглядом космонавт с высоты 400 километров?","opts":["жестокий","словесном","охватить"],"a":"словесном","fix":"словарном","why":"Словарный состав — все слова языка. Словесный выражен словами: словесный портрет.","joke":"Друг явно за словом в словарь не полез.","id":"2-2"},{"type":"find","label":"Друг прислал предложения на проверку. Какое слово ошибочно?","pair":"яблочный — яблоневый","q":"Одна из его ПРОДЕЛОК могла окончиться очень плохо, но, к счастью, не имела никаких последствий.\nКак известно, между западной и восточной культурами существуют принципиальные РАЗЛИЧИЯ во взглядах на окружающий мир и отношения между людьми.\nПринесли завтрак: хлеб, порцию масла, розетку ЯБЛОНЕВОГО джема и чашку кофе с молоком.","opts":["проделок","различия","яблоневого"],"a":"яблоневого","fix":"яблочного","why":"Джем из яблок — яблочный. Яблоневый относится к дереву: яблоневый сад.","joke":"Яблоневый джем хрустел бы корой.","id":"2-3"},{"type":"find","label":"Друг прислал предложения на проверку. Какое слово ошибочно?","pair":"отборный — отборочный","q":"Наружная реклама должна иметь ЭСТЕТИЧНЫЙ вид.\nБелую муку высшего сорта делают из ОТБОРОЧНОГО зерна.\nДрузья обескуражены ЛЕДЯНЫМ приёмом, который был оказан им в этом доме.","opts":["эстетичный","отборочного","ледяным"],"a":"отборочного","fix":"отборного","why":"Отборный — лучший: отборное зерно. Отборочный служит для отбора: отборочный тур.","joke":"Зерно прошло отборочный тур и вышло в булочку.","id":"2-4"},{"type":"find","label":"Друг прислал предложения на проверку. Какое слово ошибочно?","pair":"искусный — искусственный","q":"Русская литература подарила миру много ГУМАНИСТИЧЕСКИХ произведений.\nЧетыре из пяти покупок в Швеции совершаются без использования НАЛИЧНОСТИ.\nТрудно было сказать, что это такое – природная речка или ИСКУСНЫЙ канал.","opts":["гуманистических","наличности","искусный"],"a":"искусный","fix":"искусственный","why":"Искусственный создан людьми, а не природой. Искусный — умелый: искусный мастер.","joke":"Искусный канал вырыл бы себя сам, причём красиво.","id":"2-5"},{"type":"tf","label":"Пароним употреблён верно?","pair":"информация — информированность","q":"Один из разделов кибернетики изучает способы передачи ИНФОРМИРОВАННОСТИ.","opts":["Верно","Неверно"],"a":"Неверно","why":"Передают информацию. Информированность — это осведомлённость. Правильно: информации.","joke":"Осведомлённость по проводам пока не ходит.","id":"2-6"},{"type":"tf","label":"Пароним употреблён верно?","pair":"мороженый — морозильный — морозный","q":"Современные МОРОЗИЛЬНЫЕ камеры позволяют замораживать любые продукты питания, сохраняя их на длительный срок без ущерба вкусовым и питательным качествам.","opts":["Верно","Неверно"],"a":"Верно","why":"Морозильный служит для замораживания: морозильная камера.","joke":"Пельмени подтверждают: всё верно.","id":"2-7"},{"type":"tf","label":"Пароним употреблён верно?","pair":"оклик — отклик","q":"На ОКЛИКИ полицейских преступник не реагировал.","opts":["Верно","Неверно"],"a":"Верно","why":"Оклик — возглас, которым окликают. Отклик — ответ, отзыв. Здесь всё верно.","joke":"Оклик был, отклика не случилось. Обе стороны пары в одном сюжете.","id":"2-8"},{"type":"tf","label":"Пароним употреблён верно?","pair":"коренастый — коренной — корневой","q":"Преподаватель принёс фотографии одетых в национальные костюмы представителей КОРНЕВЫХ народов, населяющих эту территорию, и попросил студентов описать основные элементы этих костюмов.","opts":["Верно","Неверно"],"a":"Неверно","why":"Исконные жители — коренные народы. Корневой относится к корню: корневая система. Правильно: коренных.","joke":"Корневые народы живут в грядке, и это морковь.","id":"2-9"},{"type":"tf","label":"Пароним употреблён верно?","pair":"землистый — земляной — земной","q":"Озоновый слой задерживает проникновение к ЗЕМНОЙ поверхности наиболее жёсткого ультрафиолетового излучения, губительного для всего живого.","opts":["Верно","Неверно"],"a":"Верно","why":"Земной относится к планете Земля: земная поверхность. Земляной — из земли, землистый — похожий на землю цветом или составом.","joke":"Планета благодарит за точность.","id":"2-10"}]},{"name":"Мастер замены","color":"#FF6DB0","teaser":"Подбирай пару сначала из вариантов, потом по памяти.","tasks":[{"type":"fix","label":"Чем заменить выделенное слово?","pair":"благотворительный — благотворный","q":"Трудно переоценить БЛАГОТВОРИТЕЛЬНОЕ влияние природы на здоровье и душевное состояние человека.","opts":["благотворное","благодарное","благодарственное"],"a":"благотворное","why":"Благотворный — полезный. Благотворительный направлен на материальную помощь нуждающимся.","joke":"Лес помогает бескорыстно, но фонд не регистрирует.","id":"3-1"},{"type":"fix","label":"Чем заменить выделенное слово?","pair":"почтенный — почтительный — почётный","q":"ПОЧТИТЕЛЬНЫЙ возраст в сочетании с сединой подчёркивал благородство этого человека.","opts":["почтенный","преклонный","признательный"],"a":"почтенный","why":"Почтенный возраст заслуживает почтения. «Преклонный» — синоним, а не пароним.","joke":"Почтительный возраст сам здоровался бы первым.","id":"3-2"},{"type":"fix","label":"Чем заменить выделенное слово?","pair":"двойной — двойственный","q":"Шоколад приносит ДВОЙСТВЕННУЮ пользу: он поддерживает нормальную работу сердца и не позволяет клеткам организма преждевременно стареть.","opts":["двойную","двоичную","сдвоенную"],"a":"двойную","why":"Двойная польза — польза сразу в двух отношениях. Двойственный — противоречивый: двойственное впечатление.","joke":"Две пользы — ещё не повод для двух плиток.","id":"3-3"},{"type":"fix","label":"Чем заменить выделенное слово?","pair":"гарантийный — гарантированный","q":"Любая технология, в том числе и технология решения задач, – это инструмент для ГАРАНТИЙНОГО получения результата.","opts":["гарантированного","надёжного","обязательного"],"a":"гарантированного","why":"Гарантированный — обеспеченный. «Надёжный» и «обязательный» не подходят: это не паронимы к выделенному слову.","joke":"Результат не сдают в сервис по талону.","id":"3-4"},{"type":"fix","label":"Чем заменить выделенное слово?","pair":"ледовый — ледяной","q":"Предварительное изучение ЛЕДЯНОЙ обстановки на северных морях помогает избежать многих проблем в районах Крайнего Севера.","opts":["ледовой","морозной","морозильной"],"a":"ледовой","why":"Ледовый связан со льдами: ледовая обстановка. Ледяной — изо льда или очень холодный.","joke":"Ледяная обстановка бывает за столом после объявления отметок.","id":"3-5"},{"type":"input","label":"Исправь ошибку: запиши пароним в нужной форме","pair":"деловой — дельный","q":"Отличительной особенностью этого мероприятия стала ДЕЛЬНАЯ атмосфера.","a":"деловая","why":"Деловой связан с работой: деловая атмосфера. Дельный — толковый: дельный совет. Форма: деловая.","joke":"Атмосфера советов не даёт, даже дельных.","id":"3-6"},{"type":"input","label":"Исправь ошибку: запиши пароним в нужной форме","pair":"жилищный — жилой","q":"ЖИЛИЩНАЯ площадь квартиры составляет 40 квадратных метров.","a":"жилая","why":"Жилой предназначен для жилья: жилая площадь. Жилищный относится к жилищам вообще: жилищный кодекс.","joke":"Сорок метров кодекса — это очень длинный свиток.","id":"3-7"},{"type":"input","label":"Исправь ошибку: запиши пароним в нужной форме","pair":"изобретательный — изобретательский","q":"Цель программы – расширить возможности талантливых студентов для профессионального роста, ИЗОБРЕТАТЕЛЬНОЙ деятельности.","a":"изобретательской","why":"Изобретательская деятельность связана с изобретениями. Изобретательный — находчивый. Пишем: изобретательской.","joke":"Изобретательная деятельность придумала бы, как не работать.","id":"3-8"},{"type":"input","label":"Исправь ошибку: запиши пароним в нужной форме","pair":"технический — техничный","q":"Весь объём ТЕХНИЧНОГО переоснащения здания театра выполнен международной творческой командой из пяти стран мира.","a":"технического","why":"Технический связан с техникой: техническое переоснащение. Техничный — мастерски владеющий техникой движений.","joke":"Техничное переоснащение делают с финтами.","id":"3-9"},{"type":"input","label":"Исправь ошибку: запиши пароним в нужной форме","pair":"сравнимый — сравнительный","q":"В этот момент идёт наступление, по своему масштабу СРАВНИТЕЛЬНОЕ с величайшими, которые когда-либо видел мир.","a":"сравнимое","why":"Сравнимый — тот, который можно сравнить с чем-то. Сравнительный основан на сравнении: сравнительный анализ.","joke":"У слова «сравнимый» обычно есть спутник — предлог «с».","id":"3-10"}]},{"name":"Босс: Двойник","color":"#FFA347","teaser":"Синонимы-самозванцы, форма, написание и задание 5 целиком.","tasks":[{"type":"fix","label":"Ловушка «синоним». Что записать в ответ?","pair":"надеть — одеть","q":"Нельзя ОДЕВАТЬ контактные линзы, если остались какие-то помутнения на роговице после воспалительных явлений.","opts":["надевать","носить","вставлять"],"a":"надевать","why":"«Носить» и «вставлять» близки по смыслу, но это не паронимы. Типичная ошибка на ЕГЭ — записать синоним.","joke":"Синоним пришёл на чужой экзамен и очень старался.","id":"4-1"},{"type":"fix","label":"Ловушка «написание». Что записать в ответ?","pair":"костный — костяной","q":"Вошедший в комнату пожилой господин опирался на палку с КОСТНЫМ набалдашником.","opts":["костяным","костянным","костистым"],"a":"костяным","why":"Из кости — костяной, с одной Н в суффиксе -ян-. Ошибка в написании лишает балла.","joke":"Лишняя Н здесь как лишняя кость: только мешает.","id":"4-2"},{"type":"fix","label":"Ловушка «форма». Что записать в ответ?","pair":"обрывок — отрывок","q":"Он дарил ей свои стихи, написанные на каких-то газетных ОТРЫВКАХ.","opts":["обрывках","обрывки","клочках"],"a":"обрывках","why":"Обрывок — оторванный кусок, отрывок — часть текста. Форма нужна как в предложении: на обрывках.","joke":"Форма решает, даже если бумага мятая.","id":"4-3"},{"type":"fix","label":"Ловушка «значение». Что записать в ответ?","pair":"исходный — исходящий","q":"Участники парада заняли ИСХОДЯЩИЕ позиции.","opts":["исходные","начальные","входящие"],"a":"исходные","why":"Исходный — начальный, но само слово «начальный» не пароним. В ответ идёт «исходные».","joke":"Парад исходящих позиций давно ушёл бы домой.","id":"4-4"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"нестерпимый — нетерпеливый — нетерпимый","rows":["Осуществление закупок товаров невозможно без изучения и прогнозирования ПОКУПАТЕЛЬСКОГО спроса.","Даже в эпоху ПРАКТИЧНЫХ людей появляются те, кто воюет с несправедливостью.","В основе народных бунтов – несправедливость, которая становится НЕТЕРПИМОЙ болью для людей, остро переживающих неравноправие.","В политике ДВОЙНЫЕ стандарты неприменимы.","Сразу было решено, что ПОЧЁТНОМУ гостю фестиваля не следует докучать вопросами о литературных делах."],"a":"нестерпимой","why":"Боль, которую трудно вытерпеть, нестерпимая. Нетерпимый — не допускающий чужого мнения или недостойный терпения: нетерпимое отношение.","joke":"У боли нет мнения о собеседниках.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-5"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"публицистический — публицистичный","rows":["Основным претендентом на пост главы области был ДЕЙСТВУЮЩИЙ губернатор.","Четыре из пяти покупок в Швеции совершаются без использования НАЛИЧНОСТИ.","КОННЫЙ спорт предполагает соревнования на лошадях.","По крутой лестнице Максим спустился с чердака в ЖИЛЫЕ комнаты.","В старейшем издательстве страны вышли в свет два тома ПУБЛИЦИСТИЧНЫХ произведений, которые помогают разным народам лучше узнать историю и культуру друг друга."],"a":"публицистических","why":"Публицистические произведения относятся к публицистике. Публицистичный — обладающий её свойствами.","joke":"Жанр узнаётся по суффиксу, а не по обложке.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-6"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"надеть — одеть","rows":["Природа оказывает на человека БЛАГОТВОРНОЕ влияние и способствует восстановлению сил.","Для одного художника путь в искусство – это лишь средство преуспеть или прославиться, для другого – ЖИЗНЕННАЯ миссия.","Рыбаки ОДЕНУТ червяка на крючок, закинут удочку и замрут в ожидании клёва.","Лампа освещала старинные картины на белых стенах, шкатулки из ЛАКИРОВАННЫХ морских ракушек и сухие букеты из полевых цветов.","Форвард забросил две шайбы и сделал одну результативную ПЕРЕДАЧУ."],"a":"наденут","why":"Червяка надевают на крючок. Одевают — кого-то и во что-то. Форма: наденут.","joke":"Одетый червяк на рыбалке вызывает вопросы даже у рыбы.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-7"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"опасливый — опасный","rows":["Эта история, к счастью, закончилась для мальчишек хорошо, хотя в ней и было несколько по-настоящему ОПАСЛИВЫХ моментов.","При высоте потолка 2,4 м максимально допустимые ОТКЛОНЕНИЯ стоек от вертикали должны быть не более 7 мм.","Прежде чем начать ремонт в квартире, надо вычислить количество плиток для стен кухни, туалета и ВАННОЙ.","Чай, включающий морские водоросли, укрепляет иммунную систему, увеличивает СОПРОТИВЛЯЕМОСТЬ организма различным заболеваниям.","Положительный эмоциональный настрой, ГАРАНТИРОВАННАЯ ситуация успеха, как правило, пробуждают в людях добрые чувства, рождают сопереживание."],"a":"опасных","why":"Опасный связан с опасностью: опасный момент. Опасливый действует с осторожностью: опасливый взгляд.","joke":"Опасливый момент сначала выглянул бы из-за угла.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-8"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"выгода — выгодность","rows":["Наши предки считали, что любая ПОДЕЛКА из солёного теста, находящаяся дома, – символ богатства и благополучия в семье.","Правильное понимание трендов и их значения для компании позволит получить финансовую ВЫГОДНОСТЬ в краткосрочной перспективе.","АВТОРИТАРНЫЙ стиль воспитания заключается в том, что все решения принимают родители, считающие, что ребёнок во всём должен подчиняться их воле, авторитету.","Публичное покушение на ЦАРСТВУЮЩЕГО императора серьёзно повлияло на изменение внутриполитического курса страны.","После принятия христианства в 988 году князья стали широко практиковать РАЗДАЧУ земли высшим представителям церковной иерархии и монастырям."],"a":"выгоду","why":"Получают выгоду, то есть пользу, прибыль. Выгодность — свойство выгодного: выгодность предложения.","joke":"Выгодность на карту не переведёшь.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-9"},{"type":"ege","label":"Задание 5 · формат ЕГЭ","pair":"почтенный — почтительный — почётный","rows":["Родители рядового Сидорова получили из воинской части БЛАГОДАРСТВЕННОЕ письмо.","Адъютант ПОЧТЕННО обратился к генералу.","Она так и не услышала ЖЕЛАННЫХ слов от своего друга.","Всё это могло быть ловким трюком, рассчитанным на то, что сотрудник войдёт в доверие к врагам и начнёт ДВОЙНУЮ игру.","В этом году все ДЕЙСТВУЮЩИЕ санатории и пансионаты края заранее подготовились к наступающему курортному сезону и готовы принять тысячи отдыхающих."],"a":"почтительно","why":"Обращаются почтительно, то есть выражая почтение. Почтенный сам достоин уважения.","joke":"Адъютант вежлив, а почтенным ещё станет.","q":"В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.","id":"4-10"}]}];
const KEY = 'ege27-z5-paronimy-modul1-urok3-v1';
const TOTAL = LEVELS.reduce((n, l) => n + l.tasks.length, 0);
const BY = {};
LEVELS.forEach(l => l.tasks.forEach(t => { BY[t.id] = t; }));
const app = document.getElementById('app');

const THEORY = [
 ['Кто такие паронимы', `<p><b class="hl">Паронимы</b> — однокоренные слова, которые похоже звучат, но значат разное.</p><p>Отличают их приставки или суффиксы.</p><div class="row"><b>невежа</b> — невоспитанный человек</div><div class="row"><b>невежда</b> — малознающий человек</div>`],
 ['Задание 5 · ЕГЭ 2027', `<p>Даны пять предложений, в каждом выделено слово. В одном оно употреблено <b class="hl">неверно</b>.</p><p>Нужно подобрать к нему пароним и записать <b>одно слово</b>.</p><div class="row"><b>1 балл</b> — ответ полностью совпал с эталоном</div><div class="row"><b>0 баллов</b> — другое слово, не та форма или ошибка в написании</div>`],
 ['План из пяти шагов', `<div class="row"><b>1.</b> Прочитай задание.</div><div class="row"><b>2.</b> Определи значение каждого выделенного слова.</div><div class="row"><b>3.</b> Найди предложение с ошибкой.</div><div class="row"><b>4.</b> Подбери пару и поставь её в нужную форму.</div><div class="row"><b>5.</b> Запиши слово и проверь буквы.</div>`],
 ['Если значение ускользает', `<p>Вспомни пару и составь словосочетание с каждым словом. Помогает и значение морфемы.</p><div class="row"><b>костная</b> ткань — относится к костям</div><div class="row"><b>костяной</b> гребень — сделан из кости</div><p>В «Списке паронимов» ФИПИ толкований нет. Значение проверяй по толковому словарю.</p>`],
 ['Где теряют балл', `<div class="row"><b>Синоним.</b> В ответе нужен только пароним.</div><div class="row"><b>Значение.</b> Слово надо примерить к предложению.</div><div class="row"><b>Написание.</b> Верное слово с ошибкой балла не даёт.</div><div class="row"><b>Лишняя правка.</b> Меняй лишь то, что употреблено неправильно.</div>`]
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/___/g, '<span class="gap">_____</span>').replace(/[А-ЯЁ]{4,}/g, '<b>$&</b>');
const norm = s => String(s).normalize('NFC').trim().toLowerCase().replace(/ё/g, 'е');
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;

function fresh() {
  return {
    v: 1, screen: 'start', page: 0, level: 0, pos: 0, second: false, score: 0, streak: 0, best: 0, answer: null,
    order: LEVELS.map(l => shuffle(l.tasks.map(t => t.id))),
    opts: Object.fromEntries(Object.values(BY).filter(t => t.opts).map(t => [t.id, t.type === 'fix' || t.type === 'choice' ? shuffle(t.opts) : t.opts])),
    first: {}, retry: {}, queue: []
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1 && Array.isArray(s.order) && s.order.flat().length === TOTAL && s.order.flat().every(id => BY[id])) return s;
  } catch (e) { /* хранилище недоступно */ }
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* играем без сохранения */ } }

let S = load() || fresh();

const ids = () => S.second ? S.queue : S.order[S.level];
const right = l => LEVELS[l].tasks.filter(t => S.first[t.id]).length;
const starsOf = l => { const p = right(l) / LEVELS[l].tasks.length; return p >= .9 ? 3 : p >= .7 ? 2 : 1; };
const accent = c => document.documentElement.style.setProperty('--a', c);

function view(html) { app.innerHTML = html; }
function on(sel, fn) { app.querySelectorAll(sel).forEach(e => e.addEventListener('click', () => fn(e))); }
function go(screen) { S.screen = screen; save(); render(); scrollTo(0, 0); }

function start() {
  accent('#D6FF3F');
  view(`<section class="screen mid" data-screen="start">
    <p class="kicker">Русский язык · ЕГЭ 2027 · задание 5</p>
    <h1>Паронимы: <em>операция «Двойник»</em></h1>
    <div class="tiles" aria-hidden="true"><div class="tile">невежа</div><div class="tile">невежда</div><div class="tile">надеть</div><div class="tile">одеть</div></div>
    <p>Они похожи, путают всех и делают вид, что ни при чём. Твоя миссия — вывести двойников на чистую воду и забрать балл.</p>
    <div class="chips"><span class="chip">4 уровня · 1 босс · 0 таймеров</span><span class="chip">${TOTAL} заданий</span></div>
    <button class="btn" id="start">Поехали</button>
  </section>`);
  on('#start', () => { S.page = 0; go('theory'); });
}

function theory() {
  accent(['#D6FF3F', '#4CC9FF', '#FF6DB0', '#FFA347', '#D6FF3F'][S.page]);
  const [title, body] = THEORY[S.page];
  view(`<section class="screen slide" data-screen="theory">
    <div class="th"><p class="kicker">Вспомним</p><button class="link" id="skip">Пропустить</button></div>
    <h2>${title}</h2>
    <div class="card">${body}</div>
    <div class="grow"></div>
    <div class="th"><div class="dots">${THEORY.map((_, i) => `<i class="${i === S.page ? 'on' : ''}"></i>`).join('')}</div>
      ${S.page ? '<button class="link" id="back">Назад</button>' : '<span class="lead">можно листать</span>'}</div>
    <button class="btn" id="next">${S.page === THEORY.length - 1 ? 'К заданиям' : 'Дальше'}</button>
  </section>`);
  const move = d => {
    const n = S.page + d;
    if (n < 0) return;
    if (n >= THEORY.length) return go('intro');
    S.page = n; go('theory');
  };
  on('#next', () => move(1)); on('#back', () => move(-1)); on('#skip', () => go('intro'));
  let x, y;
  const el = app.firstElementChild;
  el.addEventListener('touchstart', e => { x = e.touches[0].clientX; y = e.touches[0].clientY; }, {passive: true});
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x, dy = e.changedTouches[0].clientY - y;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
  }, {passive: true});
}

function intro() {
  const L = LEVELS[S.level];
  accent(L.color);
  view(`<section class="screen mid" data-screen="intro">
    <p class="kicker">Уровень ${S.level + 1} из ${LEVELS.length}</p>
    <h1 style="font-size:34px"><em>${L.name}</em></h1>
    <p>${L.teaser}</p>
    <p class="lead">${L.tasks.length} заданий. Всё, что не получится сразу, вернётся во «Втором заходе».</p>
    <button class="btn" id="play">Играть</button>
  </section>`);
  on('#play', () => { S.pos = 0; S.second = false; S.queue = []; S.answer = null; go('game'); });
}

function game() {
  const L = LEVELS[S.level], list = ids(), T = BY[list[S.pos]], A = S.answer;
  accent(L.color);
  const seen = S.second ? S.retry : S.first;
  const bar = list.map((id, i) => `<i class="${id in seen ? (seen[id] ? 'ok' : 'bad') : i === S.pos ? 'now' : ''}"></i>`).join('');
  let body = `<div class="label">${T.label}</div>`;
  if (T.type === 'ege') {
    body += `<div class="sent small">${esc(T.q).replace('НЕВЕРНО', '<b>НЕВЕРНО</b>')}</div><div class="exs">${T.rows.map((r, i) => `<div class="ex"><span>${i + 1}</span><div>${mark(r)}</div></div>`).join('')}</div>`;
  } else {
    body += `<div class="sent ${T.type === 'find' ? 'chat' : ''}">${mark(T.q)}</div>`;
  }
  if (T.opts) {
    body += `<div class="opts">${S.opts[T.id].map(o => `<button class="opt ${A ? (o === T.a ? 'ok' : o === A.val ? 'no' : '') : ''}" data-v="${esc(o)}" ${A ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  } else {
    body += `<form id="form" class="opts"><input class="field" id="field" aria-label="Ответ одним словом" placeholder="Одно слово" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${A ? esc(A.val) : ''}" ${A ? 'disabled' : ''}><button class="btn" id="check" disabled>Проверить</button></form>`;
  }
  view(`<section class="screen" data-screen="game" data-task="${T.id}">
    <header class="top"><div class="name">${L.name}</div><div class="score"><span class="hl">★</span> ${S.score}</div><button class="round" id="help" aria-label="Шпаргалка">?</button></header>
    <div class="bar">${bar}</div>
    <div class="meta"><span>${S.second ? 'Второй заход' : 'Задание'} ${S.pos + 1} из ${list.length}</span><span>${S.streak > 1 ? `серия: ${S.streak}` : ''}</span></div>
    ${body}
    <div id="space"></div>
  </section>${A ? sheet(T, A) : ''}`);
  on('#help', help);
  on('#next', next);
  if (A) {
    const sh = app.querySelector('.sheet');
    app.querySelector('#space').style.height = sh.offsetHeight + 'px';
    app.querySelector('#next').focus({preventScroll: true});
    return;
  }
  on('.opt', e => submit(e.dataset.v));
  const form = app.querySelector('#form');
  if (form) {
    const f = app.querySelector('#field'), b = app.querySelector('#check');
    f.addEventListener('input', () => { b.disabled = !f.value.trim(); });
    form.addEventListener('submit', e => { e.preventDefault(); if (f.value.trim()) submit(f.value); });
  }
}

function sheet(T, A) {
  const ans = T.type === 'find' ? `${T.a} → ${T.fix}` : T.a;
  const head = A.ok ? (S.streak > 2 ? `Верно! Серия ${S.streak}` : 'Верно!') : 'Почти!';
  const later = !A.ok && !S.second ? '<p class="joke">Задание вернётся в конце уровня.</p>' : '';
  return `<aside class="sheet" role="status"><h2 class="${A.ok ? 'ok' : 'no'}">${head}</h2><p class="answer">Ответ: <span class="hl">${esc(ans)}</span></p><p>${esc(T.why)}</p><p class="joke">${esc(T.joke)}</p>${later}<button class="btn" id="next">Дальше</button></aside>`;
}

function submit(val) {
  if (S.answer) return;
  const T = BY[ids()[S.pos]], ok = norm(val) === norm(T.a);
  if (S.second) S.retry[T.id] = ok;
  else { S.first[T.id] = ok; if (!ok) S.queue.push(T.id); }
  if (ok) {
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    S.score += S.second ? 5 : 10 + Math.min(S.streak - 1, 3) * 2;
  } else S.streak = 0;
  S.answer = {val, ok};
  save();
  if (document.activeElement) document.activeElement.blur();
  game();
  if (ok) { confetti(); try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) { /* без вибрации */ } }
}

function next() {
  calm();
  S.answer = null;
  if (S.pos < ids().length - 1) { S.pos++; return go('game'); }
  if (!S.second && S.queue.length) { S.pos = 0; return go('again'); }
  go('result');
}

function again() {
  accent(LEVELS[S.level].color);
  const n = S.queue.length;
  view(`<section class="screen mid" data-screen="again">
    <p class="kicker">Уровень ${S.level + 1}</p><h2>Второй заход</h2>
    <p>${n} ${plural(n, 'задание', 'задания', 'заданий')} на повтор. Объяснение уже было, так что у двойников шансов меньше.</p>
    <button class="btn" id="retry">Исправить</button></section>`);
  on('#retry', () => { S.second = true; S.pos = 0; go('game'); });
}

function result() {
  const L = LEVELS[S.level], n = starsOf(S.level), N = LEVELS[S.level + 1];
  accent(L.color);
  view(`<section class="screen mid" data-screen="result">
    <p class="kicker">Уровень ${S.level + 1} позади</p><h2>${L.name}</h2>
    <div class="stars" aria-label="Звёзд: ${n} из 3">${[0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}" style="animation-delay:${i * .2}s">★</span>`).join('')}</div>
    <p>С первой попытки: <b>${right(S.level)} из ${L.tasks.length}</b>. ${['Двойники пока сопротивляются, но правило уже знакомо.', 'Хороший результат: двойники нервничают.', 'Блестяще. Двойники пишут явку с повинной.'][n - 1]}</p>
    ${N ? `<div class="card"><p class="kicker">Дальше</p><p><b>${N.name}</b></p><p class="lead">${N.teaser}</p></div>` : ''}
    <button class="btn" id="onward">${N ? 'Следующий уровень' : 'К финалу'}</button></section>`);
  on('#onward', () => {
    if (!N) return go('final');
    S.level++; S.second = false; S.queue = []; S.pos = 0; go('intro');
  });
}

function summary() {
  const good = LEVELS.reduce((n, _, i) => n + right(i), 0);
  const stars = LEVELS.reduce((n, _, i) => n + starsOf(i), 0);
  const bad = Object.values(BY).filter(t => S.first[t.id] === false);
  return {good, stars, bad};
}

function report() {
  const {good, stars, bad} = summary();
  const out = ['Тренажёр «Паронимы. Задание 5 ЕГЭ»', `Очки: ${S.score}`, `Звёзды: ${stars} из ${LEVELS.length * 3}`, `С первой попытки: ${good} из ${TOTAL}`];
  LEVELS.forEach((l, i) => out.push(`${i + 1}. ${l.name}: ${right(i)} из ${l.tasks.length}`));
  if (bad.length) {
    out.push('Ошибки:');
    bad.forEach(t => out.push(`- ${t.pair} (задание ${t.id}): ${S.retry[t.id] ? 'исправлено во втором заходе' : 'нужно повторить'}`));
  } else out.push('Ошибок нет.');
  return out.join('\n');
}

function final() {
  const {good, stars, bad} = summary();
  accent('#D6FF3F');
  view(`<section class="screen" data-screen="final">
    <p class="kicker">Финал</p><h1 style="font-size:36px">Операция <em>завершена</em></h1>
    <p>Двойники разоблачены. Отправь результат — и можно выдыхать.</p>
    <div class="stats">
      <div class="stat"><b>${S.score}</b><span>${plural(S.score, 'очко', 'очка', 'очков')}</span></div>
      <div class="stat"><b>${stars}/${LEVELS.length * 3}</b><span>звёзды</span></div>
      <div class="stat"><b>${good}/${TOTAL}</b><span>с первой попытки</span></div>
      <div class="stat"><b>${S.best}</b><span>лучшая серия</span></div>
    </div>
    <button class="btn" id="send">Отправить результат учителю</button>
    <button class="btn sec" id="restart">Пройти ещё раз</button>
    <div class="card"><p><b>${bad.length ? 'Что повторить' : 'Ошибок нет. Чистая работа!'}</b></p>
    ${bad.map(t => `<div class="row err"><b>${esc(t.pair)}</b><small>${esc(t.why)}</small></div>`).join('')}</div>
  </section>`);
  on('#send', send);
  on('#restart', () => { S = fresh(); go('intro'); });
}

function modal(html) {
  const back = document.activeElement, m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}<button class="btn" id="close">Закрыть</button></div>`;
  document.body.append(m);
  const close = () => {
    m.remove(); document.removeEventListener('keydown', key);
    if (back && back.isConnected) back.focus({preventScroll: true});
  };
  const key = e => { if (e.key === 'Escape') close(); };
  m.querySelector('#close').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', key);
  m.querySelector('#close').focus({preventScroll: true});
  return m;
}

function help() {
  modal(`<h2>Шпаргалка</h2><div>
    <div class="row"><b>Паронимы</b> — однокоренные слова с разными приставками или суффиксами и разным значением.</div>
    <div class="row"><b>Порядок:</b> значение → ошибка → пара → форма → написание.</div>
    <div class="row"><b>Проверка:</b> составь словосочетание с каждым словом пары.</div>
    <div class="row"><b>Не пароним</b> — любой синоним, даже очень подходящий.</div>
    <div class="row"><b>На ЕГЭ</b> задание 5 даёт 1 балл. Ответ — одно слово без ошибок, точно как в эталоне.</div></div>`);
}

async function send() {
  const text = report();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* ниже запасной способ */ }
  if (!ok) {
    const t = document.createElement('textarea');
    t.value = text; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();
  }
  const m = modal(`<h2>${ok ? 'Результат скопирован' : 'Скопируй результат'}</h2><p>${ok ? 'Вставь его в сообщение учителю и отправь.' : 'Автоматически не вышло. Выдели текст, скопируй и отправь учителю.'}</p><textarea id="manual" readonly></textarea>`);
  m.querySelector('#manual').value = text;
}

const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
let bits = [], frame = 0;
function calm() { cancelAnimationFrame(frame); bits = []; ctx.clearRect(0, 0, canvas.width, canvas.height); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#D6FF3F', '#4CC9FF', '#FF6DB0', '#FFA347'];
  for (let i = 0; i < 70; i++) bits.push({x: canvas.width / 2, y: canvas.height * .42, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 2, c: colors[i % 4], life: 65});
  cancelAnimationFrame(frame);
  (function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bits = bits.filter(p => p.life-- > 0);
    for (const p of bits) { p.x += p.vx; p.y += p.vy; p.vy += .4; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 8, 6); }
    if (bits.length) frame = requestAnimationFrame(tick);
  })();
}

const SCREENS = {start, theory, intro, game, again, result, final};
function render() { (SCREENS[S.screen] || start)(); }
render();
})();
</script>
</body>
</html>
