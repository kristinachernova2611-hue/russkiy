:root{
  --bg:#0F0F14; --surface:#1B1B24; --surface2:#272732; --line:#34343F;
  --text:#F6F5F0; --muted:#B0AFBD;
  --lime:#D6FF3F; --i:#4CC9FF; --y:#FF6DB0; --warn:#FFA347;
  --acc:var(--lime); --ink:#0F0F14;
  --display:'Unbounded Var','Arial Black',system-ui,sans-serif;
  --body:'Onest Var',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body[data-lvl="1"]{--acc:var(--i)}
body[data-lvl="2"]{--acc:var(--y)}
body[data-lvl="3"]{--acc:var(--warn)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font:400 17px/1.45 var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
b{font-weight:800}
#nojs{padding:32px 20px;font-size:19px}
#nojs h1{font:800 26px/1.2 var(--display);margin-bottom:12px;color:var(--lime)}

#app{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:640px) and (min-height:600px){
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60vw 60vw at 15% 10%,#1d2a06 0,transparent 60%),radial-gradient(50vw 50vw at 90% 90%,#2a0f20 0,transparent 60%),var(--bg)}
  #app{width:460px;height:min(860px,calc(100vh - 40px));border:1px solid var(--line);border-radius:28px}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;
  padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));animation:enter .35s cubic-bezier(.2,.8,.2,1)}
.screen>*{flex-shrink:0}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{display:block;width:100%;min-height:62px;padding:14px 18px;border-radius:18px;font-weight:800;font-size:19px;line-height:1.2;
  transition:transform .12s ease,filter .12s ease;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn+.btn{margin-top:10px}
.push{margin-top:auto}
.h1{font:900 clamp(34px,10.6vw,46px)/1.06 var(--display);letter-spacing:-.02em}
.h2{font:800 clamp(23px,6.6vw,28px)/1.16 var(--display);letter-spacing:-.01em}
.lead{font-size:17.5px;color:var(--muted)}
.lead b{color:var(--text)}
.cs{color:var(--i)}.cu{color:var(--y)}.cp{color:var(--warn)}

/* Старт */
.tiles{display:flex;justify-content:center;gap:12px;margin:clamp(6px,3vh,26px) 0 clamp(14px,3vh,28px)}
.tile{width:clamp(80px,25vw,106px);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;
  font:900 clamp(44px,14vw,60px)/1 var(--display);color:var(--ink)}
.tile.a{background:var(--i);transform:rotate(-7deg);animation:wobA 3.2s ease-in-out infinite}
.tile.b{background:var(--y);transform:rotate(3deg);animation:wobB 3.2s ease-in-out infinite}
.tile.c{background:var(--warn);transform:rotate(8deg);animation:wobC 3.2s ease-in-out infinite}
@keyframes wobA{50%{transform:rotate(-2deg) translateY(-8px)}}
@keyframes wobB{50%{transform:rotate(-3deg) translateY(7px)}}
@keyframes wobC{50%{transform:rotate(12deg) translateY(-5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface2);font-size:15px;font-weight:600}
.start .lead{margin-top:12px}
.kicker{font-weight:800;color:var(--acc);font-size:15.5px;margin-bottom:8px}

/* Теория */
.rules-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:6px;border-radius:9px;background:var(--surface2);transition:background .2s}
.dots i.on{background:var(--acc)}
.skip{padding:10px 0 10px 16px;color:var(--muted);font-weight:600;min-height:44px}
.slide{animation:slide .3s cubic-bezier(.2,.8,.2,1)}
.slide.back{animation-name:slideb}
@keyframes slide{from{opacity:0;transform:translateX(34px)}}
@keyframes slideb{from{opacity:0;transform:translateX(-34px)}}
.slide .lead{margin-top:10px}
.exg{background:var(--surface);border-radius:16px;padding:10px 14px;margin-top:8px;font-size:15.5px;line-height:1.35}
.exg strong{display:block;color:var(--acc);font-weight:800;font-size:15px;margin-bottom:1px}
.exg strong.cs{color:var(--i)}.exg strong.cu{color:var(--y)}.exg strong.cp{color:var(--warn)}
.exg q{quotes:none;color:var(--muted)}
.small{font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.small b{color:var(--text)}
.stick{position:sticky;bottom:calc(-1 * var(--pb));background:var(--bg);padding-top:12px;padding-bottom:var(--pb);margin-bottom:calc(-1 * var(--pb));z-index:1;--pb:max(18px,env(safe-area-inset-bottom))}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.pos div{background:var(--surface);border-radius:13px;padding:8px 11px;font-size:13.5px;line-height:1.28;color:var(--muted);min-width:0}
.pos b{display:block;color:var(--text);font-size:14.5px;overflow-wrap:anywhere}
.pos em{font-style:normal;color:var(--acc);font-weight:600}
.pos b.cs{color:var(--i)}
.pos-s div{color:var(--text);font-size:14.5px}
.mini-h{font-weight:800;font-size:15.5px;margin-top:12px}
.reveal{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.reveal button{min-height:40px;padding:6px 12px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:15px;transition:background .15s}
.reveal button.on{background:var(--acc);color:var(--ink);font-weight:800}
.steps{list-style:none;padding:0;margin:8px 0 0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:5px 0 5px 38px;font-size:15.5px;line-height:1.3;min-height:36px}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:28px;height:28px;border-radius:9px;background:var(--surface2);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:14.5px}

/* Игра */
.play{padding-bottom:max(16px,env(safe-area-inset-bottom))}
.hud-top{display:flex;align-items:center;gap:10px;min-height:44px}
.lvl-tag{font-weight:800;font-size:16px;color:var(--acc);flex:1;min-width:0}
.score{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:18px;position:relative;font-variant-numeric:tabular-nums}
.score svg{width:20px;height:20px;fill:var(--lime)}
.score.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.28)}}
.plus{position:absolute;right:0;top:-2px;color:var(--lime);font-weight:800;pointer-events:none;animation:plus .8s ease-out forwards}
@keyframes plus{to{transform:translateY(-22px);opacity:0}}
.help{width:44px;height:44px;border-radius:14px;background:var(--surface2);font-weight:800;font-size:19px;flex:none}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.seg{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.seg i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.count{margin-top:7px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:130px;padding:12px 0;text-align:center;transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.answered .ask,.answered .retry-tag,.answered .ctx{visibility:hidden}
.ask{color:var(--muted);font-size:16.5px;margin-bottom:10px}
.retry-tag{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--warn);font-weight:700;font-size:14px;margin-bottom:10px}
.phrase{font-weight:800;font-size:clamp(29px,8.6vw,36px);line-height:1.18;letter-spacing:-.01em;max-width:100%;overflow-wrap:anywhere}
.phrase.shake,.safebar.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.main{color:var(--acc);text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.14em}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:11px;min-height:64px;width:100%;padding:10px 15px;border-radius:18px;background:var(--surface);border:3px solid var(--line);
  font-weight:800;font-size:18px;line-height:1.2;text-align:left;transition:transform .12s,background .15s,color .15s,border-color .15s}
.opt:active{transform:scale(.97)}
@media (hover:hover){.opt:hover{background:var(--surface2);border-color:var(--acc)}}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:1px}
.opt .ico{font-size:25px;line-height:1;flex:none;width:30px;text-align:center}
.opt.t-s{border-color:var(--i)}.opt.t-u{border-color:var(--y)}.opt.t-p{border-color:var(--warn)}
.opt.center{justify-content:center;text-align:center}
.opt .code{margin-left:auto;flex:none;width:38px;height:38px;border-radius:11px;background:var(--surface2);color:var(--acc);display:grid;place-items:center;font:800 18px var(--display)}
.opt.vb{font-size:17.5px;min-height:56px;padding:8px 15px}
.opt.good{border-color:var(--lime);color:var(--lime)}
.opt.bad{border-color:var(--warn);color:var(--warn)}

/* Сейф */
.safebar{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:18px;padding:9px 11px;margin-top:9px}
.dial{flex:none;width:44px;height:44px;border-radius:50%;border:4px solid var(--acc);position:relative;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.dial::after{content:'';position:absolute;left:50%;top:3px;width:4px;height:12px;margin-left:-2px;border-radius:3px;background:var(--acc)}
.safe-info{flex:1;min-width:0}
.safe-name{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.15;margin-bottom:5px}
.cells{display:flex;gap:5px}
.cell{flex:1;max-width:38px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font:800 16px var(--display);color:var(--muted)}
.cell.f{background:var(--acc);color:var(--ink)}
.cell.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ctx{background:var(--surface);border-radius:14px;padding:9px 13px;margin-bottom:12px;font-size:14.5px;line-height:1.35;text-align:left;width:100%}
.ctx cite{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:2px}
.ctx em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:3px}
.vault{position:relative;width:136px;height:136px;margin:12px auto 8px;perspective:700px;flex:none;transition:transform .9s ease .5s}
.vault.open{transform:translateX(34px)}
.vault-in{position:absolute;inset:0;border-radius:20px;background:#07070B;border:4px solid var(--line);display:grid;place-items:center;font-size:62px;overflow:hidden}
.vault-in svg{width:72px;height:72px;fill:var(--lime);filter:drop-shadow(0 0 16px rgba(214,255,63,.6))}
.door{position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,#3a3a48,#23232c);border:4px solid var(--acc);transform-origin:left center;
  transition:transform 1s cubic-bezier(.5,0,.2,1) .55s;display:grid;place-items:center;z-index:2;backface-visibility:visible}
.wheel{width:70px;height:70px;border-radius:50%;border:7px solid var(--acc);position:relative;transition:transform .7s cubic-bezier(.5,0,.2,1)}
.wheel::before,.wheel::after{content:'';position:absolute;background:var(--acc);border-radius:4px}
.wheel::before{left:50%;top:-4px;bottom:-4px;width:8px;margin-left:-4px}
.wheel::after{top:50%;left:-4px;right:-4px;height:8px;margin-top:-4px}
.vault.open .wheel{transform:rotate(300deg)}
.vault.open .door{transform:rotateY(-112deg)}
.safe-open{text-align:center}
.safe-open .cells{justify-content:center;margin:8px 0 2px}
.safe-open .cell{height:42px;font-size:19px}
.recap{text-align:left;margin:8px 0 12px;animation:enter .4s .9s backwards}
.recap div{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.25}
.recap span{flex:1;min-width:0}
.recap em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.recap b{color:var(--acc);font-family:var(--display);width:18px;text-align:center}
[hidden]{display:none!important}

/* Перестрой-ка и босс */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-weight:700;font-size:15px}
.tag{padding:4px 11px;border-radius:99px;background:var(--surface2)}
.pair{width:100%}
.pair .pa{font-weight:800;font-size:clamp(23px,6.6vw,27px);line-height:1.2}
.pair .arrow{color:var(--muted);font-size:20px;line-height:1.3}
.pair .pb{font-weight:800;font-size:clamp(23px,6.6vw,27px);line-height:1.2;color:var(--acc)}
.pair .pb.strike{color:var(--warn);text-decoration:line-through;text-decoration-thickness:.09em}
.pair .plabel{color:var(--muted);font-size:16px;margin-top:6px}
.blank{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 9px}
.blank i{font-style:normal;width:21px;height:27px;border-radius:5px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--lime)}
.blank-l{font-size:13.5px;color:var(--muted)}

/* Шторка реакции */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--surface2);border-radius:26px 26px 0 0;
  padding:18px 18px max(16px,env(safe-area-inset-bottom));animation:sheet .28s cubic-bezier(.2,.9,.25,1);z-index:5;box-shadow:0 -14px 40px rgba(0,0,0,.45);text-align:left}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet h3{font:800 23px/1.15 var(--display);margin-bottom:7px}
.sheet.ok h3{color:var(--lime)}.sheet.no h3{color:var(--warn)}
.sheet p{margin-bottom:7px;font-size:16.5px;line-height:1.38}
.sheet .quip{color:var(--muted);font-size:15.5px}
.sheet .streak{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--lime);color:var(--ink);font-weight:800;font-size:14px;margin-bottom:8px}
.sheet .btn{margin-top:8px;position:sticky;bottom:0;box-shadow:0 8px 0 var(--surface2)}
.sheet .btn.primary{background:var(--lime)}
.sheet.no .btn.primary{background:var(--warn)}
.sheet .steps{margin:0 0 7px;--acc:var(--lime)}
.sheet .steps li{font-size:15.5px;padding-top:3px;padding-bottom:3px;min-height:32px}
.sheet .steps li::before{background:var(--bg);top:2px;width:26px;height:26px}

/* Между уровнями */
.inter{text-align:left}
.stars{display:flex;gap:9px;margin:16px 0 10px}
.stars svg{width:clamp(50px,15vw,62px);height:clamp(50px,15vw,62px);fill:var(--surface2)}
.stars svg.on{fill:var(--lime);animation:star .5s cubic-bezier(.2,1.7,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.15s}.stars svg.on:nth-child(3){animation-delay:.3s}
@keyframes star{from{transform:scale(0) rotate(-40deg)}}
.next-card{background:var(--surface);border-radius:22px;padding:16px 17px;margin:20px 0 16px}
.next-card .h2{font-size:21px;margin-bottom:6px}
.next-card p{color:var(--muted)}
.next-card .kicker{color:var(--next,var(--acc))}
.big-num{font:900 clamp(40px,13vw,56px)/1 var(--display);color:var(--acc);margin-top:10px}

/* Финал */
.res{margin:14px 0}
.res-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.res-row b{white-space:nowrap}
.mini-stars{display:inline-flex;gap:2px;vertical-align:-3px;margin-left:5px}
.mini-stars svg{width:15px;height:15px;fill:var(--line)}.mini-stars svg.on{fill:var(--lime)}
.err-h{font:800 18px/1.2 var(--display);margin:8px 0 10px}
.err{background:var(--surface);border-radius:14px;padding:10px 13px;margin-bottom:8px}
.err b{font-size:17px;display:block}
.err span{color:var(--muted);font-size:15px;display:block;line-height:1.35}
.clean{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}
.copy-status{min-height:0;font-weight:700;color:var(--lime);padding:10px 2px 0;font-size:16px}
.copy-status.bad{color:var(--warn)}
.manual{display:block;width:100%;height:190px;margin-top:8px;padding:11px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:400 16px/1.35 var(--body);resize:vertical}
.link-btn{padding:10px 2px;min-height:44px;color:var(--muted);text-decoration:underline;font-size:15.5px;font-weight:600;display:block}
.final-actions{padding-top:12px}

/* Шпаргалка */
.modal-wrap{position:absolute;inset:0;background:rgba(5,5,8,.72);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-top:2px solid var(--line);border-radius:26px 26px 0 0;
  padding:20px 18px max(16px,env(safe-area-inset-bottom));animation:sheet .28s cubic-bezier(.2,.9,.25,1)}
.modal .h2{font-size:23px;margin-bottom:10px}
.modal .btn{margin-top:14px}

#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.bit{position:absolute;width:10px;height:10px;border-radius:3px;animation:bit .8s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes bit{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}

var KEY='slovosochetaniya-homework-v2', S=null, locked=false, readyAt=0, lastGood=-1, lastBad=-1;

try{window.localStorage.removeItem('slovosochetaniya-trainer-v1');}catch(e){}
function store(){try{return window.localStorage;}catch(e){return null;}}
function save(){try{var s=store();if(s)s.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var s=store();if(!s)return null;var v=JSON.parse(s.getItem(KEY)||'null');
  if(v&&v.screen&&v.stats&&v.stats.length===LEVELS.length&&v.queue)return v;}catch(e){}return null;}
function clearSaved(){try{var s=store();if(s)s.removeItem(KEY);}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fresh(){return {screen:'intro',lvl:0,rule:0,queue:[],done:0,score:0,streak:0,missed:{},errors:[],cells:{},pendingSafe:null,
  stats:LEVELS.map(function(l){return {first:0,total:l.items.length};})};}
function startLevel(i){
  S.lvl=i;S.done=0;S.missed={};S.screen='play';S.pendingSafe=null;
  if(LEVELS[i].type==='safe'){S.queue=[];S.cells={};SAFES.forEach(function(sf){shuffle(sf.items).forEach(function(x){S.queue.push(x.id);});});}
  else S.queue=shuffle(LEVELS[i].items.map(function(x){return x.id;}));
  save();
}
function lvl(){return LEVELS[S.lvl];}
function byId(id){var a=lvl().items;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function pick(arr,which){var i;do{i=Math.floor(Math.random()*arr.length);}while(arr.length>1&&i===(which?lastGood:lastBad));if(which)lastGood=i;else lastBad=i;return arr[i];}
function starsFor(st){var p=st.first/st.total;return p>=.9?3:p>=.6?2:1;}
function plain(h){return h.replace(/<[^>]+>/g,'');}
function bare(t){return t.replace(/\*/g,'');}
function mark(t){return t.replace(/\*([^*]+)\*/g,'<span class="main">$1</span>');}
function addError(w,rule,note){for(var i=0;i<S.errors.length;i++)if(S.errors[i].w===w)return;S.errors.push({w:w,rule:plain(rule),note:note||'',lvl:S.lvl});}

function $(q){return app.querySelector(q);}
function $$(q){return Array.prototype.slice.call(app.querySelectorAll(q));}
function on(q,fn){var e=$(q);if(e)e.addEventListener('click',fn);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function reduced(){return window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;}
function confetti(el){if(reduced()||!el)return;var fx=$('#fx');if(!fx)return;var a=app.getBoundingClientRect(),r=el.getBoundingClientRect();
  var cols=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347'];for(var i=0;i<16;i++){var b=document.createElement('i');b.className='bit';
    var ang=Math.random()*Math.PI*2,d=50+Math.random()*90;b.style.left=(r.left-a.left+r.width/2)+'px';b.style.top=(r.top-a.top+r.height/2)+'px';
    b.style.background=cols[i%4];b.style.setProperty('--x',Math.cos(ang)*d+'px');b.style.setProperty('--y',Math.sin(ang)*d+'px');b.style.setProperty('--r',(Math.random()*540)+'deg');fx.appendChild(b);}
  setTimeout(function(){if(fx)fx.innerHTML='';},850);}
function bumpScore(p){var s=$('.score');if(!s)return;s.querySelector('b').textContent=S.score;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');

  S.screen='rules';S.rule=i;save();

   '<div class="push stick"><button class="btn primary" id="nx">'+(i<RULES.length-1?'Дальше':'К первому уровню')+'</button></div>','rules');
  function next(){if(i<RULES.length-1)renderRules(i+1,false);else goIntro();}
  function goIntro(){rulesKeys=null;S.screen='intro';S.lvl=0;save();route();}
  on('#nx',next);on('#skip',goIntro);
  $$('#reveal button').forEach(function(b){b.addEventListener('click',function(){var w=POS_WORDS[+b.getAttribute('data-w')];
    var isOn=b.classList.toggle('on');b.textContent=isOn?w[0]+': '+w[1]:w[0];});});
  var sx=null,sy=null,scr=$('#scr');
  scr.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  scr.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;

}

function hudPct(){var d=S.done,l=S.queue.length;return d+l?Math.round(d/(d+l)*100):100;}
function hudCount(){return 'Пройдено '+S.done+' из '+(S.done+S.queue.length)+(Object.keys(S.missed).length?' (с повторами)':'');}
function refreshHud(){var c=$('.count'),s=$$('.seg i');if(c)c.textContent=hudCount();if(s[S.lvl])s[S.lvl].style.width=hudPct()+'%';}
function hud(){
  var pct=hudPct();
  return '<header class="hud"><div class="hud-top"><span class="lvl-tag">'+(S.lvl+1)+'. '+lvl().name+'</span>'+
   '<span class="score" aria-label="Очки"><svg viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg><b>'+S.score+'</b></span>'+
   '<button class="help" id="help" aria-label="Открыть шпаргалку">?</button></div>'+
   '<div class="segs" aria-hidden="true">'+LEVELS.map(function(_,k){return '<div class="seg"><i style="width:'+(k<S.lvl?100:k===S.lvl?pct:0)+'%"></i></div>';}).join('')+'</div>'+
   '<div class="count">'+hudCount()+'</div></header>';
}
var RENDER={type:renderType,safe:renderSafe,swap:renderSwap,boss:renderBoss};
function renderPlay(){
  if(S.pendingSafe!==null&&S.pendingSafe!==undefined){renderSafeOpen(S.pendingSafe);return;}
  if(!S.queue.length){finishLevel();return;}
  locked=false;readyAt=Date.now()+250;
  RENDER[lvl().type](byId(S.queue[0]));
  on('#help',openHelp);
}
function retryTag(it){return S.missed[it.id]?'<span class="retry-tag">Второй заход</span>':'';}
/* Общий учёт ответа. Возвращает начисленные очки. */
function settle(it,ok,where){
  var retry=!!S.missed[it.id],pts=0;
  S.queue.shift();S.done++;
  if(ok){pts=retry?RETRY_POINTS:POINTS;S.score+=pts;if(!retry)S.stats[S.lvl].first++;S.streak++;buzz(12);bumpScore(pts);confetti(where);}
  else{S.streak=0;S.missed[it.id]=true;requeue(it);buzz([20,50,20]);}
  refreshHud();save();
  return pts;
}
function requeue(it){
  if(lvl().type!=='safe'){S.queue.push(it.id);return;}
  /* В сейфах задание возвращается в конце своего сейфа: без его цифры дверца не откроется. */
  var at=0;S.queue.forEach(function(id,i){if(byId(id).safe===it.safe)at=i+1;});
  S.queue.splice(at,0,it.id);
}
function streakChip(){return S.streak>=3?'<span class="streak">Серия: '+S.streak+'</span>':'';}
/* Шторка не должна закрывать словосочетание: поднимаем его в свободное место. */
function liftWord(sh){
  var w=$('#word'),st=$('.stage'),h=$('.safebar')||$('.hud');if(!w||!st||!h)return;
  $('#scr').classList.add('answered');
  var ar=app.getBoundingClientRect(),hb=h.getBoundingClientRect().bottom,wr=w.getBoundingClientRect();
  sh.style.maxHeight=Math.max(ar.bottom-hb-wr.height-24,170)+'px';
  var top=ar.bottom-sh.offsetHeight,d=wr.bottom-top+14;
  if(d>0)st.style.transform='translateY(-'+Math.min(d,Math.max(0,wr.top-hb-6))+'px)';
}
function openSheet(ok,title,body,extra,next,label){
  var old=$('.sheet');if(old)old.parentNode.removeChild(old);
  var sh=document.createElement('div');sh.className='sheet '+(ok?'ok':'no');sh.setAttribute('role','status');
  sh.innerHTML=(extra||'')+'<h3>'+title+'</h3>'+body+'<button class="btn primary" id="next">'+(label||'Дальше')+'</button>';
  $('#scr').parentNode.appendChild(sh);
  liftWord(sh);
  var at=Date.now()+220,b=sh.querySelector('#next');
  b.addEventListener('click',function(){if(Date.now()<at)return;if(sh.parentNode)sh.parentNode.removeChild(sh);next();});
  b.focus({preventScroll:true});
}
function busy(){return locked||Date.now()<readyAt||$('.modal-wrap')||$('.sheet');}

/* ---------- Уровень 1: тип связи ---------- */
function typeBtn(k,extra,sub){var t=TYPES[k];return '<button class="opt '+t.cl+'" data-a="'+k+'"><span class="ico" aria-hidden="true">'+t.ico+'</span><span>'+t.n+(sub?'<small>'+t.m+'</small>':'')+'</span>'+(extra||'')+'</button>';}
function renderType(it){
  show(hud()+'<div class="stage">'+retryTag(it)+'<p class="ask">Какой тип связи? Главное слово подсвечено.</p>'+
   '<div class="phrase" id="word">'+mark(it.t)+'</div></div>'+
   '<div class="opts">'+['s','u','p'].map(function(k){return typeBtn(k,'',true);}).join('')+'</div>','play');
  $$('.opt').forEach(function(b){b.addEventListener('click',function(){answerType(it,b.getAttribute('data-a'));});});
}
function answerType(it,a){
  if(busy())return;locked=true;
  var ok=a===it.a,t=TYPES[it.a];
  settle(it,ok,$('#word'));
  if(ok)openSheet(true,pick(GOOD,true),'<p><b>'+cap(t.n)+'.</b> '+it.why+'</p><p class="quip">'+it.q+'</p>',streakChip(),renderPlay);
  else{addError(bare(it.t),'Правильно: '+t.n+'. '+it.why,'Твой ответ: '+TYPES[a].n);$('#word').classList.add('shake');
    openSheet(false,pick(BAD,false),'<p>Тут <b>'+t.n+'</b>. '+it.why+'</p><p class="quip">Задание вернётся в конце уровня. Оно злопамятное.</p>','',renderPlay);}
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ---------- Уровень 2: сейфы ---------- */
function safeCells(sf,animId){return '<div class="cells">'+sf.items.map(function(x){var f=S.cells[x.id];
  return '<div class="cell'+(f?' f':'')+(animId===x.id?' pop':'')+'" data-c="'+x.id+'">'+(f?x.d:'')+'</div>';}).join('')+'</div>';}
function filledCount(sf){var n=0;sf.items.forEach(function(x){if(S.cells[x.id])n++;});return n;}
function renderSafe(it){
  var sf=SAFES[it.safe],ctx=sf.text?'<div class="ctx">'+sf.text+'<em>Основа, не словосочетание: '+sf.base+'</em></div>':'';
  var order=[0,2].sort(function(){return Math.random()-.5;});
  show(hud()+'<div class="safebar"><div class="dial" style="transform:rotate('+(filledCount(sf)*67)+'deg)" aria-hidden="true"></div><div class="safe-info"><p class="safe-name">'+sf.name+' · сейф '+(it.safe+1)+' из '+SAFES.length+'</p>'+safeCells(sf)+'</div></div>'+
   '<div class="stage">'+retryTag(it)+ctx+'<p class="ask">Какой тип связи? Верный даст цифру шифра.</p><div class="phrase" id="word">'+it.t+'</div></div>'+
   '<div class="opts">'+order.map(function(i){return typeBtn(it.o[i],'<span class="code">'+it.o[i+1]+'</span>',false);}).join('')+'</div>','play');
  $$('.opt').forEach(function(b){b.addEventListener('click',function(){answerSafe(it,b.getAttribute('data-a'));});});
}
function answerSafe(it,a){
  if(busy())return;locked=true;
  var ok=a===it.a,t=TYPES[it.a];
  if(ok){S.cells[it.id]=1;
    var c=$('.cell[data-c="'+it.id+'"]');c.textContent=it.d;c.classList.add('f','pop');
    var sf=SAFES[it.safe];$('.dial').style.transform='rotate('+(filledCount(sf)*67)+'deg)';}
  settle(it,ok,ok?$('.cell[data-c="'+it.id+'"]'):null);
  var left=S.queue.some(function(id){return byId(id).safe===it.safe;});
  if(ok&&!left){S.pendingSafe=it.safe;save();}
  if(ok)openSheet(true,pick(GOOD,true),'<p><b>'+it.qq+'</b> — '+t.n+', цифра <b>'+it.d+'</b>. '+it.why+'</p><p class="quip">'+it.q+'</p>',streakChip(),renderPlay,left?'Дальше':'Все цифры на месте!');
  else{addError(it.t,'Правильно: '+t.n+'. '+it.qq+'. '+it.why,'Твой ответ: '+TYPES[a].n);$('.safebar').classList.add('shake');
    openSheet(false,pick(BAD,false),'<p>Замок щёлкнул вхолостую: тут <b>'+t.n+'</b>. <b>'+it.qq+'</b>. '+it.why+'</p><p class="quip">Без этой цифры дверца не откроется, поэтому задание вернётся перед открытием сейфа.</p>','',renderPlay);}
}
function renderSafeOpen(idx){
  var sf=SAFES[idx],code=sf.items.map(function(x){return x.d;}).join('');
  var last=idx===SAFES.length-1;
  show('<div class="safe-open" style="display:flex;flex-direction:column;flex:1 0 auto"><p class="kicker" id="sk">'+sf.name+'</p><h2 class="h2" id="st">Шифр собран. Крути ручку!</h2>'+
   safeCells(sf)+
   '<div class="vault" id="vault"><div class="vault-in"><svg viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg></div><div class="door"><div class="wheel"></div></div></div>'+
   '<div class="recap" id="recap" hidden>'+sf.items.map(function(x){return '<div><span>'+x.qq+'</span><em>'+TYPES[x.a].n+'</em><b>'+x.d+'</b></div>';}).join('')+'</div>'+
   '<div class="push stick"><button class="btn primary" id="spin">Открыть сейф '+code+'</button><button class="btn primary" id="goon" hidden>'+(last?'Забрать звёзды':'К следующему сейфу')+'</button></div></div>','');
  document.body.setAttribute('data-lvl',S.lvl);
  on('#spin',function(){
    $('#vault').classList.add('open');$('#spin').hidden=true;buzz([15,40,15]);
    setTimeout(function(){var v=$('#vault');if(!v)return;confetti(v);var st=$('#st');st.textContent=sf.done;$('#recap').hidden=false;$('#goon').hidden=false;},reduced()?20:900);
  });
  on('#goon',function(){S.pendingSafe=null;save();renderPlay();});
}

/* ---------- Уровень 3: перестройка ---------- */
function typeTag(k){return '<span class="tag '+TYPES[k].c+'">'+TYPES[k].n+'</span>';}
function renderSwap(it){
  var opts=shuffle([[it.right,'']].concat(it.o));
  show(hud()+'<div class="stage">'+retryTag(it)+'<p class="ask">Замени синонимичным словосочетанием. Главное слово не трогай!</p>'+
   '<div class="phrase" id="word">'+it.t+'<div class="flow">'+typeTag(it.f)+'<span aria-label="в">→</span>'+typeTag(it.to)+'</div></div></div>'+
   '<div class="opts">'+opts.map(function(o,i){return '<button class="opt vb" data-i="'+i+'">'+o[0]+'</button>';}).join('')+'</div>','play');
  $$('.opt').forEach(function(b,i){b.addEventListener('click',function(){answerSwap(it,opts[i],b);});});
}
function swapSteps(it){return '<ol class="steps"><li>Главное слово <b>'+it.main+'</b>: не меняем.</li><li>Зависимое: '+it.dep+'.</li><li>Нужен тип <b>'+TYPES[it.to].n+'</b>: '+it.qq+'.</li></ol>';}
function answerSwap(it,o,b){
  if(busy())return;locked=true;
  var ok=o[0]===it.right;
  settle(it,ok,$('#word'));
  var blank='<p class="blank-l">В бланк:</p><div class="blank">'+blankCells(it.right)+'</div>';
  if(ok)openSheet(true,pick(GOOD,true),swapSteps(it)+blank+'<p class="quip">'+it.q+'</p>',streakChip(),renderPlay);
  else{addError(it.t,'Правильно: '+it.right+'. '+o[1],'Твой ответ: '+o[0]);$('#word').classList.add('shake');
    openSheet(false,pick(BAD,false),'<p>«'+o[0]+'»: '+o[1]+'</p><p>Правильно: <b>'+it.right+'</b>.</p>'+swapSteps(it)+'<p class="quip">Задание вернётся в конце уровня и притворится незнакомым.</p>','',renderPlay);}
}

/* ---------- Уровень 4: босс ---------- */
function bossPair(it,strike){
  if(it.kind==='def')return '<div class="pair" id="word"><div class="pa">«'+it.a+'»</div><div class="plabel">это</div><div class="pb'+(strike?' strike':'')+'">'+it.b+'</div></div>';
  return '<div class="pair" id="word"><div class="pa">'+it.a+'</div><div class="arrow" aria-hidden="true">↓</div><div class="pb'+(strike?' strike':'')+'">'+it.b+'</div></div>';
}
function renderBoss(it){
  show(hud()+'<div class="stage">'+retryTag(it)+'<p class="ask">'+(it.kind==='def'?'Определение верное или ошибка?':'Верная замена или ошибка?')+'</p>'+bossPair(it,false)+'</div>'+
   '<div class="opts two"><button class="opt center" id="yes" style="border-color:var(--lime)">Верно</button><button class="opt center" id="no" style="border-color:var(--warn)">Ошибка</button></div>','play');
  on('#yes',function(){bossVerdict(it,true);});on('#no',function(){bossVerdict(it,false);});
}
function bossVerdict(it,says){
  if(busy())return;
  if(says!==it.good){locked=true;bossEnd(it,false,says);return;}
  if(it.good){locked=true;bossEnd(it,true);return;}
  /* Ошибка поймана: второй шаг, выбрать правильный вариант. */
  readyAt=Date.now()+250;buzz(12);
  var pool=it.kind==='def'?shuffle(DEF_OPTS.filter(function(x){return x!==it.right;})).slice(0,3):it.o;
  var opts=shuffle([it.right].concat(pool));
  show(hud()+'<div class="stage">'+retryTag(it)+'<p class="ask">'+(it.kind==='def'?'Ошибка поймана! Что это на самом деле?':'Ошибка поймана! Как правильно?')+'</p>'+bossPair(it,true)+'</div>'+
   '<div class="opts">'+opts.map(function(o,i){return '<button class="opt vb" data-i="'+i+'">'+o+'</button>';}).join('')+'</div>','play');
  on('#help',openHelp);
  $$('.opt').forEach(function(b,i){b.addEventListener('click',function(){if(busy())return;locked=true;
    var good=opts[i]===it.right;if(good)bossEnd(it,true);else bossEnd(it,false,null,opts[i]);});});
}
function bossEnd(it,ok,says,chosen){
  var name=it.kind==='def'?'«'+it.a+'» — '+it.b:it.a+' → '+it.b;
  settle(it,ok,$('#word'));
  if(ok){var lead=it.good?'<p>Замена без подвоха. ':'<p>Правильно: <b>'+it.right+'</b>. ';
    if(it.good&&it.kind==='def')lead='<p>Всё так. ';
    openSheet(true,pick(GOOD,true),lead+it.why+'</p><p class="quip">'+it.q+'</p>',streakChip(),renderPlay);return;}
  var msg,note;
  if(says===false){msg='Здесь всё верно, ошибки нет. ';note='Твой ответ: ошибка (а тут всё верно)';}
  else if(says===true){msg='А вот и подвох: это ошибка. Правильно: <b>'+it.right+'</b>. ';note='Твой ответ: верно (а тут ошибка)';}
  else{msg='Ошибку поймать удалось, но верный вариант другой: <b>'+it.right+'</b>. ';note='Твой ответ: '+chosen;}
  addError(name,it.good?it.why:'Правильно: '+it.right+'. '+it.why,note);
  $('#word').classList.add('shake');
  openSheet(false,pick(BAD,false),'<p>'+msg+it.why+'</p><p class="quip">Босс ещё вернётся с этим заданием. Он такой.</p>','',renderPlay);
}

function finishLevel(){
  if(S.lvl<LEVELS.length-1){S.lvl++;S.screen='intro';S.done=0;S.queue=[];save();renderIntro();}
  else{S.screen='final';save();renderFinal();}
}

/* ---------- Финал ---------- */
function totals(){var st=0,first=0,tot=0;S.stats.forEach(function(x){st+=starsFor(x);first+=x.first;tot+=x.total;});return {stars:st,maxStars:S.stats.length*3,first:first,tot:tot};}
function reportText(){
  var t=totals(),out=['Тренажёр «Типы словосочетаний и задание 4 ОГЭ»: результат','Очки: '+S.score+' из '+MAX_SCORE+', звёзды: '+t.stars+' из '+t.maxStars];
  S.stats.forEach(function(x,i){out.push(LEVELS[i].name+': '+x.first+' из '+x.total+' с первого раза');});
  if(S.errors.length){out.push('Ошибки ('+S.errors.length+'):');S.errors.forEach(function(e){out.push('• '+e.w+(e.note?' ('+e.note+')':'')+': '+e.rule);});}
  else out.push('Ошибок нет.');
  return out.join('\n');
}
function renderFinal(){
  var t=totals(),p=t.first/t.tot;
  var title=p>=.9?'Босс повержен, король аплодирует стоя':p>=.6?'Босс повержен, типы связи усвоены':'Босс повержен, разведка боем удалась';
  var rows=S.stats.map(function(x,i){var st=starsFor(x);return '<div class="res-row"><span>'+LEVELS[i].name+'<span class="mini-stars">'+[1,2,3].map(function(k){return starSvg(k<=st);}).join('')+'</span></span><b>'+x.first+' из '+x.total+'</b></div>';}).join('');
  var errs=S.errors.length?'<h3 class="err-h">Над чем посмеяться и подумать</h3>'+S.errors.map(function(e){return '<div class="err"><b>'+e.w+'</b>'+(e.note?'<span>'+e.note+'</span>':'')+'<span>'+e.rule+'</span></div>';}).join(''):
    '<div class="clean"><b>Ошибок нет.</b> Даже обидно: разбирать нечего.</div>';
  show('<p class="kicker">Финал</p><h1 class="h2">'+title+'</h1>'+
    '<div class="big-num">'+S.score+'<span style="font-size:.4em;color:var(--muted)"> из '+MAX_SCORE+'</span></div>'+
    '<p class="lead" style="margin-top:6px">Звёзды: <b>'+t.stars+' из '+t.maxStars+'</b>. Справа: сколько взято с первого раза.</p>'+
    '<div class="res">'+rows+'</div>'+errs+
    '<div class="final-actions"><button class="btn primary" id="send">Отправить результат учителю</button>'+
    '<div id="copyOut" aria-live="polite"></div>'+
    '<button class="btn ghost" id="again" style="margin-top:10px">Пройти ещё раз</button></div>','final');
  if(p>=.6)setTimeout(function(){confetti($('.big-num'));},250);
  on('#send',sendResult);
  on('#again',function(){clearSaved();S=fresh();save();route();});
}
function legacyCopy(text){
  var ta=document.createElement('textarea'),ok=false;ta.value=text;ta.setAttribute('aria-hidden','true');
  ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  try{ta.focus({preventScroll:true});ta.select();ta.setSelectionRange(0,text.length);ok=document.execCommand('copy');}catch(e){ok=false;}
  document.body.removeChild(ta);return !!ok;
}
function sendResult(){
  var text=reportText();
  /* Сначала синхронный способ: во встроенных браузерах он надёжнее, чем Clipboard API. */
  if(legacyCopy(text)){copied(text);return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    var done=false;
    var fail=function(){if(!done){done=true;copyFailed(text);}};
    try{
      navigator.clipboard.writeText(text).then(function(){if(!done){done=true;copied(text);}},fail);
      setTimeout(fail,1500);
    }catch(e){fail();}
  } else copyFailed(text);
}
function copied(text){
  var o=$('#copyOut');
  o.innerHTML='<p class="copy-status" id="copyMsg">Скопировано! Теперь вставь в чат с учителем в Телеграме.</p><button class="link-btn" id="showTxt">Не вставляется? Показать текст</button>';
  buzz(12);
  on('#showTxt',function(){manual(text,'');});
}
function copyFailed(text){manual(text,'Скопировать автоматически не вышло, бывает. Выдели текст ниже и скопируй вручную:');}
function manual(text,msg){
  var o=$('#copyOut');
  o.innerHTML=(msg?'<p class="copy-status bad" id="copyMsg">'+msg+'</p>':'')+'<textarea class="manual" id="manualTxt" readonly aria-label="Текст результата"></textarea>';
  var ta=$('#manualTxt');ta.value=text;
  try{ta.focus({preventScroll:true});ta.select();ta.setSelectionRange(0,text.length);}catch(e){}
}

/* ---------- Маршрут ---------- */
function route(){
  rulesKeys=null;
  if(S.screen==='rules')renderRules(S.rule||0,false);
  else if(S.screen==='intro')renderIntro();
  else if(S.screen==='play')renderPlay();
  else if(S.screen==='final')renderFinal();
  else renderStart();
}
document.addEventListener('keydown',function(e){
  if(!S)return;
  if(e.key==='Escape'){var c=$('#closeHelp');if(c)c.click();return;}
  if(S.screen==='rules'&&rulesKeys){rulesKeys(e.key);return;}
  if(S.screen!=='play'||$('.sheet')||$('.modal-wrap'))return;
  var n=parseInt(e.key,10),opts=$$('.opt');
  if(n>=1&&n<=opts.length)opts[n-1].click();
});
renderStart();
})();
</script>
</body>
</html>
