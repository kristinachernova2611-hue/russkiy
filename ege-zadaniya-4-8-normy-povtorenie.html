body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Onest,sans-serif;overflow-x:hidden;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:Unbounded,sans-serif;line-height:1.2;margin:0}
h1{font-size:clamp(26px,7.4vw,38px)} h2{font-size:22px} h3{font-size:16px}
p{margin:0}
em{font-style:normal;font-weight:800;color:var(--a)}
#app{width:100%;max-width:560px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.center{justify-content:center}
.card{background:var(--c1);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.in{background:var(--c2);border-radius:16px;padding:12px 14px}
.mute{color:var(--mute);font-size:14px}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--a);color:#0F0F14;font-weight:750;padding:12px 16px}
.btn.second{background:var(--c2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;text-align:left;border:2px solid transparent;border-radius:18px;background:var(--c2);padding:13px 16px;font-size:18px}
.opt:disabled{cursor:default}
.opt.good{border-color:#D6FF3F;background:rgba(214,255,63,.12)}
.opt.bad{border-color:#FF6DB0;background:rgba(255,109,176,.13)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:30px;background:var(--c2);font-size:14px;font-weight:650}
.chip.on{background:var(--a);color:#0F0F14}
.tiles{display:flex;gap:8px;justify-content:center;padding:18px 0}
.tile{width:clamp(42px,13.5vw,64px);height:72px;display:grid;place-items:center;border-radius:18px;background:var(--c2);font:800 28px Unbounded;animation:bob 2.4s ease-in-out infinite}
.tile:nth-child(1){background:#D6FF3F;color:#0F0F14}.tile:nth-child(2){background:#4CC9FF;color:#0F0F14}.tile:nth-child(3){background:#FF6DB0;color:#0F0F14}.tile:nth-child(4){background:#FFA347;color:#0F0F14}.tile:nth-child(5){background:#F6F5F0;color:#0F0F14}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.top{display:flex;align-items:center;gap:10px}
.top h3{flex:1;min-width:0;color:var(--a)}
.score{white-space:nowrap;background:var(--c2);padding:9px 12px;border-radius:20px;font-weight:750}
.help{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--c2);font-weight:800;color:var(--a)}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:7px;border-radius:4px;background:var(--c2)}
.seg i.ok{background:var(--a)} .seg i.no{background:#777585} .seg i.now{background:var(--ink)}
.row{display:flex;justify-content:space-between;gap:8px}
.text{font-size:19px}
.bubble{background:var(--c2);padding:14px 16px;border-radius:20px 20px 20px 5px;font-size:19px}
.from{font-size:12px;color:var(--a);font-weight:750;margin-bottom:5px}
.claim{font:700 21px/1.35 Unbounded;text-align:center;padding:24px 10px;background:var(--c2);border-radius:18px}
ol.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ol.words li{background:var(--c2);border-radius:14px;padding:10px 14px;font-size:19px}
ol.words.small li{font-size:16px;padding:9px 12px}
.errs{display:flex;flex-direction:column;gap:6px}
.errs div{border-left:4px solid var(--a);padding:4px 10px;font-size:15px}
input,textarea{width:100%;border:2px solid #3A3A48;border-radius:16px;background:var(--bg);padding:14px;font-size:19px;user-select:text}
input:focus,textarea:focus{outline:0;border-color:var(--a)}
textarea{min-height:190px;font-size:15px}
.sheet{position:fixed;z-index:5;left:0;right:0;margin:auto;bottom:0;width:100%;max-width:560px;max-height:68vh;overflow-y:auto;padding:20px 18px calc(16px + env(safe-area-inset-bottom));background:var(--c2);border-top:5px solid var(--a);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.joke{color:var(--mute);font-size:15px}
.stars{display:flex;gap:10px;justify-content:center;font-size:58px;line-height:1}
.stars span{color:var(--c2)} .stars span.on{color:var(--a);animation:pop .55s ease both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.modal{position:fixed;z-index:9;inset:0;background:var(--bg);overflow-y:auto}
.modal>div{max-width:560px;margin:auto;padding:18px 16px 34px;display:flex;flex-direction:column;gap:14px}
.theory{touch-action:pan-y;min-height:400px}
#fx{position:fixed;z-index:10;inset:0;overflow:hidden;pointer-events:none}
#fx i{position:absolute;top:38%;left:50%;width:9px;height:13px;border-radius:3px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(620deg);opacity:0}}
.mist{display:flex;flex-direction:column;gap:4px;font-size:15px}
noscript div{max-width:420px;margin:30vh auto 0;padding:26px;border-radius:22px;background:#1B1B24;color:#F6F5F0;font:700 22px/1.4 sans-serif;text-align:center}
@media(min-width:700px){#app{padding-top:38px}#app.center{padding-top:24px}.opt:hover:not(:disabled){border-color:var(--a)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#fx{display:none}}
</style></head>

<script>
'use strict';
const KEY='ege-2027-m1u9-normy-povtorenie-v1';
const T4='Укажи варианты ответов, в которых верно выделена буква, обозначающая ударный гласный звук. Запиши номера ответов.';
const T5='В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправь лексическую ошибку, подобрав к выделенному слову пароним. Запиши подобранное слово, соблюдая нормы современного русского литературного языка.';
const T6='Отредактируй предложение: исправь лексическую ошибку, исключив лишнее слово. Выпиши это слово.';
const T6R='Отредактируй предложение: исправь лексическую ошибку, заменив неверно употреблённое слово.';
const T7='В одном из выделенных ниже слов допущена грамматическая ошибка. Исправь ошибку и запиши слово правильно.';
const T8='Установи соответствие между грамматическими ошибками и предложениями, в которых они допущены: к каждой позиции первого столбца подбери соответствующую позицию из второго столбца. Запиши цифры под буквами А–Д.';

const THEORY=[
{t:'Пять заданий — шесть баллов',b:['Задания 4, 5, 6, 7 — по <b>1 баллу</b>, задание 8 — до <b>2 баллов</b>.','Ответ пишется без пробелов, запятых и лишних знаков.','В задании 8 одна-две неверные позиции — 1 балл, больше — 0.','Те же нормы проверяют в сочинении: К9 — грамматические, К10 — речевые, до 3 баллов каждый.']},
{t:'Задание 4: ударение',b:['Найди <b>все</b> слова, где ударение выделено верно, и запиши их номера.','Порядок цифр не важен. Лишняя или пропущенная цифра — 0 баллов.','В задании только слова из орфоэпического списка ФИПИ, но в разных формах.','Буква Ё может быть напечатана как Е: «свеклА» — ошибка.']},
{t:'Задание 5: паронимы',b:['Паронимы — однокоренные слова, которые отличаются приставкой или суффиксом и значением: <b>жилой</b> дом — <b>жилищные</b> условия.','Найди слово, которое не подходит по смыслу, и замени его парой из списка паронимов ФИПИ.','Запиши слово в той же форме и без орфографических ошибок.']},
{t:'Задание 6: лишнее или неточное',b:['<b>Плеоназм</b>: значение повторено — «прейскурант цен».','<b>Нарушение сочетаемости</b>: «оказать впечатление» вместо «произвести впечатление».','Лишнее слово — только то, что дублирует смысл соседнего, а не любое определение.','Вычёркиваешь — выпиши слово в той форме, как в предложении. Заменяешь — запиши новое слово, сохранив смысл.']},
{t:'Задание 7: грамматическая ошибка',b:['Проверяем формы: множественное число, числительные (двести → <b>двухсот</b>), степени сравнения, повелительное наклонение.','Ищем несуществующие слова: ошибка в словообразовании.','Проверяем согласование с несклоняемыми словами: Тбилиси — мужской род.','Читай каждое слово по буквам: ошибка может прятаться в одной букве.']},
{t:'Задание 8: десять ошибок',b:['Причастный и деепричастный оборот, однородные члены, несогласованное приложение, управление, подлежащее и сказуемое, косвенная речь, видо-временная соотнесённость, сложное предложение, числительное.','Начни с грамматической основы, ищи слова-маркеры.','Запиши пять цифр строго по порядку букв А–Д.']}];

const R={list:'Слово из орфоэпического списка ФИПИ: норму запоминаем.',par:'Паронимы: выбираем слово по значению и сочетаемости.',ple:'Плеоназм: исключаем слово, которое дублирует смысл соседнего.',com:'Лексическая сочетаемость: заменяем слово, которое не сочетается с соседним.',gr:'Грамматическая норма: проверяем форму каждого выделенного слова.',syn:'Синтаксическая норма: начинаем с грамматической основы и ищем маркеры.'};
// k: c — варианты (первый верный), tf — верно/неверно, m — сообщение друга (первый вариант верный), e — ответ в формате ЕГЭ (n:1 — цифры задания 4, n:8 — цифры задания 8)
const LEVELS=[
{name:'Ударная волна',sub:'Задание 4: ударение',col:'#D6FF3F',next:'Начнём с ударений: одно слово — одно решение.',q:[
{id:'a1',k:'c',q:'Где ударение выделено верно?',o:['досУг','дОсуг'],why:'ДосУг: ударение на втором слоге.',r:R.list,j:'Теперь и на досУге без ошибок.',src:'список ФИПИ'},
{id:'a2',k:'tf',q:'Верно или неверно выделено ударение?',c:'свЁкла',a:true,why:'СвЁкла: ударение на Ё.',r:R.list,j:'Борщ одобряет.',src:'список ФИПИ'},
{id:'a3',k:'m',q:'Друг пишет. В каком слове ударение выделено неверно?',m:'Список покупок: два шАрфа, бАнты для сестры и кухОнные полотенца.',o:['кухОнные','шАрфа','бАнты'],why:'Правильно: кУхонные. ШАрфа и бАнты выделены верно.',r:R.list,j:'На кухне порядок, в ударениях тоже.',src:'список ФИПИ'},
{id:'a4',k:'c',q:'Где ударение выделено верно?',o:['каталОг','катАлог'],why:'КаталОг: ударение на последнем слоге.',r:R.list,j:'Занесено в каталОг полезных знаний.',src:'список ФИПИ'},
{id:'a5',k:'tf',q:'Верно или неверно выделено ударение?',c:'звОнит',a:false,why:'Правильно: звонИт.',r:'У глагола «звонИть» в личных формах ударение на окончании: звонИт, звонИшь.',j:'Звонок принят, ударение исправлено.',src:'список ФИПИ'},
{id:'a6',k:'c',q:'Где ударение выделено верно?',o:['кровоточИть','кровотОчить'],why:'КровоточИть: ударение на последнем слоге.',r:R.list,j:'Рана затянулась, норма запомнилась.',src:'список ФИПИ'},
{id:'a7',k:'tf',q:'Верно или неверно выделено ударение?',c:'тамОжня',a:true,why:'ТамОжня: ударение на втором слоге.',r:R.list,j:'Таможня даёт добро.',src:'список ФИПИ'},
{id:'a8',k:'m',q:'Друг пишет. В каком слове ударение выделено неверно?',m:'Вечно путаю дЕфис и тире, а моя нЕнависть к ним растёт с каждой контрольной.',o:['дЕфис','нЕнависть'],why:'Правильно: дефИс. НЕнависть выделена верно.',r:R.list,j:'Ненависть к дефису отменяется — только к ошибкам.',src:'список ФИПИ'},
{id:'a9',k:'c',q:'Где ударение выделено верно?',o:['бралА','брАла'],why:'БралА: в женском роде прошедшего времени ударение уходит на окончание.',r:'У группы глаголов в форме женского рода прошедшего времени ударение падает на -а.',j:'Взяла и запомнила.',src:'список ФИПИ'},
{id:'a10',k:'tf',q:'Верно или неверно выделено ударение?',c:'закупОрить',a:false,why:'Правильно: закУпорить.',r:R.list,j:'Ошибку закупорили намертво.',src:'список ФИПИ'},

{name:'Точное слово',sub:'Задания 5 и 6: лексика',col:'#4CC9FF',next:'Теперь слова похожие, но разные, и слова лишние.',q:[
{id:'b1',k:'c',q:'Какое слово подходит? «Друг купил ___ абонемент в бассейн».',o:['годовой','годовалый'],why:'Годовой — рассчитанный на год. Годовалым бывает ребёнок или щенок.',r:R.par,j:'Годовалый абонемент ходил бы в бассейн на четвереньках.',src:'составлено по списку паронимов'},
{id:'b2',k:'tf',q:'Сочетание составлено без ошибки?',c:'дождливое лето',a:true,why:'Дождливое — обильное дождями. Сочетание верное.',r:R.par,j:'Зонт одобряет.',src:'составлено по списку паронимов'},
{id:'b3',k:'m',q:'Как исправить сообщение друга?',m:'Вчера был такой ДОЖДЕВОЙ день, что все промокли до нитки.',o:['дождливый день','оставить «дождевой»'],why:'Дождевой — относящийся к дождю: дождевые капли. День бывает дождливым.',r:R.par,j:'Сообщение высохло, ошибка тоже.',src:'составлено по списку паронимов'},
{id:'b4',k:'e',q:T5,list:['Природа восхищает нас ВЕЧНОЙ красотой и удивляет своим величием.','У идеального правосудия три ключевых признака: законность, справедливость и ГУМАННОСТЬ.','ПРОИЗВОДСТВЕННЫЙ процесс – это совокупность всех действий людей и орудий труда, необходимых на данном предприятии для изготовления продукции.','Спортсмен с трудом расшнуровал ЛЕДЯНЫМИ пальцами лыжные ботинки.','До глубокой старости он оставался таким же словоохотливым, ПАМЯТНЫМ и энергичным.'],a:'памятливым',why:'Памятный — тот, который хорошо помнится (памятный день). О человеке с хорошей памятью говорят «памятливый». Ответ: памятливым.',r:R.par,j:'Памятливый ответ, памятный уровень.',src:'76164B'},
{id:'b5',k:'e',q:T5,list:['Без меди клетки кожи не могут образовывать специальное КРАСЯЩЕЕ вещество – меланин.','По небу плыли низкие ДОЖДЕВЫЕ облака, сквозь которые не было видно солнца.','ДОВЕРИТЕЛЬНЫЙ тон в общении с клиентами обеспечивает нашей компании хорошую репутацию.','Опытного журналиста назначили руководителем новой ИНФОРМАЦИОННОЙ телепрограммы.','СКРЫТЫЙ человек избегает откровенности, малообщителен, другим ничего не рассказывает о себе, прячет от всех свои чувства, помыслы, настроения.'],a:'скрытный',why:'Скрытый — спрятанный, незаметный (скрытая камера). Человек, который не делится мыслями, — скрытный. Ответ: скрытный.',r:R.par,j:'Скрытая ошибка раскрыта.',src:'5BB9F2'},
{id:'b6',k:'c',q:T6,s:'Народный фольклор, зародившийся в древности, – историческая основа мировой художественной культуры.',o:['народный','историческая','мировой','художественной'],why:'Фольклор — это и есть народное творчество. Лишнее слово «народный».',r:R.ple,j:'Народ и так в курсе.',src:'060C0F'},

{id:'b8',k:'tf',q:'Сочетание составлено без ошибки?',c:'памятный сувенир',a:false,why:'Сувенир — это и есть подарок на память. «Памятный» — лишнее.',r:R.ple,j:'Сувенир остался, повтор — нет.',src:'по образцу BFAE57'},
{id:'b9',k:'m',q:'Какое слово в сообщении друга лишнее?',m:'Вернусь обратно через час, не уходи.',o:['обратно','через','час'],why:'Вернуться — уже значит прийти обратно. Лишнее слово «обратно».',r:R.ple,j:'Друг вернулся. Без «обратно».',src:'по образцу 0cB588'},
{id:'b10',k:'c',q:T6R,s:'Снятый в прошлом году фильм создал неоднозначную реакцию кинокритиков.',o:['создал → вызвал','создал → построил','создал → провёл'],why:'Реакцию вызывают.',r:R.com,j:'Критики вызваны, реакция получена.',src:'62221D'},
{id:'b11',k:'e',q:T6,s:'Поднявшись на вершину горы, альпинисты остановились: глубокая бездна открылась перед ними.',a:'глубокая',why:'Бездна — это очень глубокая пропасть. Ответ: глубокая.',r:R.ple,j:'Из бездны ошибок ты выбрался.',src:'64BAB0'},

{id:'d4',k:'e',q:T5,list:['Врачи советуют в жару НАДЕВАТЬ лёгкую одежду.','Июнь в этом году был ДОЖДЛИВЫМ, солнце выглядывало редко.','ДОВЕРИТЕЛЬНЫЙ тон беседы способствует лучшему взаимопониманию.','Ответ был составлен в ДИПЛОМАТИЧНЫХ выражениях.','Оба берега реки были высоки и обрывисты, и можно было видеть залегающие пласты ГЛИНЯНОЙ почвы.'],a:'глинистой',why:'Глиняный — сделанный из глины (глиняный кувшин). Почва, содержащая глину, — глинистая. Ответ: глинистой. Ловушка: «надевать одежду» — верно.',r:R.par,j:'Почва под ногами у босса глинистая и скользкая.',src:'9DA278'},
{id:'d5',k:'e',q:T5,list:['Директор ЗВУЧНЫМ голосом объявил победителей олимпиады.','В Кемеровской области открыты залежи КАМЕННОГО угля.','ПОЧТИТЕЛЬНЫЙ возраст в сочетании с сединой подчёркивал благородство этого человека.','На выставке были продемонстрированы новейшие образцы пожарной и спасательной техники, позволяющей бороться с пожарами в ВЫСОТНЫХ зданиях.','На родительском собрании классный руководитель напомнил, как важно вовремя ОГРАДИТЬ детей от угроз, скрывающихся в Интернете.'],a:'почтенный',why:'Почтительный — выражающий уважение (почтительный поклон). Возраст бывает почтенным. Ответ: почтенный.',r:R.par,j:'Почтенный возраст — у босса. Почтительность — у тебя.',src:'A12B73'},

{id:'d7',k:'e',q:T6,s:'Опросы показали, что 89 % населения цивилизованных стран знают о таком необычном феномене, как фантомная вибрация – ощущение кажущегося звонка мобильного телефона, который на самом деле молчит.',a:'необычном',why:'Феномен — необычное, редкое явление. Ответ: необычном. «Цивилизованных», «мобильного», «кажущегося» добавляют смысл: это типичная ловушка из методических рекомендаций ФИПИ.',r:R.ple,j:'Телефон молчит, а знание вибрирует.',src:'439D2c, методические рекомендации ФИПИ 2026'},
{id:'d8',k:'e',q:T7,w:['ТРОЕ друзей','выглядел МОЛОДЕЕ','более СЕМИСОТ человек','в ДВЕ тысячи пятом году','ТОНЬШЕ нитки'],a:'моложе',why:'Сравнительная степень от «молодой» — моложе. «Трое друзей» — верно: собирательное числительное с существительным мужского рода. Ответ: моложе.',r:R.gr,j:'Босс выглядит старше. И растеряннее.',src:'по образцу 2850E4'},
{id:'d9',k:'e',q:T7,w:['ребёнок ОКРЕП','в ОБОИХ стёклах','городские АДРЕСЫ','нет ДЫНЬ','дождаться ЗАМОРОЗКОВ'],a:'адреса',why:'Правильно: адреса. Остальные формы верные — ловушки из методических рекомендаций ФИПИ: окреп (не «окрепнул»), дынь (не «дыней»), заморозков. Ответ: адреса.',r:R.gr,j:'Нормозавр сменил адрес. На «адреса».',src:'по образцу 848e52, методические рекомендации ФИПИ 2026'},
{id:'d10',k:'e',n:8,q:T8,err:['А) нарушение связи между подлежащим и сказуемым','Б) нарушение в построении предложения с причастным оборотом','В) нарушение в построении предложения с деепричастным оборотом','Г) неправильное употребление падежной формы имени существительного с предлогом','Д) нарушение в построении предложения с несогласованным приложением'],w:['В просторной комнате с итальянским окном в течение двенадцати лет Н.М. Карамзин работал над «Историей государства Российского».','Обречённый судьбой на постоянную праздность, я не делал решительно ничего.','По приезду молодой Дубровский хотел заняться делами, но отец был не в состоянии дать ему нужных объяснений.','Батуми за последние годы сильно преобразился.','В рассказе И.С. Тургенева «Бежином луге» повествуется об интересном случае на охоте, произошедшем с самим автором.','Он пошёл напрямик и попал в общество крестьянских мальчишек, которые в поле стерегли коней.','С молодых лет Мясоедов входил в круг художников, боровшимся с рутиной академизма.','Возвращаясь в родные места, мне вспомнились детские впечатления от впервые увиденной грозы.','Многие из тех, кто посетил выставку, принял участие в социологическом опросе.'],a:'97835',why:'А — 9 (многие… приняли), Б — 7 (художников, боровшихся), В — 8 (мне вспомнились, возвращаясь — разные субъекты), Г — 3 (по приезде), Д — 5 (в рассказе «Бежин луг»). Ответ: 97835.',r:R.syn,j:'Пять из пяти — босс шатается.',src:'245346'},
{id:'d11',k:'e',n:8,q:T8,err:['А) неправильное употребление падежной формы существительного с предлогом','Б) нарушение связи между подлежащим и сказуемым','В) нарушение в построении предложения с несогласованным приложением','Г) ошибка в построении предложения с однородными членами','Д) нарушение в построении предложения с причастным оборотом'],w:['В эмиграции М.И. Цветаева часто вспоминала и восхищалась поэзией Б.Л. Пастернака.','Все, кто побывал в Крыму, увёз с собой после расставания с ним яркие впечатления о море, горах, южных травах и цветах.','В основе произведения «Повести о настоящем человеке» лежат реальные события, произошедшие с Алексеем Маресьевым.','С.В. Михалков утверждал, что мир купеческого Замоскворечья можно увидеть на сцене Малого театра благодаря великолепной игры актёров.','В 1885 году В.Д. Поленов экспонировал на передвижной выставке девяносто семь этюдов, привезённым из поездки на Восток.','По истечении указанного в инструкции срока годности лекарство нельзя использовать.','Те, кто действительно любит и изучает русский язык, осознают его великолепие, мощь, богатство и силу.','Благодаря композитору М.И. Глинке не только жизнь и быт народа, но и героические образы русской истории и народного эпоса были воплощены в музыке.','Уезжая в Москву, Макар обещал, что обязательно сообщит, как он устроился.'],a:'42315',why:'А — 4 (благодаря великолепной игре), Б — 2 (все… увезли), В — 3 (в произведении «Повесть о настоящем человеке»), Г — 1 (вспоминала поэзию и восхищалась ею: глаголы требуют разных падежей), Д — 5 (этюдов, привезённых). Ответ: 42315.',r:R.syn,j:'Нормозавр повержен. Нормы — твои.',src:'C89E42'}]}];

const A=document.getElementById('app'),L=document.getElementById('layer'),FX=document.getElementById('fx');
const BYID={};LEVELS.forEach(l=>l.q.forEach(q=>BYID[q.id]=q));
const MAX=LEVELS.reduce((n,l)=>n+l.q.length*10,0);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mark=s=>s.replace(/(^|[^а-яёА-ЯЁ])\^([А-ЯЁ])/g,'$1<em>$2</em>').replace(/([а-яё])([АЕЁИОУЫЭЮЯ])/g,'$1<em>$2</em>');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const caps=s=>esc(s).replace(/([А-ЯЁ]{3,})/g,'<b>$1</b>');
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c);
const accent=c=>document.documentElement.style.setProperty('--a',c);

function fresh(){return{screen:'start',th:0,lv:0,queue:[],pos:0,second:false,wrong:[],marks:[],right:0,pts:0,streak:0,best:0,stars:[],firsts:[],miss:[],pend:null,order:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.screen&&Array.isArray(s.queue)&&s.queue.every(i=>BYID[i]))return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function go(screen){S.screen=screen;save();draw();window.scrollTo(0,0)}

function draw(){L.innerHTML='';A.className='';A.style.paddingBottom='';({start,theory,intro,play,retry,result,final}[S.screen]||start)()}

function start(){accent('#D6FF3F');A.className='center';
A.innerHTML=`<p class="mute">ЕГЭ 2027 · русский язык · задания 4–8</p><h1>Всё в&nbsp;норме?</h1>
<p><b>Нормы современного русского языка: повторение модуля.</b> Ударения, паронимы, лишние слова, формы и построение предложений. В конце ждёт Нормозавр: он собрал все типичные ловушки экзамена.</p>
<div class="tiles" aria-hidden="true">${['4','5','6','7','8'].map((c,i)=>`<div class="tile" style="animation-delay:${i*.18}s">${c}</div>`).join('')}</div>
<div class="chips"><span class="chip on">4 уровня</span><span class="chip">1 босс</span><span class="chip">0 таймеров</span></div>
<button class="btn" id="begin">Поехали</button><p class="mute">Ответы сохраняются на этом устройстве. Можно сделать паузу.</p>`;
A.querySelector('#begin').onclick=()=>{S.th=0;go('theory')}}

function theory(){accent(LEVELS[Math.min(S.th,3)].col);const t=THEORY[S.th];
A.innerHTML=`<div class="top"><h3>Вспомним · ${S.th+1}/${THEORY.length}</h3><button class="chip" style="border:0;min-height:44px" id="skip">Пропустить</button></div>
<div class="seg">${THEORY.map((_,i)=>`<i class="${i<=S.th?'ok':''}"></i>`).join('')}</div>
<section class="card theory" id="swipe"><h2>${t.t}</h2>${t.b.map(b=>`<p class="in">${mark(b)}</p>`).join('')}</section>
<button class="btn" id="next">Дальше</button>${S.th?'<button class="btn second" id="back">Назад</button>':''}`;
const next=()=>{if(S.th<THEORY.length-1){S.th++;go('theory')}else go('intro')},back=()=>{if(S.th){S.th--;go('theory')}};
A.querySelector('#next').onclick=next;A.querySelector('#skip').onclick=()=>go('intro');
if(S.th)A.querySelector('#back').onclick=back;
const w=A.querySelector('#swipe');let x=null,y=null;
w.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
w.addEventListener('touchend',e=>{if(x===null)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;x=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)(dx<0?next:back)()})}

function intro(){const l=LEVELS[S.lv],n=l.q.length;accent(l.col);A.className='center';
A.innerHTML=`<p class="mute">Уровень ${S.lv+1} из 4${S.lv===3?' · босс':''}</p><h1 style="color:var(--a)">${l.name}</h1><p>${l.next}</p>
<div class="card"><b>${l.sub}</b><p class="mute">${n} ${plural(n,'задание','задания','заданий')}. Ошибки вернутся во втором заходе.</p></div><button class="btn" id="go">Играть</button>`;
A.querySelector('#go').onclick=()=>{Object.assign(S,{queue:shuffle(l.q.map(q=>q.id)),pos:0,second:false,wrong:[],marks:[],right:0,pend:null,order:{}});go('play')}}

function hintFor(q){return q.n===1?'Цифры подряд, без пробелов и запятых':q.n===8?'Пять цифр по порядку букв А–Д, без пробелов':'Одно слово'}
function play(){const l=LEVELS[S.lv],id=S.queue[S.pos],q=BYID[id],P=S.pend;accent(l.col);
if((q.k==='c'||q.k==='m')&&!S.order[id]){S.order[id]=shuffle(q.o.map((_,i)=>i));save()}
let body='';
if(q.s)body+=`<p class="in text">${esc(q.s)}</p>`;
if(q.list)body+=`<ol class="words small">${q.list.map((t,i)=>`<li>${i+1}) ${caps(t)}</li>`).join('')}</ol>`;
if(q.m)body+=`<div class="bubble"><div class="from">Сообщение друга</div>${q.n||/[А-ЯЁ]{3,}/.test(q.m)?caps(q.m):mark(q.m)}</div>`;
if(q.c)body+=`<p class="claim">${mark(q.c)}</p>`;
if(q.err)body+=`<div class="errs">${q.err.map(e=>`<div>${esc(e)}</div>`).join('')}</div>`;
if(q.w)body+=`<ol class="words${q.n===8?' small':''}">${q.w.map((w,i)=>`<li>${i+1}) ${q.n===8?esc(w):q.n===1?mark(w):caps(w)}</li>`).join('')}</ol>`;
let act;
if(q.k==='e'){act=`<form id="form" class="opts" autocomplete="off"><label class="mute" for="ans">${hintFor(q)}</label><input id="ans" ${q.n?'inputmode="numeric"':''} maxlength="30" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Твой ответ" ${P?'disabled':''} value="${P?esc(P.v):''}"><p class="mute" id="hint" role="status"></p><button class="btn" id="check" ${P?'disabled':''}>Проверить</button></form>`}
else{const list=q.k==='tf'?[['true','Верно'],['false','Неверно']]:S.order[id].map(i=>[String(i),q.o[i]]);
const right=q.k==='tf'?String(q.a):'0';
act=`<div class="opts">${list.map(([v,t])=>`<button class="opt ${P?(v===right?'good':v===P.v?'bad':''):''}" data-v="${v}" ${P?'disabled':''}>${mark(t)}</button>`).join('')}</div>`}
A.innerHTML=`<header class="top"><h3>${l.name}</h3><span class="score" aria-label="Очки">★ ${S.pts}</span><button class="help" id="help" aria-label="Шпаргалка">?</button></header>
<div class="seg">${S.queue.map((_,i)=>`<i class="${i<S.marks.length?(S.marks[i]?'ok':'no'):i===S.pos?'now':''}"></i>`).join('')}</div>
<div class="row mute"><span>${S.second?'Второй заход · ':''}${S.pos+1} из ${S.queue.length}</span><span>${S.streak>=2?'Серия: '+S.streak:''}</span></div>
<section class="card"><p><b>${esc(q.q)}</b></p>${body}</section>${act}`;
A.querySelector('#help').onclick=cheat;
if(P){sheet(q,P);return}
if(q.k==='e'){A.querySelector('#form').onsubmit=e=>{e.preventDefault();const v=A.querySelector('#ans').value.trim(),h=A.querySelector('#hint');
if(!v){h.textContent='Сначала запиши ответ.';return}
if(q.n===1&&!/^[1-5]+$/.test(v)){h.textContent='Как на ЕГЭ: только цифры от 1 до 5, подряд.';return}
if(q.n===8&&!/^[1-9]{5}$/.test(v)){h.textContent='Как на ЕГЭ: ровно пять цифр от 1 до 9, подряд.';return}
if(!q.n&&!/^[А-Яа-яЁё-]+$/.test(v)){h.textContent='Как на ЕГЭ: только одно слово, без лишних знаков.';return}
const norm=x=>x.toLowerCase().replace(/ё/g,'е');
check(q,v,q.n===1?[...new Set(v)].length===v.length&&v.split('').sort().join('')===q.a:q.n===8?v===q.a:norm(v)===norm(q.a))}}
else A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;check(q,v,q.k==='tf'?v===String(q.a):v==='0')})}

function check(q,v,ok){if(S.pend)return;
if(ok){S.streak++;S.best=Math.max(S.best,S.streak);S.pts+=S.second?5:10;if(!S.second)S.right++}
else{S.streak=0;if(!S.second){S.wrong.push(q.id);S.miss.push(q.id)}}
S.marks.push(ok);S.pend={v,ok};save();play();
if(ok){confetti();try{if(navigator.vibrate)navigator.vibrate(35)}catch(e){}}}

function egePts(q,v){if(q.n!==8)return '';let d=0;for(let i=0;i<5;i++)if(v[i]!==q.a[i])d++;const p=d===0?2:d<=2?1:0;return `<p class="in">На ЕГЭ за такой ответ: <b>${p} ${plural(p,'балл','балла','баллов')} из 2</b>${d?` (неверных позиций: ${d})`:''}.</p>`}
function sheet(q,P){
L.innerHTML=`<aside class="sheet" id="sheet" role="status"><h2>${P.ok?'Верно!':'Почти!'}</h2>${P.ok&&S.streak>=3?`<b>Серия: ${S.streak} подряд</b>`:''}<p>${mark(q.why)}</p>${egePts(q,P.v)}<p class="mute">${q.r}</p><p class="joke">${P.ok?q.j:'Нормозавр потирает лапы. Но это ненадолго: задание вернётся во втором заходе.'}</p><button class="btn" id="go-on">Дальше</button></aside>`;
A.style.paddingBottom=(L.firstElementChild.offsetHeight+20)+'px';
L.querySelector('#go-on').onclick=advance}

function advance(){S.pend=null;S.pos++;
if(S.pos<S.queue.length)return go('play');
if(!S.second&&S.wrong.length)return go('retry');
endLevel()}

function retry(){accent(LEVELS[S.lv].col);A.className='center';const n=S.wrong.length;
A.innerHTML=`<h1 style="color:var(--a)">Второй заход</h1><p>${plural(n,'Возвращается','Возвращаются','Возвращаются')} ${n} ${plural(n,'задание','задания','заданий')}. Теперь ловушка знакома, а за верный ответ дают 5 очков.</p><button class="btn" id="again">Исправить</button>`;
A.querySelector('#again').onclick=()=>{Object.assign(S,{queue:shuffle(S.wrong),pos:0,second:true,marks:[],order:{}});go('play')}}

function endLevel(){const p=S.right/LEVELS[S.lv].q.length;S.stars[S.lv]=p>=.9?3:p>=.6?2:1;S.firsts[S.lv]=S.right;go('result')}

function result(){const l=LEVELS[S.lv],n=S.stars[S.lv],next=LEVELS[S.lv+1];accent(l.col);A.className='center';
A.innerHTML=`<p class="mute">Уровень ${S.lv+1} позади</p><h1>${l.name}</h1><div class="stars" aria-label="Звёзды: ${n} из 3">${[0,1,2].map(i=>`<span class="${i<n?'on':''}" style="animation-delay:${i*.15}s">★</span>`).join('')}</div>
<p class="in">С первого раза: <b>${S.firsts[S.lv]} из ${l.q.length}</b><br>Очки: <b>${S.pts}</b></p>
${next?`<div class="card"><span class="mute">Дальше</span><h2>${next.name}</h2><p>${next.next}</p></div>`:'<div class="card"><h2>Босс повержен</h2><p>Осталось посмотреть итог.</p></div>'}<button class="btn" id="on">${next?'К следующему уровню':'К результату'}</button>`;
A.querySelector('#on').onclick=()=>{if(next){S.lv++;go('intro')}else go('final')}}

const brief=q=>q.c||q.m||(q.err?'Задание 8 на соответствие ('+q.err.map(e=>e.slice(3,30)).slice(0,2).join('; ')+'…)':q.w?q.w.map((w,i)=>`${i+1}) ${w.replace('^','')}`).join(', '):q.list?q.list.map((w,i)=>`${i+1}) ${w}`).join(' '):(q.s||q.o[0]));
function report(){const all=LEVELS.reduce((n,l)=>n+l.q.length,0),ok=S.firsts.reduce((a,b)=>a+(b||0),0);
return ['Результат тренажёра «Нормы современного русского языка» (задания 4–8 ЕГЭ 2027)',
`Очки: ${S.pts} из ${MAX}`,`Звёзды: ${S.stars.reduce((a,b)=>a+(b||0),0)} из 12`,`С первого раза: ${ok} из ${all}`,
...LEVELS.map((l,i)=>`${i+1}. ${l.name}: ${S.firsts[i]||0} из ${l.q.length}, звёзд ${S.stars[i]||0}`),
`Лучшая серия: ${S.best}`,S.miss.length?'Ошибки первого захода:':'Ошибок нет.',
...S.miss.map(id=>'• '+brief(BYID[id])+' → '+BYID[id].why.replace(/<[^>]+>/g,''))].join('\n')}

function final(){accent('#D6FF3F');const st=S.stars.reduce((a,b)=>a+(b||0),0);
A.innerHTML=`<p class="mute">Нормы современного русского языка · ЕГЭ 2027</p><h1>Всё в норме!</h1>
<p>Нормозавр сдал все ловушки и записался на курсы культуры речи.</p>
<div class="row"><div class="card" style="flex:1"><span class="mute">Очки</span><h2>${S.pts} / ${MAX}</h2></div><div class="card" style="flex:1"><span class="mute">Звёзды</span><h2>★ ${st} / 12</h2></div></div>
<button class="btn" id="send">Отправить результат учителю</button><div id="copy"></div>
<button class="btn second" id="restart">Пройти ещё раз</button>
<section class="card"><h3>${S.miss.length?'Над чем поработать':'Ни одной ошибки с первого раза'}</h3>${S.miss.map(id=>{const q=BYID[id];return `<div class="in mist"><span class="mute">${esc(brief(q))}</span><b>${mark(q.why)}</b><span>${q.r}</span></div>`}).join('')}</section>`;
A.querySelector('#send').onclick=async()=>{const t=report(),box=A.querySelector('#copy');let ok=false;
try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
if(ok){box.innerHTML='<p class="in" role="status">Скопировано. Вставь текст в чат с учителем.</p>';return}
box.innerHTML='<p class="mute">Скопируй этот текст и отправь учителю:</p><textarea id="manual" readonly></textarea>';
const a=box.querySelector('#manual');a.value=t;a.focus();a.select()};
A.querySelector('#restart').onclick=()=>{S=fresh();go('intro')}}

function cheat(){if(L.querySelector('.modal'))return;const d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');
d.innerHTML=`<div><div class="top"><h3>Шпаргалка</h3><button class="help" id="close" aria-label="Закрыть">×</button></div>${THEORY.map(t=>`<section class="card"><h3>${t.t}</h3>${t.b.map(b=>`<p>${mark(b)}</p>`).join('')}</section>`).join('')}<button class="btn" id="close2">Вернуться к заданию</button></div>`;
L.appendChild(d);d.querySelectorAll('#close,#close2').forEach(b=>b.onclick=()=>d.remove())}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const C=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347'];
for(let i=0;i<34;i++){const p=document.createElement('i');p.style.background=C[i%4];p.style.setProperty('--x',(Math.random()*340-170)+'px');p.style.setProperty('--y',(Math.random()*460-250)+'px');FX.appendChild(p);setTimeout(()=>p.remove(),1150)}}

draw();
</script></body></html>
