:root{--bg:#FFF6E6;--bg2:#FFE9C9;--ink:#1E3A8A;--muted:#5A6B8C;--orange:#F47B20;--orange-d:#D9620A;--blue:#2F80ED;--blue-d:#1C63C7;--green:#22A45D;--green-d:#178048;--yellow:#FFC83D;--pink:#E5408A;--pink-d:#C22A6E;--purple:#7B3FBF;--red:#E23B3B;--card:#FFFFFF;--shadow:0 6px 0 rgba(30,58,138,.12),0 10px 24px rgba(60,40,10,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 12% 8%,#FFE2B8 0 60px,transparent 61px),radial-gradient(circle at 92% 18%,#DDEEFF 0 46px,transparent 47px),radial-gradient(circle at 85% 96%,#FFE0EE 0 70px,transparent 71px);background-attachment:fixed;color:var(--ink);font-family:'Nunito','Segoe UI',Arial,sans-serif;font-weight:800;overflow-x:hidden}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.screen{flex:1;display:flex;flex-direction:column;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.center{align-items:center;justify-content:center;text-align:center;gap:14px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:900}
h2{font-size:28px;line-height:1.15;margin:0;font-weight:900}
.big-btn{min-height:64px;padding:12px 22px;border-radius:22px;font-size:24px;color:#fff;background:var(--orange);box-shadow:0 6px 0 var(--orange-d);transition:transform .1s;width:100%;max-width:380px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.big-btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.big-btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.big-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #D7DDEA}
.kris{display:block;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.wiggle{animation:wiggle .6s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:24px;line-height:1.2;position:relative;box-shadow:var(--shadow)}
.title-tag{display:inline-block;background:var(--yellow);border-radius:999px;padding:6px 16px;font-size:20px}
/* top bar */
.top{display:flex;align-items:center;gap:10px;height:40px;margin-bottom:6px}
.lvl{font-size:16px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 #EBD9B8;white-space:nowrap}
.bar{flex:1;height:14px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 #EBD9B8}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s}
.stars{font-size:20px;background:#fff;border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 #EBD9B8;white-space:nowrap}
.stars b{color:#E7A400}
/* task */
.host{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.host img{width:62px;flex:none}
.q{font-size:26px;line-height:1.15;font-weight:900}
.sent{background:var(--card);border-radius:24px;padding:16px 16px;font-size:29px;line-height:1.2;text-align:center;box-shadow:var(--shadow);margin-bottom:14px;font-weight:900}
.sent .gap{display:inline-block;min-width:38px;border-bottom:4px solid var(--orange);color:var(--orange);text-align:center}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:64px;padding:10px 14px;border-radius:20px;font-size:24px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 5px 0 #D7DDEA;border:3px solid transparent;transition:transform .1s}
.opt:nth-child(4n+1){border-color:var(--blue)}.opt:nth-child(4n+2){border-color:var(--green)}.opt:nth-child(4n+3){border-color:var(--pink)}.opt:nth-child(4n+4){border-color:var(--purple)}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#E3F7EA;border-color:var(--green)!important;box-shadow:0 5px 0 #A9DEBC}
.opt.bad{background:#FDE7E7;border-color:var(--red)!important;box-shadow:0 5px 0 #F2B8B8}
.opt[disabled]{cursor:default}
.opts.marks{flex-direction:row;gap:14px;justify-content:center}
.marks .opt{width:88px;height:88px;font-size:48px;line-height:1;padding:0;border-radius:24px}
.row2{display:flex;gap:12px}.row2 .opt{flex:1}
.slot{min-height:72px;background:#fff;border:3px dashed #BFC9DD;border-radius:20px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}
.slot .ph{color:#9AA6BF;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}
.chip{min-height:64px;padding:8px 18px;border-radius:18px;font-size:26px;background:#fff;box-shadow:0 5px 0 #D7DDEA;border:3px solid var(--blue)}
.slot .chip{min-height:54px;border-color:var(--orange);font-size:24px;padding:6px 14px}
.chip.used{visibility:hidden}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.sheet.show{transform:none}
.sheet .in{width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(30,58,138,.18);display:grid;grid-template-columns:86px 1fr;gap:4px 12px;align-items:center}
.sheet.good .in{border-top:8px solid var(--green)}.sheet.miss .in{border-top:8px solid var(--orange)}
.sheet img{width:86px;grid-row:span 2}
.sheet .h{font-size:28px;font-weight:900}
.sheet.good .h{color:var(--green)}.sheet.miss .h{color:var(--orange-d)}
.sheet .t{font-size:20px;line-height:1.25;font-weight:700}
.sheet .t b{font-weight:900}
.sheet .big-btn{grid-column:1/-1;margin-top:8px;max-width:none}
/* stars & confetti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.flystar{position:fixed;font-size:56px;z-index:31;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.5,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.starrow{font-size:40px;letter-spacing:4px;color:#E7A400}
.rule{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow);text-align:left;width:100%}
.rule p{font-size:22px;margin:0 0 10px;line-height:1.2}
.rule .ex{font-size:22px;line-height:1.25;margin:8px 0;padding:8px 12px;border-radius:14px;background:#F7F9FF}
.c1{color:var(--blue)}.c2{color:var(--green)}.c3{color:var(--pink)}.c4{color:var(--orange-d)}.c5{color:var(--purple)}
.medal-wrap{position:relative;width:170px;margin:0 auto}
.medal-wrap svg{position:absolute;left:50%;top:50%;width:76px;transform:translate(-40%,-6%) rotate(-6deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));animation:shine 2s ease-in-out infinite}
@keyframes shine{0%,100%{transform:translate(-40%,-6%) rotate(-6deg)}50%{transform:translate(-40%,-6%) rotate(6deg)}}
.report{width:100%;font-family:inherit;font-size:18px;font-weight:700;border:2px solid #BFC9DD;border-radius:14px;padding:10px;color:var(--ink);min-height:110px}
.msg{font-size:20px;color:var(--green-d);min-height:24px}
.small{font-size:18px;color:var(--muted);font-weight:700}
.noscript{max-width:520px;margin:40px auto;padding:24px;background:#fff;border-radius:24px;font-size:26px;text-align:center;box-shadow:var(--shadow)}
@media (max-height:600px){.rule p,.rule .ex{font-size:20px}.rule .ex{margin:5px 0;padding:6px 10px}.center{gap:9px}.center>img.kris{width:72px!important}.medal-wrap{width:120px}.medal-wrap img.kris{width:120px!important}.medal-wrap svg{width:56px}h1{font-size:30px}.starrow{font-size:32px}.host img{width:52px}.q{font-size:26px}.sent{padding:12px;margin-bottom:10px}.opts{gap:8px}.top{margin-bottom:2px}.marks .opt{width:80px;height:80px}}
@media (max-height:700px){.center>img.kris{max-width:96px}}
@media (min-width:700px){#app{padding-top:28px}.host img{width:84px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  {id:'a3',type:'choice',q:'Определи цель высказывания.',text:'Закрой, пожалуйста, дверь.',options:P3,answer:'побудительное',explain:'Здесь <b>просьба</b> — предложение побудительное.'},
  {id:'a4',type:'odd',q:'Найди лишнее предложение.',options:['Идёт снег.','Дети лепят снеговика.','Ты любишь зиму?'],answer:'Ты любишь зиму?',explain:'Оно <b>вопросительное</b>, а два других — повествовательные.'},
  {id:'a5',type:'tf',q:'Верно или нет?',text:'«Помоги маме накрыть на стол.» — вопросительное предложение.',options:TF,answer:'Неверно',explain:'Здесь <b>просьба</b> — это побудительное предложение.'},

 ]},
 {name:'Уровень 2',title:'Интонация и знак в конце',tasks:[
  {id:'b1',type:'choice',q:'Определи интонацию.',text:'Какой чудесный день!',options:I2,answer:'восклицательное',explain:'Здесь <b>сильное чувство</b>, в конце «!» — предложение восклицательное.'},
  {id:'b2',type:'choice',q:'Определи интонацию.',text:'Папа моет машину.',options:I2,answer:'невосклицательное',explain:'Предложение произносится <b>спокойно</b>, в конце точка — оно невосклицательное.'},
  {id:'b3',type:'mark',q:'Какой знак нужен в конце?',text:'Сколько тебе лет_',options:MK,answer:'?',explain:'Это <b>вопрос</b> — в конце ставим вопросительный знак.'},
  {id:'b4',type:'mark',q:'Какой знак нужен в конце?',text:'Ура, мы победили_',options:MK,answer:'!',explain:'Здесь <b>сильная радость</b> — ставим восклицательный знак.'},
  {id:'b5',type:'tf',q:'Верно или нет?',text:'«Как красиво в саду!» — восклицательное предложение.',options:TF,answer:'Верно',explain:'Предложение выражает <b>сильное чувство</b>, в конце «!».'},
  {id:'b6',type:'mark',q:'Какой знак нужен в конце?',text:'Мальчик поливает цветы_',options:MK,answer:'.',explain:'Предложение <b>спокойно сообщает</b> о чём-то — ставим точку.'}
 ]},
 {name:'Супер-уровень',title:'Всё вместе',tasks:[
  {id:'c1',type:'choice',q:'Какое это предложение?',text:'Не шуми в библиотеке!',options:['побудительное, восклицательное','побудительное, невосклицательное','повествовательное, восклицательное'],answer:'побудительное, восклицательное',explain:'Это <b>приказ</b>, сказанный с сильным чувством, в конце «!».'},
  {id:'c2',type:'assemble',q:'Собери предложение.',words:['Помоги','мне,','пожалуйста.'],answer:'Помоги мне, пожалуйста.',explain:'Первое слово — с <b>заглавной буквы</b>, в конце — точка. Это побудительное предложение.'},
  {id:'c3',type:'odd',q:'Найди лишнее предложение.',options:['Как вкусно пахнет пирог!','Ура, приехал дедушка!','Дедушка чинит велосипед.'],answer:'Дедушка чинит велосипед.',explain:'Оно <b>невосклицательное</b>, а два других — восклицательные.'},
  {id:'c4',type:'mark',q:'Какой знак нужен в конце?',text:'Ух ты, какая радуга_',options:MK,answer:'!',explain:'Здесь <b>сильное удивление</b> — ставим восклицательный знак.'},
  {id:'c5',type:'tf',q:'Верно или нет?',text:'«Который час?» — побудительное предложение.',options:TF,answer:'Неверно',explain:'Здесь <b>вопрос</b> — это вопросительное предложение.'},
  {id:'c6',type:'assemble',q:'Собери предложение.',words:['Какая','сегодня','погода?'],answer:'Какая сегодня погода?',explain:'Первое слово — с <b>заглавной буквы</b>, в конце — «?». Это вопросительное предложение.'}
 ]}
];
var ALL={};LEVELS.forEach(function(L,li){L.tasks.forEach(function(t){t.level=li;ALL[t.id]=t;});});
var TOTAL=Object.keys(ALL).length;
var PRAISE=['Ура!','Супер!','Крис в восторге!','Здорово!','Отлично!','Молодец!','Точно!'];
var app=document.getElementById('app');
var S=null;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}
function fresh(){
  var st={v:1,screen:'rule1',level:0,queue:[],retry:[],tries:{},first:{},stars:0,mist:[],cur:null,shuf:{}};
  st.queue=shuffle(LEVELS[0].tasks.map(function(t){return t.id;}));
  LEVELS.forEach(function(L){L.tasks.forEach(function(t){var src=t.type==='assemble'?t.words:t.options;
    st.shuf[t.id]=(t.type==='mark'||t.type==='tf')?src.slice():shuffle(src);
    if(t.type==='assemble'){var sh=shuffle(src);var g=0;while(sh.join(' ')===t.answer&&g++<10)sh=shuffle(src);st.shuf[t.id]=sh;}});});
  return st;
}
function kimg(k,cls,w){return '<img class="kris '+(cls||'')+'" alt="Лисёнок Крис" src="'+K[k]+'"'+(w?' style="width:'+w+'px"':'')+'>';}
function render(h){app.innerHTML='<div class="screen'+(arguments[1]?' '+arguments[1]:'')+'">'+h+'</div>';window.scrollTo(0,0);}

/* ---------- screens ---------- */
function start(){
  var saved=load();
  var can=saved&&saved.v===1&&saved.screen&&saved.screen!=='final';
  render(kimg('wave','bounce',150)+
   '<div class="bubble"><h1>Привет! Я лисёнок Крис.</h1><div style="font-size:22px;margin-top:8px">Потренируемся различать предложения по цели высказывания и интонации?</div></div>'+
   (can?'<button class="big-btn green" id="cont">Продолжить ▶</button><button class="big-btn ghost" id="go">Начать сначала</button>':'<button class="big-btn" id="go">Начать ▶</button>')+
   '<div class="small">3 уровня · около 10 минут</div>','center');
  document.getElementById('go').onclick=function(){S=fresh();save();go();};
  if(can)document.getElementById('cont').onclick=function(){S=saved;if(S.screen==='task'&&!S.cur)S.screen='next';go();};
}
function go(){
  save();
  if(S.screen==='rule1')return rule1();
  if(S.screen==='rule2')return rule2();
  if(S.screen==='intro')return intro();
  if(S.screen==='retryIntro')return retryIntro();
  if(S.screen==='levelEnd')return levelEnd();
  if(S.screen==='final')return finalScreen();
  return nextTask();
}
function rule1(){
  render('<span class="title-tag">Вспомним с Крисом</span>'+kimg('explain','',110)+
  '<div class="rule"><p>По <span class="c4">цели высказывания</span> предложения бывают:</p>'+
  '<div class="ex"><span class="c1">повествовательные</span> — сообщают:<br>«Солнце светит.»</div>'+
  '<div class="ex"><span class="c2">вопросительные</span> — спрашивают:<br>«Ты рисуешь?»</div>'+
  '<div class="ex"><span class="c3">побудительные</span> — просят или приказывают:<br>«Принеси мяч.»</div></div>'+
  '<button class="big-btn" id="b">Понятно! →</button>','center');
  document.getElementById('b').onclick=function(){S.screen='rule2';go();};
}
function rule2(){
  render('<span class="title-tag">Вспомним с Крисом</span>'+kimg('explain','',110)+
  '<div class="rule"><p>По <span class="c4">интонации</span> предложения бывают:</p>'+
  '<div class="ex"><span class="c5">восклицательные</span> — с сильным чувством, в конце «!»:<br>«Ура, гости пришли!»</div>'+
  '<div class="ex"><span class="c1">невосклицательные</span> — спокойные:<br>«Гости пришли.»</div></div>'+
  '<button class="big-btn" id="b">Играем! →</button>','center');
  document.getElementById('b').onclick=function(){S.screen='intro';go();};
}
function intro(){
  var L=LEVELS[S.level];
  render(kimg(S.level===2?'joy':'wave','bounce',130)+'<span class="title-tag">'+esc(L.name)+'</span><h1>'+esc(L.title)+'</h1>'+
   (S.level===2?'<div style="font-size:22px">Чуть сложнее — ты справишься!</div>':'<div style="font-size:22px">'+L.tasks.length+' заданий. Поехали!</div>')+
   '<button class="big-btn" id="b">Начать →</button>','center');
  document.getElementById('b').onclick=function(){S.screen='task';S.cur=null;go();};
}
function retryIntro(){
  render(kimg('think','',120)+'<h2>Повторим ошибки!</h2><div style="font-size:22px">Попробуй ещё раз — теперь получится.</div><button class="big-btn" id="b">Давай! →</button>','center');
  document.getElementById('b').onclick=function(){S.screen='task';S.cur=null;go();};
}
function nextTask(){
  S.screen='task';
  if(!S.cur){
    if(S.queue.length){S.cur=S.queue.shift();}
    else if(S.retry.length){S.queue=S.retry;S.retry=[];S.screen='retryIntro';return go();}
    else{S.screen='levelEnd';return go();}
  }
  save();showTask(ALL[S.cur]);
}
function progress(){
  var L=LEVELS[S.level];var done=L.tasks.filter(function(t){return S.first.hasOwnProperty(t.id);}).length;
  return Math.round(done/L.tasks.length*100);
}
function topbar(){
  return '<div class="top"><span class="lvl">'+esc(LEVELS[S.level].name)+'</span><div class="bar"><i style="width:'+progress()+'%"></i></div><span class="stars" id="starCount"><b>★</b> '+S.stars+'</span></div>';
}
function showTask(t){
  var opts=S.shuf[t.id];var h=topbar();
  h+='<div class="host">'+kimg('explain','',null)+'<div class="q">'+esc(t.q)+'</div></div>';
  if(t.type==='choice'||t.type==='tf'||t.type==='mark'){
    var txt=esc(t.text);
    if(t.type==='mark')txt=txt.replace(/(\S+)_$/,'<span style="white-space:nowrap">$1<span class="gap" id="gap">&nbsp;</span></span>');
    h+='<div class="sent">'+txt+'</div>';
  }
  if(t.type==='assemble'){
    h+='<div class="slot" id="slot"><span class="ph">Касайся слов по порядку</span></div><div class="chips" id="chips">'+
      opts.map(function(w,i){return '<button class="chip" data-i="'+i+'">'+esc(w)+'</button>';}).join('')+'</div>'+
      '<button class="big-btn blue" id="check" style="display:none;max-width:none">Проверить</button>';
  } else {
    var cls=t.type==='mark'?'opts marks':(t.type==='tf'||opts.length===2?'opts row2':'opts');
    if(t.type==='choice'&&opts.length===2&&opts[0].length>12)cls='opts';
    h+='<div class="'+cls+'" id="opts">'+opts.map(function(o,i){return '<button class="opt" data-v="'+esc(o)+'">'+(t.type==='tf'?(o==='Верно'?'✓ ':'✗ '):'')+esc(o)+'</button>';}).join('')+'</div>';
  }
  render(h);
  if(t.type==='assemble')return wireAssemble(t);
  var bs=app.querySelectorAll('.opt');
  Array.prototype.forEach.call(bs,function(b){b.onclick=function(){answer(t,b.getAttribute('data-v'),b);};});
}
function wireAssemble(t){
  var picked=[];var slot=document.getElementById('slot');var chk=document.getElementById('check');
  var opts=S.shuf[t.id];
  function draw(){
    slot.innerHTML=picked.length?picked.map(function(i,k){return '<button class="chip" data-k="'+k+'">'+esc(opts[i])+'</button>';}).join(''):'<span class="ph">Касайся слов по порядку</span>';
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'),function(c){c.classList.toggle('used',picked.indexOf(+c.getAttribute('data-i'))>=0);});
    Array.prototype.forEach.call(slot.querySelectorAll('.chip'),function(c){c.onclick=function(){picked.splice(+c.getAttribute('data-k'),1);draw();};});
    chk.style.display=picked.length===opts.length?'block':'none';
  }
  Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'),function(c){c.onclick=function(){var i=+c.getAttribute('data-i');if(picked.indexOf(i)<0){picked.push(i);draw();}};});
  chk.onclick=function(){var s=picked.map(function(i){return opts[i];}).join(' ');chk.disabled=true;answer(t,s,null);};
}
function answer(t,val,btn){
  var ok=val===t.answer;
  var bs=app.querySelectorAll('.opt,.chip,#check');Array.prototype.forEach.call(bs,function(b){b.disabled=true;});
  if(t.type!=='assemble'){
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){if(b.getAttribute('data-v')===t.answer)b.classList.add('ok');});
    if(!ok&&btn)btn.classList.add('bad');
    if(t.type==='mark'){var g=document.getElementById('gap');if(g){g.textContent=t.answer;g.style.color=ok?'var(--green)':'var(--orange)';}}
  }
  var firstTime=!S.first.hasOwnProperty(t.id);
  if(firstTime)S.first[t.id]=ok;
  S.tries[t.id]=(S.tries[t.id]||0)+1;
  var gained=false;
  if(ok){ if(firstTime){S.stars++;gained=true;} }
  else{
    if(S.mist.indexOf(t.id)<0)S.mist.push(t.id);
    if(S.tries[t.id]<3)S.retry.push(t.id);
  }
  S.cur=null;save();
  var sh=document.getElementById('sheet');
  sh.className='sheet '+(ok?'good':'miss');
  document.getElementById('sheetImg').src=ok?(Math.random()<.5?K.happy:K.joy):K.think;
  document.getElementById('sheetH').textContent=ok?(firstTime?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Исправлено! Ура!'):'Почти! Смотри…';
  document.getElementById('sheetT').innerHTML=ok?t.explain:('Правильно: <b>'+esc(t.answer)+'</b><br>'+t.explain);
  setTimeout(function(){sh.classList.add('show');},ok?250:350);
  if(ok){confetti();if(gained)flyStar(btn);}
  var nb=document.getElementById('sheetBtn');
  nb.onclick=function(){sh.classList.remove('show');setTimeout(go,180);};
}
function levelEnd(){
  var L=LEVELS[S.level];var got=L.tasks.filter(function(t){return S.first[t.id]===true;}).length;
  var last=S.level===LEVELS.length-1;
  render(kimg('praise','bounce',140)+'<span class="title-tag">'+esc(L.name)+' пройден!</span><h1>'+(got===L.tasks.length?'Ни одной ошибки!':'Отлично!')+'</h1>'+
   '<div class="starrow">'+'★'.repeat(got)+'<span style="color:#E3D8C2">'+'★'.repeat(L.tasks.length-got)+'</span></div>'+
   '<div style="font-size:22px">Звёзд за уровень: '+got+' из '+L.tasks.length+'</div>'+
   '<button class="big-btn" id="b">'+(last?'К финалу! 🏆':'Следующий уровень →')+'</button>','center');
  confetti();
  document.getElementById('b').onclick=function(){
    if(last){S.screen='final';}
    else{S.level++;S.queue=shuffle(LEVELS[S.level].tasks.map(function(t){return t.id;}));S.retry=[];S.screen='intro';}
    S.cur=null;go();
  };
}
function reportText(){
  var firstOk=Object.keys(S.first).filter(function(k){return S.first[k];}).length;
  var errs=S.mist.map(function(id){var t=ALL[id];var s=(t.text||t.answer).replace('_','…');if(t.type==='tf')s=s.split(' — ')[0];return s.charAt(0)==='«'?s:'«'+s+'»';});
  return 'Тренажёр «Виды предложений по цели высказывания и интонации» (3 класс).\n'+
    'Звёзды: '+S.stars+' из '+TOTAL+' (верно с первой попытки).\n'+
    (errs.length?'Ошибки были в заданиях: '+errs.join('; '):'Ошибок не было!')+'\n'+
    'Дата: '+new Date().toLocaleDateString('ru-RU');
}
var MEDAL='<svg viewBox="0 0 100 130" aria-hidden="true"><path d="M30 0h16l10 40H40z" fill="#2F80ED"/><path d="M70 0H54L44 40h16z" fill="#E5408A"/><circle cx="50" cy="82" r="40" fill="#FFC83D" stroke="#E0A000" stroke-width="6"/><circle cx="50" cy="82" r="28" fill="#FFDD6E"/><path d="M50 62l6.5 13.2 14.5 2.1-10.5 10.2 2.5 14.5L50 95.2 37 102l2.5-14.5L29 77.3l14.5-2.1z" fill="#F47B20"/></svg>';
function finalScreen(){
  S.screen='final';save();
  render('<div class="medal-wrap">'+kimg('joy','bounce',170)+MEDAL+'</div><h1>Ты молодец!</h1>'+
   '<div class="starrow">★ '+S.stars+' из '+TOTAL+'</div><div style="font-size:22px">Крис дарит тебе медаль!</div>'+
   '<button class="big-btn green" id="send">Отправить результат учителю</button><div class="msg" id="msg"></div><div id="manual"></div>'+
   '<button class="big-btn ghost" id="again">Играть ещё раз ↻</button>','center');
  confetti();setTimeout(confetti,700);
  document.getElementById('send').onclick=copyReport;
  document.getElementById('again').onclick=function(){S=fresh();save();go();};
}
function copyReport(){
  var txt=reportText();var msg=document.getElementById('msg');
  function ok(){msg.textContent='Скопировано! Вставь сообщение в чат с учителем.';}
  function manual(){msg.textContent='Скопируй текст и отправь учителю:';var m=document.getElementById('manual');m.innerHTML='<textarea class="report" id="rep" readonly></textarea>';var ta=document.getElementById('rep');ta.value=txt;ta.focus();ta.select();}
  function legacy(){try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var r=document.execCommand('copy');document.body.removeChild(ta);if(r)ok();else manual();}catch(e){manual();}}
  try{
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,legacy);}
    else legacy();
  }catch(e){legacy();}
}
/* ---------- effects ---------- */
var cv=document.getElementById('fx'),ctx=cv.getContext('2d'),parts=[],raf=0;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',sizeCv);sizeCv();
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#F47B20','#2F80ED','#22A45D','#FFC83D','#E5408A','#7B3FBF'];
  for(var i=0;i<70;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:6+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:90+Math.random()*40});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<cv.height+20;});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();});
  raf=parts.length?requestAnimationFrame(tick):0;
}
function flyStar(fromEl){
  var st=document.createElement('div');st.className='flystar';st.textContent='★';st.style.color='#FFC83D';
  var r=fromEl?fromEl.getBoundingClientRect():{left:innerWidth/2-28,top:innerHeight/2,width:56,height:56};
  st.style.left=(r.left+r.width/2-28)+'px';st.style.top=(r.top+r.height/2-28)+'px';document.body.appendChild(st);
  var tgt=document.getElementById('starCount');var tr=tgt?tgt.getBoundingClientRect():{left:innerWidth-60,top:10,width:40};
  requestAnimationFrame(function(){requestAnimationFrame(function(){st.style.left=(tr.left+tr.width/2-20)+'px';st.style.top=(tr.top-8)+'px';st.style.fontSize='34px';});});
  setTimeout(function(){st.remove();if(tgt){tgt.innerHTML='<b>★</b> '+S.stars;tgt.classList.add('wiggle');}},850);
}
window.__trainer={get state(){return S;},tasks:ALL,levels:LEVELS,report:function(){return reportText();}};
start();
})();
