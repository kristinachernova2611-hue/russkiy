:root{--bg:#FFF8EC;--ink:#1E3A8A;--orange:#EA580C;--green:#16A34A;--red:#E11D48;--purple:#7C3AED;--gold:#F59E0B;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'NunitoE','Nunito','Segoe UI',Arial,sans-serif;font-weight:800}
body{overflow:hidden}
#app{height:100vh;height:100dvh;overflow-y:auto;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px calc(10px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;align-items:center;gap:8px;min-height:48px}
.stars{display:flex;align-items:center;gap:6px;background:#FEF3C7;border:3px solid var(--gold);border-radius:999px;padding:4px 14px;font-size:22px;color:#92400E}
.stars b{font-size:24px}
.lvl{flex:1;font-size:17px;color:var(--purple);text-align:center}
.icon{width:48px;height:48px;border-radius:50%;border:3px solid #C4B5FD;background:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.bar{height:12px;background:#E5E7EB;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F59E0B,#EA580C);border-radius:99px;transition:width .4s}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.host{display:flex;align-items:flex-end;gap:8px;min-height:0}
.host img{height:clamp(84px,17vh,150px);width:auto;flex:none}
.say{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:clamp(17px,2.6vh,22px);position:relative;margin-bottom:14px;line-height:1.25}
.say:before{content:'';position:absolute;left:-14px;bottom:14px;border:8px solid transparent;border-right:12px solid var(--ink)}
.q{font-size:clamp(26px,4.2vh,32px);line-height:1.2;text-align:center;margin:12px 4px 8px}
.q .w{color:var(--orange)}
.hint{text-align:center;font-size:18px;color:#6B7280;margin-bottom:6px}
.opts{display:grid;gap:12px;margin-top:auto;margin-bottom:6px}
.opts.two{grid-template-columns:1fr 1fr}
.btn{min-height:64px;border:4px solid #FDBA74;background:#fff;border-radius:20px;font:inherit;font-size:clamp(22px,3.4vh,28px);color:var(--ink);cursor:pointer;padding:8px 12px;box-shadow:0 5px 0 #FDBA74;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #FDBA74}
.btn.big{font-size:44px;min-height:96px}
.btn.ok{background:#DCFCE7;border-color:var(--green);box-shadow:0 5px 0 var(--green)}
.btn.no{background:#FFE4E6;border-color:#FDA4AF;box-shadow:0 5px 0 #FDA4AF}
.btn:disabled{cursor:default}
.main{min-height:68px;border:0;border-radius:22px;background:var(--orange);color:#fff;font:inherit;font-size:28px;cursor:pointer;box-shadow:0 6px 0 #9A3412;width:100%;margin-top:10px}
.main.green{background:var(--green);box-shadow:0 6px 0 #14532D}
.main.purple{background:var(--purple);box-shadow:0 6px 0 #4C1D95}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:72px;margin:6px 0}
.slot{min-width:64px;height:68px;border:3px dashed #93C5FD;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#EFF6FF;padding:0 10px}
.slot.f{border-style:solid;border-color:var(--ink);background:#fff}
.pieces{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:auto;margin-bottom:6px}
.pieces .btn{min-width:84px}
.fb{border-radius:20px;padding:10px 14px;font-size:clamp(18px,2.6vh,22px);margin-top:8px;display:flex;gap:10px;align-items:center;line-height:1.25}
.fb img{height:clamp(70px,12vh,110px)}
.fb.good{background:#DCFCE7;border:3px solid var(--green)}
.fb.bad{background:#EFF6FF;border:3px solid #60A5FA}
.center{text-align:center}
.title{font-size:clamp(30px,5vh,40px);color:var(--purple);text-align:center;margin:8px 0}
.rule{background:#fff;border:3px solid #C4B5FD;border-radius:22px;padding:14px;font-size:clamp(19px,2.8vh,24px);line-height:1.3;margin:8px 0}
.rule .ex{color:var(--orange)}
.hero{display:block;margin:4px auto;height:clamp(130px,30vh,250px)}
.fly{position:fixed;font-size:56px;z-index:50;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.starfield{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0;font-size:40px}
.starfield span{animation:pop .6s both}
.hid{position:absolute;opacity:.0}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;font-size:44px;margin:12px 0}
.peek{position:relative;height:clamp(160px,30vh,240px);background:#BBF7D0;border-radius:22px;overflow:hidden;border:3px solid #16A34A}
.bush{position:absolute;font-size:70px;cursor:pointer;user-select:none}
.tail{position:absolute;width:70px;cursor:pointer}
.resbox{width:100%;height:120px;font:inherit;font-size:16px;border-radius:14px;border:2px solid #C4B5FD;padding:8px}
.screen.answered .btn{min-height:50px;font-size:20px;padding:4px 8px;box-shadow:none}
.screen.answered .btn.big{min-height:56px;font-size:26px}
.screen.answered .q{font-size:22px;margin:4px 4px 6px}
.screen.answered .hint{display:none}
.screen.answered .opts,.screen.answered .pieces{margin-top:0;gap:8px}
.screen.answered .slots{min-height:52px}.screen.answered .slot{height:50px;font-size:24px}
.screen.answered .fb{margin-top:auto}
@media (max-height:740px){.fb img{height:60px}.fb{font-size:17px;padding:8px 10px}.hero{height:21vh}.title{font-size:26px;margin:4px 0}.rule{padding:10px;font-size:18px;margin:6px 0}.starfield{font-size:24px;gap:4px;margin:4px 0}.main{min-height:58px;font-size:23px;margin-top:8px}.host img{height:80px}.say{font-size:17px}}
.fin .hero{height:clamp(90px,16vh,200px)}.fin .title{margin:2px 0}.fin .main{min-height:56px;font-size:22px}.fin .starfield{font-size:22px;gap:3px}
.screen.answered .opts .btn:not(.ok):not(.no){display:none}
.noscript{padding:30px;font-size:24px;text-align:center}
</style>

  {id:'a5', type:'build', q:'Собери синоним к слову <span class="w">путь</span>', pieces:['ДО','РО','ГА'], hint:'Нажимай слоги по порядку', why:'Путь — дорога.'},
  {id:'a6', type:'letter', q:'<span class="w">умный — мудрый</span><br>Синонимы или антонимы?', a:0, why:'Умный и мудрый близки по значению — это синонимы.'}
 ]},
 {name:'Уровень 2 · Антонимы', tasks:[
  {id:'b1', type:'pick', q:'Антоним к слову <span class="w">день</span>', opts:['ночь','утро','солнце'], a:0, why:'День и ночь — противоположности.'},
  {id:'b2', type:'pick', q:'Антоним к слову <span class="w">сильный</span>', opts:['быстрый','слабый','высокий'], a:1, why:'Сильный и слабый — противоположные по значению слова.'},
  {id:'b3', type:'odd', q:'Найди лишнюю пару — в ней не антонимы', opts:['старый — новый','широкий — узкий','конь — лошадь'], a:2, why:'Конь и лошадь — близкие по значению слова, это синонимы.'},
  {id:'b4', type:'tf', q:'<span class="w">Купить</span> и <span class="w">продать</span> — антонимы?', a:true, why:'Купить и продать — противоположные действия, это антонимы.'},
  {id:'b5', type:'build', q:'Собери антоним к слову <span class="w">друг</span>', pieces:['В','Р','А','Г'], hint:'Нажимай буквы по порядку', why:'Друг — враг: противоположные слова.'},
  {id:'b6', type:'letter', q:'<span class="w">сухой — мокрый</span><br>Синонимы или антонимы?', a:1, why:'Сухой и мокрый — противоположные по значению слова, антонимы.'}
 ]},
 {name:'Супер-уровень · Значение слова', tasks:[
  {id:'c1', type:'pick', q:'Какое слово так объясняется: «<span class="w">человек, который лечит людей</span>»?', opts:['повар','врач','водитель'], a:1, why:'Лечит людей врач.'},
  {id:'c2', type:'pick', q:'«<span class="w">Ключ</span> бьёт из-под земли». Здесь ключ — это…', opts:['родник','ключ от двери','скрипичный ключ'], a:0, why:'Из-под земли бьёт родник — так здесь раскрывается значение многозначного слова «ключ».'},
  {id:'c3', type:'pick', q:'У пилы тоже есть…', opts:['зубья','глаза','крылья'], a:0, why:'Зубья у пилы острые, как зубы, — это общее в значениях слова.'},
  {id:'c4', type:'odd', q:'Найди однозначное слово', opts:['корень','трамвай','коса'], a:1, why:'Трамвай — одно значение. Корень и коса — многозначные: корень дерева и слова, коса у девочки и для травы.'},
  {id:'c5', type:'tf', q:'Слово <span class="w">кран</span> многозначное: водопроводный кран и подъёмный кран?', a:true, why:'У слова «кран» несколько значений — оно многозначное.'},
  {id:'c6', type:'build', q:'Собери слово по значению: «<span class="w">домик для скворцов</span>»', pieces:['СКВО','РЕЧ','НИК'], hint:'Нажимай слоги по порядку', why:'Домик для скворцов — скворечник.'}
 ]}
];
var TOTAL = LEVELS.reduce(function(s,l){return s+l.tasks.length;},0);
var PRAISE = ['Супер!','Отлично!','Ты молодец!','Здорово!','Точно!','Вот это да!'];
var CHEER = ['Ничего страшного, вспомним вместе!','Почти! Смотри, как правильно.','Ошибаться полезно — так мы учимся!'];

/* ---------- state ---------- */
var S = fresh();
function fresh(){return {phase:'start', lvl:0, queue:null, pos:0, stars:0, first:{}, tried:{}, done:0};}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){}}
function load(){try{var t=localStorage.getItem(KEY); if(t){var o=JSON.parse(t); if(o&&o.phase){S=o;return true;}}}catch(e){} return false;}

/* ---------- sound ---------- */
var soundOn = true;
try{ if(localStorage.getItem(SNDKEY)==='0') soundOn=false; }catch(e){}
var ctx=null, buffers={}, unlocked=false, htmlAudio={};
function b64ToBuf(b64){var bin=atob(b64), n=bin.length, u=new Uint8Array(n); for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i); return u.buffer;}
function unlock(){
  if(unlocked) return; unlocked=true;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      ctx=new AC();
      if(ctx.resume) ctx.resume();
      var sb=ctx.createBuffer(1,1,22050), src=ctx.createBufferSource(); src.buffer=sb; src.connect(ctx.destination); src.start(0);
      Object.keys(WAV).forEach(function(k){
        try{
          var p=ctx.decodeAudioData(b64ToBuf(WAV[k]), function(b){buffers[k]=b;}, function(){});
          if(p&&p.then) p.then(function(b){buffers[k]=b;}).catch(function(){});
        }catch(e){}
      });
    }
  }catch(e){ctx=null;}
  try{ Object.keys(WAV).forEach(function(k){ var a=new Audio('data:audio/wav;base64,'+WAV[k]); a.preload='auto'; htmlAudio[k]=a; }); }catch(e){}
}
function play(k){
  window.__lastPlay = {name:k, on:soundOn, ctx: ctx?ctx.state:'none', decoded: !!buffers[k], t: Date.now()};
  if(!soundOn) return;
  try{
    if(ctx && buffers[k]){
      if(ctx.state==='suspended' && ctx.resume) ctx.resume();
      var s=ctx.createBufferSource(); s.buffer=buffers[k]; s.connect(ctx.destination); s.start(0); window.__lastPlay.via='webaudio'; return;
    }
    if(htmlAudio[k]){ htmlAudio[k].currentTime=0; var pr=htmlAudio[k].play(); if(pr&&pr.catch) pr.catch(function(){}); window.__lastPlay.via='html'; }
  }catch(e){}
}
var sndBtn=document.getElementById('snd');
function drawSnd(){sndBtn.textContent=soundOn?'🔊':'🔇'; sndBtn.setAttribute('aria-label', soundOn?'Звук включён':'Звук выключен');}
sndBtn.addEventListener('click',function(){unlock(); soundOn=!soundOn; try{localStorage.setItem(SNDKEY, soundOn?'1':'0');}catch(e){} drawSnd();});
drawSnd();
document.addEventListener('pointerdown', unlock, {once:true});

/* ---------- helpers ---------- */
var scr=document.getElementById('scr');
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function img(k){var i=new Image(); i.src=IMG[k]; i.alt='Лисёнок Крис'; return i;}
function host(k, text){var h=el('div','host'); h.appendChild(img(k)); h.appendChild(el('div','say',text)); return h;}
function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function setTop(){
  document.getElementById('starNum').textContent=S.stars;
  document.getElementById('lvl').textContent = S.phase==='task'||S.phase==='intro' ? LEVELS[S.lvl].name : (S.phase==='break'?'Мини-переменка':'');
  document.getElementById('prog').style.width = Math.round(100*S.done/TOTAL)+'%';
}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.fly'),function(f){f.remove();});
  scr.innerHTML=''; scr.classList.remove('answered'); scr.classList.remove('fin'); setTop(); window.scrollTo(0,0);
  ({start:vStart, recall1:vRecall1, recall2:vRecall2, intro:vIntro, task:vTask, brk:vBreak, final:vFinal})[S.phase==='break'?'brk':S.phase]();
}
function go(ph){S.phase=ph; save(); render();}

/* ---------- views ---------- */
function vStart(){
  scr.appendChild(el('div','title','Синонимы и антонимы'));
  scr.appendChild(img('wave')).className='hero';
  scr.appendChild(el('div','rule center','Привет! Я лисёнок Крис. Помоги мне собрать звёзды: 3 уровня, а между ними — мини-переменка!'));
  var b=el('button','main','Поехали! 🚀'); b.id='go';
  b.onclick=function(){unlock(); S=fresh(); S.phase='recall1'; save(); render();};
  scr.appendChild(b);
}
function vRecall1(){
  scr.appendChild(el('div','title','Вспомним с Крисом'));
  scr.appendChild(host('explain','Слушай внимательно!'));
  scr.appendChild(el('div','rule','<b>Синонимы</b> — слова, близкие по значению: <span class="ex">грустный — печальный</span>, <span class="ex">работа — труд</span>.<br><br><b>Антонимы</b> — слова с противоположным значением: <span class="ex">длинный — короткий</span>, <span class="ex">вверх — вниз</span>.'));
  var b=el('button','main','Дальше →'); b.onclick=function(){go('recall2');}; scr.appendChild(b);
}
function vRecall2(){
  scr.appendChild(el('div','title','Вспомним с Крисом'));
  scr.appendChild(host('think','А ещё бывают слова-хитрецы!'));
  scr.appendChild(el('div','rule','<b>Многозначное слово</b> имеет несколько значений: <span class="ex">лисички в лесу (грибы) — лисички в норе (зверята)</span>, <span class="ex">солнечный зайчик — лесной зайчик</span>.'));
  var b=el('button','main green','Начинаем! ⭐'); b.onclick=function(){startLevel(0);}; scr.appendChild(b);
}
function startLevel(n){S.lvl=n; S.queue=LEVELS[n].tasks.map(function(t){return t.id;}); S.pos=0; S.phase='intro'; save(); render();}
function vIntro(){
  var L=LEVELS[S.lvl];
  scr.appendChild(el('div','title', L.name));
  scr.appendChild(img(S.lvl===2?'cheer':'happy')).className='hero';
  scr.appendChild(el('div','rule center', S.lvl===2?'Супер-уровень! Тут слова с секретом. Я верю в тебя!':'Начинаем? Каждый верный ответ — звезда!'));
  var b=el('button','main','Вперёд!'); b.onclick=function(){go('task');}; scr.appendChild(b);
}
function findTask(id){for(var i=0;i<LEVELS.length;i++)for(var j=0;j<LEVELS[i].tasks.length;j++)if(LEVELS[i].tasks[j].id===id)return LEVELS[i].tasks[j];}
var locked=false;
function vTask(){
  locked=false;
  var t=findTask(S.queue[S.pos]);
  window.__task=t;
  var retry = !!S.tried[t.id];
  scr.appendChild(el('div','q', t.q));
  if(retry) scr.appendChild(el('div','hint','Попробуем ещё раз 💪'));
  var opts;
  if(t.type==='pick'||t.type==='odd'){
    if(t.hint) scr.appendChild(el('div','hint',t.hint));
    opts=el('div','opts'); var order=shuffle(t.opts.map(function(_,i){return i;}));
    order.forEach(function(i){var b=el('button','btn',t.opts[i]); b.dataset.i=i; b.onclick=function(){answer(t, i===t.a, b, opts);}; opts.appendChild(b);});
    scr.appendChild(opts);
  } else if(t.type==='tf'){
    opts=el('div','opts two');
    [['Верно ✔',true],['Неверно ✘',false]].forEach(function(p){var b=el('button','btn big',p[0]); b.style.fontSize='28px'; b.dataset.v=p[1]; b.onclick=function(){answer(t, p[1]===t.a, b, opts);}; opts.appendChild(b);});
    scr.appendChild(opts);
  } else if(t.type==='letter'){
    scr.appendChild(el('div','hint','С — синонимы, А — антонимы'));
    opts=el('div','opts two');
    ['С','А'].forEach(function(L,i){var b=el('button','btn big',L); b.dataset.i=i; b.onclick=function(){answer(t, i===t.a, b, opts);}; opts.appendChild(b);});
    scr.appendChild(opts);
  } else if(t.type==='build'){
    scr.appendChild(el('div','hint',t.hint));
    var slots=el('div','slots'); var got=[];
    t.pieces.forEach(function(){slots.appendChild(el('div','slot',''));});
    scr.appendChild(slots);
    var pcs=el('div','pieces'); opts=pcs;
    var order=shuffle(t.pieces.map(function(_,i){return i;}));
    if(order.join()===t.pieces.map(function(_,i){return i;}).join() && t.pieces.length>1) order.reverse();
    order.forEach(function(i){
      var b=el('button','btn',t.pieces[i]); b.dataset.i=i;
      b.onclick=function(){ if(locked||b.disabled) return; b.disabled=true; b.style.visibility='hidden'; got.push(i);
        var s=slots.children[got.length-1]; s.textContent=t.pieces[i]; s.classList.add('f');
        if(got.length===t.pieces.length){ var ok=got.every(function(v,k){return v===k;}); answer(t, ok, null, pcs, slots); } };
      pcs.appendChild(b);
    });
    var undo=el('button','btn','↺ Сначала'); undo.style.fontSize='20px'; undo.onclick=function(){ if(locked) return; render(); };
    scr.appendChild(pcs); pcs.appendChild(undo);
  }
}
function answer(t, ok, btn, opts, slots){
  if(locked) return; locked=true; scr.classList.add('answered');
  Array.prototype.forEach.call(opts.querySelectorAll('button'),function(b){b.disabled=true;});
  var fb;
  if(ok){
    if(btn) btn.classList.add('ok');
    if(!S.tried[t.id]) S.first[t.id]=1;
    S.stars++; S.done++;
    play('zvezda'); flyStar(btn||opts);
    fb=el('div','fb good'); fb.appendChild(img(rnd(['praise','cheer','happy']))); fb.appendChild(el('div','', '<b>'+rnd(PRAISE)+'</b> +1 звезда!'));
    S.pos++;
  } else {
    if(btn) btn.classList.add('no');
    markRight(t, opts, slots);
    S.tried[t.id]=1;
    S.queue.push(t.id); S.pos++;
    fb=el('div','fb bad'); fb.appendChild(img('think')); fb.appendChild(el('div','', rnd(CHEER)+'<br>'+t.why));
  }
  save();
  scr.appendChild(fb);
  var nb=el('button','main green','Дальше →'); nb.id='next'; nb.onclick=next; scr.appendChild(nb);
  setTop();
}
function markRight(t, opts, slots){
  if(t.type==='pick'||t.type==='odd'||t.type==='letter'){ Array.prototype.forEach.call(opts.children,function(b){ if(+b.dataset.i===t.a) b.classList.add('ok'); }); }
  if(t.type==='tf'){ Array.prototype.forEach.call(opts.children,function(b){ if(String(t.a)===b.dataset.v) b.classList.add('ok'); }); }
  if(t.type==='build' && slots){ t.pieces.forEach(function(p,k){ slots.children[k].textContent=p; slots.children[k].style.borderColor='#16A34A'; slots.children[k].style.background='#DCFCE7'; }); }
}
function next(){
  if(S.pos < S.queue.length){ render(); return; }
  if(S.lvl===1){ go('break'); return; }
  if(S.lvl<2){ startLevel(S.lvl+1); return; }
  go('final');
}
function flyStar(from){
  try{
    var r=from.getBoundingClientRect(), t=document.getElementById('starBox').getBoundingClientRect();
    var f=el('div','fly','⭐'); f.style.left=(r.left+r.width/2-28)+'px'; f.style.top=(r.top)+'px'; document.body.appendChild(f);
    requestAnimationFrame(function(){requestAnimationFrame(function(){ f.style.left=(t.left)+'px'; f.style.top=(t.top-6)+'px'; f.style.transform='scale(.5)'; });});
    setTimeout(function(){ f.remove(); var sb=document.getElementById('starBox'); sb.classList.remove('pop'); void sb.offsetWidth; sb.classList.add('pop'); }, 850);
  }catch(e){}
}
function vBreak(){
  scr.appendChild(el('div','title','Мини-переменка!'));
  scr.appendChild(host('cheer','Посчитай звёздочки! Сколько их?'));
  var n = S.breakN || (S.breakN = 5 + Math.floor(Math.random()*4)); save();
  var c=el('div','count'); for(var i=0;i<n;i++) c.appendChild(el('span','', '⭐')); scr.appendChild(c);
  var opts=el('div','opts two'); opts.style.gridTemplateColumns='1fr 1fr 1fr';
  shuffle([n-1,n,n+1]).forEach(function(v){ var b=el('button','btn big',String(v)); b.onclick=function(){
    Array.prototype.forEach.call(opts.children,function(x){x.disabled=true; if(+x.textContent===n) x.classList.add('ok');});
    var msg = v===n ? 'Верно, '+n+'! Зоркий глаз, как у лисёнка!' : 'Их '+n+'. Ничего, считать вместе весело!';
    if(v===n) play('zvezda');
    scr.appendChild(el('div','fb '+(v===n?'good':'bad'), msg));
    var nb=el('button','main purple','К супер-уровню →'); nb.id='next'; nb.onclick=function(){ startLevel(2); }; scr.appendChild(nb);
  }; opts.appendChild(b); });
  scr.appendChild(opts);
}
function resultText(){
  var f=Object.keys(S.first).length, d=new Date();
  return 'Тренажёр «Синонимы, антонимы, многозначные слова» (3 класс, урок 11).\n'
   + 'Верно с первого раза: '+f+' из '+TOTAL+'.\n'
   + 'Звёзд собрано: '+S.stars+'.\n'
   + 'Ошибки исправлены, все задания выполнены.\n'
   + 'Дата: '+d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function vFinal(){
  S.done=TOTAL; setTop(); scr.classList.add('fin');
  scr.appendChild(el('div','title','Ты молодец! 🎉'));
  scr.appendChild(img('cheer')).className='hero';
  var sf=el('div','starfield'); for(var i=0;i<Math.min(S.stars,18);i++){var s=el('span','','⭐'); s.style.animationDelay=(i*0.08)+'s'; sf.appendChild(s);} scr.appendChild(sf);
  scr.appendChild(el('div','rule center','Звёзд: <b>'+S.stars+'</b>. С первого раза: <b>'+Object.keys(S.first).length+' из '+TOTAL+'</b>.'));
  var send=el('button','main','Отправить результат учителю'); send.id='send';
  var area=null;
  send.onclick=function(){
    var txt=resultText();
    function manual(){ if(area) return; area=el('textarea','resbox'); area.value=txt; area.readOnly=true; scr.insertBefore(area, again); area.focus(); area.select(); send.textContent='Скопируй текст и отправь учителю'; }
    try{
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(function(){ send.textContent='Скопировано! Вставь в сообщение учителю ✔'; window.__copied=txt; }, manual); }
      else manual();
    }catch(e){ manual(); }
  };
  var again=el('button','main purple','Играть ещё раз'); again.id='again';
  again.onclick=function(){ S=fresh(); S.phase='recall1'; save(); render(); };
  scr.appendChild(send); scr.appendChild(again);
  if(!S.fanfareDone){ S.fanfareDone=1; save(); setTimeout(function(){play('fanfary');},300); }
}

/* ---------- boot ---------- */
if(load() && S.phase!=='start'){
  // continue where we stopped
}
render();
window.__S=function(){return S;};
})();
</script>
</body>
