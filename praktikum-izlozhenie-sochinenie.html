body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Onest,sans-serif;overflow-x:hidden;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:Unbounded,sans-serif;line-height:1.2;margin:0}
h1{font-size:clamp(26px,7.4vw,38px)} h2{font-size:22px} h3{font-size:16px}
p{margin:0}
em{font-style:normal;font-weight:800;color:var(--a)}
#app{width:100%;max-width:560px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.center{justify-content:center}
.card{background:var(--c1);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.in{background:var(--c2);border-radius:16px;padding:12px 14px}
.mute{color:var(--mute);font-size:14px}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--a);color:#0F0F14;font-weight:750;padding:12px 16px}
.btn.second{background:var(--c2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;text-align:left;border:2px solid transparent;border-radius:18px;background:var(--c2);padding:13px 16px;font-size:18px}
.opt:disabled{cursor:default}
.opt.good{border-color:#D6FF3F;background:rgba(214,255,63,.12)}
.opt.bad{border-color:#FF6DB0;background:rgba(255,109,176,.13)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:30px;background:var(--c2);font-size:14px;font-weight:650}
.chip.on{background:var(--a);color:#0F0F14}
.tiles{display:flex;gap:8px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
.tile{min-width:clamp(46px,14vw,66px);height:72px;padding:0 6px;display:grid;place-items:center;border-radius:18px;background:var(--c2);font:800 24px Unbounded;animation:bob 2.4s ease-in-out infinite}
.tile:nth-child(1){background:#D6FF3F;color:#0F0F14}.tile:nth-child(2){background:#4CC9FF;color:#0F0F14}.tile:nth-child(3){background:#FF6DB0;color:#0F0F14}.tile:nth-child(4){background:#FFA347;color:#0F0F14}.tile:nth-child(5){background:#F6F5F0;color:#0F0F14}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.hero{display:flex;align-items:center;gap:14px}
.hero svg{flex:none;width:86px;height:86px}
.top{display:flex;align-items:center;gap:10px}
.top h3{flex:1;min-width:0;color:var(--a)}
.score{white-space:nowrap;background:var(--c2);padding:9px 12px;border-radius:20px;font-weight:750}
.help{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--c2);font-weight:800;color:var(--a)}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:7px;border-radius:4px;background:var(--c2)}
.seg i.ok{background:var(--a)} .seg i.no{background:#777585} .seg i.now{background:var(--ink)}
.row{display:flex;justify-content:space-between;gap:8px}
.text{font-size:18px}
.bubble{background:var(--c2);padding:14px 16px;border-radius:20px 20px 20px 5px;font-size:18px}
.from{font-size:12px;color:var(--a);font-weight:750;margin-bottom:5px}
.claim{font:700 19px/1.4 Unbounded;text-align:center;padding:22px 12px;background:var(--c2);border-radius:18px}
ol.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ol.words li{background:var(--c2);border-radius:14px;padding:10px 14px;font-size:18px}
ol.words.small li{font-size:15.5px;padding:9px 12px}
.errs{display:flex;flex-direction:column;gap:6px}
.errs div{border-left:4px solid var(--a);padding:4px 10px;font-size:15px}
input,textarea{width:100%;border:2px solid #3A3A48;border-radius:16px;background:var(--bg);padding:14px;font-size:19px;user-select:text}
input:focus,textarea:focus{outline:0;border-color:var(--a)}
textarea{min-height:190px;font-size:15px}
.sheet{position:fixed;z-index:5;left:0;right:0;margin:auto;bottom:0;width:100%;max-width:560px;max-height:68vh;overflow-y:auto;padding:20px 18px calc(16px + env(safe-area-inset-bottom));background:var(--c2);border-top:5px solid var(--a);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.joke{color:var(--mute);font-size:15px}
.stars{display:flex;gap:10px;justify-content:center;font-size:58px;line-height:1}
.stars span{color:var(--c2)} .stars span.on{color:var(--a);animation:pop .55s ease both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.modal{position:fixed;z-index:9;inset:0;background:var(--bg);overflow-y:auto}
.modal>div{max-width:560px;margin:auto;padding:18px 16px 34px;display:flex;flex-direction:column;gap:14px}
.theory{touch-action:pan-y;min-height:380px}
#fx{position:fixed;z-index:10;inset:0;overflow:hidden;pointer-events:none}
#fx i{position:absolute;top:38%;left:50%;width:9px;height:13px;border-radius:3px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(620deg);opacity:0}}
.mist{display:flex;flex-direction:column;gap:4px;font-size:15px}
noscript div{max-width:420px;margin:30vh auto 0;padding:26px;border-radius:22px;background:#1B1B24;color:#F6F5F0;font:700 22px/1.4 sans-serif;text-align:center}
@media(min-width:700px){#app{padding-top:38px}#app.center{padding-top:24px}.opt:hover:not(:disabled){border-color:var(--a)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#fx{display:none}}

<script>

const TITLE='Практикум: изложение и сочинение';
const OWL='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 50 A30 30 0 0 1 80 50" fill="none" stroke="#FF6DB0" stroke-width="7" stroke-linecap="round"/><rect x="12" y="46" width="14" height="24" rx="6" fill="#FF6DB0"/><rect x="74" y="46" width="14" height="24" rx="6" fill="#FF6DB0"/><path d="M34 30 H66 V78 L50 96 L34 78 Z" fill="#D6FF3F"/><path d="M42 86 L50 96 L58 86 Z" fill="#0F0F14"/><rect x="34" y="24" width="32" height="10" rx="4" fill="#4CC9FF"/><circle cx="43" cy="52" r="6" fill="#0F0F14"/><circle cx="57" cy="52" r="6" fill="#0F0F14"/><circle cx="45" cy="50" r="2" fill="#F6F5F0"/><circle cx="59" cy="50" r="2" fill="#F6F5F0"/><path d="M43 64 Q50 70 57 64" stroke="#0F0F14" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';

const THEORY=[
{t:'Изложение: как на экзамене',b:['Текст звучит <b>2 раза</b>. Между прослушиваниями — <b>5–6 минут</b> на черновик, потом около 60 минут на само изложение.','Черновик раздели на части по микротемам: пиши ключевые слова и оставляй пропуски, чтобы дополнить их при втором прослушивании.','Объём — <b>не менее 70 слов</b>. Меньше — изложение не засчитывают, 0 баллов.','Пиши <b>от того же лица</b>, что и исходный текст. Черновик не проверяют — всё переносим на бланк ответов № 2.']},
{t:'Каким должно быть изложение',b:['<b>ИК1 — содержание:</b> все микротемы — 2 балла; одна упущена или добавлена — 1; больше одной — 0.','<b>ИК2 — сжатие:</b> во всём тексте — 2; в двух микротемах — 1; в одной или нигде — 0.','<b>ИК3 — логичность:</b> логических ошибок нет — 2; одна-две — 1; три и больше — 0.','Итого <b>6 баллов</b>. В экзаменационном тексте каждый абзац — своя микротема.']},
{t:'Приёмы сжатия',b:['<b>Исключение</b> — убираем подробности, повторы, вводные слова, лишние пояснения.','<b>Обобщение</b> — перечень конкретных фактов заменяем общим словом или фразой.','<b>Упрощение</b> — длинную конструкцию заменяем короткой, сложное предложение — простым.','Главная мысль каждой микротемы остаётся на месте.']},
{t:'Сочинение 13: структура',b:['Выполняешь <b>одно</b> задание из трёх: 13.1, 13.2 или 13.3. Тема каждого — вопрос к прочитанному тексту.','<b>Вступление</b> — ответ на вопрос темы (тезис).','<b>Два примера из текста</b> — номер предложения или цитата, и к каждому <b>пояснение</b>: что показывает пример и как он подтверждает тезис.','<b>Вывод</b> — общее рассуждение, без частных примеров; не противоречит тезису и не повторяет первый абзац слово в слово.']},
{t:'Баллы за сочинение · 2027',b:['<b>СК1</b> — ответ на вопрос: 0–1. <b>СК3</b> — логичность: 0–2. <b>СК4</b> — композиция из трёх частей: 0–1.','<b>СК2</b> — примеры и пояснения: 0–4. Два примера с пояснениями — 4; пояснение только к одному — 3; два без пояснений или один с пояснением — 2; один без пояснения — 1.','Итого <b>8 баллов</b>. Меньше 70 слов, пересказ без комментариев или ответ на другой вопрос — по СК1–СК4 ноль.','Грамотность (ГК1–ГК4, ФК1) проверяют, если изложение и сочинение вместе — 140 слов и больше.']}];

const R={ex:'Демоверсия и спецификация ОГЭ 2027: устройство экзамена и задания 1.',ik1:'ИК1: все микротемы — 2, одна упущена или добавлена — 1, больше — 0.',
ik2:'ИК2: сжатие во всём тексте — 2, в двух микротемах — 1, в одной или нигде — 0.',ik3:'ИК3: нет логических ошибок — 2, одна-две — 1, три и больше — 0.',
cp:'Приёмы сжатия: исключение, обобщение, упрощение.',sk:'Критерии СК1–СК4 демоверсии ОГЭ 2027.',st:'Структура: ответ на вопрос → пример 1 + пояснение → пример 2 + пояснение → вывод.',
gk:'Критерии ГК1–ГК4 и ФК1 демоверсии ОГЭ 2027: нормы применяют, если вместе 140 слов и больше.'};
const GRA='Текст изложения из демоверсии ОГЭ 2026 (по Д. А. Гранину), микротемы — из таблицы ФИПИ.';
const ALE='Текст из открытого банка заданий ОГЭ ФИПИ (по А. Г. Алексину).';

// k: c — варианты (первый верный), tf — верно/неверно, m — сообщение друга (первый вариант верный)
const LEVELS=[
{name:'Правила игры',sub:'Как устроены задания 1 и 13 в ОГЭ 2027',col:'#D6FF3F',next:'Разминка: сколько звучит текст, сколько слов нужно и где всё это писать.',q:[
{id:'a1',k:'c',q:'Сколько минут дают на ОГЭ, чтобы поработать с черновиком между первым и вторым прослушиванием?',o:['5–6 минут','1 минуту','15 минут'],why:'По спецификации ОГЭ 2027 на осмысление текста и работу с черновиком отводят 5–6 минут.',r:R.ex,j:'Пять минут — это почти целая песня. Успеешь дописать всё недописанное.'},
{id:'a2',k:'tf',c:'Изложение из 68 слов проверят как обычно, просто снимут балл за объём.',a:false,why:'Неверно: изложение меньше 70 слов не засчитывают и оценивают нулём баллов.',r:R.ex,j:'Два слова до порога — как два сантиметра до автобусной двери.'},
{id:'a3',k:'c',q:'Где пишут изложение и сочинение, чтобы их проверили?',o:['На бланке ответов № 2','На бланке ответов № 1','В черновике: его сдают вместе с работой'],why:'Задания 1 и 13 выполняют на бланке ответов № 2. Записи в черновике не учитываются при оценивании.',r:R.ex,j:'Черновик — это лаборатория. Шедевр живёт на бланке.'},
{id:'a4',k:'tf',c:'На ОГЭ по русскому языку разрешено пользоваться орфографическим словарём.',a:true,why:'Верно: в инструкции демоверсии 2027 сказано, что орфографическим словарём пользоваться можно.',r:R.ex,j:'Словарь — легальный суперпомощник. Главное — не читать его как роман.'},
{id:'a5',k:'c',q:'Сколько длится весь экзамен по русскому языку?',o:['3 часа 55 минут','3 часа','2 часа 30 минут'],why:'На всю работу отводится 3 часа 55 минут — 235 минут.',r:R.ex,j:'Почти четыре часа. Перекус в пенале — стратегическое решение.'},
{id:'a6',k:'m',q:'Как ответить другу?',m:'В тексте рассказчик говорит «я», а я перескажу всё от «он» — так солиднее.',o:['Не надо: изложение пишут от того же лица, что и исходный текст','Отличная идея, эксперты оценят','Можно, если в начале назвать автора'],why:'По инструкции к заданию 1 сжатое изложение пишут от того же лица, от которого ведётся повествование в исходном тексте.',r:R.ex,j:'Изложение — это тот же текст, только похудевший. Голос рассказчика остаётся прежним.'},
{id:'a7',k:'c',q:'Сколько примеров нужно привести в сочинении 13 и откуда их брать?',o:['Два, оба из прочитанного текста, к каждому — пояснение','Один из текста и один из жизни','Три любых, чем больше, тем лучше'],why:'В ОГЭ 2027 нужны два примера из прочитанного текста и пояснение к каждому. Примеры из жизни по СК2 не засчитывают.',r:R.sk,j:'Текст — твой единственный склад аргументов. Зато он всегда под рукой.'},
{id:'a8',k:'tf',c:'В 2027 году за сочинение по критериям СК1–СК4 можно получить максимум 8 баллов.',a:true,why:'Верно: СК1 — 1, СК2 — 4, СК3 — 2, СК4 — 1. В 2027 году СК2 вырос с 3 до 4 баллов.',r:R.sk,j:'Новый балл — за пояснения. Объяснять выгодно!'},
{id:'a9',k:'c',q:'Сколько первичных баллов максимум можно получить за весь ОГЭ по русскому в 2027 году?',o:['38','37','45'],why:'Максимум за всю работу — 38 первичных баллов (в 2026 году было 37).',r:R.ex,j:'38 — как размер кроссовок, которые бегут к пятёрке.'},
{id:'a10',k:'tf',c:'Сочинение, написанное без опоры на прочитанный текст, проверят по обычным критериям.',a:false,why:'Неверно: работа, написанная без опоры на прочитанный текст (не по данному тексту), не оценивается.',r:R.sk,j:'Сочинение «про всё на свете» эксперт отложит в сторону. Держись за текст.'}]},

{name:'Микротемы и сжатие',sub:'Текст Д. А. Гранина из демоверсии ОГЭ 2026',col:'#4CC9FF',next:'Работаем с настоящим текстом изложения: ищем микротемы и сжимаем без потерь.',q:[
{id:'b1',k:'c',q:'Какая микротема у этого абзаца?',s:'Кроме талантливых учителей, есть и другие – любимые учителя. Наверное, любимых учителей больше, чем талантливых. Наверное, можно заслужить любовь и не имея отпущенных природой педагогических способностей. Талантливым стать нельзя, а вот любимым стать можно.',o:['Есть учителя талантливые, есть любимые: талантливым стать нельзя, а любимым — можно','Любимые учителя лучше всех знают свой предмет','Любовь учеников заслуживают только талантливые учителя'],why:'Так микротема второго абзаца сформулирована в таблице ФИПИ. Второй и третий варианты противоречат тексту.',r:GRA,j:'Талант не выдают в магазине, а любовь можно заработать. Вот это поворот!'},
{id:'b2',k:'c',q:'Какая микротема у этого абзаца?',s:'Хороших книг о школе написано немало. Но мне интересно было бы исследовать одну линию в этой огромной теме: что остаётся от учителя, от класса в характере человека, кроме знаний. В сущности, у каждого взрослого есть свои впечатления, свои воспоминания о школе. Плохие или хорошие. Одни учителя помнятся, другие нет, одни товарищи из класса врезались в память, другие забылись. И не всегда это можно объяснить степенью дружбы. Нет, тут действуют иные, глубоко скрытые, очевидно, сложные причины.',o:['У каждого взрослого свои воспоминания о школе, а объяснить, почему одни люди помнятся, а другие нет, сложно','О школе написано очень мало хороших книг','Мы помним только тех одноклассников, с которыми дружили'],why:'Это микротема первого абзаца из таблицы ФИПИ. Про книги в тексте сказано обратное («написано немало»), а про дружбу — «не всегда это можно объяснить степенью дружбы».',r:GRA,j:'Память — тот ещё капризный архивариус.'},
{id:'b3',k:'c',q:'Сколько микротем в тексте Д. А. Гранина о любимых учителях (демоверсия 2026)?',o:['Три','Две','Пять'],why:'В таблице микротем ФИПИ к этому тексту три пункта — по одному на каждый абзац.',r:GRA+' '+R.ik1,j:'Три абзаца — три микротемы. Математика тоже иногда простая.'},
{id:'b4',k:'c',q:'Какой вариант сжимает предложение приёмом обобщения?',s:'Он блестяще ставил опыты, умел рассказать материал доходчиво, образно.',o:['Он был блестящим преподавателем.','Он ставил опыты.','Он блестяще ставил опыты и умел рассказать материал доходчиво и образно.'],why:'Обобщение заменяет перечень конкретных умений общим словом («блестящий преподаватель»). Второй вариант теряет часть смысла, третий — почти не сжат.',r:R.cp+' '+GRA,j:'Обобщение — как поставить все умения в одну красивую коробку.'},
{id:'b5',k:'c',q:'Из предложения «Наверное, любимых учителей больше, чем талантливых» убрали вводное слово «наверное». Какой это приём сжатия?',o:['Исключение','Обобщение','Упрощение'],why:'Убрать вводное слово, подробность или повтор — это исключение.',r:R.cp,j:'Минус одно слово — плюс одна секунда на проверку. Выгодный обмен.'},
{id:'b6',k:'c',q:'Какое сжатие третьего абзаца сохраняет его главную мысль?',o:['Физику мы полюбили благодаря молодой учительнице: она любила нас, не скрывала своих промахов и открыто переживала их.','Физику нам преподавал известный профессор, который блестяще ставил опыты.','Молодая учительница плохо знала физику, поэтому её любили.'],why:'Главная мысль абзаца по таблице ФИПИ: любовь к физике пришла благодаря молоденькой учительнице, которая любила учеников и не скрывала промахов. Профессор — деталь для контраста, а «поэтому её любили» искажает смысл.',r:GRA+' '+R.ik1,j:'Сжатие — не стрижка «под ноль». Главное оставляем.'},
{id:'b7',k:'m',q:'Как ответить другу?',m:'Второй абзац про любимых и талантливых учителей пропущу — он короткий, никто не заметит.',o:['Заметят: это целая микротема, по ИК1 будет 1 балл вместо 2','Правильно, короткие абзацы можно пропускать','Можно, если изложение будет длиннее 70 слов'],why:'Каждый абзац экзаменационного текста — микротема. Упущена одна микротема — по ИК1 ставят 1 балл.',r:R.ik1,j:'Эксперт знает текст наизусть. Прятки не сработают.'},
{id:'b8',k:'tf',c:'В изложении ровно 70 слов — его засчитают.',a:true,why:'Верно: нужно не менее 70 слов, значит, 70 — уже достаточно.',r:R.ex,j:'Ровно на пороге — но внутри. Хотя запас никогда не мешает.'},
{id:'b9',k:'c',q:'Первая и третья микротемы сжаты, а вторая переписана почти дословно. Сколько баллов по ИК2?',o:['1','2','0'],why:'Сжаты только две микротемы — по ИК2 ставят 1 балл. Два балла — только если сжатие есть во всём тексте.',r:R.ik2,j:'Две трети работы — две трети радости. Вернее, половина баллов.'},
{id:'b10',k:'c',q:'В изложении две логические ошибки. Сколько баллов по ИК3?',o:['1','0','2'],why:'ИК3: логических ошибок нет — 2 балла, одна-две — 1, три и больше — 0.',r:R.ik3,j:'Логика — как пазл: две детали не там, и картинка уже кривовата.'},
{id:'b11',k:'tf',c:'При подсчёте слов «всё-таки» — одно слово, а «всё же» — два.',a:true,why:'Верно: по правилам подсчёта ФИПИ словом считается любая последовательность букв без пробела.',r:R.ex,j:'Дефис — клей, пробел — ножницы.'}]},

{name:'Примеры и пояснения',sub:'Текст А. Г. Алексина из открытого банка ФИПИ',col:'#FF6DB0',next:'Собираем сочинение: подбираем примеры к теме и учимся их пояснять.',q:[
{id:'c1',k:'c',q:'Тема 13.1: «Какую роль в тексте играет тире?» Какое предложение подойдёт как пример?',o:['(4)Мои родители соблюдали строгую очерёдность: одно письмо – от отца, другое – от мамы.','(5)Порядок ни разу не нарушился.','(16)Мы сознавали, что нечётко делаем гимнастику.'],why:'Для темы о тире нужен пример с тире. В предложениях 5 и 16 тире нет.',r:ALE,j:'Ищешь тире — смотри на чёрточки, а не на гимнастику.'},
{id:'c2',k:'c',q:'Почему стоит тире в предложении «одно письмо – от отца, другое – от мамы»?',o:['Оно стоит на месте пропущенного сказуемого в неполном предложении','Оно стоит между подлежащим и сказуемым, выраженными существительными','Оно стоит перед обобщающим словом'],why:'В частях «одно письмо – от отца», «другое – от мамы» пропущено сказуемое (приходило). Тире обозначает этот пропуск.',r:ALE,j:'Тире здесь как пустой стул: все понимают, кто должен был на нём сидеть.'},
{id:'c3',k:'c',q:'Какую роль играет тире в предложении «(2)Я оставался с бабушкой – маминой мамой»?',o:['Отделяет приложение, которое поясняет слово «бабушкой»','Стоит на месте пропущенного сказуемого','Оформляет реплику в диалоге'],why:'«Маминой мамой» — приложение в конце предложения, оно уточняет, какая это бабушка. Перед таким приложением можно поставить тире.',r:ALE,j:'Бабушка с пояснением — сразу ясно, чья она.'},
{id:'c4',k:'c',q:'Какой фрагмент сочинения на тему о тире — пример с пояснением?',o:['В предложении 4 тире стоит на месте пропущенного сказуемого: так автор избегает повтора и подчёркивает строгий порядок писем.','Например, в тексте есть предложение 4.','В тексте тире встречается очень часто.'],why:'Пример с пояснением — это ссылка на предложение плюс объяснение, что он показывает. Во втором варианте пояснения нет, в третьем нет и самого примера.',r:R.st+' '+R.sk,j:'Номер предложения без пояснения — как ответ без решения.'},
{id:'c5',k:'c',q:'В сочинении два примера из текста, но пояснение есть только к первому. Сколько баллов по СК2?',o:['3','4','2'],why:'СК2: два примера, пояснение только к одному — 3 балла. Четыре — когда пояснён каждый пример.',r:R.sk,j:'Один балл потерян из-за одной фразы. Обидно, но поправимо.'},
{id:'c6',k:'c',q:'Два примера из текста приведены, пояснений нет совсем. Сколько баллов по СК2?',o:['2','0','3'],why:'Два примера без пояснений — 2 балла по СК2 (столько же, сколько один пример с пояснением).',r:R.sk,j:'Примеры без пояснений — как фото без подписи: красиво, но непонятно.'},
{id:'c7',k:'m',q:'Как ответить другу?',m:'Для 13.3 второй пример возьму из жизни: у меня с бабушкой тоже есть свои секреты.',o:['Не засчитают: оба примера нужны из прочитанного текста','Отлично, личный пример ценится выше','Можно, если указать номер предложения'],why:'В ОГЭ 2027 во всех вариантах задания 13 нужны два примера из прочитанного текста. Пример из жизни по СК2 не засчитывают.',r:R.sk,j:'Бабушкины секреты оставь для семейного чата.'},
{id:'c8',k:'tf',c:'Пример из текста можно оформить цитатой, а можно указать номер предложения.',a:true,why:'Верно: в задании сказано, что можно использовать различные способы обращения к прочитанному тексту. Цитата и номер предложения — оба подходят.',r:R.st,j:'Цитата или номер — оба пропуска в клуб аргументов.'},
{id:'c9',k:'c',q:'Тема 13.2 — смысл финала: «По мнению родителей, мы с бабушкой поступали неразумно и были неправильными людьми, и это нас объединяло». Какой пример показывает, что рассказчик и бабушка вместе не следовали правилам родителей?',o:['(15)Но мы с бабушкой не желали обливаться ледяной водой и вставать по воскресеньям ещё раньше, чем в будни, чтобы идти на лыжах или в поход.','(1)В командировки мама и отец ездили очень часто: они вместе проектировали заводы, которые строились где-то очень далеко от нашего города.','(6)В конце письма неизменно стояла дата, а чуть пониже было написано: «8 часов утра».'],why:'В предложении 15 рассказчик и бабушка вместе отказываются от правил закаливания. Предложения 1 и 6 — о родителях, а не о том, что объединяло бабушку и внука.',r:ALE,j:'Ледяная вода против дружной команды — команда побеждает.'},
{id:'c10',k:'c',q:'Какое пояснение к примеру из предложения 15 подойдёт для темы 13.2?',o:['Рассказчик и бабушка вместе нарушают строгие правила родителей — это их и сближает.','В предложении 15 есть однородные сказуемые.','Родители рассказчика очень любили лыжи.'],why:'Пояснение связывает пример с темой: показывает, что «неправильность» объединяла героев. Второй вариант — разбор грамматики, третий не про тему.',r:R.st,j:'Пояснение — мостик от примера к тезису. Без мостика — вплавь.'},
{id:'c11',k:'tf',c:'Если сочинение написано на другой вопрос, чем в задании, по СК1–СК4 ставят 0.',a:true,why:'Верно: по критериям 2027 года сочинение на основе вопроса, отличного от вопроса в задании, оценивается нулём баллов по СК1–СК4.',r:R.sk,j:'Отвечать нужно на тот вопрос, который задали. Даже если свой нравится больше.'}]},

{name:'Ловушки эксперта',sub:'Босс: баллы, объём и подвохи заданий 1 и 13',col:'#FFA347',next:'Финальный босс. Тут собраны хитрые ситуации, где легко потерять баллы.',q:[
{id:'d1',k:'c',q:'Изложение — 72 слова, сочинение — 66 слов. Что будет с сочинением по СК1–СК4?',o:['0 баллов: в сочинении меньше 70 слов','Проверят как обычно: вместе больше 138 слов','Снимут только 1 балл'],why:'Сочинение меньше 70 слов по СК1–СК4 оценивается нулём. Общий объём здесь не спасает.',r:R.sk,j:'Четыре слова — и столько баллов. Самые дорогие слова в жизни.'},
{id:'d2',k:'c',q:'Изложение — 70 слов, сочинение — 70 слов. Как оценят грамотность (ГК1–ГК4, ФК1)?',o:['По обычной шкале: вместе 140 слов','Нулём: нужно хотя бы 150 слов','Только половину баллов'],why:'Нормы ГК1–ГК4 и ФК1 применяют, если изложение и сочинение вместе — 140 слов или больше.',r:R.gk,j:'140 — ровно на границе. Повезло, но лучше с запасом.'},
{id:'d3',k:'tf',c:'Если изложение и сочинение вместе — 139 слов, по ГК1–ГК4 и ФК1 ставят 0.',a:true,why:'Верно: при 139 словах и меньше по ГК1–ГК4 и ФК1 ставят ноль.',r:R.gk,j:'Одного слова не хватило до тринадцати баллов. Слово «очень» могло спасти.'},
{id:'d4',k:'c',q:'В сочинении есть вступление и два примера с пояснениями, а заключения нет. Какой критерий пострадает?',o:['СК4 — композиция','СК1 — ответ на вопрос','ГК1 — орфография'],why:'Без заключения нарушена трёхчастная композиция — по СК4 ставят 0.',r:R.sk+' '+R.st,j:'Сочинение без вывода — как сериал без последней серии.'},
{id:'d5',k:'m',q:'Как ответить другу?',m:'В 13.1 начну с высказывания известного лингвиста — без него сочинение не засчитают.',o:['Не нужно: в 2027 году тема 13.1 — вопрос к тексту, высказывания лингвиста в ней нет','Верно, без цитаты будет 0','Можно заменить цитату пословицей'],why:'Во всех трёх вариантах задания 13 в 2027 году тема — вопрос, на который нужно ответить по прочитанному тексту.',r:R.sk,j:'Лингвисты отдыхают. Работают вопрос и текст.'},
{id:'d6',k:'c',q:'Максимум за изложение по ИК1–ИК3 и максимум за сочинение по СК1–СК4 — это…',o:['6 и 8','6 и 7','8 и 8'],why:'ИК1–ИК3 — по 2 балла, всего 6. СК1–СК4 — 1 + 4 + 2 + 1 = 8.',r:R.ik1+' '+R.sk,j:'6 + 8 = 14 баллов за два текста. Почти половина экзамена!'},
{id:'d7',k:'tf',c:'Изложение, переписанное почти дословно, получит максимум по ИК2, если в нём есть все микротемы.',a:false,why:'Неверно: ИК2 оценивает сжатие. Если приёмы сжатия не использованы, по ИК2 ставят 0, даже когда все микротемы на месте.',r:R.ik2,j:'Ксерокс — хорошая машина, но не для изложения.'},
{id:'d8',k:'c',q:'Сколько раз звучит текст изложения на ОГЭ и сколько примерно длится одно прослушивание?',o:['2 раза по 3–4 минуты','1 раз, около 10 минут','3 раза по 2 минуты'],why:'По спецификации ОГЭ 2027 текст включают дважды, каждое прослушивание — 3–4 минуты.',r:R.ex,j:'Два раза по три минуты — короче, чем реклама перед видео.'},
{id:'d9',k:'m',q:'Как ответить другу?',m:'Сочинение-рассуждение — это пересказ текста своими словами, комментарии не нужны.',o:['Нет: пересказ без комментариев оценивают нулём баллов','Да, главное — пересказать подробно','Да, если пересказ длиннее 70 слов'],why:'Пересказ исходного текста без собственных комментариев по критериям ОГЭ получает ноль: нужен ответ на вопрос, примеры с пояснениями и вывод.',r:R.sk,j:'Пересказ — это эхо. А эксперт ждёт твой голос.'},
{id:'d10',k:'c',q:'В сочинении есть ответ на вопрос, один пример из текста с пояснением и вывод. Сколько баллов по СК2?',o:['2','1','4'],why:'Один пример из текста с пояснением — 2 балла по СК2. За второй пример с пояснением добавились бы ещё 2.',r:R.sk,j:'Второй пример — самые лёгкие два балла на экзамене.'},
{id:'d11',k:'c',q:'В изложении упущены две микротемы из трёх. Сколько баллов по ИК1?',o:['0','1','2'],why:'ИК1: упущено больше одной микротемы — 0 баллов.',r:R.ik1,j:'Из трёх микротем осталась одна. Даже у Грифеля грустный вид.'}]}];


const A=document.getElementById('app'),L=document.getElementById('layer'),FX=document.getElementById('fx');
const BYID={};LEVELS.forEach(l=>l.q.forEach(q=>BYID[q.id]=q));
const MAX=LEVELS.reduce((n,l)=>n+l.q.length*10,0);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mark=s=>s.replace(/(^|[^а-яёА-ЯЁ])\^([А-ЯЁ])/g,'$1<em>$2</em>').replace(/([а-яё])([АЕЁИОУЫЭЮЯ])/g,'$1<em>$2</em>');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const caps=s=>esc(s).replace(/([А-ЯЁ]{3,})/g,'<b>$1</b>');
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c);
const accent=c=>document.documentElement.style.setProperty('--a',c);

function fresh(){return{screen:'start',th:0,lv:0,queue:[],pos:0,second:false,wrong:[],marks:[],right:0,pts:0,streak:0,best:0,stars:[],firsts:[],miss:[],pend:null,order:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.screen&&Array.isArray(s.queue)&&s.queue.every(i=>BYID[i]))return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function go(screen){S.screen=screen;save();draw();window.scrollTo(0,0)}

function draw(){L.innerHTML='';A.className='';A.style.paddingBottom='';({start,theory,intro,play,retry,result,final}[S.screen]||start)()}

function start(){accent('#D6FF3F');A.className='center';
A.innerHTML=`<p class="mute">ОГЭ 2027 · русский язык · задания 1 и 13</p><div class="hero">${OWL}<h1>Практикум: изложение и&nbsp;сочинение</h1></div>
<p>Задания 1 и 13 ОГЭ: ловим микротемы, сжимаем без потерь, подбираем примеры и пояснения по критериям 2027 года. Карандаш Грифель в наушниках слушает каждый ответ, а в конце ждёт босс — ловушки эксперта.</p>
<div class="tiles" aria-hidden="true">${['1','13','70+','2×','8'].map((c,i)=>`<div class="tile" style="animation-delay:${i*.18}s">${c}</div>`).join('')}</div>
<div class="chips"><span class="chip on">4 уровня</span><span class="chip">1 босс</span><span class="chip">0 таймеров</span></div>
<button class="btn" id="begin">Поехали</button><p class="mute">Ответы сохраняются на этом устройстве. Можно сделать паузу и вернуться.</p>`;
A.querySelector('#begin').onclick=()=>{S.th=0;go('theory')}}

function theory(){accent(LEVELS[Math.min(S.th>>1,3)].col);const t=THEORY[S.th];
A.innerHTML=`<div class="top"><h3>Вспомним · ${S.th+1}/${THEORY.length}</h3><button class="chip" style="border:0;min-height:44px" id="skip">Пропустить</button></div>
<div class="seg">${THEORY.map((_,i)=>`<i class="${i<=S.th?'ok':''}"></i>`).join('')}</div>
<section class="card theory" id="swipe"><h2>${t.t}</h2>${t.b.map(b=>`<p class="in">${b}</p>`).join('')}</section>
<button class="btn" id="next">Дальше</button>${S.th?'<button class="btn second" id="back">Назад</button>':''}`;
const next=()=>{if(S.th<THEORY.length-1){S.th++;go('theory')}else go('intro')},back=()=>{if(S.th){S.th--;go('theory')}};
A.querySelector('#next').onclick=next;A.querySelector('#skip').onclick=()=>go('intro');
if(S.th)A.querySelector('#back').onclick=back;
const w=A.querySelector('#swipe');let x=null,y=null;
w.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
w.addEventListener('touchend',e=>{if(x===null)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;x=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)(dx<0?next:back)()})}

function intro(){const l=LEVELS[S.lv],n=l.q.length;accent(l.col);A.className='center';
A.innerHTML=`<p class="mute">Уровень ${S.lv+1} из 4${S.lv===3?' · босс':''}</p><h1 style="color:var(--a)">${l.name}</h1><p>${l.next}</p>
<div class="card"><b>${l.sub}</b><p class="mute">${n} ${plural(n,'задание','задания','заданий')}. Ошибки вернутся во втором заходе.</p></div><button class="btn" id="go">Играть</button>`;
A.querySelector('#go').onclick=()=>{Object.assign(S,{queue:shuffle(l.q.map(q=>q.id)),pos:0,second:false,wrong:[],marks:[],right:0,pend:null,order:{}});go('play')}}

function play(){const l=LEVELS[S.lv],id=S.queue[S.pos],q=BYID[id],P=S.pend;accent(l.col);
if((q.k==='c'||q.k==='m')&&!S.order[id]){S.order[id]=shuffle(q.o.map((_,i)=>i));save()}
let body='';
if(q.s)body+=`<p class="in text">${esc(q.s)}</p>`;
if(q.list)body+=`<ol class="words small">${q.list.map((t,i)=>`<li>${i+1}) ${caps(t)}</li>`).join('')}</ol>`;
if(q.m)body+=`<div class="bubble"><div class="from">Сообщение друга</div>${esc(q.m)}</div>`;
if(q.c)body+=`<p class="claim">${esc(q.c)}</p>`;
if(q.err)body+=`<div class="errs">${q.err.map(e=>`<div>${esc(e)}</div>`).join('')}</div>`;
if(q.w)body+=`<ol class="words${q.n==='seq'?' small':''}">${q.w.map((w,i)=>`<li>${i+1}) ${q.stress?mark(w):caps(w)}</li>`).join('')}</ol>`;
let act;
{const list=q.k==='tf'?[['true','Верно'],['false','Неверно']]:S.order[id].map(i=>[String(i),q.o[i]]);
const right=q.k==='tf'?String(q.a):'0';
act=`<div class="opts">${list.map(([v,t])=>`<button class="opt ${P?(v===right?'good':v===P.v?'bad':''):''}" data-v="${v}" ${P?'disabled':''}>${esc(t)}</button>`).join('')}</div>`}
A.innerHTML=`<header class="top"><h3>${l.name}</h3><span class="score" aria-label="Очки">★ ${S.pts}</span><button class="help" id="help" aria-label="Шпаргалка">?</button></header>
<div class="seg">${S.queue.map((_,i)=>`<i class="${i<S.marks.length?(S.marks[i]?'ok':'no'):i===S.pos?'now':''}"></i>`).join('')}</div>
<div class="row mute"><span>${S.second?'Второй заход · ':''}${S.pos+1} из ${S.queue.length}</span><span>${S.streak>=2?'Серия: '+S.streak:''}</span></div>
<section class="card"><p><b>${esc(q.q||'Верно или неверно?')}</b></p>${body}</section>${act}`;
A.querySelector('#help').onclick=cheat;
if(P){sheet(q,P);return}
A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;check(q,v,q.k==='tf'?v===String(q.a):v==='0')})}

function check(q,v,ok){if(S.pend)return;
if(ok){S.streak++;S.best=Math.max(S.best,S.streak);S.pts+=S.second?5:10;if(!S.second)S.right++}
else{S.streak=0;if(!S.second){S.wrong.push(q.id);S.miss.push(q.id)}}
S.marks.push(ok);S.pend={v,ok};save();play();
if(ok){confetti();try{if(navigator.vibrate)navigator.vibrate(35)}catch(e){}}}

function sheet(q,P){
L.innerHTML=`<aside class="sheet" id="sheet" role="status"><h2>${P.ok?'Верно!':'Почти!'}</h2>${P.ok&&S.streak>=3?`<b>Серия: ${S.streak} подряд</b>`:''}<p>${q.why}</p><p class="mute">${q.r}</p><p class="joke">${P.ok?q.j:'Грифель записал это в черновик: задание вернётся во втором заходе.'}</p><button class="btn" id="go-on">Дальше</button></aside>`;
A.style.paddingBottom=(L.firstElementChild.offsetHeight+20)+'px';
L.querySelector('#go-on').onclick=advance}

function advance(){S.pend=null;S.pos++;
if(S.pos<S.queue.length)return go('play');
if(!S.second&&S.wrong.length)return go('retry');
endLevel()}

function retry(){accent(LEVELS[S.lv].col);A.className='center';const n=S.wrong.length;
A.innerHTML=`<h1 style="color:var(--a)">Второй заход</h1><p>${plural(n,'Возвращается','Возвращаются','Возвращаются')} ${n} ${plural(n,'задание','задания','заданий')}. Теперь ловушка знакома, а за верный ответ дают 5 очков.</p><button class="btn" id="again">Исправить</button>`;
A.querySelector('#again').onclick=()=>{Object.assign(S,{queue:shuffle(S.wrong),pos:0,second:true,marks:[],order:{}});go('play')}}

function endLevel(){const p=S.right/LEVELS[S.lv].q.length;S.stars[S.lv]=p>=.9?3:p>=.6?2:1;S.firsts[S.lv]=S.right;go('result')}

function result(){const l=LEVELS[S.lv],n=S.stars[S.lv],next=LEVELS[S.lv+1];accent(l.col);A.className='center';
A.innerHTML=`<p class="mute">Уровень ${S.lv+1} позади</p><h1>${l.name}</h1><div class="stars" aria-label="Звёзды: ${n} из 3">${[0,1,2].map(i=>`<span class="${i<n?'on':''}" style="animation-delay:${i*.15}s">★</span>`).join('')}</div>
<p class="in">С первого раза: <b>${S.firsts[S.lv]} из ${l.q.length}</b><br>Очки: <b>${S.pts}</b></p>
${next?`<div class="card"><span class="mute">Дальше</span><h2>${next.name}</h2><p>${next.next}</p></div>`:'<div class="card"><h2>Босс повержен</h2><p>Осталось посмотреть итог.</p></div>'}<button class="btn" id="on">${next?'К следующему уровню':'К результату'}</button>`;
A.querySelector('#on').onclick=()=>{if(next){S.lv++;go('intro')}else go('final')}}

const plain=s=>s.replace(/<[^>]+>/g,'');
const brief=q=>q.c||q.m||(q.k==='c'?q.q+(q.s?' «'+q.s.slice(0,60)+'…»':''):'')||(q.s?q.s.slice(0,90)+(q.s.length>90?'…':''):q.list?q.list.map((w,i)=>`${i+1}) ${w}`).join(' ').slice(0,110)+'…':q.w?q.w.map((w,i)=>`${i+1}) ${w}`).join(', '):q.o[0]);
function report(){const all=LEVELS.reduce((n,l)=>n+l.q.length,0),ok=S.firsts.reduce((a,b)=>a+(b||0),0);
return ['Результат тренажёра «'+TITLE+'» (ОГЭ 2027)',
`Очки: ${S.pts} из ${MAX}`,`Звёзды: ${S.stars.reduce((a,b)=>a+(b||0),0)} из 12`,`С первого раза: ${ok} из ${all}`,
...LEVELS.map((l,i)=>`${i+1}. ${l.name}: ${S.firsts[i]||0} из ${l.q.length}, звёзд ${S.stars[i]||0}`),
`Лучшая серия: ${S.best}`,S.miss.length?'Ошибки первого захода:':'Ошибок нет.',
...S.miss.map(id=>'• '+brief(BYID[id])+' → '+plain(BYID[id].why))].join('\n')}

function final(){accent('#D6FF3F');const st=S.stars.reduce((a,b)=>a+(b||0),0);
A.innerHTML=`<p class="mute">${TITLE} · ОГЭ 2027</p><div class="hero">${OWL}<h1>Практикум пройден!</h1></div>
<p>Микротемы, сжатие, примеры с пояснениями — всё по критериям 2027 года. Осталось отправить результат: Грифель уже снял наушники и ждёт.</p>
<div class="row"><div class="card" style="flex:1"><span class="mute">Очки</span><h2>${S.pts} / ${MAX}</h2></div><div class="card" style="flex:1"><span class="mute">Звёзды</span><h2>★ ${st} / 12</h2></div></div>
<button class="btn" id="send">Отправить результат учителю</button><div id="copy"></div>
<button class="btn second" id="restart">Пройти ещё раз</button>
<section class="card"><h3>${S.miss.length?'Над чем поработать':'Ни одной ошибки с первого раза'}</h3>${S.miss.map(id=>{const q=BYID[id];return `<div class="in mist"><span class="mute">${esc(brief(q))}</span><b>${q.why}</b><span>${q.r}</span></div>`}).join('')}</section>`;
A.querySelector('#send').onclick=async()=>{const t=report(),box=A.querySelector('#copy');let ok=false;
try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
if(ok){box.innerHTML='<p class="in" role="status">Скопировано. Вставь текст в чат с учителем.</p>';return}
box.innerHTML='<p class="mute">Скопируй этот текст и отправь учителю:</p><textarea id="manual" readonly></textarea>';
const a=box.querySelector('#manual');a.value=t;a.focus();a.select()};
A.querySelector('#restart').onclick=()=>{S=fresh();go('intro')}}

function cheat(){if(L.querySelector('.modal'))return;const d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');
d.innerHTML=`<div><div class="top"><h3>Шпаргалка</h3><button class="help" id="close" aria-label="Закрыть">×</button></div>${THEORY.map(t=>`<section class="card"><h3>${t.t}</h3>${t.b.map(b=>`<p>${b}</p>`).join('')}</section>`).join('')}<button class="btn" id="close2">Вернуться к заданию</button></div>`;
L.appendChild(d);d.querySelectorAll('#close,#close2').forEach(b=>b.onclick=()=>d.remove())}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const C=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347'];
for(let i=0;i<34;i++){const p=document.createElement('i');p.style.background=C[i%4];p.style.setProperty('--x',(Math.random()*340-170)+'px');p.style.setProperty('--y',(Math.random()*460-250)+'px');FX.appendChild(p);setTimeout(()=>p.remove(),1150)}}

draw();
</script></body></html>
