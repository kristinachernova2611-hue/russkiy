:root{--bg:#0F0F14;--card:#1B1B24;--card2:#272732;--tx:#F6F5F0;--mut:#A9A8B3;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--orange:#FFA347;--acc:#D6FF3F;--ok:#D6FF3F;--bad:#FF6DB0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Onest',system-ui,sans-serif;font-size:17px;line-height:1.45;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){body{align-items:center;padding:24px 0}#app{min-height:760px;max-height:900px;background:#14141B;border-radius:32px;box-shadow:0 30px 80px #0008;padding:22px}}
h1,h2,h3,.uh{font-family:'Unbounded','Onest',sans-serif;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{display:block;width:100%;min-height:56px;border-radius:18px;background:var(--acc);color:#0F0F14;font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;padding:14px 18px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn[disabled]{opacity:.35;pointer-events:none}
.screen{display:none;flex:1;flex-direction:column;animation:in .35s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
/* start */
.tiles{position:relative;height:200px;margin:8px 0 10px}
.tile{position:absolute;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:'Unbounded';font-weight:800;font-size:28px;color:#0F0F14;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-14px) rotate(calc(var(--r) * -1))}}
.start-title{font-size:clamp(30px,9vw,40px)}
.start-title span{color:var(--lime)}
.sub{color:var(--mut);font-size:15px;margin:10px 0 16px}
.grow{flex:1}
.stack{display:grid;gap:10px;margin-top:18px}
/* theory */
.th-wrap{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
.th-track{display:flex;height:100%;transition:transform .35s ease}
.th{min-width:100%;padding:4px 2px;display:flex;flex-direction:column}
.th .card{background:var(--card);border-radius:24px;padding:20px;flex:1}
.th h2{font-size:22px;margin-bottom:10px;color:var(--lime)}
.th ul{padding-left:18px;margin:10px 0}.th li{margin:8px 0}
.th .foot{background:var(--card2);border-radius:16px;padding:12px 14px;font-size:15px;margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--card2);transition:.2s}.dots i.on{width:24px;background:var(--lime)}
.row{display:flex;gap:10px}.row .btn{flex:1}
/* game */
.top{display:flex;align-items:center;gap:10px}
.lvl{flex:1;min-width:0}
.lvl small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lvl b{font-family:'Unbounded';font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:700;white-space:nowrap}
.score em{font-style:normal;color:var(--acc)}
.help{width:44px;height:44px;border-radius:14px;background:var(--card2);font-family:'Unbounded';font-weight:800;font-size:18px;flex:none}
.bar{display:flex;gap:4px;margin:14px 0 6px}
.bar i{flex:1;height:7px;border-radius:9px;background:var(--card2)}
.bar i.ok{background:var(--acc)}.bar i.bad{background:#FF6DB0aa}.bar i.cur{background:#ffffff66}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px;min-height:20px}
.streak{color:var(--orange);font-weight:700}
.qcard{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px}
.qtype{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:8px}
.q{font-size:19px;font-weight:500}
.gap{display:inline-block;min-width:1.4em;text-align:center;border-bottom:3px solid var(--acc);color:var(--acc)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border-radius:18px;background:var(--card2);padding:12px 16px;font-size:18px;font-weight:600;text-align:left;border:2px solid transparent;transition:.15s;overflow-wrap:anywhere}
.opts.two .opt{text-align:center;font-family:'Unbounded';font-size:24px}
.opt.sel{border-color:var(--acc)}
.opt.right{background:#D6FF3F;color:#0F0F14}
.opt.wrong{background:#FF6DB0;color:#0F0F14}
.opt.small{font-size:15px;font-weight:500;line-height:1.35;display:flex;gap:10px}
.opt.small .n{font-family:'Unbounded';font-weight:800;flex:none}
.msg{background:var(--card2);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:18px;line-height:1.7}
.from{font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.w{background:#ffffff14;border-radius:10px;padding:3px 7px;border:2px dashed #ffffff40;font-weight:600}
.w.sel{border-style:solid;border-color:var(--acc)}.w.right{background:#D6FF3F;color:#0F0F14;border-color:transparent}.w.wrong{background:#FF6DB0;color:#0F0F14;border-color:transparent}
.text7{font-size:16.5px;line-height:1.75;background:var(--card2);border-radius:18px;padding:14px}
.text7 .n{color:var(--acc);font-weight:700;font-size:14px}
.digs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.dig{height:52px;border-radius:14px;background:var(--card2);font-family:'Unbounded';font-weight:800;font-size:18px;border:2px solid transparent}
.dig.sel{background:var(--acc);color:#0F0F14}
.dig.right{background:#D6FF3F;color:#0F0F14}.dig.wrong{background:#FF6DB0;color:#0F0F14}.dig.miss{border-color:#D6FF3F}
.hint{color:var(--mut);font-size:14px;margin-top:8px}
.actions{margin-top:auto;padding-top:12px}
/* sheet */
.veil{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));z-index:30;max-height:85vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-size:24px;margin-bottom:8px}
.sheet .rule{background:var(--card2);border-radius:16px;padding:12px 14px;margin:10px 0}
.sheet .joke{color:var(--mut);font-style:italic;margin:6px 0 14px}
.sheet.good h3{color:var(--lime)}.sheet.badr h3{color:var(--pink)}
.cheat h3{color:var(--blue)}.cheat ul{padding-left:18px;margin:6px 0}.cheat li{margin:6px 0;font-size:15px}
/* level/final */
.big{font-size:clamp(28px,8vw,36px)}
.stars{display:flex;gap:10px;justify-content:center;margin:22px 0}
.star{font-size:56px;line-height:1;color:var(--card2);transform:scale(.6);transition:.4s}
.star.on{color:var(--acc);transform:scale(1)}
.panel{background:var(--card);border-radius:24px;padding:18px;margin-top:12px}
.panel h3{font-size:16px;margin-bottom:6px}
.mist{border-top:1px solid #ffffff14;padding:10px 0;font-size:15px}
.mist:first-child{border-top:0}
.mist b{color:var(--pink)}
.lvrow{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
textarea{width:100%;min-height:160px;background:var(--card2);color:var(--tx);border:0;border-radius:14px;padding:12px;font:inherit;font-size:14px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-120px);background:var(--lime);color:#0F0F14;font-weight:700;border-radius:999px;padding:10px 18px;transition:.3s;z-index:50;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.nojs{padding:40px 20px;text-align:center;font-size:20px}
.nojs b{color:#D6FF3F}
</style>
</head>

        'Окончание <b>безударное</b> → ставим инфинитив: на <b>-ить</b> — II спр., все остальные — I спр.',
        'I спр.: -у/-ю, -ешь, -ет, -ем, -ете, -ут/-ют. II спр.: -у/-ю, -ишь, -ит, -им, -ите, -ат/-ят.']},
 {t:'Исключения', h:'Их надо просто выучить:',
  list:['<b>II спряжение:</b> гнать, дышать, держать, обидеть, слышать, видеть, ненавидеть, зависеть, терпеть, смотреть, вертеть.',
        '<b>I спряжение:</b> брить, стелить, зиждиться, зыбиться.',
        'Приставки и -ся спряжение не меняют: задержать, выгнать — тоже II.']},
 {t:'Суффиксы причастий', h:'Причастия настоящего времени — по спряжению:',
  list:['I спр.: действительные <b>-ущ-/-ющ-</b>, страдательные <b>-ем-/-ом-</b>.',
        'II спр.: действительные <b>-ащ-/-ящ-</b>, страдательные <b>-им-</b>.',
        'Лайфхак: поставь глагол в форму «они …» и посмотри на гласную: они тают → тающий.']},
 {t:'Смотрим на инфинитив', h:'Пишется та же гласная, что в инфинитиве перед -ть:',
  list:['перед <b>-л-</b> в прошедшем времени: таять → таял;',
        'перед <b>-вш-</b> в причастиях и <b>-в/-вши</b> в деепричастиях: обидеть → обидевший, обидев;',
        'перед <b>НН</b>: -ать/-ять → -анн-/-янн- (потерять → потерянный); -ить/-еть → -енн- (построить → построенный).']},
 {t:'Бонус: -ыва- или -ова-?', h:'Поставь глагол в 1 лицо ед. ч.: «я …»',
  list:['<b>-ываю/-иваю</b> → пишем -ыва-/-ива-: я выкраиваю → выкраивать.',
        '<b>-ую/-юю</b> → пишем -ова-/-ева-: я рисую → рисовать.'], foot:'Всё! Теперь — в бой. Шпаргалка всегда под кнопкой «?».'}
];

</script>
<script>
(function(){
'use strict';
var KEY='trener_okonch-glag-suff-prich_v1';
var TITLE='Окончания глаголов и суффиксы причастий';
var $=function(id){return document.getElementById(id)};
function store(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function strip(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent}
var TASK={};LEVELS.forEach(function(L){L.tasks.forEach(function(t){TASK[t.id]=t})});

var S=null; // state
function fresh(shuf){
  return {lv:0, phase:'intro', queue:LEVELS[0].tasks.map(function(t){return t.id}), pos:0, retry:false,
    score:0, streak:0, best:0, res:{}, retryRes:{}, order:{}, shuffled:!!shuf, done:false, levelStars:[]};
}
function save(){store(KEY,S)}

// ---------- screens
function show(id){Array.prototype.forEach.call(document.querySelectorAll('.screen'),function(s){s.classList.toggle('on',s.id===id)});window.scrollTo(0,0)}
function accent(){var L=LEVELS[S?S.lv:0];document.documentElement.style.setProperty('--acc',L?L.accent:'#D6FF3F')}

// ---------- start
var tilesEl=$('tiles'),TL=[['Е','#D6FF3F',8,20,-8],['И','#4CC9FF',30,95,6],['-ащ-','#FF6DB0',56,18,-5],['Я','#FFA347',76,105,9],['Ю','#F6F5F0',44,120,-4],['НН','#D6FF3F',82,8,5]];
TL.forEach(function(t,i){var d=document.createElement('div');d.className='tile';d.textContent=t[0];d.style.background=t[1];d.style.left=t[2]+'%';d.style.top=t[3]+'px';d.style.setProperty('--r',t[4]+'deg');d.style.animationDelay=(i*.4)+'s';if(t[0].length>2){d.style.width='92px';d.style.fontSize='20px'}tilesEl.appendChild(d)});
var saved=store(KEY);
if(saved&&!saved.done&&(saved.pos>0||saved.lv>0||saved.phase==='game')){ $('b-cont').style.display='block'; }
$('b-go').onclick=function(){S=fresh(false);save();th=0;renderTheory();show('s-theory')};
$('b-cont').onclick=function(){S=saved;accent();if(S.phase==='game')renderTask();else levelIntro()};

// ---------- theory
var th=0;
function renderTheory(){
  var tr=$('th-track');tr.innerHTML='';$('th-dots').innerHTML='';
  THEORY.forEach(function(p,i){
    var el=document.createElement('div');el.className='th';
    el.innerHTML='<div class="card"><h2>'+p.t+'</h2><div>'+p.h+'</div><ul>'+p.list.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+(p.foot?'<div class="foot">'+p.foot+'</div>':'')+'</div>';
    tr.appendChild(el);$('th-dots').appendChild(document.createElement('i'));
  });
  thGo(0);
}
function thGo(i){th=Math.max(0,Math.min(THEORY.length-1,i));$('th-track').style.transform='translateX('+(-100*th)+'%)';
  Array.prototype.forEach.call($('th-dots').children,function(d,k){d.classList.toggle('on',k===th)});
  $('th-prev').disabled=th===0;$('th-next').textContent=th===THEORY.length-1?'К заданиям!':'Дальше'}
$('th-next').onclick=function(){if(th===THEORY.length-1)levelIntro();else thGo(th+1)};
$('th-prev').onclick=function(){thGo(th-1)};
$('b-skip').onclick=function(){levelIntro()};
(function(){var x0=null,w=$('th-wrap');w.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
 w.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)thGo(th+(dx<0?1:-1));x0=null},{passive:true})})();

// ---------- level intro / between
function starsFor(lv){var L=LEVELS[lv];var n=L.tasks.length,ok=0;L.tasks.forEach(function(t){if(S.res[t.id]===true)ok++});var r=ok/n;return r>=.9?3:r>=.6?2:1}
function levelIntro(){
  accent();S.phase='intro';save();
  var L=LEVELS[S.lv],h='';
  if(S.lv>0){var st=starsFor(S.lv-1),P=LEVELS[S.lv-1];
    h+='<div style="text-align:center"><div class="chip" style="display:inline-block">'+P.short+' пройден</div><h1 class="big" style="margin-top:14px">'+['Неплохо!','Хорошо!','Огонь!'][st-1]+'</h1>'+
    '<div class="stars">'+[1,2,3].map(function(k){return '<span class="star'+(k<=st?' on':'')+'" style="color:'+(k<=st?P.accent:'')+'">★</span>'}).join('')+'</div></div>';}
  h+='<div class="panel" style="border:2px solid '+L.accent+'"><div class="qtype" style="color:'+L.accent+'">Дальше: '+L.short+'</div><h2 style="font-size:24px">'+L.name+'</h2><p class="sub" style="margin-bottom:0">'+L.promo+'</p><p class="hint">'+L.tasks.length+' заданий · ошибки вернутся во «Втором заходе»</p></div>';
  $('lv-body').innerHTML=h;$('lv-go').textContent=S.lv===3?'На босса!':'Погнали!';show('s-level');
}
$('lv-go').onclick=function(){
  var L=LEVELS[S.lv];
  if(S.phase!=='game'){S.queue=(S.shuffled?shuffle(L.tasks):L.tasks).map(function(t){return t.id});S.pos=0;S.retry=false}
  S.phase='game';save();renderTask();
};

// ---------- game
function bar(){
  var L=LEVELS[S.lv],h='';
  L.tasks.forEach(function(t,i){var r=S.res[t.id];var c=r===true?'ok':r===false?(S.retryRes[t.id]===true?'ok':'bad'):'';if(!c&&S.queue[S.pos]===t.id)c='cur';h+='<i class="'+c+'"></i>'});
  $('g-bar').innerHTML=h;
}
var cur=null,sel=null,locked=false;
function renderTask(){
  accent();show('s-game');
  var L=LEVELS[S.lv];
  if(S.pos>=S.queue.length){
    var wrong=L.tasks.filter(function(t){return S.res[t.id]===false&&S.retryRes[t.id]===undefined}).map(function(t){return t.id});
    if(!S.retry&&wrong.length){S.retry=true;S.queue=wrong;S.pos=0;save();toast('Второй заход: ошибки возвращаются 💪')}
    else return finishLevel();
  }
  cur=TASK[S.queue[S.pos]];sel=cur.type==='multi'||cur.type==='digits'?[]:null;locked=false;
  $('g-short').textContent=L.short+(S.retry?' · второй заход':'');$('g-name').textContent=L.name;$('g-score').textContent=S.score;
  $('g-pos').textContent=(S.retry?'Повтор ':'Задание ')+(S.pos+1)+' из '+S.queue.length;
  $('g-streak').textContent=S.streak>=2?'🔥 серия: '+S.streak:'';
  bar();
  var t=cur,h='<div class="qcard">';
  var lbl={choice:'Выбери ответ',tf:'Верно или неверно?',friend:'Найди ошибку в сообщении',multi:'Задание 6 ОГЭ',digits:'Задание 7 ОГЭ'}[t.type];
  h+='<div class="qtype">'+lbl+'</div>';
  if(t.type==='friend'){
    h+='<div class="from">'+esc(t.from)+' пишет в чат:</div><div class="msg">'+t.msg.map(function(p,i){return typeof p==='string'?esc(p):'<span class="w" data-w="'+t.msg.filter(function(x,k){return k<i&&typeof x!=='string'}).length+'">'+esc(p.w)+'</span>'}).join('')+'</div><p class="hint">Тапни слово с ошибкой.</p>';
  } else if(t.type==='digits'){
    h+='<div class="q" style="font-size:16px">'+t.q+'</div>';
  } else h+='<div class="q">'+t.q+'</div>';
  h+='</div>';
  if(t.type==='choice'){
    var order=S.order[t.id];if(!order){order=t.opts.map(function(_,i){return i});if(S.shuffled&&t.opts.length>2)order=shuffle(order);S.order[t.id]=order}
    var two=t.opts.every(function(o){return o.length<=2});
    h+='<div class="opts'+(two?' two':'')+'">'+order.map(function(i){return '<button class="opt" data-i="'+i+'">'+esc(t.opts[i])+'</button>'}).join('')+'</div>';
  } else if(t.type==='tf'){
    h+='<div class="opts two"><button class="opt" data-i="1" style="font-size:18px">Верно</button><button class="opt" data-i="0" style="font-size:18px">Неверно</button></div>';
  } else if(t.type==='multi'){
    h+='<div class="opts">'+t.opts.map(function(o,i){return '<button class="opt small" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span>'+o+'</span></button>'}).join('')+'</div><p class="hint">Отметь все верные варианты.</p>';
  } else if(t.type==='digits'){
    h+='<div class="text7" id="t7">'+t.text.replace(/\((\d)\)/g,function(m,d){return '<span class="n" data-g="'+d+'">('+d+')</span>'})+'</div>';
    h+='<div class="digs">'+[1,2,3,4,5,6,7,8,9].map(function(d){return '<button class="dig" data-i="'+d+'">'+d+'</button>'}).join('')+'</div>';
  }
  if(t.type==='multi'||t.type==='digits')h+='<div class="actions"><button class="btn" id="b-check" disabled>Проверить</button></div>';
  $('g-task').innerHTML=h;
  Array.prototype.forEach.call($('g-task').querySelectorAll('.opt,.dig,.w'),function(b){b.onclick=function(){pick(b)}});
  if($('b-check'))$('b-check').onclick=check;
  save();
}
function pick(b){
  if(locked)return;var t=cur;
  if(t.type==='multi'||t.type==='digits'){var i=+b.dataset.i;var k=sel.indexOf(i);if(k<0)sel.push(i);else sel.splice(k,1);b.classList.toggle('sel');$('b-check').disabled=sel.length===0;return}
  if(t.type==='friend'){answer(+b.dataset.w===t.a,b);return}
  if(t.type==='tf'){answer((b.dataset.i==='1')===t.a,b);return}
  answer(+b.dataset.i===t.a,b);
}
function check(){
  var t=cur,want=t.type==='multi'?t.a.map(function(x){return x}):t.a;
  var got=t.type==='multi'?sel.slice():sel.slice();
  var a=want.slice().sort().join(','),g=got.slice().sort().join(',');
  answer(a===g,null);
}
function answer(ok,btn){
  locked=true;var t=cur;
  // marks
  if(t.type==='choice'||t.type==='tf'){Array.prototype.forEach.call($('g-task').querySelectorAll('.opt'),function(o){var isA=t.type==='tf'?((o.dataset.i==='1')===t.a):(+o.dataset.i===t.a);if(isA)o.classList.add('right');else if(o===btn)o.classList.add('wrong')})}
  if(t.type==='friend'){Array.prototype.forEach.call($('g-task').querySelectorAll('.w'),function(o){if(+o.dataset.w===t.a){o.classList.add('right');o.textContent=t.fix}else if(o===btn)o.classList.add('wrong')})}
  if(t.type==='multi'){Array.prototype.forEach.call($('g-task').querySelectorAll('.opt'),function(o){var i=+o.dataset.i,isA=t.a.indexOf(i)>=0;o.classList.remove('sel');if(isA)o.classList.add('right');else if(sel.indexOf(i)>=0)o.classList.add('wrong')})}
  if(t.type==='digits'){Array.prototype.forEach.call($('g-task').querySelectorAll('.dig'),function(o){var i=+o.dataset.i,isA=t.a.indexOf(i)>=0,s=sel.indexOf(i)>=0;o.classList.remove('sel');if(isA&&s)o.classList.add('right');else if(isA)o.classList.add('miss');else if(s)o.classList.add('wrong')});
    Array.prototype.forEach.call($('t7').querySelectorAll('.n'),function(n){var g=+n.dataset.g;n.textContent=t.letters[g-1];n.style.fontSize='16.5px';if(t.a.indexOf(g)>=0){n.style.background='#D6FF3F';n.style.color='#0F0F14';n.style.borderRadius='6px';n.style.padding='0 3px'}})}
  if($('b-check'))$('b-check').style.display='none';
  var gain=0;
  if(S.retry){S.retryRes[t.id]=ok;if(ok)gain=5}
  else{S.res[t.id]=ok;if(ok)gain=10}
  if(ok){S.streak++;if(S.streak>S.best)S.best=S.streak;if(S.streak>=3)gain+=2;S.score+=gain;confetti();vib(35)}else{S.streak=0;vib([60,40,60])}
  $('g-score').textContent=S.score;bar();
  S.pos++;save();
  var ans='';
  if(t.type==='multi'||t.type==='digits')ans='<div><b>Ответ: '+t.a.map(function(x){return t.type==='multi'?x+1:x}).join('')+'</b></div>';
  var head=ok?(['Верно!','В точку!','Именно!','Есть!'][Math.floor(Math.random()*4)]):'Почти!';
  sheet((ok?'good':'badr'),'<h3>'+head+(ok&&S.streak>=3?' 🔥×'+S.streak:'')+'</h3>'+(ok?'<div>+'+gain+' ★</div>':(S.retry?'<div>Ничего, запомним разбор.</div>':'<div>Это задание вернётся во «Втором заходе».</div>'))+ans+'<div class="rule">'+t.rule+'</div><div class="joke">'+t.joke+'</div><button class="btn" id="b-next">Дальше</button>',false);
  $('b-next').onclick=function(){closeSheet();renderTask()};
}
function finishLevel(){
  S.levelStars[S.lv]=starsFor(S.lv);
  if(S.lv<LEVELS.length-1){S.lv++;S.phase='intro';S.pos=0;S.retry=false;save();levelIntro()}
  else{S.done=true;save();final()}
}

// ---------- final
function resultText(){
  var lines=['Тренажёр «'+TITLE+'»','Результат: '+S.score+' ★, лучшая серия: '+S.best];
  LEVELS.forEach(function(L,i){var n=L.tasks.length,ok=L.tasks.filter(function(t){return S.res[t.id]===true}).length;lines.push(L.short+' «'+L.name+'»: '+ok+'/'+n+' с первой попытки, '+(S.levelStars[i]||starsFor(i))+'★')});
  var m=mistakes();lines.push(m.length?'Ошибки с первой попытки:':'Ошибок с первой попытки нет!');
  m.forEach(function(t){lines.push('— '+label(t).slice(0,90)+(S.retryRes[t.id]?' (во втором заходе — верно)':''))});
  return lines.join('\n');
}
function label(t){if(t.type==='friend')return 'Сообщение в чате ('+t.from+'): верно «'+t.fix+'»';if(t.type==='multi')return 'Задание 6 ОГЭ ('+strip(t.opts[0]).split(' — ')[0]+' и др.)';if(t.type==='digits')return 'Задание 7 ОГЭ (буква '+t.letter+')';return strip(t.q)}
function mistakes(){var a=[];LEVELS.forEach(function(L){L.tasks.forEach(function(t){if(S.res[t.id]===false)a.push(t)})});return a}
function final(){
  accent();document.documentElement.style.setProperty('--acc','#D6FF3F');
  var total=0;LEVELS.forEach(function(L,i){total+=S.levelStars[i]||starsFor(i)});var st=Math.max(1,Math.round(total/LEVELS.length));
  $('f-sub').textContent='Твой счёт: '+S.score+' ★ · лучшая серия: '+S.best+'. '+['Есть над чем поработать — шпаргалка в помощь!','Хороший результат, почти идеально!','Мастер окончаний и суффиксов!'][st-1];
  $('f-stars').innerHTML=[1,2,3].map(function(k){return '<span class="star'+(k<=st?' on':'')+'">★</span>'}).join('');
  $('f-levels').innerHTML='<h3>Уровни</h3>'+LEVELS.map(function(L,i){var n=L.tasks.length,ok=L.tasks.filter(function(t){return S.res[t.id]===true}).length;return '<div class="lvrow"><span>'+L.short+': '+L.name+'</span><b style="color:'+L.accent+'">'+ok+'/'+n+'</b></div>'}).join('');
  var m=mistakes();
  $('f-mist').innerHTML='<h3>Ошибки и правила</h3>'+(m.length?m.map(function(t){return '<div class="mist"><b>✗</b> '+esc(label(t).slice(0,120))+'<div class="hint">'+t.rule+'</div></div>'}).join(''):'<div class="hint">Ни одной ошибки с первой попытки. Легенда!</div>');
  show('s-final');confetti();setTimeout(confetti,500);
}
$('b-send').onclick=function(){
  var txt=resultText();
  function manual(){sheet('cheat','<h3>Скопируй текст</h3><p class="hint">Выдели всё и скопируй, затем отправь учителю.</p><textarea id="ta" readonly>'+esc(txt)+'</textarea><div style="height:12px"></div><button class="btn" id="b-close">Готово</button>',true);$('b-close').onclick=closeSheet;var ta=$('ta');ta.focus();ta.select()}
  function fallback(){try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);if(ok){toast('Скопировано! Вставь в чат с учителем');return}}catch(e){}manual()}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){toast('Скопировано! Вставь в чат с учителем')},fallback)}else fallback()}catch(e){fallback()}
};
$('b-again').onclick=function(){S=fresh(true);S.order={};save();levelIntro()};

// ---------- sheet, cheat, toast, confetti
function sheet(cls,html,closable){var sh=$('sheet');sh.className='sheet '+cls;sh.innerHTML=html;requestAnimationFrame(function(){sh.classList.add('on');$('veil').classList.add('on')});$('veil').onclick=closable?closeSheet:null}
function closeSheet(){$('sheet').classList.remove('on');$('veil').classList.remove('on')}
$('b-help').onclick=function(){
  sheet('cheat','<h3>Шпаргалка</h3><ul>'+
  '<li><b>Ударное окончание</b> → по нему: Е, У, Ю — I спр.; И, А, Я — II спр. («Целую, милая»).</li>'+
  '<li><b>Безударное</b> → инфинитив: на -ить — II спр., остальные — I спр.</li>'+
  '<li><b>Исключения II:</b> гнать, дышать, держать, обидеть, слышать, видеть, ненавидеть, зависеть, терпеть, смотреть, вертеть. <b>I:</b> брить, стелить, зиждиться, зыбиться.</li>'+
  '<li><b>Причастия наст. вр.:</b> I — -ущ-/-ющ-, -ем-/-ом-; II — -ащ-/-ящ-, -им-.</li>'+
  '<li><b>Перед -л-, -вш-, -в/-вши</b> — гласная инфинитива.</li>'+
  '<li><b>Перед НН:</b> -ать/-ять → -анн-/-янн-; -ить/-еть → -енн-.</li>'+
  '<li><b>-ыва-/-ива-</b>, если «я …ываю/…иваю»; <b>-ова-/-ева-</b>, если «я …ую/…юю».</li></ul><button class="btn" id="b-close">Понятно</button>',true);
  $('b-close').onclick=closeSheet;
};
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
var cv=$('cf'),cx=cv.getContext('2d'),parts=[],raf=null;
function confetti(){
  cv.width=innerWidth;cv.height=innerHeight;var cols=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347','#F6F5F0'];
  for(var i=0;i<70;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,s:Math.random()*7+4,c:cols[i%5],r:Math.random()*6,life:90});
  if(!raf)loop();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(p){return p.life>0&&p.y<cv.height+20});
  parts.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.15;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):null;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

show('s-start');
})();
</script>
