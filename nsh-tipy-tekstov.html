:root{
  --bg:#FFF6E6; --bg2:#FFE9C7; --card:#FFFFFF; --ink:#3B2A1A; --soft:#7A6250;
  --orange:#FF8A1F; --orangeD:#D96A00; --blue:#2EA8F0; --blueD:#1A84C4;
  --green:#34C26A; --greenD:#22964F; --yellow:#FFC83A; --yellowD:#D9A100;
  --pink:#FF6FA8; --pinkD:#D94882; --red:#FF7A6B; --redD:#D9503F;
  --shadow:0 6px 18px rgba(120,70,20,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 15% 0%,#FFF1D6 0,transparent 45%),radial-gradient(circle at 100% 100%,#FFE3EE 0,transparent 40%),var(--bg);
  color:var(--ink);font-family:'NunitoK','Nunito','Segoe UI',Roboto,Arial,sans-serif;font-weight:700;overflow:hidden}
#app{max-width:600px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:10px 18px;
  border:0;border-radius:22px;font-size:24px;font-weight:900;color:#fff;line-height:1.15;
  background:var(--c,var(--orange));box-shadow:0 6px 0 var(--cd,var(--orangeD)),0 10px 18px rgba(0,0,0,.12);
  transition:transform .08s, box-shadow .08s, filter .2s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd,var(--orangeD)),0 4px 8px rgba(0,0,0,.12)}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.b-orange{--c:var(--orange);--cd:var(--orangeD)} .b-blue{--c:var(--blue);--cd:var(--blueD)}
.b-green{--c:var(--green);--cd:var(--greenD)} .b-yellow{--c:var(--yellow);--cd:var(--yellowD);color:#5A3A00}
.b-pink{--c:var(--pink);--cd:var(--pinkD)} .b-white{--c:#fff;--cd:#E8D7C2;color:var(--ink)}
.btn.ok{--c:var(--green);--cd:var(--greenD);color:#fff;animation:bounce .5s}
.btn.bad{--c:var(--red);--cd:var(--redD);color:#fff;animation:shake .4s}
.btn.dim{filter:grayscale(.6) opacity(.55)}
.btn[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.kris{display:block;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(120,60,0,.18))}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* start */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.title{font-size:clamp(34px,9vw,46px);font-weight:1000;line-height:1.05;margin:0;color:var(--orangeD)}
.subtitle{font-size:26px;margin:0;color:var(--ink)}
.bubble{position:relative;background:var(--card);border-radius:24px;padding:14px 18px;font-size:26px;line-height:1.25;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px;width:100%}
.tag{display:inline-block;background:var(--yellow);color:#5A3A00;border-radius:999px;padding:4px 14px;font-size:18px;font-weight:900}

/* rule */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rhead h2{margin:0;font-size:28px;font-weight:1000;color:var(--orangeD);line-height:1.1}
.rule{background:var(--card);border-radius:24px;padding:12px 16px;box-shadow:var(--shadow);border-left:10px solid var(--rc);margin-bottom:12px}
.rule .rt{font-size:26px;font-weight:900;line-height:1.2}
.rule .rt b{color:var(--rc)}
.rule .ex{font-size:24px;line-height:1.3;margin-top:6px;color:var(--soft)}
.hl-o{background:#FFE0BF;color:#B65400;border-radius:8px;padding:0 4px}
.hl-p{background:#D4EEFF;color:#0F6CA6;border-radius:8px;padding:0 4px}
.part{display:flex;align-items:center;gap:10px;font-size:24px;line-height:1.25;margin-top:8px}
.part i{flex:none;font-style:normal;min-width:96px;text-align:center;border-radius:12px;padding:3px 8px;font-size:19px;font-weight:900;color:#fff;background:var(--pc)}

/* task */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chip{flex:none;border-radius:999px;padding:6px 12px;font-size:18px;font-weight:900;background:var(--card);box-shadow:var(--shadow);white-space:nowrap}
.chip.lv{background:var(--blue);color:#fff}
.chip.lv.super{background:linear-gradient(90deg,var(--pink),var(--orange));}
.bar{flex:1;height:14px;border-radius:99px;background:#F3DFC4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .4s}
.stars.bump{animation:bounce .5s}
.qrow{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}
.qrow .kris{width:66px;height:96px;flex:none}
.q{flex:1;background:var(--card);border-radius:22px 22px 22px 6px;padding:10px 14px;font-size:26px;font-weight:900;line-height:1.2;box-shadow:var(--shadow)}
.q small{display:block;font-size:22px;font-weight:700;color:var(--soft);margin-top:2px}
.passage{background:#FFFDF8;border:3px dashed #F2CFA0;border-radius:22px;padding:12px 16px;font-size:26px;line-height:1.35;margin-bottom:10px}
.gap{display:inline-block;min-width:78px;border-bottom:4px solid var(--orange);color:var(--orange);text-align:center;font-weight:900}
.answers{margin-top:auto;display:grid;gap:12px;padding-bottom:4px}
.answers.two{grid-template-columns:1fr 1fr}
.emo{font-size:28px;line-height:1}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.slot{min-height:56px;border-radius:18px;border:3px dashed #EBC896;display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:24px;line-height:1.2;color:#C9A57A;background:#FFFDF8}
.slot.filled{border:3px solid var(--blue);color:var(--ink);background:#EAF6FF;cursor:pointer}
.slot b{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#EBC896;color:#fff;font-size:20px}
.slot.filled b{background:var(--blue)}
.slot.okk{border-color:var(--green);background:#E5F8EC}.slot.okk b{background:var(--green)}
.slot.badd{border-color:var(--red);background:#FFECE9}.slot.badd b{background:var(--red)}
.btn.small{font-size:24px;min-height:64px}
.btn.ord{justify-content:flex-start;text-align:left;padding:10px 14px}
.btn.ord .tx{flex:1}
.num{flex:none;width:42px;height:42px;border-radius:50%;border:3px dashed rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:1000}
.b-yellow .num{border-color:rgba(90,58,0,.5)}
.btn.picked .num{border:0;background:#fff;color:var(--ink);animation:starpop .35s ease}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.sheet-in{pointer-events:auto;width:100%;max-width:600px;background:var(--card);border-radius:30px 30px 0 0;padding:14px 16px max(14px,env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(120,70,20,.22);animation:up .35s cubic-bezier(.2,1.3,.4,1);border-top:8px solid var(--fc)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb .kris{width:92px;height:130px;flex:none}
.fb h3{margin:0 0 4px;font-size:30px;font-weight:1000;color:var(--fc);line-height:1.1}
.fb p{margin:0;font-size:22px;line-height:1.3}
.fb p b{color:var(--greenD)}
.plus{display:inline-block;font-size:26px;font-weight:1000;color:var(--yellowD);animation:starpop .7s ease}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
.shade{position:fixed;inset:0;background:rgba(60,30,0,.18);z-index:25}

/* level end / final */
.starrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:34px;max-width:420px}
.starrow span{animation:starpop .6s ease backwards}
.big{font-size:30px;font-weight:1000;margin:0;line-height:1.2}
.note{font-size:20px;color:var(--soft);margin:0}
.manual{width:100%;min-height:120px;font-family:inherit;font-size:18px;border-radius:16px;border:3px solid var(--blue);padding:10px}
.toast{font-size:20px;font-weight:900;color:var(--greenD)}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-24px;width:11px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
.nojs{margin:40px 16px;padding:24px;background:#fff;border-radius:24px;font-size:26px;text-align:center;box-shadow:var(--shadow)}

@media (min-width:700px){ .q,.passage{font-size:28px} .btn{font-size:26px} }
@media (max-height:640px){ .qrow .kris{width:52px;height:76px} .passage{padding:8px 12px} .answers{gap:10px} .fb .kris{width:70px;height:100px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

var BYID={};TASKS.forEach(function(t){BYID[t.id]=t});

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gaps(s){return esc(s).replace(/___/g,'<span class="gap">?</span>')}
function plural(n,a,b,c){var m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<10||h>=20))return b;return c}
function stars(n){return n+' '+plural(n,'звезда','звезды','звёзд')}
function load(){try{var s=localStorage.getItem(KEY);if(!s)return null;var o=JSON.parse(s);return (o&&o.v===1&&o.queues)?o:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function newState(){var q=[[],[],[]];TASKS.forEach(function(t){q[t.lv].push(t.id)});
  return {v:1,phase:'rule1',lv:0,queues:q.map(shuffle),pos:0,stars:0,lvStars:[0,0,0],wrong:[],retried:[]}}
function kris(name,cls){return '<img class="kris '+(cls||'')+'" src="'+IMG[name]+'" alt="Лисёнок Крис">'}
function show(html){app.innerHTML='<div class="screen">'+html+'</div>';}
function on(sel,fn){var els=app.querySelectorAll(sel);for(var i=0;i<els.length;i++)els[i].addEventListener('click',fn)}

function confetti(n){
  var box=document.createElement('div');box.className='confetti';
  for(var i=0;i<(n||40);i++){var p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=pick(COLORS);
    p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');
    p.style.animationDuration=(1.2+Math.random()*1.2)+'s';p.style.animationDelay=(Math.random()*.35)+'s';
    if(Math.random()<.3)p.style.borderRadius='50%';box.appendChild(p)}
  document.body.appendChild(box);setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box)},3000)}

function header(){
  var q=S.queues[S.lv], pct=Math.round(S.pos/q.length*100);
  return '<div class="top"><span class="chip lv'+(S.lv===2?' super':'')+'">'+(S.lv===2?'⚡ Супер':LEVELS[S.lv])+'</span>'+
    '<div class="bar" aria-label="Прогресс"><i style="width:'+pct+'%"></i></div>'+
    '<span class="chip stars" id="stars">⭐ '+S.stars+'</span></div>';
}
function screenTask(){
  var t=BYID[S.queues[S.lv][S.pos]];busy=false;
  var q,sub='',body='',ans='',cls='';
  if(t.type==='kind'){q='Какой это текст?';body='<div class="passage">'+gaps(t.text)+'</div>';
    ans=KINDS.map(function(k){return '<button class="btn '+k.c+'" data-a="'+k.k+'"><span class="emo">'+k.e+'</span>'+k.t+'</button>'}).join('');}
  else if(t.type==='tf'){q='Верно или нет?';body='<div class="passage">'+gaps(t.text)+'</div>';cls=' two';
    ans='<button class="btn b-green" data-a="1">👍 Верно</button><button class="btn b-pink" data-a="0">👎 Нет</button>';}
  else if(t.type==='choice'){q=t.q;sub=t.sub||'';if(t.text)body='<div class="passage">'+gaps(t.text)+'</div>';
    var ord=shuffle(t.opts.map(function(_,i){return i})), col=t.odd?['b-blue','b-yellow','b-pink','b-orange']:['b-blue','b-yellow','b-pink'];
    if(t.odd)cls=' two';
    ans=ord.map(function(i,n){return '<button class="btn '+col[n%col.length]+(t.opts[i].length>14?' small':'')+'" data-a="'+i+'">'+esc(t.opts[i])+'</button>'}).join('');}
  else if(t.type==='order'){q=t.q;sub=t.sub||'';
    var o;do{o=shuffle(t.parts.map(function(_,i){return i}))}while(o.join()===t.parts.map(function(_,i){return i}).join());
    var oc=['b-blue','b-yellow','b-pink'];
    ans=o.map(function(i,n){return '<button class="btn ord '+oc[n]+'" data-p="'+i+'"><span class="num"></span><span class="tx">'+esc(t.parts[i])+'</span></button>'}).join('')+
      '<button class="btn b-green" id="check" style="display:none">✔ Проверить</button>';}
  show(header()+'<div class="qrow">'+kris('think')+'<div class="q">'+esc(q)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div></div>'+body+
    '<div class="answers'+cls+'">'+ans+'</div>');
  if(t.type==='order')bindOrder(t);
  else on('[data-a]',function(){answer(t,this)});
}
function bindOrder(t){
  var chosen=[];
  var bs=app.querySelectorAll('[data-p]');
  function draw(){
    for(var j=0;j<bs.length;j++){var p=+bs[j].getAttribute('data-p'),k=chosen.indexOf(p);
      bs[j].querySelector('.num').textContent=k>=0?String(k+1):'';bs[j].classList.toggle('picked',k>=0)}
    app.querySelector('#check').style.display=chosen.length===t.parts.length?'':'none';
  }
  /* нажатие ставит номер; повторное нажатие убирает номер (и все после него) */
  on('[data-p]',function(){if(busy)return;var p=+this.getAttribute('data-p'),k=chosen.indexOf(p);
    if(k<0)chosen.push(p);else chosen.splice(k);draw()});
  on('#check',function(){if(busy)return;busy=true;
    var ok=chosen.every(function(c,i){return c===i});
    for(var i=0;i<bs.length;i++){var p=+bs[i].getAttribute('data-p');bs[i].disabled=true;bs[i].classList.add(chosen.indexOf(p)===p?'ok':'bad')}
    this.disabled=true;this.style.display='none';
    finish(t,ok,t.parts.map(function(p,i){return (i+1)+') '+p}).join('<br>'));
  });
}
function answer(t,btn){
  if(busy)return;busy=true;
  var a=btn.getAttribute('data-a'),ok,right,rightSel;
  if(t.type==='kind'){ok=a===t.ans;right=KNAME[t.ans];rightSel='[data-a="'+t.ans+'"]'}
  else if(t.type==='tf'){ok=(a==='1')===t.ans;right=t.ans?'верно':'неверно';rightSel='[data-a="'+(t.ans?1:0)+'"]'}
  else {ok=+a===t.ans;right=t.opts[t.ans];rightSel='[data-a="'+t.ans+'"]'}
  var all=app.querySelectorAll('[data-a]');
  for(var i=0;i<all.length;i++){all[i].disabled=true;if(all[i]!==btn)all[i].classList.add('dim')}
  btn.classList.add(ok?'ok':'bad');
  if(!ok){var r=app.querySelector(rightSel);if(r){r.classList.remove('dim');r.classList.add('ok')}}
  finish(t,ok,esc(right));
}
function finish(t,ok,rightHtml){
  var lvq=S.queues[S.lv], again=false;
  if(ok){S.stars++;S.lvStars[S.lv]++;}
  else{
    if(S.wrong.indexOf(t.id)<0)S.wrong.push(t.id);
    if(S.retried.indexOf(t.id)<0){S.retried.push(t.id);lvq.push(t.id);again=true}
  }
  S.pos++;save();
  var st=app.querySelector('#stars');
  if(ok&&st){st.textContent='⭐ '+S.stars;st.classList.remove('bump');void st.offsetWidth;st.classList.add('bump');confetti(45)}
  setTimeout(function(){sheet(ok,t,rightHtml,again)},ok?350:650);
}
function sheet(ok,t,rightHtml,again){
  var d=document.createElement('div');
  d.innerHTML='<div class="shade"></div><div class="sheet"><div class="sheet-in" style="--fc:'+(ok?'var(--greenD)':'var(--orangeD)')+'">'+
    '<div class="fb">'+kris(ok?pick(['happy','joy','praise']):'explain')+'<div>'+
    (ok?'<h3>'+pick(PRAISE)+'</h3><p><span class="plus">+1 ⭐</span></p>'
       :'<h3>Почти! Смотри…</h3><p>Ответ: <b>'+rightHtml+'</b></p><p>'+esc(t.why)+'</p>'+(again?'<p class="note">Это задание вернётся чуть позже 🙂</p>':''))+
    '</div></div><button class="btn '+(ok?'b-green':'b-orange')+'" id="go">Дальше →</button></div></div>';
  document.body.appendChild(d);
  var g=d.querySelector('#go');
  g.addEventListener('click',function(){d.parentNode.removeChild(d);next()});
}
function next(){ if(S.pos>=S.queues[S.lv].length){S.phase='levelEnd';save()} render() }
function starRow(n){var s='';for(var i=0;i<n;i++)s+='<span style="animation-delay:'+(i*.08)+'s">⭐</span>';return s||'<span>🌟</span>'}

  var n=S.lvStars[S.lv], last=S.lv===2;
  show('<div class="center">'+kris('praise','float" style="width:min(42vw,170px);height:min(28vh,250px)')+
   '<p class="big">'+(S.lv===0?'Уровень 1 пройден!':S.lv===1?'Уровень 2 пройден!':'Супер-уровень пройден!')+'</p>'+
   '<div class="starrow">'+starRow(n)+'</div>'+
   '<p class="subtitle">Всего у тебя: <b>⭐ '+S.stars+'</b></p>'+
   (S.lv===1?'<div class="bubble">Дальше — Супер-уровень!<br>Он чуть сложнее ⚡</div>':S.lv===0?'<div class="bubble">Дальше — слова-признаки<br>и слова-действия!</div>':'')+
   '<div class="stack"><button class="btn '+(last?'b-green':'b-orange')+'" id="nx" data-focus>'+(last?'К финалу 🎉':'Дальше →')+'</button></div></div>');
  confetti(30);
  on('#nx',function(){if(last){S.phase='final'}else{S.lv++;S.pos=0;S.phase='task'}save();render()});
}
function resultText(){
  var lines=['Тренажёр «Типы текстов» (3 класс, урок 2).','Звёзд: '+S.stars+' из '+TOTAL+'.'];
  if(S.wrong.length){lines.push('Ошибки ('+S.wrong.length+'): '+S.wrong.map(function(id){return BYID[id].label}).join('; ')+'.')}
  else lines.push('Ошибок нет — всё с первого раза!');
  return lines.join('\n');
}
function screenFinal(){
  show('<div class="center">'+kris('joy','float" style="width:min(46vw,190px);height:min(28vh,270px)')+
   '<h1 class="title">Ты молодец!</h1>'+
   '<p class="subtitle">У тебя <b>⭐ '+stars(S.stars)+'</b> из '+TOTAL+'!</p>'+

   '<div id="sendbox"></div>'+
   '<button class="btn b-orange" id="again">🔄 Играть ещё раз</button></div></div>');
  confetti(80);
  on('#send',function(){copyText(resultText())});

}
function copyText(txt){
  var box=app.querySelector('#sendbox');
  function done(){box.innerHTML='<p class="toast">✔ Скопировано! Вставь в сообщение учителю.</p>'}
  function manual(){box.innerHTML='<p class="note">Скопируй этот текст и отправь учителю:</p><textarea class="manual" readonly>'+esc(txt)+'</textarea>';
    var ta=box.querySelector('textarea');try{ta.focus();ta.select()}catch(e){}}
  function legacy(){try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);var ok=document.execCommand('copy');document.body.removeChild(ta);
      if(ok){done();showAlso()}else manual()}catch(e){manual()}}
  function showAlso(){box.innerHTML+='<textarea class="manual" readonly style="min-height:90px">'+esc(txt)+'</textarea>'}
  try{ if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){done();showAlso()},legacy)} else legacy() }catch(e){legacy()}
}
function render(){
  if(!S){screenStart();return}
  switch(S.phase){case 'rule1':screenRule1();break;case 'rule2':screenRule2();break;case 'task':
      if(S.pos>=S.queues[S.lv].length){S.phase='levelEnd';save();screenLevelEnd()}else screenTask();break;
    case 'levelEnd':screenLevelEnd();break;case 'final':screenFinal();break;default:screenStart()}
}
/* предпросмотр для проверки: #shot=<id>|rule1|rule2|end|final (без сохранения) */
var m=/#shot=([\w-]+)/.exec(location.hash);
if(m){save=function(){};S=newState();var v=m[1].split('-')[0],act=m[1].split('-')[1];
  if(BYID[v]){S.phase='task';S.lv=BYID[v].lv;S.queues[S.lv]=[v].concat(S.queues[S.lv].filter(function(x){return x!==v}));S.pos=0}
  else if(v==='end'){S.phase='levelEnd';S.lv=1;S.lvStars=[6,5,0];S.stars=11}
  else if(v==='final'){S.phase='final';S.lv=2;S.stars=16;S.wrong=['a5','c1']}
  else S.phase=v;
  render();
  if(act&&BYID[v]){var t0=BYID[v];
    if(t0.type==='order'){var pb=app.querySelectorAll('[data-p]'),seq=act==='ok'?[0,1,2]:[1,0,2];
      seq.forEach(function(i){for(var j=0;j<pb.length;j++)if(+pb[j].getAttribute('data-p')===i)pb[j].click()});app.querySelector('#check').click()}
    else{var want=t0.type==='kind'?t0.ans:t0.type==='tf'?(t0.ans?'1':'0'):String(t0.ans);
      var hit=[].slice.call(app.querySelectorAll('[data-a]')).filter(function(b){return (b.getAttribute('data-a')===want)===(act==='ok')})[0];hit.click()}}
} else render();
})();
</script>
</body>
</html>
