:root{
  --bg:#0F0F14; --card:#1B1B24; --card2:#272732; --txt:#F6F5F0; --sec:#B4B3BE;
  --lime:#D6FF3F; --blue:#4CC9FF; --pink:#FF6DB0; --orange:#FFA347;
  --acc:var(--lime); --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:"Onest",system-ui,sans-serif;font-size:17px;line-height:1.45;overflow-x:hidden}
h1,h2,h3,.uh{font-family:"Unbounded","Onest",sans-serif;font-weight:700;line-height:1.15;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;position:relative}
@media (min-width:700px){body{padding:28px 0}#app{min-height:min(880px,94vh);background:#14141B;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}}
.screen{flex:1;display:flex;flex-direction:column;padding:20px 18px 24px;gap:14px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 20px;border-radius:18px;background:var(--acc);color:#111;font-weight:800;font-size:18px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--txt);font-weight:600}
.btn.small{min-height:44px;font-size:15px;padding:10px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;background:var(--card2);font-weight:600;font-size:14px}
.muted{color:var(--sec)}
.small{font-size:14px}
input[type=text]{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:var(--txt);font:inherit;font-size:18px;padding:12px 14px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
/* start */
.tiles{position:relative;height:190px;margin:4px 0 2px}
.tile{position:absolute;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;animation:float 5s ease-in-out infinite}
.t1{background:var(--lime);width:96px;height:96px;left:4%;top:18px}
.t2{background:var(--blue);width:76px;height:76px;left:34%;top:84px;animation-delay:-1.2s;border-radius:50%}
.t3{background:var(--pink);width:88px;height:88px;left:58%;top:6px;animation-delay:-2.4s}
.t4{background:var(--orange);width:64px;height:64px;left:80%;top:104px;animation-delay:-3.3s;border-radius:50%}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.big{font-size:34px}
.big em{font-style:normal;color:var(--lime)}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.top .lvl{flex:1;font-family:"Unbounded";font-weight:700;font-size:15px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.help{width:44px;height:44px;border-radius:50%;background:var(--card2);font-weight:800;font-size:20px;flex:none}
.prog{display:flex;gap:4px;padding:6px 16px 4px}
.seg{flex:1;height:7px;border-radius:4px;background:var(--card2)}
.seg.ok{background:var(--acc)}.seg.bad{background:var(--pink)}.seg.cur{background:#5b5b6b}
.qwrap{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 16px 20px}
.qtype{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.qtext{font-size:20px;font-weight:600}
.quote{background:var(--card);border-left:4px solid var(--acc);border-radius:14px;padding:12px 14px;font-size:16px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{text-align:left;background:var(--card);border:2px solid var(--card2);border-radius:18px;padding:14px 16px;min-height:56px;font-size:17px;font-weight:500;transition:transform .1s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--acc)}
.opt.right{border-color:var(--lime);background:#232b12}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}

.sheet.on{transform:none}
.sheet h3{font-size:22px;margin-bottom:8px}
.sheet .ok{color:var(--lime)}.sheet .no{color:var(--orange)}
.joke{margin-top:10px;font-size:15px;color:var(--sec)}
.streak{display:inline-block;margin-left:8px;font-size:14px;font-weight:800;background:var(--card2);padding:4px 10px;border-radius:999px;vertical-align:middle}
/* theory */
.dots{display:flex;gap:6px;justify-content:center}
.dot{width:8px;height:8px;border-radius:4px;background:var(--card2)}.dot.on{width:22px;background:var(--acc)}
.th{flex:1;display:flex;flex-direction:column;gap:10px}
.th h2{font-size:24px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px}
.li .n{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--acc);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800}
.formula span{padding:8px 10px;border-radius:12px;color:#111}
/* stars */
.stars{font-size:54px;letter-spacing:6px;text-align:center}
.stars .off{opacity:.2}
.center{text-align:center}
/* essay */
textarea{width:100%;min-height:260px;border-radius:18px;border:2px solid var(--card2);background:var(--card);color:var(--txt);font:inherit;font-size:17px;padding:14px;resize:vertical;outline:none}
textarea:focus{border-color:var(--acc)}
.wc{font-weight:800;padding:8px 14px;border-radius:999px;color:#111;display:inline-block}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:var(--lime);margin-top:2px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#20202A;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px 26px}
.modal h3{font-size:20px;margin:0 0 10px}
.cs h4{font-family:"Unbounded";font-size:15px;margin:16px 0 8px;color:var(--lime)}
.cs p,.cs li{font-size:15px;margin:4px 0}
.cs ul{padding-left:18px;margin:4px 0}
.mist{background:var(--card);border-radius:14px;padding:12px;font-size:15px}
.mist b{color:var(--pink)}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--lime);color:#111;font-weight:800;padding:10px 16px;border-radius:14px;z-index:50;display:none;max-width:90vw;text-align:center}
.nojs{max-width:480px;margin:40px auto;padding:24px;background:#1B1B24;border-radius:20px;font-size:18px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function byId(id) { for (var i = 0; i < T.length; i++) if (T[i].id === id) return T[i]; return null; }
function levelTasks(l) { return T.filter(function (t) { return t.l === l; }).map(function (t) { return t.id; }); }
function buildOrders() {
  // shuffle option order for each task (except tf and order tasks keep option list, but order tasks shuffle display)
  S.order = {};
  T.forEach(function (t) { if (t.type !== "tf") S.order[t.id] = shuffle(t.o.map(function (_, i) { return i; })); });
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ===================== WORD COUNT (по правилам критериев ФИПИ) ===================== */
function countWords(text) {
  var toks = String(text).split(/\s+/);
  var n = 0;
  for (var i = 0; i < toks.length; i++) {
    var t = toks[i];
    if (!/[A-Za-zА-Яа-яЁё]/.test(t)) continue;               // цифры и знаки не считаются
    var core = t.replace(/[«»"“”„()\[\],;:!?…—–]/g, "");
    if (/^([A-ZА-ЯЁ]\.){1,2}$/.test(core) && i + 1 < toks.length && /^[«"(]?[A-ZА-ЯЁ]/.test(toks[i + 1])) continue; // инициалы + фамилия = одно слово
    n++;
  }
  return n;
}

function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2200); }
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
var cf = document.getElementById("cf"), cx = cf.getContext("2d"), parts = [], raf = null;
function confetti() {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  cf.width = innerWidth; cf.height = innerHeight;
  for (var i = 0; i < 70; i++) parts.push({x: innerWidth / 2, y: innerHeight * 0.65, vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 4, s: Math.random() * 7 + 4, c: ACC[i % 4], r: Math.random() * 6, life: 90});
  if (!raf) tick();
}
function tick() {
  cx.clearRect(0, 0, cf.width, cf.height);
  parts = parts.filter(function (p) { return p.life > 0; });
  parts.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.38; p.r += 0.2; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); cx.restore(); });
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cf.width, cf.height), null);
}

   '<div class="stars">' + starsHTML(Math.round(total / 4)) + '</div><p class="center"><b>★ ' + S.score + '</b> очков · звёзд ' + total + ' из 12 · лучшая серия ' + S.best + '</p>' +
   '<div class="card"><b>Слабые темы:</b> ' + (wt.length ? esc(wt.join(", ")) : "нет — всё с первого раза 💪") + '<br><b>«Пишу сам»:</b> ' + (S.essay.topic ? n + ' ' + plural(n, "слово", "слова", "слов") : "не выполнено") + '</div>' +
   (ms.length ? '<span class="qtype">Ошибки и правила</span>' + ms.map(function (t) { return '<div class="mist"><b>' + esc(t.rule) + '</b><br><span class="muted">' + esc(t.q) + '</span></div>'; }).join("") : '<p class="center muted">Ни одной ошибки с первого раза. Это уровень эксперта.</p>') +
   '<button class="btn" data-a="send">📤 Отправить результат учителю</button>' +
   (S.essay.topic ? '' : '<button class="btn ghost" data-a="toEssay">✍️ Вернуться к «Пишу сам»</button>') +
   '<button class="btn ghost" data-a="again">🔁 Пройти ещё раз</button></div>';
}
function copyText(txt) {
  return new Promise(function (res) {
    var fallback = function () {
      try { var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); var ok = document.execCommand("copy"); document.body.removeChild(ta); res(ok); } catch (e) { res(false); }
    };
    try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(function () { res(true); }, fallback); return; } } catch (e) {}
    fallback();
  });
}
function manualCopy(txt) {
  openModal('<h3>Скопируй результат вручную</h3><p class="small muted">Автоматически скопировать не вышло. Выдели текст ниже (долгое нажатие → «Выбрать всё» → «Копировать») и отправь учителю.</p><textarea id="mt" readonly style="min-height:300px">' + esc(txt) + '</textarea><button class="btn" data-a="closeModal" style="margin-top:12px">Закрыть</button>');
  var mt = document.getElementById("mt"); try { mt.focus(); mt.select(); } catch (e) {}
}

/* ===================== ACTIONS ===================== */
function act(a, el) {
  if (a === "go") {
    var v = (document.getElementById("nm").value || "").trim();
    if (!v) { toast("Напиши имя — оно нужно для результата"); document.getElementById("nm").focus(); return; }
    S.name = v; S.started = Date.now(); S.screen = "theory"; S.theory = 0; buildOrders(); save(); render(); return;
  }
  if (a === "thNext") { if (S.theory < THEORY.length - 1) { S.theory++; save(); render(); } else act("skipTheory"); return; }
  if (a === "thPrev") { if (S.theory > 0) { S.theory--; save(); render(); } return; }
  if (a === "skipTheory") { S.screen = "intro"; S.level = 0; save(); render(); return; }
  if (a === "startLevel") { S.queue = shuffle(levelTasks(S.level)); S.pos = 0; S.retry = false; S.retryQ = []; S.screen = "q"; save(); render(); return; }
  if (a === "help") { openModal(cheatHTML()); return; }
  if (a === "closeModal") { closeModal(); return; }
  if (a === "ans") {
    var t = byId((S.retry ? S.retryQ : S.queue)[S.pos]), i = +el.dataset.i, ok = i === t.a;
    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (b) { b.disabled = true; if (+b.dataset.i === t.a) b.classList.add("right"); else if (b === el) b.classList.add("wrong"); });
    answer(ok, t); return;
  }
  if (a === "pick") { var i2 = +el.dataset.i; if (picked.indexOf(i2) < 0) { picked.push(i2); renderSlots(); } return; }
  if (a === "unpick") { picked.pop(); renderSlots(); return; }
  if (a === "checkOrder") {
    var t2 = byId((S.retry ? S.retryQ : S.queue)[S.pos]);
    var ok2 = picked.length === t2.a.length && picked.every(function (v, k) { return v === t2.a[k]; });
    Array.prototype.forEach.call(document.querySelectorAll(".blk,.btn"), function (b) { b.disabled = true; });
    answer(ok2, t2); return;
  }
  if (a === "next") { closeSheet(); setTimeout(nextQ, 120); return; }
  if (a === "nextLevel") { S.level++; S.screen = "intro"; save(); render(); return; }
  if (a === "toEssay") { S.screen = "essay"; save(); render(); return; }
  if (a === "topic") { S.essay.topic = ESSAY_TOPICS[+el.dataset.i]; save(); render(); return; }
  if (a === "changeTopic") { S.essay.topic = null; save(); render(); return; }
  if (a === "toFinal") { S.screen = "final"; S.done = true; save(); render(); return; }
  if (a === "send") {
    var txt = resultText();
    copyText(txt).then(function (ok) { if (ok) toast("Скопировано! Вставь в чат с учителем 📨"); else manualCopy(txt); });
    return;
  }
  if (a === "again") {
    var keep = {name: S.name, essay: S.essay, checks: S.checks};
    S = fresh(keep.name); S.essay = keep.essay; S.checks = keep.checks; S.started = Date.now(); buildOrders(); S.screen = "intro"; S.level = 0; save(); render(); toast("Задания перемешаны — вперёд!"); return;
  }
}
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  act(el.dataset.a, el);
});
veil.addEventListener("click", function () { /* шторка закрывается только кнопкой «Дальше» */ });

/* ===================== BOOT ===================== */
S = load() || fresh("");
if (!S.order || !Object.keys(S.order).length) buildOrders();
if (S.screen === "q" && sheet) { /* продолжение после перезагрузки: вопрос, на который ещё не ответили */
  var curId = (S.retry ? S.retryQ : S.queue)[S.pos], r = S.res[curId];
  if (r && ((S.retry && r.second !== null && r.second !== undefined) || (!S.retry && r.first !== null && r.first !== undefined))) { S.pos++; var qq = S.retry ? S.retryQ : S.queue; if (S.pos >= qq.length) { S.pos--; nextQ(); } }
}
render();
if (S.started && S.screen !== "start") toast("С возвращением! Продолжаем с того же места");
</script>
</body>
