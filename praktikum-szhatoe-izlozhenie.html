:root{
  --bg:#0F0F14; --card:#1B1B24; --card2:#272732; --text:#F6F5F0; --muted:#A9A8B8;
  --lime:#D6FF3F; --blue:#4CC9FF; --pink:#FF6DB0; --orange:#FFA347;
  --acc:var(--lime); --ok:#D6FF3F; --bad:#FF6DB0;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Onest",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.uf{font-family:"Unbounded","Onest",sans-serif;letter-spacing:-.01em}
.app{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:18px 16px 28px;display:flex;flex-direction:column;overflow-wrap:anywhere}
@media (min-width:700px){
  body{padding:28px 0;background:radial-gradient(1200px 600px at 50% -10%,#1d1d2a 0%,var(--bg) 60%)}
  .app{min-height:calc(100vh - 56px);background:#13131a;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #23232e;padding:24px 22px 30px}
}
.nojs{max-width:480px;margin:40px auto;padding:24px;background:#1B1B24;border-radius:22px;color:#F6F5F0;font-family:system-ui,sans-serif;font-size:18px}
.nojs b{color:#D6FF3F}

/* --- общие --- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px 18px;border-radius:18px;background:var(--acc);color:#0F0F14;font-weight:800;font-size:18px;transition:transform .12s ease,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.small{min-height:46px;font-size:16px;width:auto;padding:10px 16px}
.row{display:flex;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.spacer{flex:1}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- старт --- */
.tiles{position:relative;height:210px;margin:6px 0 10px}
.tile{position:absolute;padding:12px 16px;border-radius:18px;font-family:"Unbounded";font-weight:700;font-size:15px;color:#0F0F14;animation:float 5s ease-in-out infinite;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-12px) rotate(calc(var(--rot) * -1))}}
.hero h1{font-size:40px;line-height:1.02;font-weight:900;margin:4px 0 10px}
.hero h1 span{color:var(--lime)}
.hero .sub{font-size:17px;color:var(--muted);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.intro-joke{background:var(--card);border-radius:var(--r);padding:16px 18px;font-size:16px;margin-bottom:18px}

/* --- теория --- */
.th-wrap{flex:1;display:flex;flex-direction:column}
.th-card{flex:1;background:var(--card);border-radius:26px;padding:22px 20px;margin:14px 0;touch-action:pan-y}
.th-card h2{font-size:24px;line-height:1.15;margin-bottom:14px}
.th-card ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.th-card li{background:var(--card2);border-radius:14px;padding:11px 14px;font-size:16px}
.th-card li b{color:var(--acc)}
.th-card .ex{margin-top:14px;font-size:15px;color:var(--muted)}
.th-card .ex b{color:var(--text)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--card2);transition:all .25s}
.dots i.on{width:26px;background:var(--acc)}

/* --- игра --- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top .lv{flex:1;min-width:0;font-family:"Unbounded";font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-weight:800}
.score b{color:var(--lime)}
.qbtn{width:42px;height:42px;border-radius:14px;background:var(--card2);font-family:"Unbounded";font-weight:900;font-size:18px;flex:none}
.bar{display:flex;gap:4px;margin-bottom:14px}
.bar i{flex:1;height:8px;border-radius:9px;background:var(--card2)}
.bar i.cur{background:var(--text);opacity:.55}
.bar i.ok{background:var(--lime)}
.bar i.bad{background:var(--pink)}
.streak{display:inline-flex;margin-bottom:10px}
.tcard{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:14px}
.ttype{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.tq{font-size:19px;font-weight:700;line-height:1.3}
.src{font-size:12.5px;color:var(--muted);margin-top:10px}
.ba{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ba div{background:var(--card2);border-radius:14px;padding:11px 13px;font-size:16px}
.ba small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ba .after{outline:2px solid var(--acc);outline-offset:-2px}
.quote{margin-top:14px;background:var(--card2);border-radius:14px;padding:12px 14px;font-size:16px}
.msg{margin-top:14px;display:flex;gap:10px;align-items:flex-end}
.ava{flex:none;width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:20px}
.bubble{background:var(--card2);border-radius:18px 18px 18px 4px;padding:11px 14px;font-size:16px;position:relative}
.bubble small{display:block;font-size:12px;color:var(--blue);font-weight:800;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;min-height:60px;padding:14px 16px;border-radius:18px;background:var(--card2);font-size:17px;font-weight:600;line-height:1.3;border:2px solid transparent;transition:transform .1s,background .2s,border-color .2s}
.opt:active{transform:scale(.985)}
.opt.tf{text-align:center;font-family:"Unbounded";font-size:17px}
.opts.two{flex-direction:row}
.opt.right{background:rgba(214,255,63,.16);border-color:var(--lime)}
.opt.wrong{background:rgba(255,109,176,.16);border-color:var(--pink)}
.opt[disabled]{cursor:default}
.pad-drawer{height:0;transition:height .3s}
.pad-drawer.on{height:52vh}

/* --- шторка --- */
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.drawer.on{transform:none;pointer-events:auto}
.drawer .in{width:100%;max-width:480px;max-height:72vh;overflow:auto;background:#22222c;border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.6);border-top:3px solid var(--lime)}
.drawer.bad .in{border-top-color:var(--pink)}
.drawer h3{font-size:24px;margin-bottom:8px;color:var(--lime)}
.drawer.bad h3{color:var(--pink)}
.drawer .why{font-size:16px;margin-bottom:10px}
.drawer .joke{font-size:15px;color:var(--muted);background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.drawer .rule{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}

/* --- экраны уровня/финал --- */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.big{font-size:34px;line-height:1.08;font-weight:900;margin:10px 0}
.lvnum{font-family:"Unbounded";font-weight:900;font-size:86px;line-height:1;color:var(--acc)}
.stars{font-size:44px;letter-spacing:6px;margin:10px 0}
.stars .off{opacity:.18}
.box{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;margin:12px 0}
.box h3{font-size:16px;margin-bottom:8px}
.lvrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2c2c38;font-size:15px}
.lvrow:last-child{border-bottom:0}
.err{background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.err b{color:var(--pink)}
.err span{display:block;color:var(--muted);margin-top:4px}
input.name{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--card2);background:var(--bg);color:var(--text);font:inherit;padding:10px 14px;margin:8px 0 12px}
input.name:focus{outline:none;border-color:var(--acc)}
textarea.manual{width:100%;min-height:200px;border-radius:14px;background:var(--bg);color:var(--text);border:2px solid var(--pink);padding:10px;font:14px/1.4 "Onest",sans-serif;margin-top:10px}
.status{font-size:15px;font-weight:700;margin-top:10px;min-height:22px;color:var(--lime)}
.boss{background:radial-gradient(400px 260px at 50% 30%,rgba(255,163,71,.25),transparent 70%)}

/* --- шпаргалка --- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,8,12,.78);display:none;justify-content:center;align-items:flex-end}
.modal.on{display:flex}
.modal .in{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.modal h2{font-size:20px;margin-bottom:12px}
.modal h4{font-family:"Unbounded";font-size:14px;margin:14px 0 6px;color:var(--lime)}
.modal p,.modal li{font-size:15px}
.modal ul{padding-left:18px}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  if (S.pass === 2) type = "Второй заход · " + type;
  var body = '<div class="ttype">' + type + '</div><div class="tq">' + esc(t.q) + '</div>';
  if (t.before) body += '<div class="ba"><div><small>Было</small>' + esc(t.before) + '</div>' + (t.after ? '<div class="after"><small>Стало</small>' + esc(t.after) + '</div>' : '') + '</div>';
  if (t.quote) body += '<div class="quote">' + esc(t.quote) + '</div>';
  if (t.msg) body += '<div class="msg"><div class="ava">🙂</div><div class="bubble"><small>Друг</small>' + esc(t.msg) + '</div></div>';
  if (t.src) body += '<div class="src">' + esc(t.src) + '</div>';
  var opts = order.map(function(oi, k){
    var cls = "opt" + (t.t === "tf" ? " tf" : "");
    if (A){ if (oi === t.a) cls += " right"; else if (k === A.k) cls += " wrong"; }
    return '<button class="' + cls + '" data-k="' + k + '"' + (A ? " disabled" : "") + '>' + esc(t.o[oi]) + '</button>';
  }).join("");
  app.innerHTML =
   '<div class="top"><div class="lv">' + L.emoji + ' ' + esc(L.name) + '</div><div class="score"><b>★</b> ' + S.score + '</div><button class="qbtn" id="bHelp" aria-label="Шпаргалка">?</button></div>' +
   '<div class="bar">' + bar + '</div>' +
   (S.streak >= 2 ? '<div class="chip streak">🔥 Серия: ' + S.streak + ' подряд</div>' : '') +
   '<div class="tcard fade">' + body + '</div>' +
   '<div class="opts' + (t.t === "tf" ? " two" : "") + '">' + opts + '</div>' +
   '<div class="pad-drawer' + (A ? " on" : "") + '"></div>';
  document.getElementById("bHelp").onclick = openHelp;
  if (!A){
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){ b.onclick = function(){ answer(+b.getAttribute("data-k")); }; });
  } else {
    openDrawer(A.ok, t, A.joke);
  }
}

function answer(k){
  var id = S.queue[S.pos], t = task(id), ok = S.cur.order[k] === t.a;
  if (S.pass === 1){ S.first[id] = ok; if (!ok) S.retry.push(id); } else { S.second[id] = ok; }
  if (ok){ S.streak++; S.best = Math.max(S.best, S.streak); S.score += (S.pass === 1 ? 10 : 5) + (S.streak >= 3 ? 5 : 0); }
  else S.streak = 0;
  S.ans = { id:id, k:k, ok:ok, joke:pick(ok ? JOKES_OK : JOKES_BAD) };
  save(); render();
  if (ok){ confetti(); try { if (navigator.vibrate) navigator.vibrate(35); } catch(e){} }
  else { try { if (navigator.vibrate) navigator.vibrate([20,40,20]); } catch(e){} }
}

function next(){ S.ans = null; S.cur = null; S.pos++; save(); if (S.pos >= S.queue.length) finishPass(); else { render(); window.scrollTo(0,0); } }
function finishPass(){
  if (S.pass === 1 && S.retry.length){ go("retry"); }
  else go("lvlend");
}

function openDrawer(ok, t, joke){
  drawer.className = "drawer on" + (ok ? "" : " bad");
  drawerIn.innerHTML = '<h3>' + (ok ? "Верно!" : "Почти!") + '</h3>' +
    (ok ? "" : '<div class="rule">Правильный ответ: ' + esc(t.o[t.a]) + '</div>') +
    '<div class="why">' + esc(t.why) + '</div>' +
    '<div class="joke">' + esc(joke) + '</div>' +
    '<button class="btn" id="bNextQ">Дальше</button>';
  document.getElementById("bNextQ").onclick = next;
}
function closeDrawer(){ drawer.className = "drawer"; }

/* ---------- второй заход ---------- */
function rRetry(){
  var L = LEVELS[S.lvl]; setAcc(L.color); S.resume = "retry";
  app.innerHTML = '<div class="center fade"><div class="lvnum">🔁</div><h2 class="big">Второй заход</h2>' +
   '<p class="muted" style="font-size:17px">Вернулись задания, где была ошибка: ' + S.retry.length + '. Ещё одна попытка — и эти ловушки больше не страшны.</p></div>' +
   '<button class="btn" id="bR">Реванш!</button>';
  document.getElementById("bR").onclick = function(){ S.queue = shuffle(S.retry); S.retry = []; S.pos = 0; S.pass = 2; S.cur = null; S.ans = null; go("game"); };
}

/* ---------- конец уровня ---------- */
function levelStats(l){
  var n = LEVELS[l].tasks.length, ok = 0;
  for (var i=0;i<n;i++) if (S.first[l + "-" + i]) ok++;
  var r = ok / n, stars = r >= .9 ? 3 : r >= .7 ? 2 : 1;
  return { n:n, ok:ok, stars:stars, done: (l + "-0") in S.first };
}
function starsHtml(k){ var s=""; for (var i=0;i<3;i++) s += '<span class="' + (i<k ? "" : "off") + '">★</span>'; return s; }
function rLevelEnd(){
  var L = LEVELS[S.lvl]; setAcc(L.color); S.resume = "lvlend";
  var st = levelStats(S.lvl), last = S.lvl === LEVELS.length - 1;
  var msg = st.stars === 3 ? "Чистая работа! Эксперт бы аплодировал стоя 👏" : st.stars === 2 ? "Хорошо! Пара ловушек — и все уже разобраны 💪" : "Уровень пройден! Ошибки разобраны — дальше будет легче 🙌";
  var nx = last ? "" : '<div class="box"><h3>Дальше: ' + LEVELS[S.lvl+1].emoji + ' ' + esc(LEVELS[S.lvl+1].name) + '</h3><div class="muted">' + esc(LEVELS[S.lvl+1].desc) + '</div></div>';
  app.innerHTML = '<div class="center fade"><div class="chip" style="align-self:center">Уровень ' + (S.lvl+1) + ' пройден</div>' +
   '<div class="stars" style="color:' + L.color + '">' + starsHtml(st.stars) + '</div>' +
   '<h2 class="big" style="font-size:28px">' + esc(L.name) + '</h2>' +
   '<p class="muted">С первой попытки: ' + st.ok + ' из ' + st.n + ' · очки: ' + S.score + '</p>' +
   '<p style="margin-top:10px">' + msg + '</p>' + nx + '</div>' +
   '<button class="btn" id="bL">' + (last ? "К результатам" : "Вперёд!") + '</button>';
  document.getElementById("bL").onclick = function(){ if (last) go("final"); else { S.lvl++; go("intro"); } };
  if (st.stars === 3) confetti();
}

/* ---------- финал ---------- */
function totals(){ var s = 0, ok = 0, n = 0; for (var l=0;l<LEVELS.length;l++){ var st = levelStats(l); s += st.stars; ok += st.ok; n += st.n; } return { stars:s, ok:ok, n:n }; }
function mistakes(){
  var out = [];
  LEVELS.forEach(function(L, l){ L.tasks.forEach(function(t, i){ var id = l + "-" + i; if (S.first[id] === false) out.push({ l:l, t:t, fixed: S.second[id] === true }); }); });
  return out;
}
function resultText(){
  var T = totals(), M = mistakes(), d = new Date();
  var pad = function(x){ return (x < 10 ? "0" : "") + x; };
  var lines = ["Тренажёр «" + TITLE + "»", "Имя: " + (S.name || "—"),
    "Очки: " + S.score + " ★", "Звёзды: " + T.stars + " из 12", "С первой попытки: " + T.ok + " из " + T.n, "Лучшая серия: " + S.best, ""];
  LEVELS.forEach(function(L, l){ var st = levelStats(l); lines.push("Уровень " + (l+1) + " «" + L.name + "»: " + st.ok + "/" + st.n + " " + "★".repeat(st.stars) + "☆".repeat(3 - st.stars)); });
  lines.push("");
  if (M.length){ lines.push("Ошибки (с первой попытки):"); M.forEach(function(m){ lines.push("— ур. " + (m.l+1) + ": " + m.t.q.slice(0, 70) + (m.t.before ? " [" + m.t.before.slice(0, 50) + "…]" : m.t.t === "tf" ? "" : "") + " → правило: " + m.t.rule + (m.fixed ? " (исправлено во втором заходе)" : "")); }); }
  else lines.push("Ошибок с первой попытки нет 🎉");
  lines.push("", "Дата: " + pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()));
  return lines.join("\n");
}
function rFinal(){
  setAcc("#D6FF3F"); S.resume = "final";
  var T = totals(), M = mistakes(), r = T.ok / T.n, big = r >= .9 ? 3 : r >= .7 ? 2 : 1;
  var title = big === 3 ? "Мастер сжатия!" : big === 2 ? "Отличный результат!" : "Тренажёр пройден!";
  var rows = LEVELS.map(function(L, l){ var st = levelStats(l); return '<div class="lvrow"><span>' + L.emoji + ' ' + esc(L.name) + '</span><span>' + st.ok + '/' + st.n + ' <b style="color:' + L.color + '">' + "★".repeat(st.stars) + '</b></span></div>'; }).join("");
  var errs = M.length ? M.map(function(m){ return '<div class="err"><b>Ур. ' + (m.l+1) + ':</b> ' + esc(m.t.q) + (m.t.before ? ' <i class="muted">«' + esc(m.t.before.slice(0, 60)) + '…»</i>' : '') + (m.t.msg ? ' <i class="muted">«' + esc(m.t.msg.slice(0, 60)) + '…»</i>' : '') + '<span>Правило: ' + esc(m.t.rule) + (m.fixed ? " · исправлено во втором заходе ✅" : "") + '</span></div>'; }).join("")
                      : '<p class="muted">Ни одной ошибки с первой попытки. Легенда! 🏆</p>';
  app.innerHTML = '<div class="fade" style="text-align:center"><div class="chip">Финал</div>' +
   '<div class="stars" style="color:#D6FF3F">' + starsHtml(big) + '</div>' +
   '<h2 class="big">' + title + '</h2>' +
   '<p class="muted">Очки: <b style="color:#F6F5F0">' + S.score + ' ★</b> · звёзды: ' + T.stars + ' из 12 · лучшая серия: ' + S.best + '</p></div>' +
   '<div class="box"><h3>Уровни</h3>' + rows + '</div>' +
   '<div class="box"><h3>Работа над ошибками</h3>' + errs + '</div>' +
   '<div class="box"><h3>Отправить учителю</h3><div class="muted" style="font-size:15px">Имя (чтобы учитель знал, чей результат):</div>' +
   '<input class="name" id="iName" maxlength="40" placeholder="Имя и фамилия" value="' + esc(S.name || "") + '">' +
   '<button class="btn" id="bSend">Отправить результат учителю</button><div class="status" id="st"></div><div id="manual"></div></div>' +
   '<button class="btn ghost" id="bAgain">Пройти ещё раз</button>';
  document.getElementById("iName").oninput = function(e){ S.name = e.target.value.trim(); save(); };
  document.getElementById("bSend").onclick = copyResult;
  document.getElementById("bAgain").onclick = function(){ S = fresh(S.name); S.lvl = 0; go("intro"); };
  if (big === 3) confetti();
}
function copyResult(){
  var txt = resultText(), st = document.getElementById("st"), box = document.getElementById("manual");
  function okMsg(){ st.textContent = "Скопировано! Вставь результат в чат с учителем 📨"; box.innerHTML = ""; }
  function manual(){
    st.textContent = "Скопировать автоматически не вышло — выдели текст ниже и скопируй вручную:";
    box.innerHTML = '<textarea class="manual" id="ta" readonly></textarea>';
    var ta = document.getElementById("ta"); ta.value = txt; ta.focus(); ta.select();
  }
  function fallback(){
    var done = false;
    try { var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select(); done = document.execCommand("copy"); document.body.removeChild(ta); } catch(e){ done = false; }
    if (done) okMsg(); else manual();
  }
  try {
    if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(okMsg, fallback); }
    else fallback();
  } catch(e){ fallback(); }
}

/* ---------- шпаргалка ---------- */
function openHelp(){
  modalIn.innerHTML = '<div class="top"><h2 style="flex:1;margin:0">Шпаргалка</h2><button class="btn ghost small" id="bClose">Закрыть</button></div>' +
   '<h4>Задание 1 ОГЭ (2027)</h4><ul><li>текст звучит 2 раза, между прослушиваниями 5–6 минут</li><li>не менее 70 слов, иначе 0 баллов</li><li>от того же лица, что и исходный текст</li><li>максимум по ИК1–ИК3 — 6 баллов; словарь разрешён</li></ul>' +
   '<h4>Черновик</h4><ul><li>3 части — по числу микротем (абзацев)</li><li>ключевые слова + пропуски</li><li>между прослушиваниями: расписать сокращения, восстановить предложения, составить план</li></ul>' +
   '<h4>Сжатие</h4><ul><li>исключение — второстепенное (повторы, синонимы, уточнения)</li><li>обобщение — перечень → точное общее слово, «все», «никто»</li><li>упрощение — слияние, косвенная речь, короткий синоним</li><li>один или несколько приёмов — во всём тексте</li></ul>' +
   '<h4>Критерии</h4><ul><li>ИК1: все микротемы — 2; одна упущена/добавлена — 1; больше — 0</li><li>ИК2: сжатие во всём тексте — 2; в двух микротемах — 1; в одной или нигде — 0</li><li>ИК3: нет логических ошибок — 2; одна-две — 1; три и более — 0</li><li>порядок микротем — как в тексте</li></ul>';
  modal.className = "modal on";
  document.getElementById("bClose").onclick = closeHelp;
}
function closeHelp(){ modal.className = "modal"; }
modal.addEventListener("click", function(e){ if (e.target === modal) closeHelp(); });

/* ---------- конфетти ---------- */
var cf = document.getElementById("cf"), cx = cf.getContext ? cf.getContext("2d") : null, parts = [], raf = 0;
function confetti(){
  if (!cx) return;
  try { if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(e){}
  cf.width = window.innerWidth; cf.height = window.innerHeight;
  var cols = ["#D6FF3F","#4CC9FF","#FF6DB0","#FFA347","#F6F5F0"];
  for (var i=0;i<90;i++) parts.push({ x:cf.width/2 + (Math.random()-.5)*120, y:cf.height*.45, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, s:Math.random()*7+4, c:pick(cols), r:Math.random()*6, vr:(Math.random()-.5)*.3, life:0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cf.width,cf.height);
  parts = parts.filter(function(p){ return p.life < 80 && p.y < cf.height + 20; });
  parts.forEach(function(p){ p.life++; p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); cx.restore(); });
  if (parts.length) raf = requestAnimationFrame(tick); else { raf = 0; cx.clearRect(0,0,cf.width,cf.height); }
}

/* ---------- запуск ---------- */
S = load() || fresh();
if (S.screen !== "start" && S.screen !== "final"){ S.resume = S.screen; S.screen = "start"; }
render();
</script>
</body>
</html>
