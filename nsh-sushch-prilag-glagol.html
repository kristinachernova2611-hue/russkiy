:root{--navy:#1d3b6f;--blue:#24418c;--teal:#0e9bb8;--sky:#e6f7fd;--gold:#ffc233;--green:#23a047;--red:#e8173f;--orange:#ff8a1f;--card:#fff;--shadow:0 4px 0 rgba(29,59,111,.18),0 6px 16px rgba(29,59,111,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dff4fc;color:var(--blue);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:700}
body{background:radial-gradient(circle at 15% 10%,#fff 0,#e9f8fd 40%,#cdeefa 100%);overflow-x:hidden}
#app{max-width:560px;margin:0 auto;min-height:100%;height:100dvh;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;min-height:48px}
.lvl{font-weight:900;color:var(--navy);font-size:17px;white-space:nowrap}
.bar{flex:1;height:12px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ccfef,#23a047);border-radius:8px;transition:width .4s}
.stars{display:flex;align-items:center;gap:3px;background:#fff;border-radius:20px;padding:4px 10px 4px 6px;font-weight:900;font-size:19px;color:#b77a00;box-shadow:var(--shadow)}
.stars svg{width:24px;height:24px}
.snd{width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:var(--shadow);cursor:pointer}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
.host{display:flex;align-items:flex-end;gap:8px;margin:6px 0 8px}
.host img{height:110px;width:auto;flex:none}
.say{position:relative;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);font-size:18px;line-height:1.25;flex:1}
.say:before{content:"";position:absolute;left:-9px;bottom:18px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.q{background:#fff;border-radius:20px;padding:14px 14px;box-shadow:var(--shadow);text-align:center;margin-bottom:12px}
.q .t{font-size:clamp(24px,7vw,28px);line-height:1.2;color:var(--navy);font-weight:900}
.q .w{display:inline-block;margin-top:6px;font-size:clamp(28px,8.5vw,36px);color:var(--red);font-weight:900}
.opts{display:grid;gap:10px;margin-top:auto;margin-bottom:auto}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{min-height:64px;border:3px solid #9ccfe8;border-radius:18px;background:#fff;color:var(--blue);font:inherit;font-weight:900;font-size:clamp(21px,6vw,25px);padding:8px 10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.big{font-size:34px;min-height:76px}
.opt.ok{border-color:var(--green);background:#e7f9ec;color:var(--green)}
.opt.no{border-color:#ffb4c2;background:#fff1f4;color:#c2264a}
.opt[disabled]{cursor:default}
.slots{display:flex;justify-content:center;gap:6px;min-height:64px;margin:6px 0 10px;flex-wrap:wrap}
.slot{min-width:64px;height:64px;border:3px dashed #9ccfe8;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--navy);background:#fff;padding:0 8px}
.slot.f{border-style:solid;border-color:var(--teal)}
.syl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.syl .opt{min-width:84px}
.syl .opt.used{visibility:hidden}
.small{min-height:52px!important;font-size:19px!important;border-color:#d5e3ee;color:#6a7f99}
.fb{margin-top:10px;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:18px;line-height:1.25;box-shadow:var(--shadow)}
.fb img{height:80px;flex:none}
.fb.good{background:#e7f9ec;color:#16702f}
.fb.bad{background:#fff6e5;color:#8a4b00}
.fb b{color:var(--navy)}
.next{margin-top:10px;width:100%;min-height:64px;border:0;border-radius:18px;background:var(--green);color:#fff;font:inherit;font-weight:900;font-size:24px;box-shadow:0 4px 0 #157a33;cursor:pointer}
.next.blue{background:var(--teal);box-shadow:0 4px 0 #0b7189}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
h1{font-size:clamp(28px,8vw,36px);margin:0;color:var(--navy);font-weight:900;line-height:1.1}
h2{font-size:clamp(24px,7vw,30px);margin:0;color:var(--navy);font-weight:900}
.lead{font-size:20px;line-height:1.3;max-width:440px}
.hero{height:clamp(150px,30vh,240px)}
.rule{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);font-size:21px;line-height:1.3;text-align:left;width:100%}
.rule .ex{margin-top:10px;display:grid;gap:8px}
.rule .ex div{background:#eef8fd;border-radius:12px;padding:8px 10px;font-size:19px}
.n{color:var(--teal)}.a{color:var(--orange)}.v{color:var(--green)}
.pause{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:330px;margin:4px auto}
.pause svg{width:56px;height:56px}
.fly{position:fixed;z-index:50;width:56px;height:56px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.7,1),opacity .8s}
.pop{animation:pop .5s}

.res{width:100%;min-height:110px;font:inherit;font-size:16px;border-radius:12px;border:2px solid #9ccfe8;padding:8px}

.btnrow{display:grid;gap:10px;width:100%}
.note{font-size:15px;color:#4a6585}

 c.appendChild(opts);s.appendChild(c);}

 return "Тренажёр: "+TITLE+"\nДата: "+ds+"\nВыполнено заданий: "+TOTAL+" из "+TOTAL+"\nС первой попытки: "+firstOk+" из "+TOTAL+"\nОшибки исправлены при повторе: "+(TOTAL-firstOk)+"\nСобрано звёзд: "+S.stars;}

  var manual=function(){msg.innerHTML="";msg.appendChild(el("div",null,"Скопируй текст ниже и отправь учителю:"));var ta=el("textarea","res");ta.id="resText";ta.value=txt;ta.readOnly=true;msg.appendChild(ta);try{ta.focus();ta.select();}catch(e){}};
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){legacy()||manual();});}else{legacy()||manual();}}catch(e){manual();}
  function legacy(){try{var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();if(ok)done();return ok;}catch(e){return false;}}};
 again.onclick=function(){var snd=S.sound;S=fresh();S.sound=snd;save();rules(0);};}

start();
