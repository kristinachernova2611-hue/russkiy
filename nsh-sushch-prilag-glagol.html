:root{--navy:#1d3b6f;--blue:#24418c;--teal:#0e9bb8;--sky:#e6f7fd;--gold:#ffc233;--green:#23a047;--red:#e8173f;--orange:#ff8a1f;--card:#fff;--shadow:0 4px 0 rgba(29,59,111,.18),0 6px 16px rgba(29,59,111,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dff4fc;color:var(--blue);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:700}
body{background:radial-gradient(circle at 15% 10%,#fff 0,#e9f8fd 40%,#cdeefa 100%);overflow-x:hidden}
#app{max-width:560px;margin:0 auto;min-height:100%;height:100dvh;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;min-height:48px}
.lvl{font-weight:900;color:var(--navy);font-size:17px;white-space:nowrap}
.bar{flex:1;height:12px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ccfef,#23a047);border-radius:8px;transition:width .4s}
.stars{display:flex;align-items:center;gap:3px;background:#fff;border-radius:20px;padding:4px 10px 4px 6px;font-weight:900;font-size:19px;color:#b77a00;box-shadow:var(--shadow)}
.stars svg{width:24px;height:24px}
.snd{width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:var(--shadow);cursor:pointer}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
.host{display:flex;align-items:flex-end;gap:8px;margin:6px 0 8px}
.host img{height:110px;width:auto;flex:none}
.say{position:relative;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);font-size:18px;line-height:1.25;flex:1}
.say:before{content:"";position:absolute;left:-9px;bottom:18px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.q{background:#fff;border-radius:20px;padding:14px 14px;box-shadow:var(--shadow);text-align:center;margin-bottom:12px}
.q .t{font-size:clamp(24px,7vw,28px);line-height:1.2;color:var(--navy);font-weight:900}
.q .w{display:inline-block;margin-top:6px;font-size:clamp(28px,8.5vw,36px);color:var(--red);font-weight:900}
.opts{display:grid;gap:10px;margin-top:auto;margin-bottom:auto}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{min-height:64px;border:3px solid #9ccfe8;border-radius:18px;background:#fff;color:var(--blue);font:inherit;font-weight:900;font-size:clamp(21px,6vw,25px);padding:8px 10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.big{font-size:34px;min-height:76px}
.opt.ok{border-color:var(--green);background:#e7f9ec;color:var(--green)}
.opt.no{border-color:#ffb4c2;background:#fff1f4;color:#c2264a}
.opt[disabled]{cursor:default}
.slots{display:flex;justify-content:center;gap:6px;min-height:64px;margin:6px 0 10px;flex-wrap:wrap}
.slot{min-width:64px;height:64px;border:3px dashed #9ccfe8;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--navy);background:#fff;padding:0 8px}
.slot.f{border-style:solid;border-color:var(--teal)}
.syl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.syl .opt{min-width:84px}
.syl .opt.used{visibility:hidden}
.small{min-height:52px!important;font-size:19px!important;border-color:#d5e3ee;color:#6a7f99}
.fb{margin-top:10px;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:18px;line-height:1.25;box-shadow:var(--shadow)}
.fb img{height:80px;flex:none}
.fb.good{background:#e7f9ec;color:#16702f}
.fb.bad{background:#fff6e5;color:#8a4b00}
.fb b{color:var(--navy)}
.next{margin-top:10px;width:100%;min-height:64px;border:0;border-radius:18px;background:var(--green);color:#fff;font:inherit;font-weight:900;font-size:24px;box-shadow:0 4px 0 #157a33;cursor:pointer}
.next.blue{background:var(--teal);box-shadow:0 4px 0 #0b7189}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
h1{font-size:clamp(28px,8vw,36px);margin:0;color:var(--navy);font-weight:900;line-height:1.1}
h2{font-size:clamp(24px,7vw,30px);margin:0;color:var(--navy);font-weight:900}
.lead{font-size:20px;line-height:1.3;max-width:440px}
.hero{height:clamp(150px,30vh,240px)}
.rule{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);font-size:21px;line-height:1.3;text-align:left;width:100%}
.rule .ex{margin-top:10px;display:grid;gap:8px}
.rule .ex div{background:#eef8fd;border-radius:12px;padding:8px 10px;font-size:19px}
.n{color:var(--teal)}.a{color:var(--orange)}.v{color:var(--green)}
.pause{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:330px;margin:4px auto}
.pause svg{width:56px;height:56px}
.fly{position:fixed;z-index:50;width:56px;height:56px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.7,1),opacity .8s}
.pop{animation:pop .5s}

.res{width:100%;min-height:110px;font:inherit;font-size:16px;border-radius:12px;border:2px solid #9ccfe8;padding:8px}

.btnrow{display:grid;gap:10px;width:100%}
.note{font-size:15px;color:#4a6585}

function rules(i){S.phase="rules";S.ruleI=i;save();showTop(false);var s=scr();var c=el("div","center");var r=RULES[i];
 c.appendChild(el("h2",null,r.t));c.appendChild(host("explain",i===0?"Сначала вспомним главное!":"И ещё одна подсказка!"));
 var box=el("div","rule",r.h);var ex=el("div","ex");r.ex.forEach(function(x){ex.appendChild(el("div",null,x));});box.appendChild(ex);c.appendChild(box);
 var b=el("button","next",i<RULES.length-1?"Дальше ▶":"Поехали! ▶");b.onclick=function(){if(i<RULES.length-1)rules(i+1);else{S.lvl=0;intro();}};c.appendChild(b);s.appendChild(c);}
function intro(){S.phase="intro";if(!S.queue.length||S.queueLvl!==S.lvl){S.queue=LEVELS[S.lvl].tasks.map(function(t){return t.id;});S.queueLvl=S.lvl;S.pos=0;}save();showTop(true);updTop();
 var s=scr();var c=el("div","center");var L=LEVELS[S.lvl];c.appendChild(el("h1",null,L.name));c.appendChild(el("div","lead",L.sub));
 var i=el("img","hero");i.src=S.lvl===2?IMG.surprised:IMG.happy;i.alt="Крис";c.appendChild(i);
 c.appendChild(el("div","lead",S.lvl===2?"Это самый трудный уровень. Ты справишься!":"Начинаем!"));
 var b=el("button","next","Начать уровень ▶");b.onclick=function(){S.phase="task";save();showTask();};c.appendChild(b);s.appendChild(c);}
function showTask(){S.phase="task";save();showTop(true);updTop();if(S.pos>=S.queue.length){return levelDone();}
 var t=task(S.queue[S.pos]);window.__cur=t;var retry=!!S.wrong[t.id]&&S.first[t.id]===false;var s=scr();
 s.appendChild(host(retry?"think":"happy",retry?"Попробуем ещё раз это задание!":pick(["Как думаешь?","Подумай и ответь!","Я верю в тебя!","Это интересно!"])));
 var q=el("div","q");q.appendChild(el("div","t",esc(t.q)+(t.type==="choice"&&t.w&&t.q.slice(-1)!=="?"&&t.q.slice(-1)!=="."?":":"")));
 if(t.w)q.appendChild(el("div","w",esc(t.w)));s.appendChild(q);
 var answered=false;
 function finish(ok,btn,correctText){if(answered)return;answered=true;s.classList.add("answered");
  if(ok){S.stars++;if(S.first[t.id]===undefined)S.first[t.id]=true;S.done=Math.min(TOTAL,S.done+(S.wrong[t.id]?0:1));if(S.wrong[t.id])S.wrong[t.id]=false;}
  else{if(S.first[t.id]===undefined)S.first[t.id]=false;if(!S.wrong[t.id]){S.wrong[t.id]=true;S.done=Math.min(TOTAL,S.done+1);}S.queue.push(t.id);}
  S.pos++;save();updTop();
  var fb=el("div","fb "+(ok?"good":"bad"));var im=el("img");im.src=ok?IMG.cheer:IMG.think;im.alt="Крис";fb.appendChild(im);
  fb.appendChild(el("div",null,ok?"<b>"+pick(PRAISE)+"</b> "+esc(t.why):"<b>"+pick(CHEER)+"</b> Правильный ответ: <b>"+esc(correctText)+"</b>. "+esc(t.why)));
  s.appendChild(fb);var nb=el("button","next","Дальше ▶");nb.id="nextBtn";nb.onclick=showTask;s.appendChild(nb);
  if(ok){play("star");flyStar(btn);}else{btn&&btn.classList.add("shake");}
  try{nb.scrollIntoView({block:"nearest"});}catch(e){}}
 if(t.type==="build"){var slots=el("div","slots");var cur=[];var syl=el("div","syl");
  function draw(){slots.innerHTML="";var n=t.parts.length;for(var k=0;k<n;k++){var d=el("div","slot"+(cur[k]!=null?" f":""),cur[k]!=null?esc(t.parts[cur[k]]):"");slots.appendChild(d);}}
  draw();s.appendChild(slots);var order=shuffleIdx(t.parts.length,t.id);var btns=[];
  order.forEach(function(k){var b=el("button","opt",esc(t.parts[k]));b.dataset.k=k;b.onclick=function(){if(answered||b.classList.contains("used"))return;b.classList.add("used");cur.push(k);draw();
    if(cur.length===t.parts.length){var word=cur.map(function(x){return t.parts[x];}).join("");var ok=word===t.answer;slots.querySelectorAll(".slot").forEach(function(d){d.style.borderColor=ok?"#23a047":"#ffb4c2";});finish(ok,ok?slots:null,t.answer);}};btns.push(b);syl.appendChild(b);});
  s.appendChild(syl);var er=el("button","opt small","⌫ Стереть");er.style.marginTop="10px";er.onclick=function(){if(answered)return;cur=[];btns.forEach(function(b){b.classList.remove("used");});draw();};s.appendChild(er);return;}
 var opts=el("div","opts"+(t.type==="odd"||t.type==="tf"||(t.big&&t.o.length===2)?" c2":""));
 var list=t.type==="tf"?["Верно","Неверно"]:t.o;var correct=t.type==="tf"?(t.a?0:1):t.a;
 list.forEach(function(o,k){var b=el("button","opt"+(t.big?" big":""),esc(o));b.dataset.k=k;b.onclick=function(){if(answered)return;var ok=k===correct;b.classList.add(ok?"ok":"no");if(!ok)opts.children[correct].classList.add("ok");
   Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;});finish(ok,b,list[correct]);};opts.appendChild(b);});
 s.appendChild(opts);}
function shuffleIdx(n,seed){var a=[];for(var i=0;i<n;i++)a.push(i);var h=0;for(i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;for(i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;var j=h%(i+1);var x=a[i];a[i]=a[j];a[j]=x;}
 var same=true;for(i=0;i<n;i++)if(a[i]!==i)same=false;if(same){a.push(a.shift());}return a;}
function flyStar(fromEl){try{var r=(fromEl||document.body).getBoundingClientRect();var tgt=$("starBox").getBoundingClientRect();var f=el("div","fly",STAR);
 f.style.left=(r.left+r.width/2-28)+"px";f.style.top=(r.top+r.height/2-28)+"px";document.body.appendChild(f);
 requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.transform="translate("+(tgt.left-r.left-r.width/2+40)+"px,"+(tgt.top-r.top-r.height/2+12)+"px) scale(.45) rotate(360deg)";f.style.opacity=".3";});});
 setTimeout(function(){f.remove();$("starBox").classList.remove("pop");void $("starBox").offsetWidth;$("starBox").classList.add("pop");},820);}catch(e){}}
function levelDone(){S.queue=[];S.pos=0;if(S.lvl===1){S.lvl=2;S.phase="pause";save();return pause();}if(S.lvl<2){S.lvl++;save();return intro();}S.phase="final";save();final();}
function pause(){S.phase="pause";save();showTop(true);updTop();var s=scr();var c=el("div","center");
 c.appendChild(el("h2",null,"Мини-переменка!"));c.appendChild(host("surprised","Посчитай звёздочки! Сколько их?"));
 var box=el("div","pause");for(var i=0;i<7;i++){var d=el("span",null,STAR);d.style.transform="rotate("+(i*23%40-20)+"deg) scale("+(0.8+(i%3)*0.15)+")";box.appendChild(d);}c.appendChild(box);
 var opts=el("div","opts");opts.style.gridTemplateColumns="1fr 1fr 1fr";opts.style.width="100%";var ans=false;
 [6,7,8].forEach(function(n){var b=el("button","opt big",String(n));b.onclick=function(){if(ans)return;ans=true;var ok=n===7;b.classList.add(ok?"ok":"no");if(!ok)opts.children[1].classList.add("ok");
  c.appendChild(el("div","fb "+(ok?"good":"bad"),ok?"<b>Верно, 7 звёздочек!</b> Отдохнули — впереди Супер-уровень!":"<b>Почти!</b> Их 7. Ничего страшного — впереди Супер-уровень!"));
  if(ok)play("star");var nb=el("button","next","На Супер-уровень ▶");nb.id="nextBtn";nb.onclick=function(){intro();};c.appendChild(nb);};opts.appendChild(b);});
 c.appendChild(opts);s.appendChild(c);}
function resultText(){var firstOk=0;LEVELS.forEach(function(l){l.tasks.forEach(function(t){if(S.first[t.id]===true)firstOk++;});});
 var d=new Date();var ds=("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+d.getFullYear();
 return "Тренажёр: "+TITLE+"\nДата: "+ds+"\nВыполнено заданий: "+TOTAL+" из "+TOTAL+"\nС первой попытки: "+firstOk+" из "+TOTAL+"\nОшибки исправлены при повторе: "+(TOTAL-firstOk)+"\nСобрано звёзд: "+S.stars;}
function final(){S.phase="final";save();showTop(true);updTop();$("barI").style.width="100%";var s=scr();var c=el("div","center");
 var i=el("img","hero");i.src=IMG.cheer;i.alt="Крис празднует";c.appendChild(i);c.appendChild(el("h1",null,"Ты молодец!"));
 c.appendChild(el("div","final-stars",STAR.replace('<svg','<svg style="width:30px;height:30px;vertical-align:-5px"')+" × "+S.stars));
 c.appendChild(el("div","lead","Все задания пройдены! Крис говорит спасибо за помощь."));
 var row=el("div","btnrow");var send=el("button","next","📨 Отправить результат учителю");send.id="send";var again=el("button","next blue","🔄 Играть ещё раз");again.id="again";
 var msg=el("div","note");row.appendChild(send);row.appendChild(msg);row.appendChild(again);c.appendChild(row);s.appendChild(c);play("fan");
 send.onclick=function(){var txt=resultText();var done=function(){msg.textContent="Результат скопирован! Вставь его в сообщение учителю.";};
  var manual=function(){msg.innerHTML="";msg.appendChild(el("div",null,"Скопируй текст ниже и отправь учителю:"));var ta=el("textarea","res");ta.id="resText";ta.value=txt;ta.readOnly=true;msg.appendChild(ta);try{ta.focus();ta.select();}catch(e){}};
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){legacy()||manual();});}else{legacy()||manual();}}catch(e){manual();}
  function legacy(){try{var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();if(ok)done();return ok;}catch(e){return false;}}};
 again.onclick=function(){var snd=S.sound;S=fresh();S.sound=snd;save();rules(0);};}
window.__state=function(){return S;};window.__result=resultText;
start();
})();
</script>
</body>
