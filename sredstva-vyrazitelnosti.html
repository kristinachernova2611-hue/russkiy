:root{--bg:#0F0F14;--card:#1B1B24;--card2:#272732;--tx:#F6F5F0;--mut:#A9A8B3;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--orange:#FFA347;--ok:#3DDC84;--bad:#FF6B6B;--acc:var(--lime);
--h:'Unbounded',system-ui,sans-serif;--b:'Onest',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--b);font-size:17px;line-height:1.45;overflow-x:hidden}
body{display:flex;justify-content:center;align-items:stretch;min-height:100dvh}
#app{width:100%;max-width:480px;min-height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){body{align-items:center;padding:24px 0}#app{min-height:min(900px,calc(100dvh - 48px));border-radius:32px;background:#13131A;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #24242E}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{flex:1;display:flex;flex-direction:column;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:in .35s ease both;min-height:0}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--h);font-weight:800;letter-spacing:-.01em;line-height:1.12}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px 18px;border-radius:18px;font-family:var(--h);font-weight:700;font-size:16px;background:var(--acc);color:#0F0F14;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.small{min-height:46px;font-size:14px;border-radius:14px}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.row{display:flex;gap:10px}
.mut{color:var(--mut)}
/* start */
.tiles{position:relative;height:232px;margin:4px -6px 8px}
.tile{position:absolute;padding:12px 16px;border-radius:18px;font-family:var(--h);font-weight:700;font-size:15px;color:#0F0F14;animation:float 6s ease-in-out infinite;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg)*-1))}}
.big{font-size:clamp(34px,10vw,46px);margin:6px 0 12px}
.big span{color:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{padding:8px 13px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600}
.chip b{color:var(--lime)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:auto}
/* theory */
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--card2);transition:.3s}
.dots i.on{width:26px;background:var(--acc)}
.tcard{background:var(--card);border-radius:28px;padding:24px 22px;flex:1;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;position:relative;overflow:hidden}
.tcard .tg{align-self:flex-start;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#0F0F14}
.tcard h2{font-size:30px}
.tcard p{font-size:18px}
.tcard .exm{background:var(--card2);border-radius:18px;padding:16px;font-size:18px}
.tcard .exm i{font-style:normal;font-weight:700;color:var(--acc)}
.tcard .nt{font-size:15px;color:var(--mut)}
.blob{position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;opacity:.18}
/* game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .lv{flex:1;min-width:0}
.top .lv small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.top .lv b{font-family:var(--h);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc)}

    var ord2=optOrder(T,key,T.o.length);
    ord2.forEach(function(oi,k){var b=el('<button class="opt"><span class="n">'+"АБВГ"[k]+'</span><span>'+esc(T.o[oi])+'</span></button>');b.dataset.i=oi;
      b.addEventListener("click",function(){Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(x){x.disabled=true;if(+x.dataset.i===T.a)x.classList.add("ok");});if(oi!==T.a)b.classList.add("bad");answer(oi===T.a,b,box);});box.appendChild(b);});
  }
}
function answer(ok,b,box){
  var c=curTask(),T=c.T;
  if(T.t==="tf"){Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(x){x.disabled=true;var v=x.textContent==="Верно";if(v===T.a)x.classList.add("ok");});if(!ok&&b)b.classList.add("bad");}
  var res=S.res[S.level];
  if(S.phase==="main"){res[c.ti]=ok;if(!ok){S.retry.push(c.ti);S.mistakes.push({lv:S.level,ti:c.ti});}}
  else if(ok){res[c.ti]="fixed";}
  if(ok){S.streak++;S.best=Math.max(S.best,S.streak);var pts=S.phase==="main"?10:5;if(S.streak>=3)pts+=2;S.score+=pts;confetti();vib(40);}
  else{S.streak=0;vib([30,60,30]);}
  S.answered=true;store();
  sheet(ok,T);
}
function rightText(T){
  if(T.t==="tf")return "Правильно: «"+(T.a?"Верно":"Неверно")+"»";
  if(T.t==="multi")return "Верные варианты: "+T.s.map(function(x){return x[1]?"«"+x[0]+"»":null;}).filter(Boolean).join(" ");
  return "Правильно: «"+T.o[T.a]+"»";
}
var sheetEl=null,veil=null;
function closeSheet(now){if(sheetEl){sheetEl.remove();sheetEl=null;}if(veil){veil.remove();veil=null;}}
function sheet(ok,T){
  veil=el('<div class="veil"></div>');app.appendChild(veil);
  var good=["Верно!","В точку!","Огонь!","Чётко!","Так держать!"];
  var h='<div class="sheet '+(ok?"good":"badr")+'"><div class="bar"></div><h3>'+(ok?good[Math.floor(Math.random()*good.length)]:"Почти!")+'</h3>';
  if(!ok)h+='<div class="ans">'+esc(rightText(T))+'</div>';
  if(T.t==="multi"){h+='<ul>'+T.s.map(function(x){return '<li class="'+(x[1]?"y":"n")+'">'+esc(x[0])+' — <span class="mut">'+esc(x[2])+'</span></li>';}).join("")+'</ul>';}
  else h+='<p>'+esc(T.e)+'</p>';
  h+='<p class="mut" style="font-size:14px">📌 '+esc(RULES[T.r])+'</p><p class="joke">'+esc(T.j)+'</p></div>';
  sheetEl=el(h);app.appendChild(sheetEl);
  sheetEl.appendChild(btn("Дальше →","",nextTask));
  requestAnimationFrame(function(){requestAnimationFrame(function(){veil.classList.add("on");sheetEl.classList.add("on");});});
}
function nextTask(){
  S.answered=false;S.pos++;
  var list=S.phase==="main"?S.orders[S.level]:S.retry;
  if(S.pos>=list.length){
    if(S.phase==="main"&&S.retry.length){S.phase="retry";S.pos=0;render();toast("Второй заход: ошибки возвращаются!");return;}
    var res=S.res[S.level],n=LEVELS[S.level].tasks.length,ok=0;for(var k in res)if(res[k]===true)ok++;
    var p=ok/n;S.stars[S.level]=p>=0.9?3:p>=0.7?2:1;S.screen="lvdone";render();return;
  }
  render();
}
function lvdone(){
  var L=LEVELS[S.level];setAcc(L.accent);S.resume="lvdone";
  var res=S.res[S.level],ok=0,n=L.tasks.length;for(var k in res)if(res[k]===true)ok++;
  var st=S.stars[S.level],stars="";for(var i=0;i<3;i++)stars+='<span class="'+(i<st?"":"off")+'">★</span>';
  var nx=LEVELS[S.level+1];
  var phr=st===3?"Чистая победа!":st===2?"Хорошо! Ещё чуть-чуть до идеала.":"Уровень пройден — ошибки разобраны, это главное.";
  var s=mount('<section class="scr"><div class="center"><span class="lvnum">Уровень '+L.id+' пройден</span><div class="stars" style="color:'+L.accent+'">'+stars+'</div><h2>'+phr+'</h2>'+
   '<div class="stat"><div><b>'+ok+'/'+n+'</b><small>с первой попытки</small></div><div><b>★ '+S.score+'</b><small>всего очков</small></div></div>'+
   (nx?'<div class="qcard" style="width:100%;text-align:left;margin-top:6px;border:1px solid '+nx.accent+'55"><div class="qk" style="color:'+nx.accent+'">Дальше: уровень '+nx.id+(nx.boss?" · БОСС":"")+'</div><b style="font-family:var(--h)">'+nx.name+'</b><p class="mut" style="font-size:15px">'+nx.teaser+'</p></div>':'')+
   '</div><div class="stack"></div></section>');
  s.querySelector(".stack").appendChild(btn(nx?"Следующий уровень →":"К финалу →","",function(){if(nx){S.level++;goLevelIntro();}else{S.screen="final";S.done=true;render();}}));
}
function resultText(){
  var tot=S.stars.reduce(function(a,b){return a+b;},0);
  var lines=["Тренажёр «Средства выразительности речи» (задание 11 ОГЭ)","Очки: "+S.score+" · Звёзды: "+tot+" из 12 · Лучшая серия: "+S.best];
  LEVELS.forEach(function(L,i){var ok=0;for(var k in S.res[i])if(S.res[i][k]===true)ok++;lines.push("Уровень "+L.id+" «"+L.name+"»: "+ok+"/"+L.tasks.length+" с первой попытки, звёзд: "+S.stars[i]);});
  if(S.mistakes.length){lines.push("Ошибки:");S.mistakes.forEach(function(m){var T=LEVELS[m.lv].tasks[m.ti];lines.push("— ур. "+(m.lv+1)+": "+taskLabel(T)+" → "+RULES[T.r]);});}
  else lines.push("Ошибок нет!");
  return lines.join("\n");
}
function taskLabel(T){return T.t==="friend"?T.m:T.t==="tf"?T.q:T.t==="multi"?T.q.replace(/<[^>]+>/g,""):(T.ex?T.ex:T.q);}
function fin(){
  setAcc("#D6FF3F");S.resume="final";
  var tot=S.stars.reduce(function(a,b){return a+b;},0),stars="";for(var i=0;i<3;i++)stars+='<span class="'+(i<Math.round(tot/4)?"":"off")+'">★</span>';
  var mist=S.mistakes.map(function(m){var T=LEVELS[m.lv].tasks[m.ti];return '<div><b>'+esc(taskLabel(T))+'</b><span>'+esc(RULES[T.r])+'</span></div>';}).join("");
  var s=mount('<section class="scr"><div class="scroll" style="flex:1"><div class="center" style="justify-content:flex-start;padding-top:10px"><span class="lvnum">Финал</span><h1 style="font-size:32px">Все образы пойманы!</h1>'+
   '<div class="stars" style="color:var(--lime)">'+stars+'</div><div class="stat"><div><b>★ '+S.score+'</b><small>очков</small></div><div><b>'+tot+'/12</b><small>звёзд за уровни</small></div><div><b>🔥 '+S.best+'</b><small>лучшая серия</small></div><div><b>'+S.mistakes.length+'</b><small>ошибок в первом заходе</small></div></div>'+
   (mist?'<h3 style="align-self:flex-start;margin-top:8px">Над чем поработать</h3><div class="mist">'+mist+'</div>':'<p>Ни одной ошибки. Босс просит реванша 😅</p>')+
   '<div class="manual" style="width:100%"></div></div></div><div class="stack" style="margin-top:14px"></div></section>');
  var st=s.querySelector(".stack");
  st.appendChild(btn("Отправить результат учителю","",function(){
    var txt=resultText(),done=function(){toast("Скопировано! Вставь в чат с учителем");},
      fail=function(){var m=s.querySelector(".manual");m.innerHTML='<p class="mut" style="margin:10px 0 6px;font-size:14px">Скопировать автоматически не вышло — выдели текст и скопируй вручную:</p>';var ta=document.createElement("textarea");ta.value=txt;ta.readOnly=true;m.appendChild(ta);ta.focus();ta.select();};
    try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){legacy(txt)?done():fail();});}else{legacy(txt)?done():fail();}}catch(e){fail();}
  }));
  st.appendChild(btn("Пройти ещё раз","ghost",function(){S=fresh(true);S.screen="theory";render();}));
}
function legacy(txt){try{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();return ok;}catch(e){return false;}}
function cheat(){
  veil=el('<div class="veil"></div>');app.appendChild(veil);
  var h='<div class="sheet cheat"><div class="bar"></div><h3>Шпаргалка</h3>'+THEORY.map(function(T){return '<h4 style="color:'+T.c+'">'+T.h+'</h4><p>'+T.p+'</p>';}).join("")+
   '<h4>Алгоритм задания 11</h4><p>1. Прочитай задание. 2. Вспомни, что значит термин и какие условия искать. 3. Анализируй каждое высказывание. 4. Выпиши от 2 до 4 номеров.</p></div>';
  sheetEl=el(h);app.appendChild(sheetEl);
  sheetEl.appendChild(btn("Понятно, назад","ghost",function(){closeSheet();}));
  veil.addEventListener("click",function(){closeSheet();});
  requestAnimationFrame(function(){requestAnimationFrame(function(){veil.classList.add("on");sheetEl.classList.add("on");});});
}
/* ---------- boot ---------- */
S=load();
if(!S||S.v!==1)S=fresh(false);
var resumeScreen=S.screen;
if(resumeScreen!=="start"&&!S.done){S.resume=resumeScreen;S.screen="start";}
if(S.done){S.screen="final";}
render();
})();
</script>
</body>
</html>
