<title>Гласные в суффиксах причастий</title>

<style>
:root{--bg:#0F0F14;--card:#1B1B24;--card2:#272732;--text:#F6F5F0;--muted:#A9A8B8;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--orange:#FFA347;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
h1,h2,h3,.uf{font-family:Unbounded,Onest,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:-.01em;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.lime{color:var(--lime)}.blue{color:var(--blue)}.pink{color:var(--pink)}.orange{color:var(--orange)}
.small{font-size:14px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border-radius:16px;background:var(--lime);color:#14140F;font-family:Unbounded,Onest,sans-serif;font-weight:700;font-size:15px;transition:transform .12s;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.blue{background:var(--blue);color:#06202b}.btn.pink{background:var(--pink);color:#2b0718}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.gapv{height:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:7px 12px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600}
.chip.l{background:var(--lime);color:#111}.chip.b{background:var(--blue);color:#06202b}.chip.p{background:var(--pink);color:#2b0718}.chip.o{background:var(--orange);color:#2b1503}
.hero{text-align:center;padding-top:18px}
.hero h1{font-size:25px;line-height:1.18;margin:8px 0 6px}
.capa{width:150px;height:auto;display:block;margin:0 auto}
.capa.sm{width:60px;flex:none;margin:0}
details.th{background:var(--card);border-radius:16px;margin:10px 0;overflow:hidden}
details.th summary{list-style:none;cursor:pointer;padding:15px 16px;font-family:Unbounded,Onest,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
details.th summary::-webkit-details-marker{display:none}
details.th summary::after{content:'+';margin-left:auto;color:var(--lime);font-size:22px;line-height:1}
details.th[open] summary::after{content:'–'}
details.th .tb{padding:0 16px 16px}
.ex{background:var(--card2);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px;line-height:1.6}
.scheme{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.scheme div{background:var(--card2);border-radius:12px;padding:10px;font-size:15px;line-height:1.45}
.scheme b{display:block;font-family:Unbounded,sans-serif;font-size:13px;margin-bottom:4px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:10px 0 8px}
.topr{display:flex;align-items:center;gap:8px}
.lvl{flex:1;min-width:0;font-family:Unbounded,sans-serif;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{background:var(--card2);padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.help{width:40px;height:40px;border-radius:50%;background:var(--card2);font-family:Unbounded,sans-serif;font-weight:800;font-size:17px;color:var(--lime);flex:none}
.segs{display:flex;gap:4px;margin-top:10px}
.seg{flex:1;height:7px;border-radius:4px;background:var(--card2)}
.seg.ok{background:var(--lime)}.seg.bad{background:var(--pink)}.seg.half{background:var(--orange)}.seg.cur{background:var(--blue)}
.phase{font-size:13px;color:var(--orange);font-weight:700;margin-top:6px;min-height:18px}
.q{font-family:Unbounded,sans-serif;font-size:18px;line-height:1.3;font-weight:700;margin:4px 0 12px}
.sent{background:var(--card2);border-radius:14px;padding:14px 16px;font-size:19px;line-height:1.55;margin-bottom:14px;overflow-wrap:anywhere}
.phrase{font-family:Unbounded,sans-serif;font-size:21px;text-align:center;padding:22px 12px;background:var(--card2);border-radius:16px;margin-bottom:14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opts.duo{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-size:17px;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.opts.duo .opt{justify-content:center;text-align:center;font-weight:700}
.opt .let{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#33333f;font-weight:800;font-size:14px;color:var(--orange)}
.opt:not([disabled]):hover{border-color:#44445a}
.opt.good{border-color:var(--lime);background:#2b3313}.opt.bad{border-color:var(--pink);background:#3a1a2a}
.words{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;font-size:19px;line-height:1.3;background:var(--card2);border-radius:14px;padding:14px 12px;margin-bottom:14px}
.w{padding:7px 10px;border-radius:10px;background:#33333f;border:2px solid transparent;font-size:18px}
.w.sel{background:var(--blue);color:#06202b;font-weight:700}
.w.good{border-color:var(--lime)}.w.miss{border-color:var(--lime);border-style:dashed}.w.bad{background:var(--pink);color:#2b0718}
.gtext{background:var(--card2);border-radius:14px;padding:16px 14px;font-size:20px;line-height:2.1;margin-bottom:14px;overflow-wrap:anywhere}
.gp{display:inline-grid;place-items:center;min-width:34px;height:38px;padding:0 6px;margin:0 2px;border-radius:9px;background:#3a3a4a;border:2px dashed #6a6a80;font-weight:800;font-size:20px;line-height:1;color:var(--muted);vertical-align:middle}
.gp.on{background:var(--blue);border:2px solid var(--blue);color:#06202b}
.gp.good{background:var(--lime);border-color:var(--lime);color:#111}.gp.bad{background:var(--pink);border-color:var(--pink);color:#2b0718}
.inp{width:100%;min-height:56px;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid #44445a;font-size:19px;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--blue)}
.inp.good{border-color:var(--lime)}.inp.bad{border-color:var(--pink)}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s;pointer-events:none}
.sheet.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1);pointer-events:auto}
.sheet .in{max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0009;border-top:3px solid var(--lime);max-height:78vh;overflow:auto}
.sheet.no .in{border-top-color:var(--pink)}.sheet.try .in{border-top-color:var(--orange)}
.verdict{font-family:Unbounded,sans-serif;font-size:21px;font-weight:800;color:var(--lime);margin-bottom:6px}
.sheet.no .verdict{color:var(--pink)}.sheet.try .verdict{color:var(--orange)}
.why{background:var(--card2);border-radius:14px;padding:12px 14px;margin:10px 0}
.why b.t{display:block;font-family:Unbounded,sans-serif;font-size:13px;color:var(--blue);margin-bottom:4px}
.joke{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:10px;margin:12px 0;font-size:15px}
.spacer{height:0;transition:height .3s}
.modal{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .in{background:var(--bg);border-radius:20px;max-width:528px;width:100%;padding:16px;max-height:85vh;overflow:auto}
.stars{font-size:44px;letter-spacing:6px;text-align:center;margin:8px 0;color:var(--lime)}
.stars .off{opacity:.2}
.mist{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.mist b{color:var(--lime)}
textarea.res{width:100%;min-height:180px;background:var(--card2);color:var(--text);border:2px solid var(--blue);border-radius:12px;padding:10px;font:14px/1.4 Onest,sans-serif;margin-top:10px}
.toast{position:fixed;left:50%;top:16px;visibility:hidden;transform:translate(-50%,-300%);background:var(--lime);color:#111;font-weight:700;padding:10px 16px;border-radius:999px;z-index:40;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:25;pointer-events:none;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.sheet{transition:none}}
@media (min-width:700px){.q{font-size:20px}.hero h1{font-size:29px}}
.nojs{max-width:560px;margin:40px auto;padding:20px;background:#1B1B24;border-radius:18px;color:#F6F5F0;font-family:Onest,sans-serif}
</style>
</head>

 "text": "выкач{а}нная из бассейна вода", "opts": ["а", "е"], "ex": "Воду качали: выкачать (на -ать) → выкачанная.", "hint": "Воду насосом катят или качают?", "joke": ""}, {"type": "gap", "q": "Вставь пропущенную букву.", "text": "замеш{е}нное тесто", "opts": ["а", "е"], "ex": "Тесто месят: замесить (на -ить) → замешенное.", "hint": "Тесто замешивают руками — это глагол «замесить» или «замешать»?", "joke": "Капа помогает месить тесто. Тесто против."}, {"type": "choice", "q": "В каком слове ошибка?", "opts": ["надеявшийся", "обидевший", "засеивший"], "a": 2, "ex": "Правильно: засеявший — от «засеять», перед -вш- та же гласная, что перед -ть.", "hint": "Назови инфинитив каждого слова.", "joke": ""}, {"type": "gap", "q": "Вставь пропущенную букву.", "text": "друг, ненавид{я}щий спойлеры", "opts": ["ю", "я"], "ex": "Ненавидеть — исключение на -еть, II спряжение (ненавидят) → ненавидящий.", "hint": "Вспомни 7 глаголов-исключений на -еть.", "joke": "Капа тоже ненавидит спойлеры. Особенно про арбуз."}, {"type": "gap", "q": "Вставь пропущенную букву.", "text": "пикник, завис{я}щий от погоды", "opts": ["ю", "я"], "ex": "Зависеть — исключение на -еть, II спряжение (зависят) → зависящий.", "hint": "Зависеть — в списке исключений на -еть?", "joke": ""}]}, {"name": "Босс: Капа-Автокорректор", "short": "Босс", "color": "#FFA347", "boss": true, "intro": "Финальный босс! Смешанные задания и тексты с ошибками. Каждое правило урока — в деле.", "tasks": [{"type": "pick", "q": "Отметь все слова с ошибками.", "words": ["Таящий", "снег", "и", "клеющий", "объявления", "дворник", "—", "приметы", "весны."], "a": [0, 3], "ex": "Правильно: тающий (таять — I спр., тают) и клеящий (клеить — II спр., клеят).", "hint": "Ошибок две. Проверь оба причастия по спряжению.", "joke": "Весна! Капа снимает шарф.", "multi": true}, {"type": "choice", "q": "Какое слово написано верно?", "opts": ["обидивший", "обидевший", "обидявший"], "a": 1, "ex": "Обидеть → обидевший: перед -вш- та же гласная, что перед -ть.", "hint": "Инфинитив: обид…ть.", "joke": ""}, {"type": "gap", "q": "Вставь пропущенную букву.", "text": "рассе{я}нный по полю овёс", "opts": ["е", "я"], "ex": "Рассеять — на -ять → перед -нн- пишем я: рассеянный.", "hint": "Глагол рассе…ть — на -ять или на -ить?", "joke": ""}, {"type": "input", "q": "Впиши слово целиком, вставив букву.", "word": "колебл_мый", "a": ["колеблемый"], "ex": "Колебать — I спряжение (колеблют) → колеблемый.", "hint": "Колебать — не исключение. Значит, спряжение?", "joke": "", "ph": "Впиши слово целиком"}, {"type": "choice", "q": "Где все слова написаны верно?", "opts": ["слышимый, видимый, гонимый", "слышемый, видимый, гонимый", "слышимый, видемый, гонимый"], "a": 0, "ex": "Слышать, видеть, гнать — все три исключения II спряжения → -им-.", "hint": "Все три глагола — исключения. Какого спряжения?", "joke": ""}, {"type": "gap", "q": "Вставь пропущенную букву.", "text": "Ветер, ве{ю}щий с моря, принёс запах соли.", "opts": ["ю", "я"], "ex": "Веять — I спряжение (веют) → веющий.", "hint": "Веять — на -ять, а не на -ить. Значит, спряжение?", "joke": "Капа нюхает морской ветер. Пахнет приключениями."}, {"type": "input", "q": "Образуй страдательное причастие прошедшего времени от глагола «нарисовать».", "word": "", "a": ["нарисованный"], "ex": "Нарисовать — на -ать → а перед -нн-: нарисованный.", "hint": "Суффикс -нн-, перед ним — гласная из инфинитива на -ать.", "joke": "", "ph": "Например: прочитанный"}, {"type": "pick", "q": "Отметь слово с ошибкой.", "words": ["Мальчик,", "построевший", "шалаш,", "позвал", "друзей,", "надеявшихся", "на", "чай."], "a": [1], "ex": "Правильно: построивший — от «построить», перед -вш- та же гласная, что перед -ть. «Надеявшихся» написано верно.", "hint": "Найди причастия и назови их инфинитивы.", "joke": "Шалаш построен, чай налит. Босс повержен!", "multi": false}]}], "theory": [{"title": "Спряжение — главный ключ", "html": "<p><b class=\"lime\">II спряжение<\/b>: все глаголы на <b>-ить<\/b> (кроме <i>брить, стелить<\/i>), 7 на -еть (<i>смотреть, видеть, ненавидеть, терпеть, обидеть, вертеть, зависеть<\/i>) и 4 на -ать (<i>гнать, держать, дышать, слышать<\/i>).<\/p><p><b class=\"blue\">I спряжение<\/b> — все остальные: <i>читать, колоть, бороться, таять, брить<\/i>.<\/p><div class=\"ex\">Проверка: они стро<b>я<\/b>т (II) · они та<b>ю<\/b>т (I)<\/div>"}, {"title": "Суффиксы настоящего времени", "html": "<div class=\"scheme\"><div><b class=\"blue\">I спряжение<\/b>-ущ- / -ющ-<br>-ем-<br><i>пишущий, тающий, читаемый<\/i><\/div><div><b class=\"pink\">II спряжение<\/b>-ащ- / -ящ-<br>-им-<br><i>дышащий, строящий, гонимый<\/i><\/div><\/div><p class=\"small\">Гласная суффикса — та же, что в окончании «они …»: чита<b>ю<\/b>т → чита<b>ю<\/b>щий.<\/p>"}, {"title": "Гласная перед -вш-", "html": "<p>Перед <b class=\"lime\">-вш-<\/b> пишем ту же гласную, что перед <b>-ть<\/b> в инфинитиве.<\/p><div class=\"ex\">кле<b>и<\/b>ть → кле<b>и<\/b>вший<br>слыш<b>а<\/b>ть → слыш<b>а<\/b>вший<br>наде<b>я<\/b>ться → наде<b>я<\/b>вшийся<br>обид<b>е<\/b>ть → обид<b>е<\/b>вший<\/div>"}, {"title": "Гласная перед -нн-", "html": "<div class=\"scheme\"><div><b class=\"orange\">-ать, -ять<\/b>→ а, я<br><i>посеять → посеянный<br>написать → написанный<\/i><\/div><div><b class=\"lime\">-ить, -еть<\/b>→ е<br><i>построить → построенный<br>увидеть → увиденный<\/i><\/div><\/div><p class=\"small\">Ловушка: выкатить → выкаченная бочка, выкачать → выкачанная вода.<\/p>"}]};

/* gap-текст: {верно|вариант2|...} */
function parseGap(t){var parts=[],re=/\{([^}]*)\}/g,last=0,m;while((m=re.exec(t.text))){parts.push({s:t.text.slice(last,m.index)});parts.push({g:m[1].split('|')[0]});last=re.lastIndex;}parts.push({s:t.text.slice(last)});return parts;}
function gapRight(t){return parseGap(t).filter(function(p){return 'g' in p;}).map(function(p){return p.g;});}
function gapFilled(t,vals){return parseGap(t).map(function(p){if('s' in p)return p.s;var v=vals.shift();return v===undefined||v===null?'_':v;}).join('');}
function norm(x){return String(x).toLowerCase().replace(/ /g,' ').replace(/[«»"]/g,'').replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'').trim();}
function answerText(t){if(t.type==='choice'||t.type==='duo')return t.opts[t.a];if(t.type==='pick')return t.a.map(function(i){return t.words[i].replace(/[.,!?»«]/g,'');}).join(', ');if(t.type==='gap')return gapFilled(t,gapRight(t));if(t.type==='input')return t.a[0];return '';}
function taskTitle(t){var x=t.q;if(t.sentence)x+=' «'+t.sentence+'»';if(t.phrase)x+=' «'+t.phrase+'»';if(t.type==='pick')x+=' «'+t.words.join(' ')+'»';if(t.type==='gap')x+=' «'+gapFilled(t,[])+'»';if(t.type==='input'&&t.word)x+=' «'+t.word+'»';return x;}
function okCount(l){var f=S.first[l]||{},n=0;for(var k in f)if(f[k])n++;return n;}
function starsFor(l){var r=okCount(l)/LV[l].tasks.length;return r>=0.9?3:r>=0.7?2:r>=0.4?1:0;}

  (saved?'<button class="btn" id="cont">Продолжить с места остановки</button><div class="gapv"></div><button class="btn ghost" id="restart">Начать заново</button>':'<button class="btn" id="go">Поехали!</button>'));

function renderTask(){var l=LV[S.lvl],t=l.tasks[S.pos];cur={t:t,sel:[],vals:[]};
  var b='<div class="card"><div class="q">'+esc(t.q)+'</div>';
  if(t.sentence)b+='<div class="sent">'+esc(t.sentence)+'</div>';
  if(t.phrase)b+='<div class="phrase">'+esc(t.phrase)+'</div>';
  if(t.type==='choice'||t.type==='duo')b+='<div class="opts'+(t.type==='duo'?' duo':'')+'">'+t.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+(t.type==='choice'?'<span class="let">'+'АБВГД'[i]+'</span>':'')+'<span>'+esc(o)+'</span></button>';}).join('')+'</div>';
  if(t.type==='pick')b+='<div class="hint">'+(t.multi?'Можно отметить несколько слов.':'Отметь одно слово.')+'</div><div class="words">'+t.words.map(function(w,i){return '<button class="w" data-i="'+i+'">'+esc(w)+'</button>';}).join('')+'</div><button class="btn" id="check" disabled>Проверить</button>';
  if(t.type==='gap'){var gi=0;b+='<div class="hint">Нажимай на пропуск — буква меняется: '+t.opts.map(esc).join(' → ')+'.</div><div class="gtext">'+parseGap(t).map(function(p){if('s' in p)return esc(p.s);var k=gi++;cur.vals.push(null);return '<button class="gp" data-g="'+k+'" aria-label="Пропуск '+(k+1)+'">?</button>';}).join('')+'</div><button class="btn" id="check" disabled>Проверить</button>';}
  if(t.type==='input')b+=(t.word?'<div class="phrase">'+esc(t.word)+'</div>':'')+'<input class="inp" id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(t.ph||'Впиши ответ')+'"><button class="btn" id="check" disabled>Проверить</button>';
  b+='</div><div class="spacer" id="spacer"></div>';
  h(topbar()+b);bindHelp();
  if(S.answered&&S.last){cur.sel=S.last.sel||[];cur.vals=S.last.vals||[];if(t.type==='input')$('#inp').value=S.last.txt||'';showResult(S.last.ok,true);return;}
  $$('.opt').forEach(function(x){x.onclick=function(){check(+x.dataset.i);};});
  $$('.w').forEach(function(x){x.onclick=function(){if(S.answered)return;var i=+x.dataset.i,k=cur.sel.indexOf(i);if(t.multi){if(k>=0)cur.sel.splice(k,1);else cur.sel.push(i);}else cur.sel=k>=0?[]:[i];$$('.w').forEach(function(y){y.classList.toggle('sel',cur.sel.indexOf(+y.dataset.i)>=0);});$('#check').disabled=!cur.sel.length;};});
  $$('.gp').forEach(function(x){x.onclick=function(){if(S.answered)return;var g=+x.dataset.g,v=cur.vals[g],k=t.opts.indexOf(v);var nv=(k<0)?t.opts[0]:(k+1<t.opts.length?t.opts[k+1]:null);cur.vals[g]=nv;x.textContent=nv===null?'?':(nv===''?'∅':nv);x.classList.toggle('on',nv!==null);$('#check').disabled=cur.vals.some(function(q){return q===null;});};});
  var inp=$('#inp');if(inp){inp.oninput=function(){$('#check').disabled=!inp.value.trim();};inp.onkeydown=function(e){if(e.key==='Enter'&&inp.value.trim())check(null);};}
  var c=$('#check');if(c)c.onclick=function(){check(null);};}
function same(a,b){a=a.slice().sort();b=b.slice().sort();return a.length===b.length&&a.every(function(x,i){return x===b[i];});}
function check(choice){if(S.answered)return;var t=cur.t,ok,txt='';
  if(t.type==='choice'||t.type==='duo'){ok=choice===t.a;cur.sel=[choice];}
  else if(t.type==='pick')ok=same(cur.sel,t.a);
  else if(t.type==='gap'){var r=gapRight(t);ok=cur.vals.every(function(v,i){return v===r[i];});}
  else if(t.type==='input'){txt=$('#inp').value;var n=norm(txt);ok=t.a.some(function(x){return norm(x)===n;});}
  var L=S.lvl,ti=S.pos;
  if(S.tr===0){S.first[L][ti]=ok;if(ok)S.score+=10;}else{S.second[L][ti]=ok;if(ok)S.score+=5;}
  S.answered=true;S.last={ok:ok,sel:cur.sel.slice(),vals:cur.vals.slice(),txt:txt};save();showResult(ok,false);}
function paint(){var t=cur.t,ok=S.last.ok,final=ok||S.tr===1;
  if(t.type==='choice'||t.type==='duo')$$('.opt').forEach(function(b){var i=+b.dataset.i;b.disabled=true;if(final&&i===t.a)b.classList.add('good');else if(cur.sel.indexOf(i)>=0)b.classList.add(i===t.a?'good':'bad');});
  if(t.type==='pick'){$$('.w').forEach(function(b){var i=+b.dataset.i,s=cur.sel.indexOf(i)>=0,r=t.a.indexOf(i)>=0;b.disabled=true;if(final){b.classList.remove('sel');if(s&&r)b.classList.add('good','sel');else if(s)b.classList.add('bad');else if(r)b.classList.add('miss');}});$('#check').style.display='none';}
  if(t.type==='gap'){var r=gapRight(t);$$('.gp').forEach(function(b){var g=+b.dataset.g;b.disabled=true;if(final){var v=cur.vals[g];b.textContent=r[g]===''?'∅':r[g];b.classList.remove('on');b.classList.add(v===r[g]?'good':'bad');}});$('#check').style.display='none';}
  if(t.type==='input'){var inp=$('#inp');inp.disabled=true;inp.classList.add(ok?'good':'bad');$('#check').style.display='none';}}
function showResult(ok,restored){var t=cur.t;paint();
  var html;
  if(ok){sheet.className='sheet show';html='<div class="verdict">'+(S.tr?'Со второй попытки — засчитано!':GOOD[(S.pos+S.lvl)%GOOD.length])+'</div><div class="why"><b class="t">Почему так</b>'+esc(t.ex)+'</div>'+(t.joke?'<div class="joke">'+CAPA.happySm+'<div>'+esc(t.joke)+'</div></div>':'')+'<button class="btn" id="nextBtn">Дальше →</button>';}

  else{sheet.className='sheet show no';html='<div class="verdict">Пока не получилось</div><p><b>Верно:</b> '+esc(answerText(t))+'</p><div class="why"><b class="t">Почему так</b>'+esc(t.ex)+'</div><button class="btn" id="nextBtn">Дальше →</button>';}
  sheetIn.innerHTML=html;

function next(){S.answered=false;S.last=null;S.tr=0;S.pos++;if(S.pos>=LV[S.lvl].tasks.length)S.screen='levelEnd';save();render();}
function mistakes(){var r=[];LV.forEach(function(l,i){var f=S.first[i]||{},s=S.second[i]||{};l.tasks.forEach(function(t,ti){if(f[ti]===false)r.push({t:t,lvl:i,fixed:s[ti]===true});});});return r;}
function resultText(){var d=new Date();var lines=['Тренажёр «'+META.title+'» ('+META.lesson+')','Ученица: '+(S.name||'—'),'Дата: '+d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'Очки: '+S.score+' из '+maxScore()];
  LV.forEach(function(l,i){lines.push('Уровень '+(i+1)+' «'+l.name+'»: с первой попытки '+okCount(i)+' из '+l.tasks.length+', звёзды '+starsFor(i)+' из 3');});
  var m=mistakes();lines.push(m.length?'Ошибки с первой попытки ('+m.length+'):':'Ошибок с первой попытки нет!');
  m.forEach(function(x,i){lines.push((i+1)+'. [ур. '+(x.lvl+1)+'] '+taskTitle(x.t)+' → верно: '+answerText(x.t)+(x.fixed?' (исправлено со второй попытки)':' (и со второй — ошибка)'));});
  return lines.join('\n');}
function renderFinal(){var m=mistakes(),tot=0;LV.forEach(function(_,i){tot+=starsFor(i);});
  h('<div class="hero">'+CAPA.party+'<h1>Тренажёр пройден!</h1><div class="chips" style="justify-content:center"><span class="chip l">★ '+S.score+' из '+maxScore()+'</span><span class="chip b">Звёзды: '+tot+' из '+(LV.length*3)+'</span></div></div>'+
  '<div class="card">'+LV.map(function(l,i){return '<div class="row" style="align-items:center;margin:6px 0"><span>Ур. '+(i+1)+' · '+esc(l.short)+'</span><span style="flex:none;color:var(--lime)">'+'★'.repeat(starsFor(i))+'<span style="opacity:.2">'+'★'.repeat(3-starsFor(i))+'</span> '+okCount(i)+'/'+l.tasks.length+'</span></div>';}).join('')+'</div>'+
  '<div class="card"><h3 style="font-size:15px">'+(m.length?'Над чем ещё поработать':'Ни одной ошибки с первой попытки!')+'</h3>'+(m.length?m.map(function(x){return '<div class="mist">'+esc(taskTitle(x.t))+'<br><b>Верно:</b> '+esc(answerText(x.t))+(x.fixed?' <span class="small">· исправлено</span>':'')+'</div>';}).join(''):'<p class="small">Капа в шоке. В хорошем смысле.</p>')+'</div>'+
  '<div class="card"><label for="nm" class="uf" style="font-size:14px;display:block;margin-bottom:8px">Твоё имя</label><input class="inp" id="nm" type="text" autocomplete="given-name" placeholder="Например, Аня" value="'+esc(S.name||'')+'"><button class="btn" id="send">Отправить результат учителю</button><div id="sendBox"></div></div>'+
  '<button class="btn ghost" id="again">Пройти ещё раз</button>');
  $('#nm').oninput=function(){S.name=this.value.trim();save();};
  $('#send').onclick=sendResult;
  $('#again').onclick=function(){var nm=S.name;clearSave();S=fresh();S.name=nm;S.started=true;startLevel(0);};}
function copyText(txt,done){function fb(){var ok=false;try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){ok=false;}done(ok);}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){done(true);},fb);}else fb();}catch(e){fb();}}
function sendResult(){S.name=$('#nm').value.trim();save();if(!S.name){toast('Впиши имя — учитель должен знать, чей результат');$('#nm').focus();return;}
  var txt=resultText();
  var tg='https://t.me/share/url?url='+encodeURIComponent(META.url)+'&text='+encodeURIComponent(txt);
  var ml='mailto:?subject='+encodeURIComponent('Результат тренажёра: '+META.title+' — '+S.name)+'&body='+encodeURIComponent(txt);
  var box=document.getElementById('sendBox');
  box.innerHTML='<p class="small" style="margin:14px 0 8px">Результат готов. Отправь его учителю удобным способом:</p><a class="btn blue" id="tg" href="'+tg+'" target="_blank" rel="noopener">Отправить в Telegram</a><div class="gapv"></div><a class="btn pink" id="ml" href="'+ml+'">Отправить на почту</a><div class="gapv"></div><button class="btn ghost" id="cp">Скопировать результат</button><textarea class="res" id="resTxt" readonly></textarea>';
  document.getElementById('resTxt').value=txt;
  document.getElementById('cp').onclick=function(){copyText(txt,function(ok){if(ok)toast('Скопировано! Вставь в чат с учителем');else{toast('Не получилось — выдели текст ниже и скопируй');var ta=document.getElementById('resTxt');try{ta.focus();ta.select();}catch(e){}}});};
  box.scrollIntoView({behavior:'smooth',block:'start'});}
var toastT;function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2600);}
function confetti(){var cols=['#D6FF3F','#4CC9FF','#FF6DB0','#FFA347'];for(var i=0;i<30;i++){var c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];c.style.animationDelay=Math.random()*0.3+'s';c.style.animationDuration=(1+Math.random()*0.8)+'s';document.body.appendChild(c);setTimeout((function(el){return function(){el.remove();};})(c),2300);}}
function openCheat(){document.getElementById('cheat').innerHTML=theoryHtml(false);document.getElementById('modal').classList.add('show');document.getElementById('closeCheat').focus();}
document.getElementById('closeCheat').onclick=function(){document.getElementById('modal').classList.remove('show');};
document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')this.classList.remove('show');};
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('modal').classList.remove('show');});
window.__kapa={data:DATA,state:function(){return S;}};
var saved=load();
if(saved){S=saved;S.resume=(S.screen==='start')?'intro':S.screen;S.screen='start';}else S=fresh();
render();
})();
</script>
