:root{
  --bg1:#fff6dc;--bg2:#dff1ff;--ink:#1e3a8a;--ink2:#334155;--orange:#f97316;--orange2:#ffb547;
  --green:#16a34a;--green-bg:#dcfce7;--red-soft:#fee2e2;--blue:#0ea5e9;--card:#ffffff;--gold:#f59e0b;
  --shadow:0 6px 0 rgba(30,58,138,.12),0 10px 24px rgba(30,58,138,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"NunitoK","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;height:52px;flex:0 0 auto}
.lvl{flex:1;font-weight:900;font-size:17px;line-height:1.1;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl small{display:block;font-weight:700;font-size:13px;color:#64748b;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:#cbd5e1;display:block}
.dots i.ok{background:var(--green)}.dots i.cur{background:var(--orange)}
.stars{display:flex;align-items:center;gap:4px;background:#fff;border-radius:20px;padding:5px 12px;font-weight:900;font-size:20px;box-shadow:var(--shadow)}
.stars b{font-size:22px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:22px;cursor:pointer;flex:0 0 auto}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:10px}
.kris-row{display:flex;align-items:flex-end;gap:8px;flex:0 0 auto;min-height:0}
.kris-row img{height:clamp(70px,14vh,120px);width:auto;flex:0 0 auto}
.bubble{position:relative;background:#fff;border-radius:18px;padding:9px 13px;font-weight:800;font-size:18px;line-height:1.25;box-shadow:var(--shadow);margin-bottom:12px;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;text-align:center;flex:0 0 auto}
.q{font-size:clamp(26px,7vw,28px);font-weight:800;color:var(--ink2);line-height:1.2}
.big{font-size:clamp(26px,7.6vw,34px);font-weight:900;line-height:1.2;margin-top:6px;color:var(--ink)}
.big.long{font-size:clamp(26px,6.9vw,28px)}
.opts{display:grid;gap:10px;margin-top:auto;padding-top:12px}
.opts.c2{grid-template-columns:1fr 1fr}
.btn{min-height:64px;border:0;border-radius:20px;background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:clamp(20px,6vw,28px);
  box-shadow:0 5px 0 #bfdbfe,0 8px 18px rgba(14,165,233,.18);cursor:pointer;padding:6px 10px;transition:transform .08s;touch-action:manipulation;border:3px solid #bae6fd}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #bfdbfe}
.btn.small{font-size:clamp(17px,5vw,22px)}
.btn.ok{background:var(--green-bg);border-color:var(--green);color:#065f46}
.btn.no{background:var(--red-soft);border-color:#fca5a5;color:#7f1d1d}
.btn.main{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 5px 0 #c2410c,0 8px 18px rgba(249,115,22,.3)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 5px 0 #0369a1}
.btn:disabled{opacity:.6}
.slots{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap;min-height:58px}
.slot{min-width:52px;height:58px;border-radius:14px;border:3px dashed #93c5fd;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;background:#f8fafc;padding:0 6px}
.slot.full{border-style:solid;border-color:var(--orange);background:#fff7ed;cursor:pointer}
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.tiles .btn{min-width:72px}
.tiles .btn.used{visibility:hidden}
.fb{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.fb .msg{background:#fff;border-radius:20px;padding:12px 14px;font-size:20px;font-weight:800;line-height:1.3;box-shadow:var(--shadow);text-align:center}
.fb .msg.good{background:var(--green-bg);color:#065f46}
.fb .msg .ans{display:block;font-size:26px;font-weight:900;color:var(--green);margin-top:4px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:0}
.center img{height:clamp(120px,30vh,230px)}
h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1.15;font-weight:1000}
h2{margin:0;font-size:clamp(24px,7vw,32px);font-weight:900}
.lead{font-size:clamp(19px,5.2vw,23px);font-weight:700;color:var(--ink2);line-height:1.3;margin:0}
.rule{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);font-size:clamp(20px,5.6vw,24px);font-weight:800;line-height:1.3}
.rule .ex{display:block;margin-top:8px;font-size:clamp(19px,5.2vw,22px);color:#0f766e}
.rule .ex b{color:var(--orange)}
.col{display:flex;flex-direction:column;gap:10px;width:100%}
.starfield{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;font-size:34px;max-width:300px}
.center img.sm{height:clamp(64px,14vh,120px)}
.starfield span{animation:tw 1.2s ease-in-out infinite alternate}
@keyframes tw{from{transform:scale(.8);opacity:.7}to{transform:scale(1.1);opacity:1}}
.fly{position:fixed;z-index:50;font-size:44px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-0.3,.7,1),opacity .8s;will-change:transform}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.result{background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);font-size:18px;font-weight:700;width:100%}
textarea{width:100%;height:120px;font:inherit;font-size:15px;border-radius:12px;border:2px solid #93c5fd;padding:8px}
.toast{position:fixed;left:50%;top:64px;max-width:90vw;text-align:center;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;font-size:18px}
noscript div{margin:20px;padding:20px;background:#fff;border-radius:20px;font-size:22px;font-weight:800;text-align:center}
@media (max-height:600px){.kris-row img{height:66px}.bubble{font-size:16px;padding:7px 11px}.card{padding:10px 12px;margin-top:6px}.opts{gap:8px}.center img{height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- storage ---------- */
function load(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function del(k){try{window.localStorage.removeItem(k)}catch(e){}}
var st=null;
function fresh(){return {phase:"start",level:0,queue:[],pos:0,stars:0,first:{},wrong:{},done:false,started:Date.now()}}
function persist(){save(KEY,JSON.stringify(st))}
function restore(){try{var s=JSON.parse(load(KEY)||"null");if(s&&s.queue)return s}catch(e){}return null}

/* ---------- sound ---------- */
var muted=load(MUTEKEY)==="1", actx=null, bufs={}, decoding={};
var T=window.__snd={state:"none",decoded:{},errors:[],plays:[],started:0,fallback:0};
function b64buf(d){var b=atob(d.split(",")[1]);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function decode(name){
  if(!actx||bufs[name]||decoding[name])return; decoding[name]=1;
  var done=false;
  function ok(buf){if(done)return;done=true;bufs[name]=buf;T.decoded[name]=true}
  function bad(e){if(done)return;done=true;decoding[name]=0;T.errors.push(name+": "+(e&&e.message||e))}
  try{var p=actx.decodeAudioData(b64buf(SND[name]),ok,bad);if(p&&p.then)p.then(ok,bad)}catch(e){bad(e)}
}
function unlock(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!actx&&AC){actx=new AC()}
    if(actx){
      if(actx.state!=="running"&&actx.resume){var r=actx.resume();if(r&&r.then)r.then(function(){T.state=actx.state},function(){})}
      var b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start?s.start(0):s.noteOn(0);
      T.state=actx.state; decode("zvezda"); decode("fanfary");
    }
  }catch(e){T.errors.push("unlock: "+e.message)}
}
function play(name){
  if(muted)return; T.plays.push(name);
  try{
    if(actx&&bufs[name]){
      if(actx.state!=="running"&&actx.resume)actx.resume();
      var s=actx.createBufferSource();s.buffer=bufs[name];s.connect(actx.destination);s.start?s.start(0):s.noteOn(0);T.started++;T.state=actx.state;return;
    }
  }catch(e){T.errors.push("play: "+e.message)}
  try{var a=new Audio(SND[name]);T.fallback++;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
}
var sndBtn=document.getElementById("snd");
function drawSnd(){sndBtn.textContent=muted?"🔇":"🔊";sndBtn.setAttribute("aria-label",muted?"Звук выключен":"Звук включён")}
sndBtn.addEventListener("click",function(){muted=!muted;save(MUTEKEY,muted?"1":"0");drawSnd();if(!muted){unlock()}});
drawSnd();
document.addEventListener("pointerdown",function(){if(!actx||actx.state!=="running")unlock()},{passive:true});

/* ---------- helpers ---------- */
var scr=document.getElementById("screen");
function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){if(k==="cls")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function kimg(n,alt){return h("img",{src:KRIS[n],alt:alt||"Крис",draggable:"false"})}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function setStars(){document.getElementById("starCount").textContent=st.stars}
function header(){
  var L=LEVELS[st.level]; var lv=document.getElementById("lvl");
  if(st.phase!=="task"&&st.phase!=="levelintro"){lv.innerHTML="Тренажёр<small>Местоимение, числительное</small>";return}
  var dots=h("div",{cls:"dots"});
  L.tasks.forEach(function(t){var c=st.first[t.id]!==undefined&&(st.queue.indexOf(t.id,st.pos)===-1)?"ok":"";dots.appendChild(h("i",{cls:c}))});
  lv.innerHTML="";lv.appendChild(document.createTextNode(L.name));lv.appendChild(h("small",{},[L.title]));lv.appendChild(dots);
}
function show(nodes){scr.innerHTML="";nodes.forEach(function(n){scr.appendChild(n)});header();setStars()}
function toast(t){var e=h("div",{cls:"toast"},[t]);document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}

/* ---------- screens ---------- */
function startScreen(){
  st.phase="start";
  var saved=restore(), canContinue=saved&&!saved.done&&saved.phase!=="start";
  var col=h("div",{cls:"col"});
  if(canContinue){
    col.appendChild(h("button",{cls:"btn main",id:"go-continue",onclick:function(){unlock();st=saved;resume()}},["Продолжить ▶"]));
    col.appendChild(h("button",{cls:"btn",id:"go-new",onclick:function(){unlock();st=fresh();persist();remind(0)}},["Начать заново"]));
  }else{
    col.appendChild(h("button",{cls:"btn main",id:"go",onclick:function(){unlock();st=fresh();persist();remind(0)}},["Поехали! ▶"]));
  }
  show([h("div",{cls:"center"},[kimg("wave","Крис машет"),h("h1",{},["Привет! Я Крис!"]),
    h("p",{cls:"lead"},[canContinue?"Есть сохранённая игра — продолжим с того же места?":"Поиграем в местоимения и числительные? Собери все звёзды!"]),
    h("p",{cls:"lead",style:"font-size:16px"},["🔊 Включи звук на телефоне"]),col])]);
}
function remind(i){
  st.phase="remind";st.ri=i;persist();
  var R=[{t:"[М]естоимение указывает на предмет, но не называет его.",ex:["Кошка спит → <b>Она</b> спит.","Ребята поют → <b>Они</b> поют."]},
         {t:"[И]мя числительное называет количество (сколько?) или порядок при счёте (который по счёту?).",ex:["три зайца — <b>сколько?</b>","третий урок — <b>который по счёту?</b>"]}][i];
  var rule=h("div",{cls:"rule",html:R.t.replace(/\[(.)\]/,"$1")+R.ex.map(function(x){return '<span class="ex">'+x+"</span>"}).join("")});
  show([h("div",{cls:"center"},[h("h2",{},["Вспомним с Крисом "+(i+1)+"/2"]),kimg("explain","Крис объясняет"),rule,
    h("button",{cls:"btn main",id:"next",style:"width:100%",onclick:function(){if(i===0)remind(1);else levelIntro(0)}},[i===0?"Дальше →":"Начинаем! ▶"])])]);
}
function levelIntro(l){
  st.phase="levelintro";st.level=l;st.queue=LEVELS[l].tasks.map(function(t){return t.id});st.pos=0;persist();
  var L=LEVELS[l];
  show([h("div",{cls:"center"},[kimg(l===2?"surprised":"happy","Крис"),h("h1",{},[L.name]),h("p",{cls:"lead"},["«"+L.title+"» — "+L.tasks.length+" заданий"]),
    l===2?h("p",{cls:"lead"},["Самые хитрые задания! Справишься?"]):null,
    h("button",{cls:"btn main",id:"next",style:"width:100%",onclick:function(){st.phase="task";task()}},["Вперёд! ▶"])])]);
}
function findTask(id){for(var l=0;l<3;l++)for(var i=0;i<LEVELS[l].tasks.length;i++)if(LEVELS[l].tasks[i].id===id)return LEVELS[l].tasks[i]}
function task(){
  st.phase="task";persist();
  if(st.pos>=st.queue.length){return levelDone()}
  var t=findTask(st.queue[st.pos]);window.__cur=t;
  var bubble=h("div",{cls:"bubble"},[t.type==="tf"?"Как думаешь, это правда?":t.type==="build"?"Касайся слогов или букв по порядку!":"Как думаешь, какой ответ верный?"]);
  var card=h("div",{cls:"card"},[h("div",{cls:"q"},[t.q]),t.big?h("div",{cls:"big"+(t.big.length>22?" long":"")},[t.big]):null]);
  var nodes=[h("div",{cls:"kris-row"},[kimg("happy"),bubble]),card];
  if(t.type==="build"){
    var slots=h("div",{cls:"slots"}),tiles=h("div",{cls:"tiles"}),picked=[];
    t.a.forEach(function(){slots.appendChild(h("div",{cls:"slot"}))});
    var order=shuffle(t.parts.map(function(p,i){return i}));
    order.forEach(function(i){var b=h("button",{cls:"btn","data-part":t.parts[i],onclick:function(){if(b.classList.contains("used"))return;b.classList.add("used");picked.push({i:i,b:b});drawSlots();if(picked.length===t.a.length){var got=picked.map(function(p){return t.parts[p.i]});answer(t,got.join("")===t.a.join(""),b,got.join(""))}}},[t.parts[i]]);tiles.appendChild(b)});
    function drawSlots(){Array.prototype.forEach.call(slots.children,function(s,k){s.textContent=picked[k]?t.parts[picked[k].i]:"";s.className="slot"+(picked[k]?" full":"");s.onclick=picked[k]?function(){var p=picked.splice(k);p.forEach(function(x){x.b.classList.remove("used")});drawSlots()}:null})}
    card.appendChild(slots);nodes.push(tiles);
  }else{
    var opts=t.type==="tf"?["Верно","Неверно"]:t.opts;
    var long=opts.some(function(o){return o.length>9});
    var grid=h("div",{cls:"opts"+((t.type==="odd"||t.type==="tf"||(t.type==="letter"))?" c2":"")});
    if(t.type==="letter")grid.className="opts";
    if(t.type==="letter")grid.style.gridTemplateColumns="repeat("+opts.length+",1fr)";
    opts.forEach(function(o){var b=h("button",{cls:"btn"+(long?" small":""),"data-opt":o,onclick:function(){answer(t,o===t.a,b,o)}},[t.type==="tf"?(o==="Верно"?"✔ Верно":"✘ Неверно"):o]);grid.appendChild(b)});
    nodes.push(grid);
  }
  show(nodes);
}
var busy=false;
function answer(t,ok,btn,given){
  if(busy)return;busy=true;
  var first=st.first[t.id]===undefined; if(first)st.first[t.id]=ok;
  Array.prototype.forEach.call(scr.querySelectorAll(".opts .btn,.tiles .btn"),function(b){b.disabled=true});
  if(ok){
    btn.classList.add("ok");st.stars++;play("zvezda");flyStar(btn);
    st.pos++;persist();
    var fb=h("div",{cls:"fb"},[h("div",{cls:"msg good",id:"fb-msg"},[rnd(PRAISE)+" +1 ⭐"])]);
    scr.querySelector(".kris-row img").src=KRIS[rnd(["cheer","praise"])];
    scr.querySelector(".bubble").textContent=rnd(PRAISE);
    setTimeout(function(){busy=false;task()},1400);
  }else{
    btn.classList.add("no");
    st.wrong[t.id]=(st.wrong[t.id]||0)+1;
    if(st.queue.indexOf(t.id,st.pos+1)===-1)st.queue.push(t.id);
    st.pos++;persist();
    scr.querySelector(".kris-row img").src=KRIS.think;
    scr.querySelector(".bubble").textContent="Не беда — разберёмся вместе!";
    var good=t.ans||(t.type==="tf"?t.a:t.a);
    var area=scr.querySelector(".opts")||scr.querySelector(".tiles");
    var fb=h("div",{cls:"fb"},[h("div",{cls:"msg",id:"fb-msg"},[rnd(CHEER),h("span",{cls:"ans"},[good]),t.ex]),
      h("button",{cls:"btn blue",id:"fb-next",onclick:function(){busy=false;task()}},["Понятно →"])]);
    area.replaceWith(fb);
    var sl=scr.querySelector(".slots");if(sl)sl.style.display="none";
  }
}
function flyStar(btn){
  try{
    var r=btn.getBoundingClientRect(),c=document.getElementById("starCount").getBoundingClientRect();
    var s=h("div",{cls:"fly"},["⭐"]);s.style.left=(r.left+r.width/2-22)+"px";s.style.top=(r.top+r.height/2-22)+"px";document.body.appendChild(s);
    requestAnimationFrame(function(){requestAnimationFrame(function(){s.style.transform="translate("+(c.left-r.left-r.width/2+10)+"px,"+(c.top-r.top-r.height/2+4)+"px) scale(.5)";s.style.opacity=".3"})});
    setTimeout(function(){s.remove();setStars();var sc=document.querySelector(".stars");sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop")},820);
  }catch(e){setStars()}
}
function levelDone(){
  var l=st.level;
  if(l===2)return finish();
  st.phase="leveldone";persist();
  show([h("div",{cls:"center"},[kimg("praise","Крис хвалит"),h("h1",{},[LEVELS[l].name+" пройден!"]),h("p",{cls:"lead"},["Звёзд уже: "+st.stars+" ⭐"]),
    h("button",{cls:"btn main",id:"next",style:"width:100%",onclick:function(){if(l===1)breakScreen();else levelIntro(l+1)}},["Дальше →"])])]);
}
function breakScreen(){
  st.phase="break";persist();
  var n=9,field=h("div",{cls:"starfield"});for(var i=0;i<n;i++){var sp=h("span",{},["⭐"]);sp.style.animationDelay=(i*0.13)+"s";field.appendChild(sp)}
  var grid=h("div",{cls:"opts",style:"grid-template-columns:repeat(3,1fr);width:100%"});
  [8,9,10].forEach(function(v){var b=h("button",{cls:"btn","data-opt":String(v),onclick:function(){
      Array.prototype.forEach.call(grid.children,function(x){x.disabled=true});
      b.classList.add(v===n?"ok":"no");
      msg.textContent=v===n?"Верно, их 9! Отдохнули — вперёд!":"Их 9! Отдохнули — вперёд!";
      if(v===n)play("zvezda");
      go.style.visibility="visible"}},[String(v)]);grid.appendChild(b)});
  var msg=h("p",{cls:"lead",id:"break-msg"},["Посчитай звёздочки! Сколько их?"]);
  var go=h("button",{cls:"btn main",id:"next",style:"width:100%;visibility:hidden",onclick:function(){levelIntro(2)}},["На Супер-уровень! ▶"]);
  show([h("div",{cls:"center"},[h("h2",{},["Мини-переменка!"]),(function(){var i=kimg("surprised","Крис удивлён");i.className="sm";return i})(),field,msg,grid,go])]);
}
function resultText(){
  var firstOk=0,errs=[];
  LEVELS.forEach(function(L){L.tasks.forEach(function(t){if(st.first[t.id]===true)firstOk++;else errs.push(t.id+" («"+(t.big||t.q)+"» → "+(t.ans||t.a)+")")})});
  var d=new Date();
  return "Тренажёр «Местоимение и имя числительное» (3 класс)\nРезультат: пройдены все 3 уровня ("+TOTAL+" заданий).\nЗвёзд собрано: "+st.stars+".\nВерно с первой попытки: "+firstOk+" из "+TOTAL+".\n"+
    (errs.length?"Были ошибки (потом исправлены): "+errs.join("; ")+".":"Ошибок не было!")+"\nДата: "+d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function finish(){
  st.phase="final";st.done=true;persist();
  play("fanfary");
  var txt=resultText();window.__result=txt;
  var area=h("div",{cls:"col",id:"sendArea"});
  show([h("div",{cls:"center"},[h("h1",{},["Ты молодец!"]),kimg("cheer","Крис ликует"),
    h("div",{cls:"stars",style:"font-size:30px;padding:8px 18px"},["⭐ "+st.stars]),
    h("p",{cls:"lead"},["Все уровни пройдены! Крис гордится тобой."]),
    h("button",{cls:"btn main",id:"send",style:"width:100%",onclick:function(){copy(txt,area)}},["📨 Отправить результат учителю"]),
    area,
    h("button",{cls:"btn",id:"again",style:"width:100%",onclick:function(){st=fresh();persist();remind(0)}},["🔄 Играть ещё раз"])])]);
}
function copy(txt,area){
  function manual(){area.innerHTML="";area.appendChild(h("p",{cls:"lead",style:"font-size:17px"},["Скопируй текст и отправь учителю:"]));var ta=h("textarea",{id:"resultBox",readonly:"readonly"});ta.value=txt;area.appendChild(ta);ta.focus();ta.select();window.__copied="manual"}
  function done(){toast("Скопировано! Вставь в сообщение учителю.");window.__copied="clipboard";area.innerHTML="";area.appendChild(h("p",{cls:"lead",style:"font-size:17px"},["✅ Результат скопирован. Отправь его учителю в мессенджере."]))}
  function legacy(){try{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();if(ok)done();else manual()}catch(e){manual()}}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,legacy)}else legacy()}catch(e){legacy()}
}
function resume(){
  setStars();
  switch(st.phase){
    case "remind":return remind(st.ri||0);
    case "levelintro":return levelIntro(st.level);
    case "task":return task();
    case "leveldone":return levelDone();
    case "break":return breakScreen();
    default:return remind(0);
  }
}
st=fresh();startScreen();
})();
</script>
</body>
