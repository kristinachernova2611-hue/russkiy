:root{--bg:#0F0F14;--c1:#1B1B24;--c2:#272732;--tx:#F6F5F0;--mut:#A9A9BA;--lime:#D6FF3F;--blue:#4CC9FF;--pink:#FF6DB0;--orange:#FFA347;--ac:var(--lime)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;color:var(--tx);background:var(--bg);font:400 17px/1.45 Onest,sans-serif;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
h1,h2,h3{font-family:Unbounded,sans-serif;line-height:1.18;margin:0 0 12px}
h1{font-size:clamp(30px,9.4vw,48px)}h2{font-size:23px}h3{font-size:15px;margin-top:4px}
p{margin:0 0 12px}
[hidden]{display:none!important}
#app{width:100%;max-width:640px;min-height:100vh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px}
.bar{display:flex;align-items:center;gap:8px}
.lvl{flex:1;min-width:0;font-weight:700;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-weight:700;white-space:nowrap}.score i{font-style:normal;color:var(--ac)}
.ib{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--c2);font-weight:700;display:grid;place-items:center;padding:0}
.ib.on{background:var(--ac);color:var(--bg)}
.seg{display:flex;gap:3px;margin-top:8px}.seg i{flex:1;height:6px;border-radius:4px;background:var(--c2)}
.seg i.ok{background:var(--ac)}.seg i.no{background:#777789}.seg i.now{background:var(--tx)}
main{flex:1;display:flex;flex-direction:column;padding:12px 16px 28px;min-width:0}
main.center{justify-content:center}
.card{background:var(--c1);border-radius:22px;padding:18px;margin-bottom:12px;min-width:0}
.tag{display:inline-block;font-size:12px;color:var(--mut);margin-bottom:8px}
.tag b{color:var(--ac)}
.q{font-weight:700;font-size:19px;line-height:1.35;margin-bottom:12px}
.txt{background:var(--c2);border-radius:16px;padding:14px;margin-bottom:12px;white-space:pre-line}
.txt.long{font-size:16px}
.big{font-size:23px;font-weight:700;text-align:center;line-height:1.3;padding:18px 12px}
.hl{color:var(--ac);font-weight:700}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:56px;text-align:left;background:var(--c2);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin-top:8px}

ричастие пришло с компанией, поэтому НЕ стоит отдельно.","id":"T22"},{"l":3,"src":"demo13","n":13,"b":"O","kind":"one","q":"Как пишется НЕ с выделенным словом?","text":"Закрытые шлюзы высоко подняли воду, образовав (НЕ)ШИРОКИЙ, но глубокий затон.","opts":["слитно","раздельно"],"ans":0,"why":"Слитно: неширокий, но глубокий. Союз НО здесь соединяет разные признаки, а не противопоставляет их.","joke":"Затон неширокий, зато глубокий. Как хороший друг.","id":"T23"},{"l":3,"src":"4958B4","n":15,"b":"O","kind":"input","q":"На месте каких цифр пишется НН? Запиши цифры без пробелов.","text":"До наших дней в архивах сохранились подли(1)ые счета, предъявле(2)ые художнику за доставле(3)ые ему масля(4)ые краски.","ans":["123"],"free":true,"why":"НН: подлинные, предъявленные, доставленные. Одна Н: масляные краски (суффикс -ян-).","joke":"Масляные краски экономят на Н.","id":"T24"},{"l":3,"src":"4DAc5F","n":17,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"Девочки (1) осторожно приоткрыв (2) дверь (3) на цыпочках пробрались к своим любимым (4) местам.","ans":["13"],"free":true,"why":"Деепричастный оборот «осторожно приоткрыв дверь» выделяется с двух сторон: 1 и 3.","joke":"Оборот, как дверь: открывается и закрывается.","id":"T25"},{"l":3,"src":"33848D","n":18,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"Такая жизнь (1) вероятно (2) Вареньке наскучила, ей (3) конечно (4) хотелось своего угла. (По А.П. Чехову)","ans":["1234"],"free":true,"why":"«Вероятно» и «конечно» здесь вводные слова. Каждое выделяется с двух сторон.","joke":"Вводные слова любят личное пространство.","id":"T26"},{"l":3,"src":"F83e19","n":19,"b":"P","kind":"friend","chat":true,"q":"Друг прислал ответ к заданию. Что с ним не так?","text":"Крик этой таинственной птицы слышали каждую весну, но не знали (1) какая она (2) и (3) где (4) живёт.","msg":"смотри, у меня 12, вроде изи","opts":["Лишняя цифра 2","Лишняя цифра 1","Ещё нужна цифра 4","Ошибки нет"],"ans":0,"why":"Ответ: 1. «Какая она» и «где живёт» — однородные придаточные с одиночным И, запятой между ними нет.","joke":"Другу спасибо за уверенность, запятую вернуть на склад.","id":"T27"},{"l":4,"src":"282412","n":12,"b":"O","kind":"multi","q":"В каких рядах в обоих словах пропущена одна и та же буква?","opts":["завис..шь, ответ..вший","вспомн..шь, колебл..мый","бор..шься, вытащ..нный","наряд..шься, обиж..нный","повенч..нный, (вещи) высуш..тся"],"ans":"135","why":"1: И (зависишь — глагол-исключение, ответивший). 3: Е (борешься, вытащенный). 5: А (повенчанный, высушатся). Причастие проверяем по инфинитиву.","joke":"Зависеть — глагол-исключение. От него многое зависит.","id":"T28"},{"l":4,"src":"demo13b","n":13,"b":"O","kind":"multi","q":"Где НЕ (НИ) с выделенным словом пишется СЛИТНО?","opts":["Наш сосед никогда не заботился (НИ)(О)КОМ, кроме себя.","(НЕ)ОСОЗНАВАЯ сути правил коммуникации, люди пользуются ими каждый день.","Самостоятельно осваивать технологию обработки металла и получать профессию кузнеца – очень (НЕ)ПРОСТОЕ занятие.","Я не любитель романтических комедий и лёгких мелодрам, поэтому фильм я так и (НЕ)ДОСМОТРЕЛ до конца.","Стоит выйти на крыльцо, как осень начнёт дышать в лицо горьким запахом первого тонкого льда, сковавшего (НЕ)ПОДВИЖНЫЕ воды."],"ans":"35","why":"3: очень непростое. 5: неподвижные. Ловушки: ни о ком, не осознавая, не досмотрел до конца (это НЕ и приставка до-).","joke":"Недосмотреть за котом и не досмотреть сериал: две разные беды.","id":"T29"},{"l":4,"src":"demo14","n":14,"b":"O","kind":"multi","q":"Где оба выделенных слова пишутся СЛИТНО?","opts":["Моя лучшая подруга – очень пунктуальный человек: она всегда приходит (НА)ВСТРЕЧИ (ВО)ВРЕМЯ.","(ОТ)ТОГО берега отошла лодка, которая (В)СЛЕДСТВИЕ сильного течения не смогла пристать к берегу.","Вера, которая была на (ПОЛ)ГОЛОВЫ выше сестры, всегда носила одну и ту же причёску: она зачёсывала волосы (НА)БОК.","Стены ТАК(ЖЕ), как и потолок, были (С)НАЧАЛА оштукатурены, а потом расписаны художником.","Нельзя идти (НА)ПЕРЕКОР природе, ЧТО(БЫ) не сожалеть впоследствии о результатах."],"ans":"35","why":"3: полголовы, набок. 5: наперекор, чтобы. Ловушки: на встречи (существительное), от того берега, так же как.","joke":"На встречи ходят, навстречу бегут.","id":"T30"},{"l":4,"src":"57cA81","n":16,"b":"P","kind":"multi","q":"Где нужно поставить ОДНУ запятую?","opts":["Ни усталость ни скука ни на минуту не могли согнать с лица Ильи Ильича мягкость.","Командир дивизиона стал у входа в актовый зал и тысяча огней играла на серебряной резьбе его шашки.","Турбин не удержался поднял крышку парты и присел.","На лестнице показалась фигурка и медленно полезла по ступеням вверх.","Мы искали в тексте не только антонимы но и синонимы омонимы."],"ans":"123","why":"1: ни усталость, ни скука. 2: две основы. 3: не удержался, поднял и присел. В 4 запятая не нужна, в 5 их две.","joke":"Считай основы, а не вдохи.","id":"T31"},{"l":4,"src":"A37A1D","n":17,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"Незнакомец (1) только что вошедший в ворота (2) посмотрел с удивлением Лемму вслед (3) и (4) вглядевшись в Лизу (5) подошёл прямо к ней.","ans":["1245"],"free":true,"why":"1, 2 — причастный оборот, 4, 5 — деепричастный. 3 не нужна: И соединяет сказуемые «посмотрел и подошёл».","joke":"Незнакомец вошёл, а запятая за ним нет.","id":"T32"},{"l":4,"src":"demo18","n":18,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"Некоторым студентам (1) видимо (2) не пришло в голову обсудить совместные доклады, поэтому (3) их выступления (4) к сожалению (5) не пользовались успехом.","ans":["1245"],"free":true,"why":"Вводные: видимо, к сожалению. «Поэтому» вводным словом не является, цифра 3 не нужна.","joke":"«Поэтому» только притворяется вводным.","id":"T33"},{"l":4,"src":"36FB6c","n":19,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"Когда я шёл по набережной (1) меня поразила мелодия (2) которой я прежде не слышал (3) и (4) которую хотелось повторять и повторять.","ans":["12"],"free":true,"why":"1 и 2 — границы придаточных. Между однородными придаточными «которой…» и «которую…» одиночное И, запятой нет.","joke":"Два «которых» и одно И: мирное соседство.","id":"T34"},{"l":4,"src":"Bc4600","n":20,"b":"P","kind":"input","q":"На месте каких цифр должны стоять запятые? Запиши цифры без пробелов.","text":"У человека есть одна родина (1) и (2) куда бы ни забросила (3) его судьба (4) он не смеет забыть свой край, свой город.","ans":["124"],"free":true,"why":"1 — граница частей сложного предложения. 2 и 4 выделяют придаточное «куда бы ни забросила его судьба». Стык «и куда»: дальше нет ТО, значит, запятая есть.","joke":"Куда бы ни забросила судьба, ищи основу.","id":"T35"},{"l":4,"src":"demo21","n":21,"b":"P","kind":"input","q":"В каких предложениях тире стоит по одному и тому же правилу? Запиши номера без пробелов.","text":"(1)Юрий Александрович Бычков – спецкор газеты «Советская культура», общественный деятель в области сохранения культурного наследия. (2)В 1967 году он оказался в Суздале. (3)Цель командировки – подготовить материал о том, как живут старинные российские города. (4)Когда материал был собран, Юрий Александрович решил вернуться в Москву не той дорогой, по которой ехал в Суздаль, а окружным путём – по ярославской трассе. (5)Владимир, Суздаль, Ярославль, Переславль-Залесский, Ростов Великий, Сергиев Посад, Кострому и Иваново – эти города посетил во время поездки Бычков. (6)По итогам командировки в газете «Советская культура» журналист Ю.А. Бычков опубликовал не единственную статью о Суздале, как планировалось изначально, а серию очерков под общим названием «Золотое кольцо», где каждому из городов посвятил отдельный материал. (7)В Москве он увидел, как блестят на солнце купола в Кремле, вспомнил очертания маршрута, по которому проехал, и то, как блестела рожь вдоль дорог, – так и родилось сочетание «Золотое кольцо».","ans":["13"],"free":true,"why":"1 и 3: тире между подлежащим и сказуемым. В остальных предложениях тире стоит по другим правилам.","joke":"Самое трудное задание тестовой части в 2026 году. Сова снимает шляпу за попытку.","id":"T36"},{"l":4,"src":"C74F7B","n":8,"b":"G","kind":"seq","q":"Какая ошибка в каком предложении? Для каждой буквы отметь цифру.","lr":[["нарушение связи между подлежащим и сказуемым","нарушение в построении предложения с причастным оборотом","нарушение в употреблении числительного","нарушение в построении предложения с однородными членами","нарушение в построении предложения с деепричастным оборотом"],["Детвора с утра резвились во дворе, не обращая внимания на прохожих.","Слушая пение птиц, мне было грустно.","Свернувшись на старом кресле и вздрагивая во сне, кот проспал весь день.","Удары конских копыт по сухой земле были первыми звуками, нарушившими утреннюю тишину.","Люди запасали топливо на зиму, погружённых в свои повседневные заботы.","Музей – это учреждение, занимающееся не только коллекционированием, но и хранением памятников старины.","Рассмотрение вопроса о нарушении правил дорожного движения двоими ученицами было перенесено на другой день.","Космонавт провёл на орбите четверо суток, выполнив запланированный объём работ.","Некоторые виды бамбука выращивают не столько ради практических целей, но и для красоты."]],"ans":"15792","why":"А–1: детвора резвилась. Б–5: люди, погружённые в заботы. В–7: двумя ученицами. Г–9: не столько…, сколько. Д–2: мне не может «слушать», нужно: когда я слушаю пение, мне грустно.","joke":"Девять предложений, пять ошибок, ноль паники.","id":"T37"},{"l":4,"src":"28B68c","n":22,"b":"T","kind":"seq","q":"Какое средство выразительности в каком примере?","ans":"86524","why":"А — риторический вопрос, Б — эпитет, В — многосоюзие, Г — риторическое восклицание, Д — метонимия (материал вместо вещей).","joke":"Пушкин одобряет. Сова уточняла.","lr":[["К чему бесплодно спорить с веком? (А.С. Пушкин)","Вдоль сонной улицы рядами\nДвойные фонари карет\nВесёлый изливают свет. (А.С. Пушкин)","Люблю я бешеную младость,\nИ тесноту, и блеск, и радость. (А.С. Пушкин)","Ах! Долго я забыть не мог… (А.С. Пушкин)","Фарфор и бронза на столе. (А.С. Пушкин)"],["гипербола","риторическое восклицание","риторическое обращение","метонимия","многосоюзие","эпитет","литота","риторический вопрос","бессоюзие"]],"id":"T38"},{"l":4,"src":"demo27k","n":27,"b":"E","kind":"tf","q":"Это правда по критериям ЕГЭ?","big":"Если позиция автора сформулирована неверно, за К1, К2 и К3 будет 0 баллов.","opts":["Верно","Неверно"],"ans":0,"why":"Так сказано в указании к К1. Поэтому сначала понимаем позицию автора, потом пишем.","joke":"Сначала навигатор, потом газ.","id":"T39"}],"levels":[["Разминка","Быстро, просто, без паники","#D6FF3F"],["Слова и смысл","Паронимы, формы слов и внимание к тексту","#4CC9FF"],["Буквы и запятые","Орфография и пунктуация","#FF6DB0"],["Босс: Ловушечник","Типичные ловушки по данным ФИПИ","#FFA347"]],"blocks":{"W":"Слова и ударения","G":"Грамматика","O":"Орфография","P":"Пунктуация","T":"Работа с текстом","E":"Сочинение"}};

      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.13, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .32);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .35);

}

let fxId = 0;
function stopFx() { fxId++; const c = document.getElementById('fx'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function confetti() {
  const my = ++fxId;
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('fx'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({length:70}, () => ({x:c.width / 2, y:c.height * .4, a:(Math.random() - .5) * 11, b:-Math.random() * 10 - 2, c:COL[Math.floor(Math.random() * 4)]}));
  let n = 0;
  (function step() {
    if (my !== fxId) return;
    x.clearRect(0, 0, c.width, c.height);
    if (++n > 70) return;
    P.forEach(p => { p.x += p.a; p.y += p.b; p.b += .4; x.fillStyle = p.c; x.fillRect(p.x, p.y, 7, 10); });
    requestAnimationFrame(step);

}

function optBtn(t, orig, shown) {

function ready(t) {
  const p = S.pick;
  if (t.kind === 'multi') return Array.isArray(p) && p.length > 0;

}

function rightText(t) {

function stats() {
  const all = D.tasks, B = {}, N = {};
  all.forEach(t => {
    const ok = S.res[t.id] && S.res[t.id].ok ? 1 : 0;
    B[t.b] = B[t.b] || [0, 0]; B[t.b][0] += ok; B[t.b][1]++;
    N[t.n] = N[t.n] || [0, 0]; N[t.n][0] += ok; N[t.n][1]++;
  });
  const names = f => Object.keys(D.blocks).filter(k => f(B[k][0] / B[k][1])).map(k => D.blocks[k]);
  return {B, N, ok:firstOk(all.map(t => t.id)), strong:names(p => p >= .8), grow:names(p => p < .8), wrong:all.filter(t => !(S.res[t.id] && S.res[t.id].ok))};

  } else if (S.scr === 'task') {
    cls = ''; const t = task();
    b = taskH(t) + (S.done ? sheetH(t) : '');
  } else if (S.scr === 'again') {
    b = `<div class="card center-t">${owl('ok')}<h2>Второй заход</h2><p>Заданий на повтор: ${S.queue.length}. Теперь у тебя есть правило, проверим его в деле.</p><p class="small">В карту уже записана первая попытка.</p></div><button class="btn" id="goRetry" data-a="goRetry">Попробовать ещё</button>`;
  } else if (S.scr === 'end') {
    const n = starsN(S.l);
    b = `<div class="card center-t">${owl(n === 3 ? 'wow' : 'wink')}<h2>${S.l === 3 ? 'Ловушечник позади!' : 'Уровень пройден!'}</h2><div class="stars" id="stars">${starsH(n)}</div><p>С первой попытки: ${firstOk(S.order[S.l])} из ${S.order[S.l].length}</p><p class="small">${['Точки роста найдены. Ради них и шли.', 'База есть, докрутим детали.', 'Сова аплодирует крыльями.'][n - 1]}</p></div><button class="btn" id="lvNext" data-a="lvNext">${S.l === 3 ? 'К короткой анкете' : 'Следующий уровень'}</button>`;
  } else if (S.scr === 'survey') {
    const i = S.sv.length;
    b = `<div class="card"><span class="tag">Анкета без оценок · ${i + 1}/${SURVEY.length}</span><h2>${esc(SURVEY[i][0])}</h2>${SURVEY[i][1].map((o, j) => `<button class="opt" data-a="survey" data-v="${j}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    cls = ''; b = finalH();
  }
  app.innerHTML = h + `<main class="${cls}">${b}</main>`;
  const sh = $('#sheet');
  if (sh) $('main').style.paddingBottom = sh.offsetHeight + 20 + 'px';
  const inp = $('#answer');
  if (inp && !S.done) {
    inp.addEventListener('input', () => { S.pick = inp.value; $('#check').disabled = !ready(task()); save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && ready(task())) check(); });
  }
  scrollTo(0, keep ? y : 0);
  save();
}

function check() {
  if (S.done) return;
  const t = task(), p = S.pick;
  if (!ready(t)) return;
  let ok, given;
  if (t.kind === 'multi') { given = p.slice().sort().join(''); ok = given === t.ans; }
  else if (t.kind === 'seq') { given = p.join(''); ok = given === t.ans; }
  else if (t.kind === 'input') {
    given = String(p).trim();
    if (t.free) ok = given.replace(/[\s,.;]/g, '').split('').sort().join('') === t.ans[0];
    else { const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, ''); ok = t.ans.some(a => norm(a) === norm(given)); }
  } else { given = t.opts[p]; ok = p === t.ans; }
  if (S.retry) {
    S.res[t.id].r = ok;
    if (ok) S.pts += 5;
  } else {
    S.res[t.id] = {ok, given};
    S.streak = ok ? S.streak + 1 : 0;
    S.best = Math.max(S.best, S.streak);
    if (ok) S.pts += S.streak >= 3 ? 12 : 10;
  }
  S.done = {ok};
  render(true);
  snd(ok ? 'ok' : 'no');
  if (ok) confetti();
  const n = $('#next'); if (n) n.focus({preventScroll:true});
}

const clear = () => { S.pick = null; S.cur = 0; S.done = null; };

function next() {
  stopFx();
  clear(); S.q++;
  if (S.q >= levelIds().length) {
    S.q = 0;
    const bad = S.order[S.l].filter(i => !S.res[i].ok);
    if (!S.retry && bad.length) { S.queue = bad; S.scr = 'again'; }
    else { S.retry = false; S.queue = []; S.scr = 'end'; }
  }
  render();
  if (S.scr === 'end') snd('level');
}

function modal(html) {
  closeM();
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m) closeM(); });
}
function closeM() { const m = $('#modal'); if (m) m.remove(); }
function toast(s) {
  const t = document.createElement('div');
  t.className = 'toast'; t.id = 'toast'; t.setAttribute('role', 'status'); t.textContent = s;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

async function send() {
  const s = report();
  try { await navigator.clipboard.writeText(s); toast('Скопировано! Вставь текст в сообщение учителю.'); return; } catch (e) {}
  try {
    const a = document.createElement('textarea');
    a.value = s; a.readOnly = true; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    const ok = document.execCommand('copy'); a.remove();
    if (ok) { toast('Скопировано! Вставь текст в сообщение учителю.'); return; }
  } catch (e) {}
  modal(`<h2>Скопируй результат</h2><p>Выдели весь текст, скопируй и отправь учителю.</p><textarea class="copy" id="manual" readonly>${esc(s)}</textarea><button class="btn ghost" data-a="close">Закрыть</button>`);
  $('#manual').select();
}

const ACT = {
  sound() {
    S.sound = !S.sound; save(); snd('on');
    const b = $('#sound');
    b.classList.toggle('on', S.sound); b.innerHTML = S.sound ? '♪' : '<s>♪</s>';
    b.setAttribute('aria-label', S.sound ? 'Звук включён, выключить' : 'Звук выключен, включить');
  },
  help() {
    const playing = S.scr === 'task' && !S.done;
    if (playing) { S.cheat++; save(); }
    modal(`<h2>Шпаргалка</h2><ul>${CHEAT[S.l].map(x => `<li>${esc(x)}</li>`).join('')}<li>Цифры записывай подряд, без пробелов и запятых.</li></ul>${playing ? '<p class="small">Заглядывать можно. Учитель увидит, сколько раз это помогало.</p>' : ''}<button class="btn" id="closeHelp" data-a="close">Понятно</button>`);
  },
  close: closeM,
  start() { S.scr = 'theory'; S.th = 0; render(); },
  thNext() { if (S.th < 3) S.th++; else { S.scr = 'intro'; S.l = 0; } render(); },
  thBack() { S.th = Math.max(0, S.th - 1); render(); },
  go() { S.scr = 'task'; S.q = 0; S.retry = false; clear(); render(); },
  goRetry() { S.scr = 'task'; S.q = 0; S.retry = true; clear(); render(); },
  pick(v) {
    if (S.done) return;
    const t = task();
    if (t.kind === 'multi') {
      const d = String(v + 1), p = Array.isArray(S.pick) ? S.pick.slice() : [];
      S.pick = p.includes(d) ? p.filter(x => x !== d) : p.concat(d);
      render(true);
    } else { S.pick = v; check(); }
  },
  letter(v) { S.cur = v; render(true); },
  digit(v) {
    if (S.done) return;
    const p = (S.pick || ['', '', '', '', '']).slice();
    p[S.cur] = String(v); S.pick = p;
    const e = p.findIndex(x => !x); if (e >= 0) S.cur = e;
    render(true);
  },
  check, next,
  lvNext() { stopFx(); if (S.l < 3) { S.l++; S.scr = 'intro'; } else { S.scr = 'survey'; S.sv = []; } render(); },
  survey(v) {
    S.sv.push(SURVEY[S.sv.length][1][v]);
    if (S.sv.length >= SURVEY.length) { S.scr = 'final'; render(); confetti(); snd('level'); } else render();
  },
  send,
  askReset() { modal('<h2>Начать заново?</h2><p>Текущий результат сотрётся. Сначала отправь его учителю. Задания перемешаются.</p><button class="btn" id="reset" data-a="reset">Да, перемешать</button><button class="btn ghost" data-a="close">Вернуться к результату</button>'); },
  reset() { stopFx(); closeM(); S = fresh(true, S.sound); S.scr = 'intro'; render(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  ACT[b.dataset.a](b.dataset.v === undefined ? undefined : +b.dataset.v);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
render();
})();
</script>
</body>
</html>
