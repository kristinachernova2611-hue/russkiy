:root{
  --bg:#fff8ec;--bg2:#ffefd6;--card:#ffffff;--ink:#3a2a1e;--soft:#8a6f5a;
  --orange:#f5821f;--orange-d:#d8670a;--blue:#2f8ff0;--blue-d:#1d6fc4;--green:#2fb86a;--green-d:#1f9152;
  --yellow:#ffc928;--yellow-d:#e0a800;--pink:#ff6fa8;--pink-d:#e04c8a;--red-soft:#ffe1e6;--ok-soft:#dcf7e6;
  --shadow:0 6px 0 rgba(0,0,0,.12),0 10px 24px rgba(180,110,40,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 10% 0%,#ffe6c2 0,transparent 40%),radial-gradient(circle at 100% 100%,#e2f1ff 0,transparent 45%);
  color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;color:inherit}
#app{height:100vh;height:100dvh;max-width:640px;margin:0 auto;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom));animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grow{flex:1 1 auto;min-height:0}
.center{justify-content:center;text-align:center}
.btn{min-height:68px;border-radius:22px;font-size:26px;padding:10px 26px;color:#fff;background:var(--orange);box-shadow:0 6px 0 var(--orange-d),0 10px 20px rgba(245,130,31,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-d),0 10px 20px rgba(47,143,240,.3)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d),0 10px 20px rgba(47,184,106,.3)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 6px 0 #e7d6c2,0 10px 20px rgba(0,0,0,.08)}
.btn.wide{width:100%;max-width:420px}
.kris{display:block;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(120,60,10,.2))}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:34px;line-height:1.1;margin:6px 0;font-weight:900}
h2{font-size:28px;line-height:1.15;margin:4px 0;font-weight:900}
.sub{font-size:24px;color:var(--soft);margin:4px 0 10px}
.bubble{background:#fff;border-radius:24px;padding:14px 18px;font-size:26px;line-height:1.2;box-shadow:var(--shadow);position:relative}
.stack{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}

/* top bar */
.top{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lvl{background:#fff;border-radius:16px;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap}
.lvl.super{background:linear-gradient(90deg,#ffd84d,#ff9bc4);}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#ead9c4}
.dot.ok{background:var(--green)}.dot.bad{background:var(--orange)}.dot.cur{outline:3px solid var(--blue);outline-offset:2px}
.stars{display:flex;align-items:center;gap:4px;background:#fff;border-radius:16px;padding:4px 10px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.star{width:26px;height:26px;display:inline-block}

/* task */
.host{display:flex;align-items:flex-end;gap:8px;width:100%}
.host img{width:78px;height:112px;flex:none}
.host .bubble{flex:1;font-size:26px;font-weight:900;padding:12px 16px}
.host .bubble:before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.sent{margin-top:14px;width:100%;background:#fff;border-radius:24px;padding:16px;font-size:30px;line-height:1.3;text-align:center;box-shadow:var(--shadow);font-weight:800}
.area{width:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:10px 0}
.opt{min-height:68px;border-radius:22px;font-size:26px;padding:10px 16px;background:#fff;box-shadow:0 6px 0 #e7d6c2;line-height:1.2;width:100%}
.opt.c0{background:#fff2e2;box-shadow:0 6px 0 #f5c38f}.opt.c1{background:#e6f2ff;box-shadow:0 6px 0 #a9cdf5}.opt.c2{background:#fff6d1;box-shadow:0 6px 0 #f0d26b}
.opt:active{transform:translateY(4px)}
.opt.right{background:var(--ok-soft)!important;box-shadow:0 6px 0 #8fd9ad!important;outline:4px solid var(--green)}
.opt.wrong{background:var(--red-soft)!important;box-shadow:0 6px 0 #f5b3c1!important}
.row{display:flex;gap:14px;width:100%}
.row .opt{flex:1;font-size:28px}
.tf-yes{background:#dcf7e6!important;box-shadow:0 6px 0 #8fd9ad!important}
.tf-no{background:#ffe1ee!important;box-shadow:0 6px 0 #f5a9c8!important}
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.word{min-height:68px;min-width:68px;border-radius:20px;font-size:28px;padding:8px 18px;background:#e6f2ff;box-shadow:0 6px 0 #a9cdf5}
.word.right{background:var(--ok-soft);box-shadow:0 6px 0 #8fd9ad;outline:4px solid var(--green)}
.word.wrong{background:var(--red-soft);box-shadow:0 6px 0 #f5b3c1}
.gapline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;row-gap:10px;background:#fff;border-radius:24px;padding:14px 8px;box-shadow:var(--shadow);width:100%}
.gw{font-size:30px;font-weight:800;padding:0 2px}
.gap{width:44px;height:64px;border-radius:16px;background:#fff6d1;box-shadow:inset 0 0 0 3px #f0d26b;font-size:40px;line-height:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;margin:0 3px;color:var(--orange-d)}
.gap.on{background:#ffe2c2;box-shadow:inset 0 0 0 3px var(--orange)}
.gap.right{background:var(--ok-soft);box-shadow:inset 0 0 0 3px var(--green);color:var(--green-d)}
.gap.wrong{background:var(--red-soft);box-shadow:inset 0 0 0 3px var(--pink)}
.hint{font-size:20px;color:var(--soft);text-align:center}
.build{min-height:80px;background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px;width:100%}
.build:empty:before{content:"Нажимай на слова по порядку";font-size:20px;color:#b9a48f}
.chip{min-height:64px;min-width:56px;border-radius:18px;font-size:28px;padding:6px 16px;background:#fff2e2;box-shadow:0 5px 0 #f5c38f}
.chip.comma{background:#ffe2c2;color:var(--orange-d);font-size:36px;min-width:56px;padding:0 0 10px}
.chip.used{visibility:hidden}
.build .chip{background:#e6f2ff;box-shadow:0 5px 0 #a9cdf5}
.check{align-self:center}
.mini{min-height:64px;border-radius:20px;font-size:24px;padding:8px 18px;background:#fff;box-shadow:0 5px 0 #e7d6c2}

/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;display:flex;flex-direction:column;gap:10px;animation:up .3s ease;z-index:5;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet.good{background:#e3f9ea}.sheet.oops{background:#fff1dc}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .fb{display:flex;align-items:center;gap:12px}
.sheet img{width:84px;height:110px;flex:none}
.fb-title{font-size:30px;font-weight:900;line-height:1.1}
.good .fb-title{color:var(--green-d)}.oops .fb-title{color:var(--orange-d)}
.fb-text{font-size:22px;line-height:1.25;margin-top:4px}
.fb-ans{font-size:24px;font-weight:900;background:#fff;border-radius:14px;padding:6px 10px;margin-top:6px;display:inline-block}
b.hl,.hl{color:var(--blue-d);background:#e3f0ff;border-radius:8px;padding:0 4px}
.cm{color:var(--pink-d);font-weight:1000;font-size:1.15em}

/* rule */
.rule{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--shadow);width:100%;text-align:center}
.rule .phrase{font-size:28px;line-height:1.25;font-weight:900}
.ex{font-size:28px;margin-top:12px;background:#fff8ec;border-radius:18px;padding:10px;font-weight:800}
.tag{display:inline-block;font-size:18px;background:var(--yellow);border-radius:12px;padding:4px 12px;margin-bottom:8px}

.bigstars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:360px}
.bigstars .star{width:44px;height:44px;animation:starin .5s backwards}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.score{font-size:30px;font-weight:900;background:#fff;border-radius:20px;padding:8px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
textarea.manual{width:100%;max-width:420px;height:120px;font-family:inherit;font-size:16px;border-radius:14px;border:2px solid var(--orange);padding:8px;user-select:text;-webkit-user-select:text}
.note{font-size:20px;color:var(--green-d);min-height:24px;text-align:center}

/* confetti + flying star */
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.fly{position:fixed;z-index:21;width:60px;height:60px;pointer-events:none;animation:fly .9s ease-in forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:.6}}

/* ---------- Состояние ---------- */
var st=null;
function fresh(){
  return {v:1,screen:"start",lvl:0,queue:[],status:{},stars:0,lvlStars:[0,0,0],started:false};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.v===1&&s.status)return s;}catch(e){}return null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function startLevel(i){st.lvl=i;st.queue=shuffle(LEVELS[i].tasks.map(function(t){return t.id;}));st.screen="task";save();render();}

/* ---------- Отрисовка ---------- */
var app=document.getElementById("app");
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
function kris(name,cls,w,h){return '<img class="kris '+(cls||"")+'" src="'+IMG[name]+'" alt="Лисёнок Крис" style="width:'+w+'px;height:'+h+'px">';}
function screen(html,cls){app.innerHTML="";var s=el('<div class="screen '+(cls||"")+'">'+html+'</div>');app.appendChild(s);return s;}
function on(root,sel,fn){Array.prototype.forEach.call(root.querySelectorAll(sel),function(b){b.addEventListener("click",fn);});}

function render(){
  Array.prototype.forEach.call(document.querySelectorAll(".conf,.fly"),function(c){c.remove();});
  var s=st.screen;
  if(s==="start")return rStart();
  if(s==="rule1"||s==="rule2")return rRule(s==="rule1"?1:2);
  if(s==="intro")return rIntro();
  if(s==="task")return rTask();
  if(s==="between")return rBetween();
  if(s==="final")return rFinal();
}

function rStart(){
  var saved=st.started;
  var sc=screen(
    '<div class="grow"></div>'+kris("wave","bounce hero",170,240)+
    '<div class="bubble" style="margin:14px 0 6px;text-align:center"><b>Привет! Я Крис.</b><br>Будем искать обращения!</div>'+
    '<div class="sub">3 уровня · собирай звёзды</div>'+
    '<div class="grow"></div><div class="stack">'+
    (saved?'<button class="btn green wide" id="go">Продолжить ▶</button><button class="btn white wide" id="new">Начать сначала</button>'
          :'<button class="btn wide" id="go">Начать ▶</button>')+'</div>',"center");
  on(sc,"#go",function(){if(!saved){st.started=true;st.screen="rule1";save();render();}else{st.screen=st.resume||"rule1";render();}});
  on(sc,"#new",function(){st=fresh();st.started=true;st.screen="rule1";save();render();});
}

function rRule(n){
  var body=n===1?
    '<div class="tag">Вспомним с Крисом · 1</div><div class="phrase"><span class="hl">Обращение</span> — слово, которое называет того, к кому обращаются.</div>'+
    '<div class="ex"><b class="hl">Таня</b>, помоги мне.</div><div class="ex">Здравствуй, <b class="hl">зима</b>!</div>'
   :'<div class="tag">Вспомним с Крисом · 2</div><div class="phrase">Обращение отделяем <span class="cm">запятой</span>. В середине — с двух сторон.</div>'+
    '<div class="ex"><b class="hl">Гена</b><span class="cm">,</span> лови мяч!</div><div class="ex">Привет<span class="cm">,</span> <b class="hl">Гена</b><span class="cm">,</span> как дела?</div>';
  var sc=screen('<div class="grow"></div>'+kris("explain","hero",120,170)+'<div class="rule" style="margin-top:10px">'+body+'</div><div class="grow"></div>'+
    '<button class="btn blue wide" id="nx">'+(n===1?"Дальше ▶":"Понятно! ▶")+'</button>',"center");
  on(sc,"#nx",function(){st.screen=n===1?"rule2":"intro";st.lvl=n===1?st.lvl:st.lvl;save();render();});
}

function rIntro(){
  var L=LEVELS[st.lvl];
  var sc=screen('<div class="grow"></div>'+kris(L.sup?"wow":"think","bounce hero",150,210)+
    '<div class="tag" style="margin-top:12px;font-size:22px'+(L.sup?';background:linear-gradient(90deg,#ffd84d,#ff9bc4)':'')+'">'+L.name+'</div><h1>'+L.title+'</h1>'+
    '<div class="sub">'+L.tasks.length+' заданий</div><div class="grow"></div><button class="btn wide" id="nx">Поехали! ▶</button>',"center");
  on(sc,"#nx",function(){startLevel(st.lvl);});
}

function topBar(){
  var L=LEVELS[st.lvl],cur=st.queue[0];
  var dots=L.tasks.map(function(t){var s=st.status[t.id];var c=s==="ok"||s==="fixed"?"ok":(s==="retry"||s==="miss"?"bad":"");if(t.id===cur)c+=" cur";return '<span class="dot '+c+'"></span>';}).join("");
  return '<div class="top"><span class="lvl'+(L.sup?" super":"")+'">'+(L.sup?"Супер":L.name)+'</span><div class="dots">'+dots+'</div><span class="stars" id="starbox">'+STAR+'<span id="starn">'+st.stars+'</span></span></div>';
}

function rTask(){
  if(!st.queue.length){st.screen=st.lvl<LEVELS.length-1?"between":"final";save();return render();}
  var t=TASK[st.queue[0]];
  var head=topBar()+'<div class="host">'+kris("think","",78,112)+'<div class="bubble">'+t.q+'</div></div>';
  var html=head;
  if(t.t==="word"){
    html+='<div class="area grow"><div class="words">'+t.w.map(function(w,i){return '<button class="word" data-i="'+i+'">'+w+'</button>';}).join("")+'</div></div>';
  }else if(t.t==="tf"){
    html+='<div class="sent">'+t.s+'</div><div class="area grow"><div class="row"><button class="opt tf-yes" data-v="1">Да</button><button class="opt tf-no" data-v="0">Нет</button></div></div>';
  }else if(t.t==="pick"){
    var ord=shuffle(t.o.map(function(_,i){return i;}));
    html+=(t.s?'<div class="sent">'+t.s+'</div>':'')+'<div class="area grow">'+ord.map(function(i,k){return '<button class="opt c'+k+'" data-i="'+i+'">'+t.o[i]+'</button>';}).join("")+'</div>';
  }else if(t.t==="gap"){
    var g='';t.w.forEach(function(w,i){g+='<span class="gw">'+w+'</span>';if(i<t.w.length-1)g+='<button class="gap" data-i="'+i+'" aria-label="место для запятой"></button>';});
    html+='<div class="area grow"><div class="gapline">'+g+'</div><div class="hint">Нажми между словами</div><button class="btn green check" id="chk" disabled style="opacity:.5">Проверить ✓</button></div>';
  }else if(t.t==="build"){
    html+='<div class="area grow"><div class="build" id="bl"></div><div class="words" id="pool">'+t.c.map(function(c,i){return '<button class="chip'+(c===","?" comma":"")+'" data-i="'+i+'">'+c+'</button>';}).join("")+'</div><button class="mini" id="rs" style="align-self:center">↺ Сначала</button></div>';
  }
  var sc=screen(html);
  var done=false;
  function finish(ok){if(done)return;done=true;answer(t,ok,sc);}
  if(t.t==="word"){
    on(sc,".word",function(){if(done)return;var i=+this.dataset.i;var ok=i===t.a;this.classList.add(ok?"right":"wrong");if(!ok)sc.querySelector('.word[data-i="'+t.a+'"]').classList.add("right");finish(ok);});
  }else if(t.t==="tf"){
    on(sc,".opt",function(){if(done)return;var ok=(this.dataset.v==="1")===t.a;this.classList.add(ok?"right":"wrong");finish(ok);});
  }else if(t.t==="pick"){
    on(sc,".opt",function(){if(done)return;var i=+this.dataset.i;var ok=i===t.a;this.classList.add(ok?"right":"wrong");if(!ok)sc.querySelector('.opt[data-i="'+t.a+'"]').classList.add("right");finish(ok);});
  }else if(t.t==="gap"){
    var chk=sc.querySelector("#chk");
    on(sc,".gap",function(){if(done)return;this.classList.toggle("on");this.textContent=this.classList.contains("on")?",":"";var n=sc.querySelectorAll(".gap.on").length;chk.disabled=!n;chk.style.opacity=n?1:.5;});
    on(sc,"#chk",function(){if(done)return;var sel=[];Array.prototype.forEach.call(sc.querySelectorAll(".gap"),function(g){var i=+g.dataset.i,isOn=g.classList.contains("on"),need=t.a.indexOf(i)>=0;if(isOn)sel.push(i);
        if(need){g.classList.add(isOn?"right":"wrong");g.textContent=",";}else if(isOn){g.classList.add("wrong");}});
      var ok=sel.length===t.a.length&&t.a.every(function(i){return sel.indexOf(i)>=0;});finish(ok);});
  }else if(t.t==="build"){
    var bl=sc.querySelector("#bl"),seq=[];
    on(sc,"#pool .chip",function(){if(done)return;var i=+this.dataset.i;this.classList.add("used");seq.push(i);
      var c=el('<button class="chip'+(t.c[i]===","?" comma":"")+'">'+t.c[i]+'</button>');
      c.addEventListener("click",function(){if(done)return;var k=Array.prototype.indexOf.call(bl.children,c);seq.splice(k,1);bl.removeChild(c);sc.querySelector('#pool .chip[data-i="'+i+'"]').classList.remove("used");});
      bl.appendChild(c);
      if(seq.length===t.c.length){var got=seq.map(function(k){return t.c[k];});var ok=got.join("|")===t.a.join("|");setTimeout(function(){finish(ok);},250);}
    });
    on(sc,"#rs",function(){if(done)return;seq=[];bl.innerHTML="";Array.prototype.forEach.call(sc.querySelectorAll("#pool .chip"),function(c){c.classList.remove("used");});});
  }
}

function answer(t,ok,sc){
  var prev=st.status[t.id];
  st.queue.shift();
  if(ok){st.status[t.id]=prev==="retry"?"fixed":"ok";st.stars++;st.lvlStars[st.lvl]++;}
  else if(prev==="retry"){st.status[t.id]="miss";}
  else{st.status[t.id]="retry";st.queue.push(t.id);}
  save();
  var img,title,text;
  if(ok){img=PRAISE_IMG[Math.floor(Math.random()*3)];title=PRAISE[Math.floor(Math.random()*PRAISE.length)];text=t.ans;confetti(40);flyStar();}
  else{img="explain";title="Почти! Смотри…";text='<div class="fb-ans">'+t.ans+'</div><div class="fb-text">'+t.why+(prev!=="retry"?" Попробуем ещё раз в конце!":"")+'</div>';}
  var sh=el('<div class="sheet '+(ok?"good":"oops")+'"><div class="fb">'+kris(img,ok?"bounce":"",84,110)+'<div><div class="fb-title">'+title+'</div>'+(ok?'<div class="fb-ans">'+text+'</div>':text)+'</div></div><button class="btn '+(ok?"green":"")+' wide" id="nx" style="align-self:center">Дальше ▶</button></div>');
  sc.appendChild(sh);
  sh.querySelector("#nx").addEventListener("click",function(){render();});
  var n=document.getElementById("starn");if(n)n.textContent=st.stars;
  var dots=sc.querySelector(".dots");if(dots){var tmp=el(topBar());sc.querySelector(".top").replaceWith(tmp);}
}

function rBetween(){
  var done=st.lvl,next=LEVELS[st.lvl+1],n=st.lvlStars[done],stars="";
  for(var i=0;i<n;i++)stars+=STAR.replace('class="star"','class="star" style="animation-delay:'+(i*0.12)+'s"');
  var sc=screen('<div class="grow"></div>'+kris("praise","bounce hero",150,210)+'<h1 style="margin-top:10px">'+LEVELS[done].name+' пройден!</h1>'+
    '<div class="bigstars">'+stars+'</div><div class="score" style="margin-top:12px">'+STAR+' Всего: '+st.stars+'</div>'+
    '<div class="sub" style="margin-top:12px">Дальше: <b>'+next.name+'</b>'+(next.sup?' — чуть сложнее!':'')+'</div><div class="grow"></div>'+
    '<button class="btn wide" id="nx">Вперёд! ▶</button>',"center");
  confetti(50);
  on(sc,"#nx",function(){st.lvl++;st.screen="intro";save();render();});
}

function report(){
  var first=0,errs=[];
  LEVELS.forEach(function(L){L.tasks.forEach(function(t){var s=st.status[t.id];if(s==="ok")first++;else if(s)errs.push(t.key);});});
  return "Тренажёр «Предложения с обращениями» (3 класс).\nЗвёзды: "+st.stars+" из "+TOTAL+". С первого раза: "+first+" из "+TOTAL+".\n"+
    (errs.length?"Были ошибки: "+errs.join("; ")+".":"Ошибок не было!");
}
function copyText(txt,cb){
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb(ok);}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){cb(true);},fallback);return;}}catch(e){}
  fallback();
}
function rFinal(){
  var stars="",show=Math.min(st.stars,TOTAL);
  for(var i=0;i<show;i++)stars+=STAR.replace('class="star"','class="star" style="width:32px;height:32px;animation-delay:'+(i*0.07)+'s"');
  var sc=screen('<div class="grow"></div>'+kris("joy","bounce hero",150,210)+'<h1 style="margin-top:8px">Ты молодец!</h1>'+
    '<div class="score">'+STAR+' '+st.stars+' из '+TOTAL+'</div><div class="bigstars" style="margin-top:10px">'+stars+'</div>'+
    '<div class="grow"></div><div class="stack"><button class="btn green wide" id="send">Отправить результат учителю</button>'+
    '<div class="note" id="note"></div><button class="btn white wide" id="again">↺ Играть ещё раз</button></div>',"center");
  confetti(90);
  on(sc,"#send",function(){var txt=report(),note=sc.querySelector("#note");
    copyText(txt,function(ok){
      if(ok){note.textContent="Скопировано! Вставь в сообщение учителю.";}
      else{note.textContent="Скопируй текст и отправь учителю:";if(!sc.querySelector("textarea")){var ta=el('<textarea class="manual" readonly></textarea>');ta.value=txt;note.after(ta);ta.focus();ta.select();}}
    });});
  on(sc,"#again",function(){st=fresh();st.started=true;st.screen="intro";save();render();});
}

/* ---------- Эффекты ---------- */
function confetti(n){
  var cols=["#f5821f","#2f8ff0","#2fb86a","#ffc928","#ff6fa8"];
  for(var i=0;i<n;i++){var c=document.createElement("div");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%5];
    c.style.setProperty("--dx",(Math.random()*160-80)+"px");c.style.animationDuration=(1.4+Math.random()*1.4)+"s";c.style.animationDelay=(Math.random()*.3)+"s";
    document.body.appendChild(c);(function(c){setTimeout(function(){c.remove();},3300);})(c);}
}
function flyStar(){
  var box=document.getElementById("starbox");if(!box)return;var r=box.getBoundingClientRect();
  var f=el(STAR.replace('class="star"','class="fly"'));var x=innerWidth/2,y=innerHeight/2;f.style.left=x+"px";f.style.top=y+"px";
  f.style.setProperty("--tx",(r.left+r.width/2-x-30)+"px");f.style.setProperty("--ty",(r.top+r.height/2-y-30)+"px");
  document.body.appendChild(f);setTimeout(function(){f.remove();},950);
}

/* ---------- Старт ---------- */
(function init(){
  var s=load();
  if(s&&s.started&&s.screen!=="start"){st=s;st.resume=s.screen;st.screen="start";}
  else st=fresh();
  render();
})();
</script>
</body>
</html>
