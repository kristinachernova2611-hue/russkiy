:root{--bg:#FFF7EC;--ink:#1F3A93;--acc:#FF7A1A;--ok:#2E9E4F;--card:#fff;--soft:#FFE7CF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"NunitoE","Nunito","Segoe UI",Arial,sans-serif;font-weight:800}
body{background:radial-gradient(circle at 10% 5%,#FFE2C2 0,transparent 35%),radial-gradient(circle at 95% 90%,#D9F1FF 0,transparent 40%),var(--bg)}
#app{max-width:560px;margin:0 auto;min-height:100%;height:100dvh;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;min-height:48px}
.lvl{background:var(--acc);color:#fff;border-radius:999px;padding:6px 12px;font-size:16px;white-space:nowrap}
.bar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid #FFD2A8}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB547,#FF7A1A);transition:width .4s}
.cnt{display:flex;align-items:center;gap:4px;font-size:20px;background:#fff;border-radius:999px;padding:4px 10px;border:2px solid #FFD54F}
.cnt b{font-size:22px}
.snd{width:48px;height:48px;border-radius:50%;border:2px solid #FFD2A8;background:#fff;font-size:22px;cursor:pointer}
.host{display:flex;align-items:flex-end;gap:8px;margin:8px 0 6px;min-height:96px}
.host img{height:96px;width:auto;flex:none}
.say{background:#fff;border:3px solid #9FB4F2;border-radius:18px;padding:10px 12px;font-size:19px;line-height:1.25;position:relative;flex:1}
.say:before{content:"";position:absolute;left:-12px;bottom:16px;border:8px solid transparent;border-right:10px solid #9FB4F2}
.main{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
.q{font-size:27px;line-height:1.2;text-align:center;background:var(--card);border-radius:20px;padding:14px 12px;box-shadow:0 3px 0 #FFD2A8}
.q .w{color:#E5194A}
.opts{display:grid;gap:10px}
.opts.c3{grid-template-columns:1fr}
.opts.c2{grid-template-columns:1fr 1fr}
.btn{min-height:64px;border:3px solid #3949AB;background:#fff;color:var(--ink);border-radius:18px;font:inherit;font-size:24px;cursor:pointer;padding:8px 10px;box-shadow:0 4px 0 #C5CAE9;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C5CAE9}
.btn.good{background:#DFF5E1;border-color:var(--ok)}
.btn.bad{background:#FFE4E4;border-color:#E57373}
.btn.dim{opacity:.45}
.big{background:var(--acc);border-color:#E06400;color:#fff;box-shadow:0 4px 0 #B85200;font-size:26px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tiles .btn{min-width:84px}
.slot{min-height:64px;border:3px dashed #9FB4F2;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:1px;padding:6px}
.slot span{color:#E5194A}
.fb{font-size:20px;text-align:center;min-height:28px}
.star{position:fixed;font-size:56px;z-index:9;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;justify-content:center;flex:1}
.center img{height:170px}
h1{font-size:30px;margin:4px 0;line-height:1.15}
.rule{background:#fff;border-radius:20px;padding:14px;font-size:22px;line-height:1.3;box-shadow:0 3px 0 #FFD2A8;text-align:left}
.rule .ex{margin-top:8px;color:#5D4037;font-size:21px}
.pt{color:#C2185B}.rt{color:#1565C0}.sf{color:#2E7D32}.en{color:#E65100}
.stars{font-size:34px;letter-spacing:2px;word-break:break-all}
.field{position:relative;height:240px;width:100%;background:#E8F5FF;border-radius:20px;overflow:hidden}
.field span{position:absolute;font-size:34px}
textarea{width:100%;height:110px;font:inherit;font-size:16px;border-radius:12px;padding:8px}
.hide{display:none!important}
.sc{font-size:22px}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
@media (max-height:620px){.host img{height:74px}.host{min-height:74px}.q{font-size:25px;padding:10px}.btn{min-height:64px;font-size:22px}.say{font-size:17px}.main{gap:8px}.tiles .btn{min-width:64px}.slot{min-height:64px;font-size:26px}}
</style>

function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.screen)return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var soundOn=true;try{soundOn=localStorage.getItem(KEY+"-snd")!=="0";}catch(e){}
var sndBtn=document.getElementById("snd");
function drawSnd(){sndBtn.textContent=soundOn?"🔊":"🔇";}
sndBtn.onclick=function(){soundOn=!soundOn;try{localStorage.setItem(KEY+"-snd",soundOn?"1":"0");}catch(e){}drawSnd();unlock();};
drawSnd();
/* ---- audio: Web Audio first, HTMLAudio fallback */
var ctx=null,buf={},audioOK=false,dec=0;
window.__audio={state:function(){return ctx?ctx.state:"none";},decoded:function(){return Object.keys(buf).length;},played:0,errors:[]};
function b64(s){var bin=atob(s),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function unlock(){
 try{
  if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
   ["star","fan"].forEach(function(k){try{var p=ctx.decodeAudioData(b64(WAV[k]),function(b){buf[k]=b;},function(e){window.__audio.errors.push("decode "+k);});if(p&&p.catch)p.catch(function(){});}catch(e){window.__audio.errors.push(String(e));}});}
  if(ctx.state!=="running"&&ctx.resume){ctx.resume();}
  var sb=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();src.buffer=sb;src.connect(ctx.destination);src.start(0);
  audioOK=true;
 }catch(e){window.__audio.errors.push(String(e));}
}
var fallback={};
function play(k){
 if(!soundOn)return;
 try{
  if(ctx&&buf[k]){if(ctx.state!=="running")ctx.resume();var s=ctx.createBufferSource();s.buffer=buf[k];s.connect(ctx.destination);s.start(0);window.__audio.played++;return;}
  if(!fallback[k])fallback[k]=new Audio("data:audio/wav;base64,"+WAV[k]);
  fallback[k].currentTime=0;var p=fallback[k].play();if(p&&p.catch)p.catch(function(){});window.__audio.played++;
 }catch(e){window.__audio.errors.push(String(e));}
}
document.addEventListener("touchend",unlock,{passive:true});document.addEventListener("click",unlock);
/* ---- ui helpers */
function host(emo,text){kimg.src=IMG[emo];say.innerHTML=text;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function setTop(){
 var L=document.getElementById("lvl"),b=document.getElementById("bar");
 document.getElementById("cnt").textContent=S.stars;
 if(S.screen==="task"){L.textContent=LEVELS[S.lvl].name;var tot=S.queue.length;b.style.width=Math.round(100*S.pos/Math.max(1,tot))+"%";}
 else if(S.screen==="final"){L.textContent="Финиш";b.style.width="100%";}
 else{L.textContent=S.screen==="break"?"Переменка":"Старт";b.style.width=S.screen==="break"?"100%":"0%";}
}
function flyStar(from){
 var cnt=document.getElementById("cnt").getBoundingClientRect(),r=from.getBoundingClientRect();
 var s=el("div","star","⭐");s.style.left=(r.left+r.width/2-28)+"px";s.style.top=(r.top-10)+"px";document.body.appendChild(s);
 requestAnimationFrame(function(){requestAnimationFrame(function(){s.style.left=(cnt.left-10)+"px";s.style.top=(cnt.top-14)+"px";s.style.transform="scale(.4)";s.style.opacity=".3";});});
 setTimeout(function(){s.remove();},900);
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
/* ---- screens */
function render(){setTop();main.innerHTML="";
 ({start:scrStart,rule1:scrRule1,rule2:scrRule2,levelIntro:scrLevelIntro,task:scrTask,brk:scrBreak,"break":scrBreak,final:scrFinal})[S.screen]();save();}
function scrStart(){
 host("wave","Привет! Я лисёнок Крис. Поиграем в части слова?");
 var c=el("div","center");c.appendChild(el("h1","","Тренажёр Криса"));c.appendChild(el("div","sc","Корень, приставка, суффикс — значимые части слова"));
 c.appendChild(el("div","sc","3 уровня · 7–10 минут · включи звук 🔊"));
 var b=el("button","btn big","Поехали! 🚀");b.onclick=function(){unlock();S.screen="rule1";render();};c.appendChild(b);main.appendChild(c);
}
function scrRule1(){
 host("explain","Вспомним с Крисом!");
 main.appendChild(el("div","rule","<span class=pt>Приставка</span> стоит перед корнем, <span class=rt>корень</span> — общая часть родственных слов, <span class=sf>суффикс</span> — после корня, <span class=en>окончание</span> — изменяемая часть в конце слова."+
 "<div class=ex>Пример 1: <span class=pt>под</span>-<span class=rt>окон</span>-<span class=sf>ник</span></div><div class=ex>Пример 2: <span class=rt>мыш</span>-<span class=sf>к</span>-<span class=en>а</span></div>"));
 var b=el("button","btn big","Понятно! →");b.onclick=function(){S.screen="levelIntro";S.lvl=0;render();};main.appendChild(b);
}
function scrRule2(){scrRule1();}
function startLevel(i){S.lvl=i;S.queue=LEVELS[i].tasks.map(function(_,k){return k;});S.pos=0;S.retry={};S.screen="task";render();}
function scrLevelIntro(){
 var L=LEVELS[S.lvl];host(S.lvl===2?"surprised":"happy",S.lvl===2?"Ого, Супер-уровень! Ты справишься!":"Начинаем: "+L.title.toLowerCase()+"!");
 var c=el("div","center");c.appendChild(el("h1","",L.name));c.appendChild(el("div","sc",L.title));
 var b=el("button","btn big","Вперёд!");b.onclick=function(){startLevel(S.lvl);};c.appendChild(b);main.appendChild(c);
}
function answer(ok,btn,task){
 if(busy)return;busy=true;
 var id=S.queue[S.pos],key=S.lvl+"-"+id;
 var fb=document.getElementById("fb");
 if(ok){
  if(!S.retry[key]){S.first++;}
  S.stars++;S.done++;play("star");flyStar(btn);host(pick(["cheer","praise","happy"]),pick(GOOD)+" +1 ⭐");
  fb.innerHTML="";setTop();
  setTimeout(function(){busy=false;next();},1100);
 }else{
  S.mist++;S.retry[key]=1;S.queue.push(id);
  host("think",pick(BAD)+" "+task.e);
  fb.innerHTML="Верный ответ: <b>"+(task.t==="tf"?(task.a?"Верно":"Неверно"):task.t==="build"?task.ans:task.o[task.a])+"</b>. Это задание вернётся в конце уровня.";
  var b=el("button","btn big","Дальше →");b.onclick=function(){busy=false;next();};main.appendChild(b);save();
 }
}
function next(){S.pos++;
 if(S.pos>=S.queue.length){
  if(S.lvl===1){S.screen="break";}
  else if(S.lvl===2){S.screen="final";}
  else{S.lvl++;S.screen="levelIntro";}
 }
 render();
}
function scrTask(){
 var task=LEVELS[S.lvl].tasks[S.queue[S.pos]];
 var again=S.retry[S.lvl+"-"+S.queue[S.pos]]&&S.pos>=LEVELS[S.lvl].tasks.length;
 host(again?"explain":"happy",again?"Попробуем ещё раз — теперь точно получится!":pick(["Как думаешь?","Подумай хорошенько!","Твой ход!","Я в тебя верю!"]));
 main.appendChild(el("div","q",task.q));
 if(task.t==="choice"){
  var o=el("div","opts "+(task.o.some(function(x){return x.length>9;})?"c3":"c2"));
  task.o.forEach(function(txt,i){var b=el("button","btn",txt);b.onclick=function(){if(busy)return;b.classList.add(i===task.a?"good":"bad");if(i!==task.a){Array.prototype.forEach.call(o.children,function(c,j){if(j===task.a)c.classList.add("good");else if(c!==b)c.classList.add("dim");});}answer(i===task.a,b,task);};o.appendChild(b);});
  main.appendChild(o);
 }else if(task.t==="tf"){
  var o2=el("div","opts c2");
  [["Верно ✔",true],["Неверно ✖",false]].forEach(function(p){var b=el("button","btn",p[0]);b.onclick=function(){if(busy)return;var ok=p[1]===task.a;b.classList.add(ok?"good":"bad");answer(ok,b,task);};o2.appendChild(b);});
  main.appendChild(o2);
 }else{
  var slot=el("div","slot","&nbsp;"),built=[],tl=el("div","tiles");
  var order=task.p.slice();
  task.p.forEach(function(part){var b=el("button","btn",part);b.onclick=function(){if(busy||b.disabled)return;built.push(part);b.disabled=true;b.classList.add("dim");slot.innerHTML="<span>"+built.join("")+"</span>";
    if(built.length===task.p.length){var ok=built.join("")===task.ans;slot.style.borderColor=ok?"#2E9E4F":"#E57373";answer(ok,slot,task);}};tl.appendChild(b);});
  var clr=el("button","btn","↺ Сначала");clr.onclick=function(){if(busy)return;built=[];slot.innerHTML="&nbsp;";Array.prototype.forEach.call(tl.children,function(c){c.disabled=false;c.classList.remove("dim");});};
  tl.appendChild(clr);main.appendChild(slot);main.appendChild(tl);
 }
 main.appendChild(el("div","fb","")).id="fb";
}
function scrBreak(){
 host("cheer","Мини-переменка! Посчитай звёздочки на небе.");
 var N=7,f=el("div","field");
 var pos=[[8,12],[30,58],[55,18],[75,62],[18,72],[62,40],[86,20]];
 for(var i=0;i<N;i++){var s=el("span","","⭐");s.style.left=pos[i][0]+"%";s.style.top=pos[i][1]+"%";f.appendChild(s);}
 main.appendChild(f);main.appendChild(el("div","q","Сколько звёздочек?"));
 var o=el("div","opts c2");o.style.gridTemplateColumns="1fr 1fr 1fr";
 [6,7,8].forEach(function(n){var b=el("button","btn",String(n));b.onclick=function(){
   if(n===N){b.classList.add("good");host("praise","Верно, семь! Отдохнули — вперёд на Супер-уровень!");setTimeout(function(){S.lvl=2;S.screen="levelIntro";render();},1200);}
   else{b.classList.add("bad");host("think","Посчитай ещё раз, пальчиком по каждой звёздочке!");}};o.appendChild(b);});
 main.appendChild(o);
}
function resultText(){
 var d=new Date();
 return "Тренажёр Криса «Корень, приставка, суффикс» — пройден!\nЗвёзд: "+S.stars+" из 18\nС первой попытки: "+S.first+" из 18\nОшибок (исправлено при повторе): "+S.mist+"\nДата: "+d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function scrFinal(){
 host("cheer","Ты молодец! Мы прошли все уровни!");
 if(!S.fanPlayed){play("fan");S.fanPlayed=1;}
 var c=el("div","center");c.appendChild(el("h1","","Ты молодец! 🎉"));
 var st="";for(var i=0;i<S.stars;i++)st+="⭐";c.appendChild(el("div","stars",st));
 c.appendChild(el("div","sc","Звёзд: "+S.stars+" · с первой попытки: "+S.first+" из 18"));
 var send=el("button","btn big","📨 Отправить результат учителю");var box=el("div","hide");var ta=el("textarea");ta.readOnly=true;box.appendChild(el("div","sc","Скопируй текст и отправь учителю:"));box.appendChild(ta);
 send.onclick=function(){var t=resultText();ta.value=t;
  function manual(){box.classList.remove("hide");ta.focus();ta.select();host("explain","Не получилось скопировать само — выдели текст и скопируй.");}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){host("praise","Скопировано! Вставь в сообщение учителю 📨");send.textContent="✔ Скопировано!";window.__copied=t;},manual);}else{manual();}}catch(e){manual();}
 };
 var again=el("button","btn","🔁 Играть ещё раз");again.onclick=function(){S=fresh();S.screen="rule1";render();};
 c.appendChild(send);c.appendChild(box);c.appendChild(again);main.appendChild(c);
}
S=load()||fresh();
if(S.screen==="final"&&S.fanPlayed){}
window.__state=function(){return S;};
render();
})();
</script>
</body>
</html>
