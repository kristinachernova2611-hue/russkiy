:root{
  --bg:#FFF7EC; --bg2:#FFEFD9; --ink:#23305E; --muted:#5B6690;
  --orange:#FF7A1A; --orange-d:#E2600A; --blue:#2F9BFF; --blue-d:#1B7FE0; --green:#22B45A; --green-d:#178A43;
  --yellow:#FFC928; --pink:#FF5FA2; --pink-d:#E2397F; --card:#FFFFFF; --line:#FFD9B0; --red:#F0476B;
  --shadow:0 6px 0 rgba(35,48,94,.12), 0 10px 24px rgba(35,48,94,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{overflow-x:hidden}
body{background:radial-gradient(circle at 15% 10%,#FFE6C2 0 18%,transparent 19%),radial-gradient(circle at 90% 85%,#DDF0FF 0 20%,transparent 21%),var(--bg);
  color:var(--ink);font-family:"Nunito","Segoe UI",Arial,sans-serif;font-weight:700;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.screen{flex:1;display:flex;flex-direction:column;gap:12px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
button{font-family:inherit;font-weight:900;border:0;cursor:pointer;color:#fff;border-radius:20px;min-height:66px;font-size:24px;padding:10px 16px;
  box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s, box-shadow .08s;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.b-orange{background:var(--orange)} .b-blue{background:var(--blue)} .b-green{background:var(--green)} .b-pink{background:var(--pink)} .b-yellow{background:var(--yellow);color:var(--ink)}
.b-white{background:#fff;color:var(--ink);border:3px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.lvl{font-weight:900;font-size:18px;background:#fff;border-radius:14px;padding:4px 12px;box-shadow:var(--shadow);white-space:nowrap}
.bar{flex:1;height:14px;border-radius:10px;background:#FFE1BE;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:10px;transition:width .4s}
.stars{font-weight:900;font-size:20px;white-space:nowrap}
.host{display:flex;align-items:flex-end;gap:8px}
.host img{width:auto;height:118px;flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.say{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-size:22px;line-height:1.2;box-shadow:var(--shadow);margin-bottom:22px;flex:1}
.say:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.task{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);font-size:28px;line-height:1.25;text-align:center;font-weight:900}
.task small{display:block;font-size:20px;color:var(--muted);font-weight:700;margin-bottom:4px}
.opts{display:grid;gap:12px;margin-top:auto}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two2{grid-template-columns:1fr 1fr}
.opts.two2 button:last-child:nth-child(odd){grid-column:1/-1}
.final .big-k{height:min(26vh,190px)}
.final .starrow{font-size:24px}
.opts button{width:100%}
.opt-sent{font-size:24px;line-height:1.2;text-align:left;padding:10px 14px}
.hl{color:var(--orange-d)} .hb{color:var(--blue-d)} .hg{color:var(--green-d)}
.u1{border-bottom:3px solid currentColor;padding-bottom:1px} .u2{border-bottom:6px double currentColor;padding-bottom:1px}
.feedback{border-radius:22px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;box-shadow:var(--shadow);animation:pop .3s ease;margin-top:auto}
.feedback img{height:84px;width:auto}
.feedback .h{font-size:28px;font-weight:900;line-height:1.1}
.feedback .t{grid-column:1/-1;font-size:22px;line-height:1.25;overflow-wrap:break-word}
.feedback .t b{font-weight:900}
.fb-ok{background:#E6F9EE;border:3px solid #9BE3B7} .fb-no{background:#FFF1E2;border:3px solid #FFC489}
.correct{background:var(--green)!important;color:#fff!important}
.wrong{background:var(--red)!important;color:#fff!important}
.dim{opacity:.45}
.slot{min-height:78px;background:#fff;border:3px dashed var(--line);border-radius:20px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{min-height:66px;font-size:24px;padding:8px 14px}
.center{text-align:center}
.big-k{height:min(34vh,250px);width:auto;margin:0 auto;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
h1{font-size:32px;line-height:1.15;margin:4px 0;font-weight:900;text-align:center}
h2{font-size:28px;margin:0;font-weight:900;text-align:center}
p.lead{font-size:24px;margin:0;text-align:center;line-height:1.25}
.rule{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);font-size:26px;line-height:1.3}
.rule .ex{margin-top:10px;font-size:26px;background:var(--bg2);border-radius:16px;padding:8px 12px}
.col{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.starrow{font-size:30px;text-align:center;line-height:1.15;overflow-wrap:anywhere;word-break:break-all;max-width:100%}
.trophy{position:relative;display:flex;justify-content:center;align-items:flex-end}
.trophy svg{height:min(16vh,120px);width:auto;margin-left:-24px;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-6deg) translateY(-6px)}}
.copybox{width:100%;min-height:120px;font:inherit;font-size:18px;border-radius:14px;border:3px solid var(--line);padding:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-size:20px;z-index:60}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-height:600px){.screen{gap:9px}.host img{height:72px}.rule{font-size:22px;padding:10px 12px}.rule .ex{font-size:22px;margin-top:6px;padding:6px 10px}.feedback .t{font-size:20px}.feedback img{height:64px}.feedback .h{font-size:26px}.final .big-k{height:140px}.final .starrow{font-size:21px}.final .trophy svg{height:80px}.slot{min-height:70px}.lead{font-size:21px}.say{font-size:20px}.task{font-size:26px;padding:10px 12px}.big-k{height:min(30vh,200px)}h1{font-size:28px}.feedback img{height:78px}}
@media (min-width:700px){#app{padding-top:24px}.host img{height:140px}}
noscript div{max-width:520px;margin:40px auto;background:#fff;border-radius:20px;padding:24px;font-size:26px;text-align:center;box-shadow:var(--shadow)}
</style>
</head>

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function task(id){ for(const l of LEVELS) for(const t of l.tasks) if(t.id===id) return t; return null; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function br(s){ return esc(s).replace(/\n/g,"<br>"); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function starsDone(){ return Object.values(st.solved).filter(Boolean).length; }

const app = document.getElementById("app");
function render(html){ app.innerHTML = '<div class="screen">'+html+'</div>'; window.scrollTo(0,0); }
function kimg(name, cls, alt){ return '<img class="'+(cls||"")+'" src="'+IMG[name]+'" alt="'+esc(alt||"Лисёнок Крис")+'">'; }

/* ---------- ЭКРАНЫ ---------- */
function startScreen(){
  const saved = load();
  const canContinue = saved && saved.phase!=="start" && saved.phase!=="final";
  render(
    '<h1>Привет! Я лисёнок Крис</h1>'+kimg("mashet","big-k","Крис машет лапой")+
    '<p class="lead">Поиграем с предложениями? Будет 3 уровня и много звёзд!</p>'+
    '<div class="col">'+(canContinue?'<button class="b-green" id="cont">Продолжить</button><button class="b-white" id="new">Начать сначала</button>':'<button class="b-orange" id="go">Начать</button>')+'</div>');
  if(canContinue){ byId("cont").onclick=()=>{ st=saved; route(); }; byId("new").onclick=()=>{ st=fresh(); st.phase="rule1"; save(); route(); }; }
  else byId("go").onclick=()=>{ st=fresh(); st.phase="rule1"; save(); route(); };
}
function rule1(){
  render('<div class="host">'+kimg("obyasnyaet","","Крис объясняет")+'<div class="say">Вспомним с Крисом!</div></div>'+
    '<div class="rule"><span class="hb">Нераспространённое</span> предложение — только <b>основа</b>: подлежащее и сказуемое.'+
    '<div class="ex"><span class="u1 hb">Птенцы</span> <span class="u2 hb">пищат</span>.</div><div class="ex"><span class="u1 hb">Трава</span> <span class="u2 hb">растёт</span>.</div></div>'+
    '<div class="col"><button class="b-blue" id="next">Дальше</button></div>');
  byId("next").onclick=()=>{ st.phase="rule2"; save(); route(); };
}
function rule2(){
  render('<div class="host">'+kimg("obyasnyaet","","Крис объясняет")+'<div class="say">И ещё одно правило!</div></div>'+
    '<div class="rule"><span class="hl">Распространённое</span> предложение — основа <b>и второстепенные члены</b>.'+
    '<div class="ex"><span class="hl">Маленькие</span> <span class="u1">птенцы</span> <span class="hl">громко</span> <span class="u2">пищат</span>.</div><div class="ex"><span class="hl">Зелёная</span> <span class="u1">трава</span> <span class="u2">растёт</span> <span class="hl">на лугу</span>.</div></div>'+
    '<div class="col"><button class="b-orange" id="next">Играть!</button></div>');
  byId("next").onclick=()=>{ st.phase="levelIntro"; save(); route(); };
}
function levelIntro(){
  const L = LEVELS[st.level];
  const done = starsDone();
  render(kimg(st.level===0?"raduetsya":"hvalit","big-k","Крис радуется")+
    '<h1>'+esc(L.name)+'</h1>'+
    (st.level>0?'<div class="starrow">'+"⭐".repeat(Math.min(done,18))+'</div><p class="lead">Звёзд уже: '+done+'</p>':'<p class="lead">За каждый верный ответ — звезда!</p>')+
    (st.level===2?'<p class="lead">Тут задания чуть сложнее. Ты справишься!</p>':'')+
    '<div class="col"><button class="b-orange" id="go">Вперёд!</button></div>');
  byId("go").onclick=()=>{ st.phase="task"; save(); route(); };
}
function header(){
  const L = LEVELS[st.level];
  const n = st.queue.length, p = Math.min(st.pos, n);
  return '<div class="top"><span class="lvl">'+esc(L.name)+'</span><span class="bar"><i style="width:'+Math.round(p/n*100)+'%"></i></span><span class="stars" aria-label="звёзды">⭐ '+starsDone()+'</span></div>';
}
function taskScreen(){
  if(st.pos>=st.queue.length){ return levelDone(); }
  const t = task(st.queue[st.pos]);
  const retry = st.retries[t.id] ? '<small>Ещё раз!</small>' : '';
  let body = header() + '<div class="host">'+kimg(st.retries[t.id]?"dumaet":"raduetsya","","Крис")+'<div class="say">'+esc(t.q)+'</div></div>';
  if(!st.order[t.id]) { st.order[t.id] = t.type==="build" ? shuffle(t.words.map((w,i)=>i)) : shuffle((t.opts||["Да","Нет"]).map((o,i)=>i)); save(); }
  const ord = st.order[t.id];
  if(t.type==="choice"){
    body += '<div class="task">'+retry+br(t.s)+'</div>';
    const two = t.opts.length===2 && t.opts.every(o=>o.length<10);
    const two2 = !two && t.opts.length===3 && t.opts.every(o=>o.length<=7);
    body += '<div class="opts'+(two?' two':'')+(two2?' two2':'')+'">'+ord.map((i,k)=>'<button class="'+["b-blue","b-pink","b-green"][k%3]+'" data-v="'+esc(t.opts[i])+'">'+esc(t.opts[i])+'</button>').join("")+'</div>';
  } else if(t.type==="tf"){
    body += '<div class="task" style="font-size:26px">'+retry+br(t.s)+'</div>';
    body += '<div class="opts two"><button class="b-green" data-v="Да">Да, верно</button><button class="b-pink" data-v="Нет">Нет</button></div>';
  } else if(t.type==="odd"){
    if(retry) body += '<div class="task" style="font-size:22px">'+retry+'</div>';
    body += '<div class="opts">'+ord.map((i,k)=>'<button class="b-white opt-sent" data-v="'+esc(t.opts[i])+'">'+esc(t.opts[i])+'</button>').join("")+'</div>';
  } else if(t.type==="build"){
    const placed = st.build;
    body += '<div class="slot" id="slot" aria-label="Собранное предложение">'+placed.map(i=>'<button class="b-orange" data-p="'+i+'">'+esc(t.words[i])+'</button>').join("")+'</div>';
    body += '<div class="chips">'+ord.filter(i=>!placed.includes(i)).map(i=>'<button class="b-blue" data-w="'+i+'">'+esc(t.words[i])+'</button>').join("")+'</div>';
    body += '<div class="opts">'+(placed.length===t.words.length?'<button class="b-green" id="check">Проверить</button>':'')+'</div>';
  }
  render(body);
  if(t.type==="build"){
    app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ st.build.push(+b.dataset.w); save(); taskScreen(); });
    app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ st.build=st.build.filter(x=>x!==+b.dataset.p); save(); taskScreen(); });
    const c=byId("check"); if(c) c.onclick=()=>{ const sent=st.build.map(i=>t.words[i]).join(" "); answer(t, t.a.includes(sent), sent); };
  } else {
    app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
      app.querySelectorAll("[data-v]").forEach(x=>{ x.disabled=true; if(x.dataset.v===t.a) x.classList.add("correct"); else if(x!==b) x.classList.add("dim"); });
      const ok = b.dataset.v===t.a; if(!ok) b.classList.add("wrong");
      answer(t, ok, b.dataset.v);
    });
  }
}
function answer(t, ok, given){
  const opts = app.querySelector(".opts") || app.querySelector(".screen");
  if(ok){
    if(!st.solved[t.id]){ st.solved[t.id]=1; if(!st.wrong[t.id]) st.firstTry[t.id]=1; }
    confetti();
  } else {
    st.wrong[t.id]=(st.wrong[t.id]||0)+1;
    // вернуть задание в конец уровня (не больше двух повторов)
    if((st.retries[t.id]||0)<2){ st.queue.push(t.id); st.retries[t.id]=(st.retries[t.id]||0)+1; delete st.order[t.id]; }

  }
  st.pos++; st.build=[]; save();
  const fb = document.createElement("div");
  fb.className = "feedback " + (ok?"fb-ok":"fb-no");
  const correctText = (t.type==="build" ? t.a[0] : (t.type==="tf" ? (t.a==="Да"?"да":"нет") : t.a)).replace(/\.$/,"");
  fb.innerHTML = kimg(ok?"likuet":"dumaet","",ok?"Крис радуется":"Крис подбадривает")+
    '<div class="h">'+(ok?pick(PRAISE)+" ⭐":pick(CHEER))+'</div><div class="t">'+(ok?"":"Верно: <b>"+esc(correctText)+"</b>. ")+esc(t.why)+'</div>';
  const nextBtn = document.createElement("button");
  nextBtn.className = ok ? "b-green" : "b-orange"; nextBtn.id="next"; nextBtn.textContent = "Дальше →";
  const zone = app.querySelector(".opts");
  const hostEl = app.querySelector(".host"); if(hostEl) hostEl.remove();
  if(t.type==="build"){ zone.innerHTML=""; zone.appendChild(nextBtn); const ch=app.querySelector(".chips"); if(ch) ch.remove(); const sl=app.querySelector(".slot"); const tk=document.createElement("div"); tk.className="task"+(ok?"":" shake"); tk.innerHTML=(ok?"":"<small>У тебя получилось:</small>")+esc(given); sl.replaceWith(tk); tk.insertAdjacentElement("afterend", fb); }
  else if(t.type==="odd"){ app.querySelectorAll("[data-v]").forEach(x=>{ if(!x.classList.contains("correct") && !x.classList.contains("wrong")) x.remove(); }); zone.insertAdjacentElement("afterend", fb); fb.insertAdjacentElement("afterend", nextBtn); }
  else { zone.replaceWith(fb); fb.insertAdjacentElement("afterend", nextBtn); }
  fb.style.marginTop = t.type==="odd" ? "0" : "auto";
  nextBtn.onclick = ()=>{ taskScreen(); };
  nextBtn.focus({preventScroll:true});
}
function levelDone(){
  if(st.level < LEVELS.length-1){
    st.level++; st.queue = shuffle(LEVELS[st.level].tasks.map(t=>t.id)); st.pos=0; st.phase="levelIntro"; save(); route();
  } else { st.phase="final"; save(); route(); }
}
function resultText(){
  const errs = []; for(const l of LEVELS) for(const t of l.tasks) if(st.wrong[t.id]) errs.push(t.type==="build"? t.a[0] : (t.s || t.a));
  const first = Object.keys(st.firstTry).length;
  return "Тренажёр с Крисом: «"+TOPIC+"».\n"+
    "Звёзд: "+starsDone()+" из "+TOTAL+". С первой попытки: "+first+" из "+TOTAL+".\n"+
    (errs.length ? "Были ошибки в заданиях: "+errs.join(" | ") : "Ошибок не было!")+"\n"+
    "Дата: "+new Date().toLocaleDateString("ru-RU");
}
function finalScreen(){
  const n = starsDone();
  render('<div class="trophy">'+kimg("likuet","big-k","Крис с кубком")+TROPHY+'</div>'+
    '<h1>Ты молодец!</h1><div class="starrow">'+"⭐".repeat(Math.min(n,18))+'</div>'+
    '<p class="lead">Звёзд: <b>'+n+' из '+TOTAL+'</b>. Крис гордится тобой!</p>'+
    '<div class="col"><button class="b-orange" id="send">Отправить результат учителю</button><div id="manual"></div><button class="b-blue" id="again">Играть ещё раз</button></div>');
  app.querySelector(".screen").classList.add("final");
  confetti(200);
  byId("send").onclick = async ()=>{
    const txt = resultText(); let ok=false;
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); ok=true; } }catch(e){ ok=false; }
    if(!ok){ try{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); }catch(e){ ok=false; } }
    if(ok){ toast("Скопировано! Вставь сообщение в чат с учителем."); byId("send").textContent="Скопировано ✓ Отправь учителю"; }
    else { byId("manual").innerHTML='<p class="lead" style="font-size:20px">Скопируй этот текст и отправь учителю:</p><textarea class="copybox" readonly>'+esc(txt)+'</textarea>'; const ta=app.querySelector(".copybox"); ta.focus(); ta.select(); }
  };
  byId("again").onclick = ()=>{ st=fresh(); st.phase="levelIntro"; save(); route(); };
}
function toast(m){ const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function byId(i){ return document.getElementById(i); }
function route(){
  switch(st.phase){ case "rule1": return rule1(); case "rule2": return rule2(); case "levelIntro": return levelIntro(); case "task": return taskScreen(); case "final": return finalScreen(); default: return startScreen(); }
}
/* ---------- КОНФЕТТИ ---------- */
const cv = byId("confetti"), cx = cv.getContext("2d"); let parts=[], raf=0;
function confetti(n){ n=n||70; cv.width=innerWidth; cv.height=innerHeight; const cols=["#FF7A1A","#2F9BFF","#22B45A","#FFC928","#FF5FA2"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,s:Math.random()*8+5,c:cols[i%5],r:Math.random()*6,life:90+Math.random()*40});
  if(!raf) tick(); }
function tick(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.life-->0);
  for(const p of parts){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=.2; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : 0; if(!raf) cx.clearRect(0,0,cv.width,cv.height); }
/* ---------- СТАРТ ---------- */
st = fresh();
startScreen();
window.__trainer = { LEVELS, get state(){ return st; }, resultText };
</script>
</body>
